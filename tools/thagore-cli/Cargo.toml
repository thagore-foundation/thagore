[package]
name = "thagore-cli"
version = "0.9.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "thagc"
path = "src/main.rs"

[[bin]]
name = "thagore"
path = "src/main.rs"

[dependencies]
# `bumpalo` is required because the lexer and parser public APIs take a shared arena.
bumpalo = "3.16.0"
# `clap` defines the command-line surface and help text for the compiler driver.
clap = { version = "4.5.38", features = ["derive"] }
# `serde` serializes structured diagnostics for editor-facing JSON output.
serde = { version = "1.0.219", features = ["derive"] }
# `serde_json` emits JSON diagnostics for `thagore check --json`.
serde_json = "1.0.140"
# `tempfile` manages temporary build directories for `thagore run`.
tempfile = "3.20.0"
# `termcolor` renders compiler diagnostics with stable ANSI-independent colors.
termcolor = "1.4.1"
thagore-ast = { path = "../../crates/ast" }
thagore-codegen = { path = "../../crates/codegen" }
thagore-ir = { path = "../../crates/ir" }
thagore-lexer = { path = "../../crates/lexer" }
thagore-parser = { path = "../../crates/parser" }
thagore-typeck = { path = "../../crates/typeck" }
