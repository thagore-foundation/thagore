name: Selfhost Frontend Stage

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/selfhost-frontend-stage.yml"
      - "bootstrap/selfhost/frontend/**"
      - "tests/selfhost_frontend/**"
      - "tests/bootstrap_seed/**"
      - "tooling/ci/build_selfhost_frontend_stage.py"
      - "tooling/ci/selfhost_frontend_stage.py"
      - "tools/thagore-cli/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-frontend-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Selfhost frontend stage (temporarily skipped)
    runs-on: ubuntu-latest
    steps:
      - name: Skip linux selfhost frontend stage while stabilizing
        run: echo "selfhost frontend stage temporarily disabled on linux; tracking in issue"
