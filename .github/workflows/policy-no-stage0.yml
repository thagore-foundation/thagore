name: Policy No Stage0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "120"

  enforce-no-stage0:
    runs-on: ubuntu-latest
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce workflow policy
        shell: bash
        run: |
          set -euo pipefail
          HITS="$(grep -REn "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" .github/workflows \
            | grep -Ev "policy-no-stage0.yml|grep -Eqi \"stage0\|THAG_STAGE0_HELPER\|ALLOW_STAGE0_BOOTSTRAP\"|no stage0|no-stage0|stage0 fallback markers|forbidden stage0 markers" || true)"
          if [[ -n "$HITS" ]]; then
            echo "CRITICAL: Stage0 markers are forbidden in workflows."
            echo "$HITS"
            exit 1
          fi
          FALLBACK_HITS="$(grep -REn "fallback to existing compiler binary|fallback to previous stage2 binary|allow_missing_output" .github/workflows \
            | grep -Ev "policy-no-stage0.yml" || true)"
          if [[ -n "$FALLBACK_HITS" ]]; then
            echo "CRITICAL: compiler-output fallback paths are forbidden in workflows."
            echo "$FALLBACK_HITS"
            exit 1
          fi
          RELEASE_FALLBACK_HITS="$(grep -REn "RELEASE_OPTIONAL_SKIP|build_runtime_fallback|build_stage1_blob_native|fallback smoke binaries|non-strict lane|continue with bootstrap chain" .github/workflows/release.yml || true)"
          if [[ -n "$RELEASE_FALLBACK_HITS" ]]; then
            echo "CRITICAL: release fallback markers are forbidden."
            echo "$RELEASE_FALLBACK_HITS"
            exit 1
          fi
          SCRIPT_HITS="$(grep -REn "ALLOW_STAGE0_BOOTSTRAP|legacy[/\\]stage0|legacy[/\\]build[/\\].*thag" scripts \
            | grep -Ev "intent_budget_gate.py|policy-no-stage0.yml" || true)"
          if [[ -n "$SCRIPT_HITS" ]]; then
            echo "CRITICAL: Stage0/legacy bootstrap markers are forbidden in scripts."
            echo "$SCRIPT_HITS"
            exit 1
          fi
          CXX_HITS="$(grep -REn "runtime/src/.*\\.cpp|clang\\+\\+|cmake -S runtime" .github/workflows scripts \
            | grep -Ev "policy-no-stage0.yml" || true)"
          if [[ -n "$CXX_HITS" ]]; then
            echo "CRITICAL: C++ runtime build markers are forbidden in workflows/scripts."
            echo "$CXX_HITS"
            exit 1
          fi
          echo "Policy OK: no Stage0 markers in workflows."

      - name: Enforce no C++ dependency in tracked files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/no_cpp_dependency_gate.py --report no-cpp-dependency-report.txt

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-no-stage0-report
          path: |
            no-cpp-dependency-report.txt

      - name: Discord update - Enforce workflow policy
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Enforce workflow policy

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, enforce-no-stage0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
