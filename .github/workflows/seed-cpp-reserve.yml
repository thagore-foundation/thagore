name: Seed C++ Reserve

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  reserve-cpp-toolchain:
    name: reserve-cpp (${{ matrix.asset_tag }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_tag: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset_tag: linux-arm64
          - runner: macos-latest
            asset_tag: macos-arm64
          - runner: windows-latest
            asset_tag: windows-x86_64
          - runner: windows-11-arm
            asset_tag: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build
          clang++ --version
          cmake --version
          ninja --version

      - name: Install C++ toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cmake ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang++ --version
          cmake --version
          ninja --version

      - name: Install C++ toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command clang++ -ErrorAction SilentlyContinue)) {
            choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --no-progress -y --execution-timeout=1800
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y --execution-timeout=1800
          }
          clang++ --version
          cmake --version
          ninja --version

      - name: Build and run C++ seed probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cat > runtime_seed_probe.cpp <<'CPP'
          #include <algorithm>
          #include <iostream>
          #include <numeric>
          #include <string>
          #include <vector>

          int main() {
              std::vector<int> v{1, 3, 5, 7, 9};
              const int sum = std::accumulate(v.begin(), v.end(), 0);
              std::string marker = "RUNTIME_SEED_OK";
              if (sum != 25) return 2;
              std::cout << marker << ":" << sum << "\n";
              return 0;
          }
          CPP
          clang++ runtime_seed_probe.cpp -std=c++20 -O2 -fuse-ld=lld -o runtime_seed_probe
          ./runtime_seed_probe | tee cpp-seed-probe-output.txt
          grep -q "RUNTIME_SEED_OK:25" cpp-seed-probe-output.txt
          {
            echo "asset_tag=${{ matrix.asset_tag }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "clang=$(clang++ --version | head -n1)"
            echo "cmake=$(cmake --version | head -n1)"
            echo "ninja=$(ninja --version)"
          } > cpp-seed-reserve-${{ matrix.asset_tag }}.txt

      - name: Build and run C++ seed probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          #include <algorithm>
          #include <iostream>
          #include <numeric>
          #include <string>
          #include <vector>

          int main() {
              std::vector<int> v{1, 3, 5, 7, 9};
              const int sum = std::accumulate(v.begin(), v.end(), 0);
              std::string marker = "RUNTIME_SEED_OK";
              if (sum != 25) return 2;
              std::cout << marker << ":" << sum << "\n";
              return 0;
          }
          "@ | Set-Content -Path runtime_seed_probe.cpp -Encoding utf8
          clang++ runtime_seed_probe.cpp -std=c++20 -O2 -o runtime_seed_probe.exe
          $out = [string]((& .\runtime_seed_probe.exe | Out-String))
          $out | Set-Content -Path cpp-seed-probe-output.txt -Encoding utf8
          if ($out -notmatch "RUNTIME_SEED_OK:25") { throw "CRITICAL: C++ seed probe output mismatch." }
          $clang = [string]((& clang++ --version | Select-Object -First 1 | Out-String)).Trim()
          $cmake = [string]((& cmake --version | Select-Object -First 1 | Out-String)).Trim()
          $ninja = [string]((& ninja --version | Out-String)).Trim()
          @(
            "asset_tag=${{ matrix.asset_tag }}",
            "runner_os=${{ runner.os }}",
            "runner_arch=${{ runner.arch }}",
            "clang=$clang",
            "cmake=$cmake",
            "ninja=$ninja"
          ) | Set-Content -Path "cpp-seed-reserve-${{ matrix.asset_tag }}.txt" -Encoding utf8

      - name: Upload C++ reserve report
        uses: actions/upload-artifact@v4
        with:
          name: cpp-seed-reserve-${{ matrix.asset_tag }}
          path: |
            cpp-seed-reserve-${{ matrix.asset_tag }}.txt
            cpp-seed-probe-output.txt
