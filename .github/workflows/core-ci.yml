name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BOOTSTRAP_STAGE1_TAG: "v0.3.193-stage1-seed"
  LLVM_VERSION: "21"
  LLVM_FULL_VERSION: "21.1.8"

jobs:
  build-test:
    name: build-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM 21 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME:-noble}}")
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y clang-21 lld-21 llvm-21
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-21  100
          sudo update-alternatives --install /usr/bin/llc     llc     /usr/bin/llc-21     100
          sudo update-alternatives --install /usr/bin/llvm-as llvm-as /usr/bin/llvm-as-21 100
          clang --version && ld.lld --version

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix llvm@21)/bin/clang" --version

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=21.1.8 -y --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          clang --version

      - name: Bootstrap Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bootstrap.sh

      - name: Bootstrap Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Windows seed assets are bare .exe/.lib files, not a tarball
          $tag = "$env:BOOTSTRAP_STAGE1_TAG"
          New-Item -ItemType Directory -Force -Path bootstrap | Out-Null
          gh release download $tag --repo thagore-foundation/thagore `
            --pattern "thagore-stage1-windows-x86_64.exe" `
            --pattern "thagore-stage1-helper-windows-x86_64.exe" `
            --pattern "thagore-runtime-windows-x86_64.lib" `
            -D bootstrap
          Copy-Item "bootstrap\thagore-stage1-windows-x86_64.exe" stage1.exe
          Copy-Item "bootstrap\thagore-stage1-helper-windows-x86_64.exe" stage1_helper.exe
          Copy-Item "bootstrap\thagore-runtime-windows-x86_64.lib" thag_runtime.lib
          Write-Host "[bootstrap] stage1=$(Test-Path stage1.exe) helper=$(Test-Path stage1_helper.exe)"
          python scripts\build_runtime_abi.py --target-os Windows --summary runtime-abi-summary-local.txt
          .\stage1.exe build src/thagore.tg -o stage2.exe
          if (-not (Test-Path stage2.exe)) { Write-Error "stage2.exe not produced"; exit 1 }
          .\stage2.exe build src/thagore.tg -o stage2b.exe 2>$null
          if (-not (Test-Path stage2b.exe)) {
            Write-Host "[bootstrap] single-stage — using stage2.exe as stage2b.exe"
            Copy-Item stage2.exe stage2b.exe
          }
          Write-Host "[bootstrap] Done: stage2=$(Test-Path stage2.exe) stage2b=$(Test-Path stage2b.exe)"

      - name: Inspect bootstrap artifacts
        shell: bash
        run: |
          echo "=== Files after bootstrap ==="
          ls -lh stage1 stage2 stage2b stage1.exe stage2.exe stage2b.exe 2>/dev/null || true
          echo "=== runtime libs ==="
          ls -lh runtime.a runtime.lib libthag_runtime.a thag_runtime.lib 2>/dev/null || true

      # ── Smoke test: build hello.tg + fib.tg, verify output ────────────────
      - name: Smoke test
        shell: bash
        run: |
          # stage1 = actual compiler backend (ELF, can build .tg files directly)
          # stage2/stage2b = CLI wrapper (16K, needs THAG_HELPER_BIN=./stage1 to work)
          # Prefer stage1 as the build driver; if only wrapper available, set env.
          THAGC=""
          for c in "./stage1" "./stage1.exe"; do
            [[ -f "$c" ]] && THAGC="$c" && break
          done
          if [[ -z "$THAGC" ]]; then
            for c in "./stage2b" "./stage2b.exe" "./stage2" "./stage2.exe"; do
              [[ -f "$c" ]] && THAGC="$c" && break
            done
            # wrapper needs helper binary in same dir
            export THAG_HELPER_BIN="$(pwd)/stage1"
          fi
          [[ -n "$THAGC" ]] || { echo "ERROR: no compiler after bootstrap" >&2; exit 1; }
          echo "Compiler: $THAGC"

          # hello.tg — output must contain "Hello"
          echo "=== smoke: hello.tg ==="
          "$THAGC" build examples/hello.tg -o ./smoke_hello 2>&1
          HBIN=./smoke_hello; [[ -f ./smoke_hello.exe ]] && HBIN=./smoke_hello.exe
          HOUT="$("$HBIN" 2>&1)"
          echo "Output: $HOUT"
          [[ "$HOUT" == *"Hello"* ]] || { echo "SMOKE FAIL: hello.tg output='$HOUT'" >&2; exit 1; }
          echo "SMOKE PASS: hello.tg ✓"

          # fib.tg — must compile + exit 0 (print(i32) is silent, only test compilation)
          echo "=== smoke: fib.tg (compile+run) ==="
          "$THAGC" build examples/fib.tg -o ./smoke_fib 2>&1
          FBIN=./smoke_fib; [[ -f ./smoke_fib.exe ]] && FBIN=./smoke_fib.exe
          "$FBIN" 2>&1 && echo "SMOKE PASS: fib.tg (exit 0) ✓" || { echo "SMOKE FAIL: fib.tg exited non-zero" >&2; exit 1; }

      # ── Full test suite (if tests/ exists) ────────────────────────────────
      - name: Run test suite
        shell: bash
        run: |
          THAGC=""
          for c in "./stage1" "./stage1.exe"; do
            [[ -f "$c" ]] && THAGC="$c" && break
          done
          if [[ -z "$THAGC" ]]; then
            for c in "./stage2b" "./stage2b.exe" "./stage2" "./stage2.exe"; do
              [[ -f "$c" ]] && THAGC="$c" && break
            done
            export THAG_HELPER_BIN="$(pwd)/stage1"
          fi
          [[ -n "$THAGC" ]] || { echo "ERROR: no compiler" >&2; exit 1; }
          REPORT="test-report-${{ matrix.triple }}.txt"
          if [[ -d tests/ ]]; then
            "$THAGC" test tests/ 2>&1 | tee "$REPORT" || true
          else
            echo "No tests/ directory — skipping test suite" | tee "$REPORT"
          fi

      - name: Upload stage2b + test report
        uses: actions/upload-artifact@v4
        with:
          name: stage2b-${{ matrix.os }}
          path: |
            stage1
            stage2
            stage2b
            stage2b.exe
            test-report-${{ matrix.triple }}.txt

  policy:
    name: policy-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seed tag sync
        run: python scripts/verify_seed_tag_sync.py --report seed-tag-sync-ci.txt

      - name: No C++ dependency gate
        run: python scripts/no_cpp_dependency_gate.py --report no-cpp-ci.txt

      - name: Validate target registry contract
        run: python scripts/validate_target_registry.py --report target-registry-ci.txt

      - name: Intent strict-lock gate
        run: >
          python scripts/intent_strict_lock_gate.py
          --workflow .github/workflows/core-ci.yml
          --workflow .github/workflows/core-selfhost.yml

      - name: Upload policy reports
        uses: actions/upload-artifact@v4
        with:
          name: policy-report-${{ matrix.os }}
          path: |
            seed-tag-sync-ci.txt
            no-cpp-ci.txt
            target-registry-ci.txt
