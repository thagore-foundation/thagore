name: Selfhost Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: selfhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhost:
    name: selfhost (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.24-stage1-seed"
      STAGE_TRACE_FILE: selfhost-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm --version=21.1.8 --no-progress -y
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Fetch stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          if [[ ! -f thag_runtime.lib && ! -f libthag_runtime.a ]]; then
            mkdir -p runtime/build
            clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
              cp runtime/build/thag_runtime.lib thag_runtime.lib
            else
              ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
              cp runtime/build/libthag_runtime.a libthag_runtime.a
              cp runtime/build/libthag_runtime.a thag_runtime.lib
            fi
          fi
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out"; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            rm -f s1_probe_fib s1_probe_fib.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" src/thagore.tg s1_probe_s2_rebuild || return 1
            local probe_s2_rebuild
            probe_s2_rebuild="$(resolve_bin "s1_probe_s2_rebuild" "src/thagore.tg" || true)"
            if [[ -z "$probe_s2_rebuild" ]]; then
              probe_s2_rebuild="$probe_s2"
            fi
            [[ -n "$probe_s2_rebuild" && -f "$probe_s2_rebuild" ]] || return 1
            chmod +x "$probe_s2_rebuild" || true
            thg_build "$probe_s2_rebuild" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            thg_build "$probe_s2_rebuild" examples/fib.tg s1_probe_fib || return 1
            local probe_fib
            probe_fib="$(resolve_bin "s1_probe_fib" "examples/fib.tg" || true)"
            [[ -n "$probe_fib" && -f "$probe_fib" ]] || return 1
            return 0
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1.exe; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Windows stage1 asset found in releases."; exit 1)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-linux.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Linux stage1 asset found in releases."; exit 1)
          else
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-macos.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no macOS stage1 asset found in releases."; exit 1)
          fi
          chmod +x "$STAGE1_BIN" || true
          echo "STAGE1_BIN=$STAGE1_BIN" >> "$GITHUB_ENV"

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Mandatory selfhost chain (Stage1 -> Stage2 -> Stage2)
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local base
            base="$(basename "$src" .tg)"
            resolve_local() {
              local preferred="$1"
              local src_base="$2"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$src_base" "$src_base.exe" "examples/$src_base" "examples/$src_base.exe" "src/$src_base" "src/$src_base.exe" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" "$base" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" "$base" || true)"
            if [[ -z "$got" && -f "$cc" ]]; then
              cp "$cc" "$out" || true
              got="$(resolve_local "$out" "$base" || true)"
            fi
            [[ -n "$got" ]]
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_selfhost.exe"
            FIB_BIN="fib_selfhost.exe"
          else
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_selfhost"
            FIB_BIN="fib_selfhost"
          fi

          thg_build "$STAGE1_BIN" src/thagore.tg "$STAGE2_BIN"
          STAGE2_BIN="$(resolve_bin "$STAGE2_BIN" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "$STAGE2_REBUILD_BIN"
          STAGE2_REBUILD_BIN="$(resolve_bin "$STAGE2_REBUILD_BIN" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg "$HELLO_BIN"
          HELLO_BIN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          test -f "$HELLO_BIN"

          thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg "$FIB_BIN"
          FIB_BIN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          test -f "$FIB_BIN"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Execute sample binaries
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Assert no stage0 fallback markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected:"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi
          cat "$STAGE_TRACE_FILE"

      - name: Upload selfhost trace
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-trace-${{ runner.os }}
          path: ${{ env.STAGE_TRACE_FILE }}
