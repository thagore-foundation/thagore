name: Selfhost Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: selfhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhost:
    name: selfhost (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: ""
      STAGE_TRACE_FILE: selfhost-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm --version=21.1.8 --no-progress -y
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Fetch stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          download_asset() {
            local pattern="$1"
            if [[ -n "$BOOTSTRAP_STAGE1_TAG" ]]; then
              gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
            else
              gh release download --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
            fi
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_ASSET="thagore-stage1.exe"
            STAGE1_BIN="stage1.exe"
            download_asset "$STAGE1_ASSET"
            cp "bootstrap/$STAGE1_ASSET" "$STAGE1_BIN"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            STAGE1_ASSET="thagore-linux.tar.gz"
            STAGE1_BIN="stage1"
            download_asset "$STAGE1_ASSET"
            tar -xzf "bootstrap/$STAGE1_ASSET" -C bootstrap
            CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in linux seed asset"; exit 1)
            cp "$CANDIDATE" "$STAGE1_BIN"
          else
            STAGE1_ASSET="thagore-macos.tar.gz"
            STAGE1_BIN="stage1"
            download_asset "$STAGE1_ASSET"
            tar -xzf "bootstrap/$STAGE1_ASSET" -C bootstrap
            CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in macos seed asset"; exit 1)
            cp "$CANDIDATE" "$STAGE1_BIN"
          fi
          chmod +x "$STAGE1_BIN" || true
          echo "STAGE1_BIN=$STAGE1_BIN" >> "$GITHUB_ENV"

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Mandatory selfhost chain (Stage1 -> Stage2 -> Stage2)
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_selfhost.exe"
            FIB_BIN="fib_selfhost.exe"
          else
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_selfhost"
            FIB_BIN="fib_selfhost"
          fi

          echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $STAGE2_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build src/thagore.tg -o "$STAGE2_BIN"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          echo "[CMD] ./$STAGE2_BIN build src/thagore.tg -o $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE2_BIN" build src/thagore.tg -o "$STAGE2_REBUILD_BIN"
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          echo "[CMD] ./$STAGE2_REBUILD_BIN build examples/hello.tg -o $HELLO_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE2_REBUILD_BIN" build examples/hello.tg -o "$HELLO_BIN"
          test -f "$HELLO_BIN"

          echo "[CMD] ./$STAGE2_REBUILD_BIN build examples/fib.tg -o $FIB_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE2_REBUILD_BIN" build examples/fib.tg -o "$FIB_BIN"
          test -f "$FIB_BIN"

      - name: Execute sample binaries
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./hello_selfhost.exe
            ./fib_selfhost.exe
          else
            chmod +x hello_selfhost fib_selfhost || true
            ./hello_selfhost
            ./fib_selfhost
          fi

      - name: Assert no stage0 fallback markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected:"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi
          cat "$STAGE_TRACE_FILE"

      - name: Upload selfhost trace
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-trace-${{ runner.os }}
          path: ${{ env.STAGE_TRACE_FILE }}
