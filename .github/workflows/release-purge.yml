name: Release Purge

on:
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: "Type PURGE_ALL_RELEASES to continue"
        required: true
        type: string
      dry_run:
        description: "Only report, do not delete"
        required: true
        default: true
        type: boolean
      keep_tag:
        description: "Optional tag to keep"
        required: false
        default: ""
        type: string

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify confirmation
        run: |
          if [[ "${{ inputs.confirm_phrase }}" != "PURGE_ALL_RELEASES" ]]; then
            echo "Invalid confirmation phrase"
            exit 1
          fi

      - name: Purge release/tag records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ -n "${{ inputs.keep_tag }}" ]]; then
            ARGS+=(--keep-tag "${{ inputs.keep_tag }}")
          fi
          python3 tooling/release/purge_legacy_releases.py "${ARGS[@]}" --report purge-report.json

      - name: Upload purge report
        uses: actions/upload-artifact@v4
        with:
          name: purge-report
          path: purge-report.json

