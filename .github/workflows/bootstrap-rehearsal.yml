name: Bootstrap Rehearsal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-rehearsal.yml"
      - "tests/bootstrap_probe/**"
      - "tooling/bootstrap/**"
      - "tooling/release/**"
      - "stdlib/**"
      - "crates/**"
      - "tools/thagore-cli/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Bootstrap rehearsal ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux-x64
            installer: sh
            prefix: ${{ runner.temp }}/thagore-install
            thagc: ${{ runner.temp }}/thagore-install/bin/thagc
          - runner: windows-latest
            os_name: windows-x64
            installer: pwsh
            prefix: ${{ runner.temp }}\thagore-install
            thagc: ${{ runner.temp }}\thagore-install\bin\thagc.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install latest public Thagore on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/thagore-foundation/thagore/releases/latest/download/thagup.sh -o "$RUNNER_TEMP/thagup.sh"
          sh "$RUNNER_TEMP/thagup.sh" --prefix "${{ matrix.prefix }}" --with-drago --force

      - name: Install latest public Thagore on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'thagup.ps1'
          Invoke-WebRequest -Uri 'https://github.com/thagore-foundation/thagore/releases/latest/download/thagup.ps1' -OutFile $installer
          & powershell -NoProfile -ExecutionPolicy Bypass -File $installer -Prefix '${{ matrix.prefix }}' -WithDrago -Force

      - name: Rehearse bootstrap probe on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/bootstrap/rehearse_probe.py \
            --thagc "${{ matrix.thagc }}" \
            --probe tests/bootstrap_probe/main.tg \
            --expected tests/bootstrap_probe/expected.txt \
            --result tests/bootstrap_probe/probe-result.txt \
            --out-dir bootstrap-rehearsal

      - name: Rehearse bootstrap probe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/bootstrap/rehearse_probe.py `
            --thagc '${{ matrix.thagc }}' `
            --probe 'tests/bootstrap_probe/main.tg' `
            --expected 'tests/bootstrap_probe/expected.txt' `
            --result 'tests/bootstrap_probe/probe-result.txt' `
            --out-dir 'bootstrap-rehearsal'

      - uses: actions/upload-artifact@v6
        with:
          name: bootstrap-rehearsal-${{ matrix.os_name }}
          path: bootstrap-rehearsal/*
