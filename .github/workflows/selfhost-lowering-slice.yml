name: Selfhost Lowering Slice

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/selfhost-lowering-slice.yml"
      - "bootstrap/selfhost/frontend/**"
      - "bootstrap/selfhost/corpus/**"
      - "bootstrap/selfhost/tools/**"
      - "tooling/ci/build_selfhost_frontend_stage.py"
      - "tooling/ci/selfhost_lowering_slice.py"
      - "tools/thagore-cli/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-lowering-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lowering-slice:
    name: Selfhost lowering slice ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux-x64
            thagc_bin: target/release/thagc
            exe_suffix: ""
          - runner: windows-latest
            os_name: windows-x64
            thagc_bin: target/release/thagc.exe
            exe_suffix: ".exe"

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 30
        shell: bash
        run: bash tooling/ci/install_linux_llvm14.sh

      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\tooling\ci\setup_msvc_env.ps1 -Arch amd64

      - name: Install Windows LLVM 14 prebuilt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target-prebuilt"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target.zip"
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          Invoke-WebRequest -Uri "https://github.com/thagore-foundation/thagore/releases/download/llvm-prebuilt-14.0.6/llvm-14.0.6-$target.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $llvmRoot = Join-Path $extractRoot "llvm-14.0.6-$target"
          $llvmBin = Join-Path $llvmRoot 'bin'
          $configCandidate = Join-Path $llvmBin 'llvm-config.exe'
          if (-not (Test-Path $configCandidate)) {
            $shimSource = Join-Path $env:RUNNER_TEMP 'llvm-config-lowering.cs'
            @(
              'using System;','using System.IO;','using System.Linq;','','internal static class Program','{',
              '    private static int Main(string[] args)','    {','        string root = Environment.GetEnvironmentVariable("THAGORE_LLVM_ROOT") ?? "";',
              '        string lib = Path.Combine(root, "lib");','        string include = Path.Combine(root, "include");',
              '        if (args.Contains("--version")) { Console.WriteLine("14.0.6"); return 0; }',
              '        if (args.Contains("--prefix")) { Console.WriteLine(root); return 0; }',
              '        if (args.Contains("--libdir")) { Console.WriteLine(lib); return 0; }',
              '        if (args.Contains("--includedir")) { Console.WriteLine(include); return 0; }',
              '        if (args.Contains("--build-mode")) { Console.WriteLine("Release"); return 0; }',
              '        if (args.Contains("--cflags")) { Console.WriteLine("-I" + include); return 0; }',
              '        if (args.Contains("--ldflags") || args.Contains("--system-libs")) { Console.WriteLine(""); return 0; }',
              '        if (args.Contains("--libnames") || args.Contains("--libs")) { var libs = Directory.EnumerateFiles(lib, "*.lib").Select(Path.GetFileName).Where(name => !string.IsNullOrWhiteSpace(name)).OrderBy(name => name, StringComparer.OrdinalIgnoreCase); Console.WriteLine(string.Join(" ", libs)); return 0; }',
              '        Console.WriteLine(""); return 0;','    }','}'
            ) | Set-Content -Path $shimSource -Encoding UTF8
            & csc /nologo "/out:$configCandidate" $shimSource
          }
          "LLVM_SYS_140_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THAGORE_LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_CONFIG_PATH=$configCandidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build host thagc on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release -p thagore-cli --bin thagc

      - name: Build host thagc on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release -p thagore-cli --bin thagc

      - name: Normalize lowering corpus line endings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root = Path("bootstrap/selfhost/corpus")
          for path in root.rglob("*"):
              if path.suffix not in {".tg", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              normalized = text.replace("\r\n", "\n").replace("\r", "\n")
              if normalized != text:
                  path.write_text(normalized, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Build selfhost lowering first pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/build_selfhost_frontend_stage.py \
            --repo-root "$PWD" \
            --thagc-bin "$PWD/${{ matrix.thagc_bin }}" \
            --manifest "bootstrap/selfhost/tools/frontend-lowering-manifest.txt" \
            --out-dir "$PWD/selfhost-lowering-first"

      - name: Validate selfhost lowering first pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/selfhost_lowering_slice.py \
            --repo-root "$PWD" \
            --lower-bin "$PWD/selfhost-lowering-first/selfhost-lower${{ matrix.exe_suffix }}" \
            --report-out "$PWD/selfhost-lowering-first/report.txt"

      - name: Build selfhost lowering second pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/build_selfhost_frontend_stage.py \
            --repo-root "$PWD" \
            --thagc-bin "$PWD/${{ matrix.thagc_bin }}" \
            --manifest "bootstrap/selfhost/tools/frontend-lowering-manifest.txt" \
            --out-dir "$PWD/selfhost-lowering-second"

      - name: Validate selfhost lowering second pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/selfhost_lowering_slice.py \
            --repo-root "$PWD" \
            --lower-bin "$PWD/selfhost-lowering-second/selfhost-lower${{ matrix.exe_suffix }}" \
            --report-out "$PWD/selfhost-lowering-second/report.txt"

      - name: Build selfhost lowering first pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/build_selfhost_frontend_stage.py `
            --repo-root $PWD `
            --thagc-bin $PWD/${{ matrix.thagc_bin }} `
            --manifest bootstrap/selfhost/tools/frontend-lowering-manifest.txt `
            --out-dir $PWD/selfhost-lowering-first

      - name: Validate selfhost lowering first pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/selfhost_lowering_slice.py `
            --repo-root $PWD `
            --lower-bin $PWD/selfhost-lowering-first/selfhost-lower${{ matrix.exe_suffix }} `
            --report-out $PWD/selfhost-lowering-first/report.txt

      - name: Build selfhost lowering second pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/build_selfhost_frontend_stage.py `
            --repo-root $PWD `
            --thagc-bin $PWD/${{ matrix.thagc_bin }} `
            --manifest bootstrap/selfhost/tools/frontend-lowering-manifest.txt `
            --out-dir $PWD/selfhost-lowering-second

      - name: Validate selfhost lowering second pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/selfhost_lowering_slice.py `
            --repo-root $PWD `
            --lower-bin $PWD/selfhost-lowering-second/selfhost-lower${{ matrix.exe_suffix }} `
            --report-out $PWD/selfhost-lowering-second/report.txt

      - name: Diff lowering reports on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: diff -u selfhost-lowering-first/report.txt selfhost-lowering-second/report.txt

      - name: Diff lowering reports on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-Content selfhost-lowering-first/report.txt -Raw) -ne (Get-Content selfhost-lowering-second/report.txt -Raw)) {
            throw 'selfhost lowering slice reports differ between rebuilds'
          }

      - name: Upload lowering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-lowering-slice-${{ matrix.os_name }}
          path: |
            selfhost-lowering-first/report.txt
            selfhost-lowering-second/report.txt

