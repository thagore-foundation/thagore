name: Bootstrap Certify

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Consecutive green run window"
        required: false
        default: "3"
  schedule:
    - cron: "0 */12 * * *"

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap certification (remote)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/certify_bootstrap_100.py \
            --window "${{ github.event.inputs.window || '3' }}" \
            --skip-local \
            --report bootstrap-certify-report.txt

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-certify-report
          path: bootstrap-certify-report.txt
