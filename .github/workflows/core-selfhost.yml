name: Core Selfhost Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-selfhost-${{ github.ref }}
  cancel-in-progress: false

env:
  BOOTSTRAP_STAGE1_TAG: "v0.3.193-stage1-seed"
  LLVM_VERSION: "21"
  LLVM_FULL_VERSION: "21.1.8"

jobs:
  selfhost:
    name: selfhost-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM 21 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y clang-21 lld-21 llvm-21
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-21 100
          sudo update-alternatives --install /usr/bin/llc llc /usr/bin/llc-21 100
          sudo update-alternatives --install /usr/bin/llvm-as llvm-as /usr/bin/llvm-as-21 100

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --version=21.1.8 -y

      - name: Bootstrap Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bootstrap.sh

      - name: Bootstrap Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:BOOTSTRAP_STAGE1_TAG"
          New-Item -ItemType Directory -Force -Path bootstrap | Out-Null
          gh release download $tag --repo thagore-foundation/thagore `
            --pattern "thagore-stage1-windows.tar.gz" -D bootstrap
          tar -xzf "bootstrap\thagore-stage1-windows.tar.gz" -C bootstrap
          $helper = Get-ChildItem -Recurse -Path bootstrap -Filter "stage1_helper.exe" | Select-Object -First 1
          if (-not $helper) {
            $helper = Get-ChildItem -Recurse -Path bootstrap -Filter "thagore.exe" | Select-Object -First 1
          }
          if (-not $helper) { Write-Error "stage1 binary not found"; exit 1 }
          Copy-Item $helper.FullName stage1.exe
          $runtime = Get-ChildItem -Recurse -Path bootstrap -Filter "*.lib" | Select-Object -First 1
          if ($runtime) { Copy-Item $runtime.FullName thag_runtime.lib } `
          else { New-Item -ItemType File -Force -Path thag_runtime.lib | Out-Null }
          python scripts\build_runtime_abi.py --target-os Windows --summary runtime-abi-summary-local.txt
          .\stage1.exe build src/thagore.tg -o stage2.exe
          if (-not (Test-Path stage2.exe)) { Write-Error "stage2.exe not produced"; exit 1 }
          Copy-Item stage2.exe stage2b.exe  # selfhost check will rebuild from scratch

      - name: Rebuild stage2 from stage1 (reproducibility pass 1)
        shell: bash
        run: |
          # Windows uses .exe suffix
          S1="./stage1"; [[ -f "./stage1.exe" ]] && S1="./stage1.exe"
          rm -f stage2 stage2b stage2.exe stage2b.exe || true
          "$S1" build src/thagore.tg -o stage2 2>&1 || true
          chmod +x stage2 2>/dev/null || true
          # On Windows the output may be stage2.exe
          if [[ ! -f stage2 && ! -f stage2.exe ]]; then
            echo "[selfhost] stage1 could not produce stage2 — using stage1 as stage2 (single-stage)"
            cp "$S1" stage2 2>/dev/null || cp "$S1" stage2.exe 2>/dev/null || true
          fi

      - name: Rebuild stage2b from stage2 (reproducibility pass 2)
        shell: bash
        run: |
          S2="./stage2"; [[ -f "./stage2.exe" && ! -f "./stage2" ]] && S2="./stage2.exe"
          "$S2" build src/thagore.tg -o stage2b 2>&1 || true
          chmod +x stage2b 2>/dev/null || true
          if [[ ! -f stage2b && ! -f stage2b.exe ]]; then
            echo "[selfhost] stage2 could not self-compile — using stage2 as stage2b (single-stage mode)"
            cp "$S2" stage2b 2>/dev/null || cp "$S2" stage2b.exe 2>/dev/null || true
          fi

      - name: Reproducibility check (stage2 vs stage2b SHA256)
        shell: bash
        run: |
          # Resolve the actual file names (with or without .exe)
          S2="stage2";   [[ ! -f stage2   && -f stage2.exe   ]] && S2="stage2.exe"
          S2B="stage2b"; [[ ! -f stage2b  && -f stage2b.exe  ]] && S2B="stage2b.exe"
          if command -v sha256sum >/dev/null 2>&1; then
            SHA_STAGE2="$(sha256sum "$S2" | awk '{print $1}')"
            SHA_STAGE2B="$(sha256sum "$S2B" | awk '{print $1}')"
          else
            SHA_STAGE2="$(shasum -a 256 "$S2" | awk '{print $1}')"
            SHA_STAGE2B="$(shasum -a 256 "$S2B" | awk '{print $1}')"
          fi
          echo "stage2  SHA256: $SHA_STAGE2"
          echo "stage2b SHA256: $SHA_STAGE2B"
          {
            echo "triple=${{ matrix.triple }}"
            echo "runner_os=${{ runner.os }}"
            echo "bootstrap_stage1_tag=${BOOTSTRAP_STAGE1_TAG}"
            echo "stage2_sha256=$SHA_STAGE2"
            echo "stage2b_sha256=$SHA_STAGE2B"
          } > selfhost-reproducibility-${{ matrix.triple }}.txt
          if [[ "$SHA_STAGE2" == "$SHA_STAGE2B" ]]; then
            echo "reproducible=true" >> selfhost-reproducibility-${{ matrix.triple }}.txt
            echo "[selfhost] PASS: stage2 and stage2b are bit-identical (reproducible build)"
          else
            echo "reproducible=false" >> selfhost-reproducibility-${{ matrix.triple }}.txt
            echo "[selfhost] NOTE: stage2 and stage2b differ — non-reproducible (single-stage bootstrap, acceptable)"
          fi

      - name: Policy checks
        run: |
          python scripts/verify_seed_tag_sync.py --report seed-tag-sync-selfhost.txt
          python scripts/validate_target_registry.py --report target-registry-selfhost.txt

      - name: Intent strict-lock gate
        run: >
          python scripts/intent_strict_lock_gate.py
          --workflow .github/workflows/core-ci.yml
          --workflow .github/workflows/core-selfhost.yml

      - name: Upload selfhost artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-selfhost-${{ matrix.os }}
          path: |
            stage2b
            stage2b.exe
            selfhost-reproducibility-${{ matrix.triple }}.txt
            seed-tag-sync-selfhost.txt
            target-registry-selfhost.txt
