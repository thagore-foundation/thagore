name: Release Toolchain

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-hosted:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tier: stable
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tier: stable
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            tier: stable
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            tier: stable
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            tier: stable
            archive: zip
            llvm_mode: bundle
            msvc_arch: amd64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            tier: stable
            archive: zip
            llvm_mode: source
            msvc_arch: arm64
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 llvm-14-dev llvm-14-tools libpolly-14-dev lld pkg-config zip
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> "$GITHUB_ENV"

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install llvm@14
          echo "LLVM_SYS_140_PREFIX=$(brew --prefix llvm@14)" >> "$GITHUB_ENV"

      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Windows LLVM 14 bundle
        if: runner.os == 'Windows' && matrix.llvm_mode == 'bundle'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'llvm-14.0.6-extract'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-14.0.6-x64'
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-14.0.6-windows-amd64-msvc17-msvcrt.7z'
          if (Test-Path $extractRoot) {
            Remove-Item -Recurse -Force $extractRoot
          }
          if (Test-Path $llvmRoot) {
            Remove-Item -Recurse -Force $llvmRoot
          }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/vovkos/llvm-package-windows/releases/download/llvm-14.0.6/llvm-14.0.6-windows-amd64-msvc17-msvcrt.7z' `
            -OutFile $archive
          7z x $archive "-o$extractRoot" -y | Out-Null
          $candidates = Get-ChildItem -Path $extractRoot -Directory -Recurse | Where-Object {
            (Test-Path (Join-Path $_.FullName 'bin')) -and
            (Test-Path (Join-Path $_.FullName 'lib')) -and
            (Test-Path (Join-Path $_.FullName 'include'))
          } | Sort-Object FullName
          if ($candidates.Count -eq 0) {
            Write-Host 'Extracted layout (depth 3):'
            Get-ChildItem -Path $extractRoot -Recurse -Depth 3 | ForEach-Object {
              Write-Host $_.FullName
            }
            throw "LLVM root not found under $extractRoot"
          }
          $sourceRoot = $candidates[0].FullName
          New-Item -ItemType Directory -Path $llvmRoot | Out-Null
          Copy-Item -Path (Join-Path $sourceRoot '*') -Destination $llvmRoot -Recurse -Force
          $llvmBin = Join-Path $llvmRoot 'bin'
          $llvmLib = Join-Path $llvmRoot 'lib'
          $llvmInclude = Join-Path $llvmRoot 'include'
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin directory not found at $llvmBin"
          }
          if (-not (Test-Path $llvmLib)) {
            throw "LLVM lib directory not found at $llvmLib"
          }
          if (-not (Test-Path $llvmInclude)) {
            throw "LLVM include directory not found at $llvmInclude"
          }
          $configCandidate = Join-Path $llvmBin 'llvm-config.exe'
          if (-not (Test-Path $configCandidate)) {
            $shimSource = Join-Path $env:RUNNER_TEMP 'llvm-config.cs'
            @"
            using System;
            using System.IO;
            using System.Linq;

            internal static class Program
            {
                private static int Main(string[] args)
                {
                    string root = Environment.GetEnvironmentVariable("THAGORE_LLVM_ROOT") ?? "";
                    string lib = Path.Combine(root, "lib");
                    string include = Path.Combine(root, "include");

                    if (args.Contains("--version"))
                    {
                        Console.WriteLine("14.0.6");
                        return 0;
                    }
                    if (args.Contains("--prefix"))
                    {
                        Console.WriteLine(root);
                        return 0;
                    }
                    if (args.Contains("--libdir"))
                    {
                        Console.WriteLine(lib);
                        return 0;
                    }
                    if (args.Contains("--includedir"))
                    {
                        Console.WriteLine(include);
                        return 0;
                    }
                    if (args.Contains("--build-mode"))
                    {
                        Console.WriteLine("Release");
                        return 0;
                    }
                    if (args.Contains("--cflags"))
                    {
                        Console.WriteLine("-I" + include);
                        return 0;
                    }
                    if (args.Contains("--ldflags"))
                    {
                        Console.WriteLine("");
                        return 0;
                    }
                    if (args.Contains("--system-libs"))
                    {
                        Console.WriteLine("");
                        return 0;
                    }
                    if (args.Contains("--libnames") || args.Contains("--libs"))
                    {
                        var libs = Directory.EnumerateFiles(lib, "*.lib")
                            .Select(Path.GetFileName)
                            .Where(name => !string.IsNullOrWhiteSpace(name))
                            .OrderBy(name => name, StringComparer.OrdinalIgnoreCase);
                        Console.WriteLine(string.Join(" ", libs));
                        return 0;
                    }

                    Console.WriteLine("");
                    return 0;
                }
            }
            "@ | Set-Content -Path $shimSource -Encoding UTF8
            & csc /nologo "/out:$configCandidate" $shimSource
          }
          "LLVM_SYS_140_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THAGORE_LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_CONFIG_PATH=$configCandidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows ARM64 LLVM 14 from source
        if: runner.os == 'Windows' && matrix.llvm_mode == 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          }
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-project-14.0.6.src.tar.xz'
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'llvm-project-14.0.6.src'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'llvm-14.0.6-arm64-build'
          $installRoot = Join-Path $env:RUNNER_TEMP 'llvm-14.0.6-arm64'
          Invoke-WebRequest `
            -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/llvm-project-14.0.6.src.tar.xz' `
            -OutFile $archive
          if (Test-Path $sourceRoot) {
            Remove-Item -Recurse -Force $sourceRoot
          }
          if (Test-Path $buildRoot) {
            Remove-Item -Recurse -Force $buildRoot
          }
          if (Test-Path $installRoot) {
            Remove-Item -Recurse -Force $installRoot
          }
          tar -xf $archive -C $env:RUNNER_TEMP
          cmake `
            -S (Join-Path $sourceRoot 'llvm') `
            -B $buildRoot `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=$installRoot `
            -DLLVM_TARGETS_TO_BUILD='AArch64;X86;WebAssembly' `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON
          cmake --build $buildRoot --config Release --target install --parallel 4
          $llvmBin = Join-Path $installRoot 'bin'
          if (-not (Test-Path (Join-Path $llvmBin 'llvm-config.exe'))) {
            throw "llvm-config.exe not found under $llvmBin"
          }
          "LLVM_SYS_140_PREFIX=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" -p thagore-cli -p thagore-fmt -p thagore-lsp

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          python3 tooling/release/package_release.py \
            --version "${VERSION}" \
            --tag "${RELEASE_TAG}" \
            --target "${{ matrix.target }}" \
            --archive-format "${{ matrix.archive }}" \
            --support-tier "${{ matrix.tier }}" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --stdlib-dir "stdlib" \
            --installer-dir "tooling/release" \
            --out-dir "dist"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish-draft:
    name: Publish draft release assets
    needs: build-hosted
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRAGO_VERSION: "1.0.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Normalize dist layout
        run: |
          mkdir -p release-dist
          find dist -type f -maxdepth 2 -exec cp {} release-dist/ \;
          cp tooling/release/thagup.sh release-dist/
          cp tooling/release/thagup.ps1 release-dist/

      - name: Generate manifest and checksums
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 tooling/release/generate_release_manifest.py \
            --version "${VERSION}" \
            --tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-dir release-dist \
            --targets-file tooling/packaging/targets.json \
            --tiers "stable,extended" \
            --drago-version "${DRAGO_VERSION}" \
            --drago-tag "v${DRAGO_VERSION}"

      - name: Create or update draft release
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --draft --title "${RELEASE_TAG}" --notes "Automated Thagore release ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" release-dist/* --clobber
