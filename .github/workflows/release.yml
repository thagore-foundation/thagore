name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: build-release (linux)
    runs-on: ubuntu-latest
    env:
      STAGE1_BIN: stage1
      FINAL_BIN: thagore
      HELLO_BIN: hello
      FIB_BIN: fib
      STAGE1_SEED_ASSET: thagore-stage1-linux.tar.gz
      RELEASE_ASSET: thagore-linux.tar.gz
      RELEASE_ASSET_LEGACY: thag-linux.tar.gz
      STAGE_TRACE_FILE: stage-commands.log
      ALLOW_STAGE0_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Bootstrap Stage1 (release asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap

          if gh release download --repo "${{ github.repository }}" --pattern "$STAGE1_SEED_ASSET" -D bootstrap; then
            mkdir -p bootstrap/extracted_stage1
            tar -xzf "bootstrap/$STAGE1_SEED_ASSET" -C bootstrap/extracted_stage1
            if [[ -f "bootstrap/extracted_stage1/bin/thagore" ]]; then
              cp "bootstrap/extracted_stage1/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted_stage1/dist/bin/thagore" ]]; then
              cp "bootstrap/extracted_stage1/dist/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted_stage1/dist/bin/thag" ]]; then
              cp "bootstrap/extracted_stage1/dist/bin/thag" "$STAGE1_BIN"
            fi
          fi

          if gh release download --repo "${{ github.repository }}" --pattern "$RELEASE_ASSET" -D bootstrap; then
            mkdir -p bootstrap/extracted
            tar -xzf "bootstrap/$RELEASE_ASSET" -C bootstrap/extracted
            if [[ -f "bootstrap/extracted/bin/thagore" ]]; then
              cp "bootstrap/extracted/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted/dist/bin/thagore" ]]; then
              cp "bootstrap/extracted/dist/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted/dist/bin/thag" ]]; then
              cp "bootstrap/extracted/dist/bin/thag" "$STAGE1_BIN"
            fi
          fi
          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "$RELEASE_ASSET_LEGACY" -D bootstrap; then
              mkdir -p bootstrap/extracted_legacy
              tar -xzf "bootstrap/$RELEASE_ASSET_LEGACY" -C bootstrap/extracted_legacy
              if [[ -f "bootstrap/extracted_legacy/bin/thagore" ]]; then
                cp "bootstrap/extracted_legacy/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/bin/thag" ]]; then
                cp "bootstrap/extracted_legacy/bin/thag" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/dist/bin/thagore" ]]; then
                cp "bootstrap/extracted_legacy/dist/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/dist/bin/thag" ]]; then
                cp "bootstrap/extracted_legacy/dist/bin/thag" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "thagore" -D bootstrap; then
              if [[ -f "bootstrap/thagore" ]]; then
                cp "bootstrap/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/thag" ]]; then
                cp "bootstrap/thag" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if [[ "$ALLOW_STAGE0_BOOTSTRAP" == "true" || "$ALLOW_STAGE0_BOOTSTRAP" == "1" || "$ALLOW_STAGE0_BOOTSTRAP" == "TRUE" || "$ALLOW_STAGE0_BOOTSTRAP" == "yes" || "$ALLOW_STAGE0_BOOTSTRAP" == "YES" ]]; then
              LLVM_ARG=""
              if [[ "${{ runner.os }}" == "Windows" && -n "${LLVM_PATH:-}" ]]; then
                LLVM_DOS="$(cygpath -d "$LLVM_PATH" 2>/dev/null || true)"
                if [[ -n "$LLVM_DOS" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_DOS}/lib/cmake/llvm"
                elif [[ -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
                fi
              elif [[ -n "${LLVM_PATH:-}" && -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
              elif [[ -d "/usr/lib/llvm-21/lib/cmake/llvm" ]]; then
                LLVM_ARG="-DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm"
              fi
              echo "[CMD] cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}" | tee -a "$STAGE_TRACE_FILE"
              cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}
              echo "[CMD] cmake --build legacy/build --config Release" | tee -a "$STAGE_TRACE_FILE"
              cmake --build legacy/build --config Release
              if [[ -f "legacy/build/thag" ]]; then
                cp "legacy/build/thag" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag" ]]; then
                cp "legacy/build/Release/thag" "$STAGE1_BIN"
              else
                echo "CRITICAL: stage0 fallback enabled but legacy build output not found."
                exit 1
              fi
            else
              echo "CRITICAL: Stage1 bootstrap asset not found on Linux."
              echo "Set ALLOW_STAGE0_BOOTSTRAP=true (or 1) to allow stage0 fallback."
              exit 1
            fi
          fi

          RUNTIME_CXX="clang++"
          if ! command -v "$RUNTIME_CXX" >/dev/null 2>&1; then
            RUNTIME_CXX="c++"
          fi
          "$RUNTIME_CXX" -std=c++17 -Ilegacy/include -c legacy/src/runtime/runtime.cpp -o thag_runtime.o
          ar rcs libthag_runtime.a thag_runtime.o
          cp libthag_runtime.a thag_runtime.lib
          if [[ ! -f "thag_runtime.lib" && ! -f "libthag_runtime.a" ]]; then
            echo "CRITICAL: runtime library missing (thag_runtime.lib/libthag_runtime.a)."
            exit 1
          fi

          chmod +x "$STAGE1_BIN"
          echo "[CMD] ./$STAGE1_BIN build examples/hello.tg -o stage1_probe" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build examples/hello.tg -o stage1_probe
          [[ -f "stage1_probe" ]] || (echo "CRITICAL: downloaded stage1 asset is invalid."; exit 1)
          ./stage1_probe || true

          echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $FINAL_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build src/thagore.tg -o "$FINAL_BIN"
          [[ -f "$FINAL_BIN" ]] || (echo "ERROR: missing stage2 binary"; exit 1)

      - name: Test hello + fib
        shell: bash
        run: |
          set -euo pipefail
          export THAG_STAGE0_HELPER="./$STAGE1_BIN"
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find . -maxdepth 3 -type f \( -name "$base" -o -name "$base.exe" \) | head -n 1)"
            if [[ -n "$found" ]]; then
              echo "${found#./}"
              return 0
            fi
            return 1
          }
          "./$STAGE1_BIN" build examples/hello.tg -o "$HELLO_BIN"
          "./$STAGE1_BIN" build examples/fib.tg -o "$FIB_BIN"
          HELLO_RUN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          FIB_RUN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          "./$HELLO_RUN"
          "./$FIB_RUN"

      - name: Package tar.gz + .deb
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$FINAL_BIN" dist/bin/thagore
          chmod +x dist/bin/thagore
          cp -r std dist/lib/std
          cp scripts/install/install-linux.sh dist/install.sh
          chmod +x dist/install.sh
          tar -czf "$RELEASE_ASSET" -C dist .
          rm -rf seed_dist
          cp -r dist seed_dist
          cp "$STAGE1_BIN" seed_dist/bin/thagore
          chmod +x seed_dist/bin/thagore
          tar -czf "$STAGE1_SEED_ASSET" -C seed_dist .
          cp "$RELEASE_ASSET" "$RELEASE_ASSET_LEGACY"

          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.0.0"
          PKG_ROOT="deb_dist/thagore_${VERSION}_amd64"
          rm -rf deb_dist
          mkdir -p "${PKG_ROOT}/DEBIAN" "${PKG_ROOT}/usr/bin" "${PKG_ROOT}/usr/lib/thagore"
          cp "$FINAL_BIN" "${PKG_ROOT}/usr/bin/thagore"
          chmod +x "${PKG_ROOT}/usr/bin/thagore"
          cp -r std "${PKG_ROOT}/usr/lib/thagore/std"
          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: thagore
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Thagore Foundation <release@thagore.org>
          Depends: libc6
          Description: Thagore self-hosted compiler
          EOF
          dpkg-deb --build "${PKG_ROOT}"
          mv "deb_dist/thagore_${VERSION}_amd64.deb" "thagore_${VERSION}_amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            thagore-stage1-linux.tar.gz
            thagore-linux.tar.gz
            thag-linux.tar.gz
            thagore_*_amd64.deb

  build-macos:
    name: build-release (macos)
    runs-on: macos-latest
    env:
      STAGE1_BIN: stage1
      FINAL_BIN: thagore
      HELLO_BIN: hello
      FIB_BIN: fib
      STAGE1_SEED_ASSET: thagore-stage1-macos.tar.gz
      BOOTSTRAP_ASSET: thagore-macos.tar.gz
      BOOTSTRAP_ASSET_LEGACY: thag-macos.tar.gz
      RELEASE_ASSET: thagore-macos.pkg
      STAGE_TRACE_FILE: stage-commands.log
      ALLOW_STAGE0_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Bootstrap Stage1 (release asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap

          if gh release download --repo "${{ github.repository }}" --pattern "$STAGE1_SEED_ASSET" -D bootstrap; then
            mkdir -p bootstrap/extracted_stage1
            tar -xzf "bootstrap/$STAGE1_SEED_ASSET" -C bootstrap/extracted_stage1
            if [[ -f "bootstrap/extracted_stage1/bin/thagore" ]]; then
              cp "bootstrap/extracted_stage1/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted_stage1/dist/bin/thagore" ]]; then
              cp "bootstrap/extracted_stage1/dist/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted_stage1/dist/bin/thag" ]]; then
              cp "bootstrap/extracted_stage1/dist/bin/thag" "$STAGE1_BIN"
            fi
          fi

          if gh release download --repo "${{ github.repository }}" --pattern "$BOOTSTRAP_ASSET" -D bootstrap; then
            mkdir -p bootstrap/extracted
            tar -xzf "bootstrap/$BOOTSTRAP_ASSET" -C bootstrap/extracted
            if [[ -f "bootstrap/extracted/bin/thagore" ]]; then
              cp "bootstrap/extracted/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted/dist/bin/thagore" ]]; then
              cp "bootstrap/extracted/dist/bin/thagore" "$STAGE1_BIN"
            elif [[ -f "bootstrap/extracted/dist/bin/thag" ]]; then
              cp "bootstrap/extracted/dist/bin/thag" "$STAGE1_BIN"
            fi
          fi
          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "$BOOTSTRAP_ASSET_LEGACY" -D bootstrap; then
              mkdir -p bootstrap/extracted_legacy
              tar -xzf "bootstrap/$BOOTSTRAP_ASSET_LEGACY" -C bootstrap/extracted_legacy
              if [[ -f "bootstrap/extracted_legacy/bin/thagore" ]]; then
                cp "bootstrap/extracted_legacy/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/bin/thag" ]]; then
                cp "bootstrap/extracted_legacy/bin/thag" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/dist/bin/thagore" ]]; then
                cp "bootstrap/extracted_legacy/dist/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_legacy/dist/bin/thag" ]]; then
                cp "bootstrap/extracted_legacy/dist/bin/thag" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "thagore" -D bootstrap; then
              if [[ -f "bootstrap/thagore" ]]; then
                cp "bootstrap/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/thag" ]]; then
                cp "bootstrap/thag" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if [[ "$ALLOW_STAGE0_BOOTSTRAP" == "true" || "$ALLOW_STAGE0_BOOTSTRAP" == "1" || "$ALLOW_STAGE0_BOOTSTRAP" == "TRUE" || "$ALLOW_STAGE0_BOOTSTRAP" == "yes" || "$ALLOW_STAGE0_BOOTSTRAP" == "YES" ]]; then
              LLVM_ARG=""
              if [[ "${{ runner.os }}" == "Windows" && -n "${LLVM_PATH:-}" ]]; then
                LLVM_DOS="$(cygpath -d "$LLVM_PATH" 2>/dev/null || true)"
                if [[ -n "$LLVM_DOS" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_DOS}/lib/cmake/llvm"
                elif [[ -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
                fi
              elif [[ -n "${LLVM_PATH:-}" && -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
              else
                LLVM_PREFIX="$(brew --prefix llvm 2>/dev/null || true)"
                if [[ -n "$LLVM_PREFIX" && -d "$LLVM_PREFIX/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm"
                fi
              fi
              echo "[CMD] cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}" | tee -a "$STAGE_TRACE_FILE"
              cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}
              echo "[CMD] cmake --build legacy/build --config Release" | tee -a "$STAGE_TRACE_FILE"
              cmake --build legacy/build --config Release
              if [[ -f "legacy/build/thag" ]]; then
                cp "legacy/build/thag" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag" ]]; then
                cp "legacy/build/Release/thag" "$STAGE1_BIN"
              else
                echo "CRITICAL: stage0 fallback enabled but legacy build output not found."
                exit 1
              fi
            else
              echo "CRITICAL: Stage1 bootstrap asset not found on macOS."
              echo "Set ALLOW_STAGE0_BOOTSTRAP=true (or 1) to allow stage0 fallback."
              exit 1
            fi
          fi

          RUNTIME_CXX="clang++"
          if ! command -v "$RUNTIME_CXX" >/dev/null 2>&1; then
            RUNTIME_CXX="c++"
          fi
          "$RUNTIME_CXX" -std=c++17 -Ilegacy/include -c legacy/src/runtime/runtime.cpp -o thag_runtime.o
          ar rcs libthag_runtime.a thag_runtime.o
          if command -v libtool >/dev/null 2>&1; then
            libtool -static -o thag_runtime.lib thag_runtime.o || cp libthag_runtime.a thag_runtime.lib
          else
            cp libthag_runtime.a thag_runtime.lib
          fi
          if [[ ! -f "thag_runtime.lib" && ! -f "libthag_runtime.a" ]]; then
            echo "CRITICAL: runtime library missing (thag_runtime.lib/libthag_runtime.a)."
            exit 1
          fi

          chmod +x "$STAGE1_BIN"
          echo "[CMD] ./$STAGE1_BIN build examples/hello.tg -o stage1_probe" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build examples/hello.tg -o stage1_probe
          [[ -f "stage1_probe" ]] || (echo "CRITICAL: downloaded stage1 asset is invalid."; exit 1)
          ./stage1_probe || true

          echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $FINAL_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build src/thagore.tg -o "$FINAL_BIN"
          [[ -f "$FINAL_BIN" ]] || (echo "ERROR: missing stage2 binary"; exit 1)

      - name: Test hello + fib
        shell: bash
        run: |
          set -euo pipefail
          export THAG_STAGE0_HELPER="./$STAGE1_BIN"
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find . -maxdepth 3 -type f \( -name "$base" -o -name "$base.exe" \) | head -n 1)"
            if [[ -n "$found" ]]; then
              echo "${found#./}"
              return 0
            fi
            return 1
          }
          "./$STAGE1_BIN" build examples/hello.tg -o "$HELLO_BIN"
          "./$STAGE1_BIN" build examples/fib.tg -o "$FIB_BIN"
          HELLO_RUN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          FIB_RUN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          "./$HELLO_RUN"
          "./$FIB_RUN"

      - name: Package tar.gz + pkg
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$FINAL_BIN" dist/bin/thagore
          chmod +x dist/bin/thagore
          cp -r std dist/lib/std
          tar -czf "$BOOTSTRAP_ASSET" -C dist .
          rm -rf seed_dist
          cp -r dist seed_dist
          cp "$STAGE1_BIN" seed_dist/bin/thagore
          chmod +x seed_dist/bin/thagore
          tar -czf "$STAGE1_SEED_ASSET" -C seed_dist .
          cp "$BOOTSTRAP_ASSET" "$BOOTSTRAP_ASSET_LEGACY"

          rm -rf pkgroot
          mkdir -p pkgroot/usr/local/bin pkgroot/usr/local/lib/thagore
          cp "$FINAL_BIN" pkgroot/usr/local/bin/thagore
          chmod +x pkgroot/usr/local/bin/thagore
          cp -r std pkgroot/usr/local/lib/thagore/std

          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.0.0"
          pkgbuild --root pkgroot --identifier org.thagore.compiler --version "$VERSION" --install-location "/" "$RELEASE_ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            thagore-stage1-macos.tar.gz
            thagore-macos.tar.gz
            thag-macos.tar.gz
            thagore-macos.pkg

  build-windows:
    name: build-release (windows)
    runs-on: windows-latest
    env:
      STAGE1_BIN: stage1.exe
      FINAL_BIN: thagore.exe
      HELLO_BIN: hello.exe
      FIB_BIN: fib.exe
      STAGE1_SEED_ASSET: thagore-stage1.exe
      RELEASE_ASSET: thagore-windows-setup.exe
      RELEASE_ASSET_LEGACY: thag-windows-setup.exe
      STAGE_TRACE_FILE: stage-commands.log
      ALLOW_STAGE0_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      - name: Install NSIS
        shell: bash
        run: choco install nsis --no-progress -y

      - name: Bootstrap Stage1 (release asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap

          if gh release download --repo "${{ github.repository }}" --pattern "$STAGE1_SEED_ASSET" -D bootstrap; then
            if [[ -f "bootstrap/$STAGE1_SEED_ASSET" ]]; then
              cp "bootstrap/$STAGE1_SEED_ASSET" "$STAGE1_BIN"
            fi
          fi

          if gh release download --repo "${{ github.repository }}" --pattern "thagore-windows-setup.exe" -D bootstrap; then
            mkdir -p bootstrap/install
            "bootstrap/thagore-windows-setup.exe" /S "/D=$PWD/bootstrap/install" || true
            if [[ -f "bootstrap/install/bin/thagore.exe" ]]; then
              cp "bootstrap/install/bin/thagore.exe" "$STAGE1_BIN"
            elif [[ -f "bootstrap/install/bin/thag.exe" ]]; then
              cp "bootstrap/install/bin/thag.exe" "$STAGE1_BIN"
            fi
          fi
          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "thag-windows-setup.exe" -D bootstrap; then
              mkdir -p bootstrap/install
              "bootstrap/thag-windows-setup.exe" /S "/D=$PWD/bootstrap/install" || true
              if [[ -f "bootstrap/install/bin/thagore.exe" ]]; then
                cp "bootstrap/install/bin/thagore.exe" "$STAGE1_BIN"
              elif [[ -f "bootstrap/install/bin/thag.exe" ]]; then
                cp "bootstrap/install/bin/thag.exe" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if gh release download --repo "${{ github.repository }}" --pattern "thagore.exe" -D bootstrap; then
              if [[ -f "bootstrap/thagore.exe" ]]; then
                cp "bootstrap/thagore.exe" "$STAGE1_BIN"
              elif [[ -f "bootstrap/thag.exe" ]]; then
                cp "bootstrap/thag.exe" "$STAGE1_BIN"
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if [[ "$ALLOW_STAGE0_BOOTSTRAP" == "true" || "$ALLOW_STAGE0_BOOTSTRAP" == "1" || "$ALLOW_STAGE0_BOOTSTRAP" == "TRUE" || "$ALLOW_STAGE0_BOOTSTRAP" == "yes" || "$ALLOW_STAGE0_BOOTSTRAP" == "YES" ]]; then
              LLVM_ARG=""
              if [[ "${{ runner.os }}" == "Windows" && -n "${LLVM_PATH:-}" ]]; then
                LLVM_DOS="$(cygpath -d "$LLVM_PATH" 2>/dev/null || true)"
                if [[ -n "$LLVM_DOS" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_DOS}/lib/cmake/llvm"
                elif [[ -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
                fi
              elif [[ -n "${LLVM_PATH:-}" && -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
              fi
              echo "[CMD] cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}" | tee -a "$STAGE_TRACE_FILE"
              cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}
              echo "[CMD] cmake --build legacy/build --config Release" | tee -a "$STAGE_TRACE_FILE"
              cmake --build legacy/build --config Release
              if [[ -f "legacy/build/thag.exe" ]]; then
                cp "legacy/build/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/thag" ]]; then
                cp "legacy/build/thag" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag.exe" ]]; then
                cp "legacy/build/Release/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag" ]]; then
                cp "legacy/build/Release/thag" "$STAGE1_BIN"
              else
                echo "CRITICAL: stage0 fallback enabled but legacy build output not found."
                exit 1
              fi
            else
              echo "CRITICAL: Stage1 bootstrap asset not found. Release build stops here."
              echo "Set ALLOW_STAGE0_BOOTSTRAP=true (or 1) to allow stage0 fallback."
              exit 1
            fi
          fi

          if [[ -f "legacy/thag_runtime.lib" ]]; then
            cp legacy/thag_runtime.lib thag_runtime.lib
          fi
          if [[ ! -f "thag_runtime.lib" ]]; then
            echo "CRITICAL: runtime library missing (thag_runtime.lib)."
            exit 1
          fi

          echo "[CMD] ./$STAGE1_BIN build examples/hello.tg -o stage1_probe.exe" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build examples/hello.tg -o stage1_probe.exe
          [[ -f "stage1_probe.exe" ]] || (echo "CRITICAL: downloaded stage1 asset is invalid."; exit 1)
          ./stage1_probe.exe || true

          echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $FINAL_BIN" | tee -a "$STAGE_TRACE_FILE"
          "./$STAGE1_BIN" build src/thagore.tg -o "$FINAL_BIN"
          [[ -f "$FINAL_BIN" ]] || (echo "ERROR: missing stage2 binary"; exit 1)

      - name: Test hello + fib
        shell: bash
        run: |
          set -euo pipefail
          export THAG_STAGE0_HELPER="./$STAGE1_BIN"
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find . -maxdepth 3 -type f \( -name "$base" -o -name "$base.exe" \) | head -n 1)"
            if [[ -n "$found" ]]; then
              echo "${found#./}"
              return 0
            fi
            return 1
          }
          "./$STAGE1_BIN" build examples/hello.tg -o "$HELLO_BIN"
          "./$STAGE1_BIN" build examples/fib.tg -o "$FIB_BIN"
          HELLO_RUN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          FIB_RUN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          "./$HELLO_RUN"
          "./$FIB_RUN"

      - name: Package Windows UI installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$FINAL_BIN" dist/bin/thagore.exe
          cp "$FINAL_BIN" dist/bin/thag.exe
          cp "$STAGE1_BIN" "$STAGE1_SEED_ASSET"
          cp -r std dist/lib/std
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.0.0"
          "/c/Program Files (x86)/NSIS/makensis.exe" "//DVERSION=$VERSION" installer/windows/thagore.nsi
          if [[ -f "installer/windows/$RELEASE_ASSET" ]]; then
            mv "installer/windows/$RELEASE_ASSET" "$RELEASE_ASSET"
          fi
          [[ -f "$RELEASE_ASSET" ]] || (echo "ERROR: installer not generated"; exit 1)
          cp "$RELEASE_ASSET" "$RELEASE_ASSET_LEGACY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            thagore-stage1.exe
            thagore-windows-setup.exe
            thag-windows-setup.exe

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-macos
      - build-windows
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/release-linux/*
            release-assets/release-macos/*
            release-assets/release-windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Homebrew formula
        if: startsWith(github.ref, 'refs/tags/')
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: thagore
          homebrew-tap: thagore-foundation/homebrew-thagore
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/thagore-linux.tar.gz
          commit-message: "Update thagore to {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
