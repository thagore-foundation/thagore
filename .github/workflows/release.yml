name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no release publish)"
        required: false
        default: "true"

permissions:
  actions: read
  contents: write

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seed tag sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/verify_seed_tag_sync.py --report seed-tag-sync-release.txt

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  seed-asset-probe:
    name: seed-asset-probe
    needs: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      available_tags: ${{ steps.probe.outputs.available_tags }}
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
    steps:
      - name: Probe stage1/runtime seed assets
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_names=";$(gh release view "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | tr '\n' ';')"
          has_asset() {
            local name="$1"
            [[ "$asset_names" == *";${name};"* ]]
          }
          available=";"
          if has_asset "thagore-stage1-linux-x86_64.tar.gz" && has_asset "thagore-runtime-linux-x86_64.a"; then
            available="${available}linux-x86_64;"
          elif has_asset "thagore-stage1-linux.tar.gz" && has_asset "thagore-runtime-linux.a"; then
            available="${available}linux-x86_64;"
          fi
          if has_asset "thagore-stage1-linux-arm64.tar.gz" && has_asset "thagore-runtime-linux-arm64.a"; then
            available="${available}linux-arm64;"
          fi
          if has_asset "thagore-stage1-macos-x86_64.tar.gz" && has_asset "thagore-runtime-macos-x86_64.a"; then
            available="${available}macos-x86_64;"
          fi
          if has_asset "thagore-stage1-macos-arm64.tar.gz" && has_asset "thagore-runtime-macos-arm64.a"; then
            available="${available}macos-arm64;"
          elif has_asset "thagore-stage1-macos.tar.gz" && has_asset "thagore-runtime-macos.a"; then
            available="${available}macos-arm64;"
          fi
          if has_asset "thagore-stage1-windows-x86_64.exe" && has_asset "thagore-runtime-windows-x86_64.lib"; then
            available="${available}windows-x86_64;"
          elif has_asset "thagore-stage1.exe" && has_asset "thagore-runtime-windows.lib"; then
            available="${available}windows-x86_64;"
          fi
          if has_asset "thagore-stage1-windows-arm64.exe" && has_asset "thagore-runtime-windows-arm64.lib"; then
            available="${available}windows-arm64;"
          fi
          echo "available_tags=$available" >> "$GITHUB_OUTPUT"
          echo "available_tags=$available"

  build-release:
    name: release (${{ matrix.asset_tag }})
    needs: [discord-notify-init, seed-asset-probe]
    continue-on-error: ${{ matrix.allow_failure }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
            arch: x86_64
            asset_tag: linux-x86_64
            allow_failure: false
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux-x86_64.tar.gz
            stage1_seed_name: thagore-stage1-linux-x86_64.tar.gz
            runtime_seed_name: thagore-runtime-linux-x86_64.a
            stage_trace_file: release-stage-trace-linux-x86_64.log
          - runner: ubuntu-24.04-arm
            os_name: Linux
            arch: arm64
            asset_tag: linux-arm64
            allow_failure: false
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux-arm64.tar.gz
            stage1_seed_name: thagore-stage1-linux-arm64.tar.gz
            runtime_seed_name: thagore-runtime-linux-arm64.a
            stage_trace_file: release-stage-trace-linux-arm64.log
          - runner: macos-latest
            os_name: macOS
            arch: arm64
            asset_tag: macos-arm64
            allow_failure: false
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-macos-arm64.tar.gz
            stage1_seed_name: thagore-stage1-macos-arm64.tar.gz
            runtime_seed_name: thagore-runtime-macos-arm64.a
            stage_trace_file: release-stage-trace-macos-arm64.log
          - runner: windows-latest
            os_name: Windows
            arch: x86_64
            asset_tag: windows-x86_64
            allow_failure: false
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows-x86_64.tar.gz
            stage1_seed_name: thagore-stage1-windows-x86_64.exe
            runtime_seed_name: thagore-runtime-windows-x86_64.lib
            stage_trace_file: release-stage-trace-windows-x86_64.log
          - runner: windows-11-arm
            os_name: Windows
            arch: arm64
            asset_tag: windows-arm64
            allow_failure: false
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows-arm64.tar.gz
            stage1_seed_name: thagore-stage1-windows-arm64.exe
            runtime_seed_name: thagore-runtime-windows-arm64.lib
            stage_trace_file: release-stage-trace-windows-arm64.log
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
      STAGE_TRACE_FILE: ${{ matrix.stage_trace_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo dpkg --add-architecture amd64 || true
            sudo apt-get update || true
            sudo apt-get install -y qemu-user qemu-user-static libc6:amd64 libstdc++6:amd64 zlib1g:amd64
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" \
            --pattern "thagore-stage1*" \
            --pattern "thagore-runtime*" \
            --pattern "seed-promotion-manifest-*" \
            -D bootstrap || true
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            if [[ -f "bootstrap/$pattern" ]]; then
              return 0
            fi
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
            [[ -f "bootstrap/$pattern" ]]
          }
          download_runtime_asset() {
            local pattern="$1"
            local dest="$2"
            if [[ ! -f "bootstrap/$pattern" ]]; then
              gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
            fi
            if [[ -f "bootstrap/$pattern" ]]; then
              cp "bootstrap/$pattern" "$dest"
              return 0
            fi
            return 1
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out"; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            rm -f s1_probe_fib s1_probe_fib.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" src/thagore.tg s1_probe_s2_rebuild || return 1
            local probe_s2_rebuild
            probe_s2_rebuild="$(resolve_bin "s1_probe_s2_rebuild" "src/thagore.tg" || true)"
            if [[ -z "$probe_s2_rebuild" ]]; then
              probe_s2_rebuild="$probe_s2"
            fi
            [[ -n "$probe_s2_rebuild" && -f "$probe_s2_rebuild" ]] || return 1
            chmod +x "$probe_s2_rebuild" || true
            thg_build "$probe_s2_rebuild" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            thg_build "$probe_s2_rebuild" examples/fib.tg s1_probe_fib || return 1
            local probe_fib
            probe_fib="$(resolve_bin "s1_probe_fib" "examples/fib.tg" || true)"
            [[ -n "$probe_fib" && -f "$probe_fib" ]] || return 1
            return 0
          }
          STAGE1_ASSET=""
          STAGE1_CANDIDATES=("${{ matrix.stage1_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-windows-x86_64.exe")
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux-x86_64.tar.gz")
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-macos.tar.gz")
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
                echo "[SKIP] optional lane missing Windows stage1 asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
                echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
                : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
                : > "core-ir-release-${{ matrix.asset_tag }}.txt"
                : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
                exit 0
              fi
              echo "CRITICAL: no Windows stage1 asset found in releases."
              exit 1
            fi
          else
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" && "$ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}.x86_64"
                  chmod +x "${{ matrix.stage1_bin }}.x86_64" || true
                  printf '%s\n' \
                    '#!/usr/bin/env bash' \
                    'set -euo pipefail' \
                    'SELF_DIR="$(cd "$(dirname "$0")" && pwd)"' \
                    'EMU_BIN="$(command -v qemu-x86_64 || command -v qemu-x86_64-static || true)"' \
                    'if [[ -z "$EMU_BIN" ]]; then' \
                    '  echo "CRITICAL: missing qemu-x86_64 or qemu-x86_64-static in PATH" >&2' \
                    '  exit 1' \
                    'fi' \
                    'exec "$EMU_BIN" -L /usr/x86_64-linux-gnu "$SELF_DIR/stage1.x86_64" "$@"' \
                    > "${{ matrix.stage1_bin }}"
                else
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                fi
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
                echo "[SKIP] optional lane missing Unix stage1 asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
                echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
                : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
                : > "core-ir-release-${{ matrix.asset_tag }}.txt"
                : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
                exit 0
              fi
              echo "CRITICAL: no Unix stage1 asset found in releases."
              exit 1
            fi
          fi
          if [[ "$STAGE1_ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
            if [[ -f "bootstrap/$STAGE1_ASSET" ]]; then
              cp "bootstrap/$STAGE1_ASSET" "bootstrap/${{ matrix.stage1_seed_name }}"
            fi
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true
          RUNTIME_CANDIDATES=("${{ matrix.runtime_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-macos.a")
          fi
          RUNTIME_ASSET=""
          build_runtime_fallback() {
            mkdir -p _rt
            git cat-file blob 7f9ed799c71ceff8da657316012dc5e4d01d34d4 > _rt/runtime.cc
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" -c "from pathlib import Path; p=Path('_rt/runtime.cc'); raw=p.read_bytes(); txt=raw.decode('utf-16') if raw.startswith((b'\\xff\\xfe', b'\\xfe\\xff')) else raw.decode('utf-8', errors='replace'); p.write_text(txt, encoding='utf-8')"
            AR_BIN="llvm-ar"
            if ! command -v "$AR_BIN" >/dev/null 2>&1; then
              AR_BIN="ar"
            fi
            clang++ -std=c++17 -O2 -c _rt/runtime.cc -o _rt/runtime.o
            if [[ "${{ runner.os }}" == "Windows" ]] && command -v llvm-lib >/dev/null 2>&1; then
              llvm-lib "/OUT:bootstrap/${{ matrix.runtime_seed_name }}" _rt/runtime.o
            else
              "$AR_BIN" rcs "bootstrap/${{ matrix.runtime_seed_name }}" _rt/runtime.o
            fi
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "bootstrap/${{ matrix.runtime_seed_name }}" thag_runtime.lib
            else
              cp "bootstrap/${{ matrix.runtime_seed_name }}" libthag_runtime.a
              cp libthag_runtime.a thag_runtime.lib
            fi
            RUNTIME_ASSET="${{ matrix.runtime_seed_name }}"
          }
          runtime_contract_ok() {
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" scripts/runtime_abi_inventory.py \
              --profile bootstrap-critical \
              --runtime-lib thag_runtime.lib \
              --write "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
            grep -q "^status: pass$" "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "thag_runtime.lib"; then
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          else
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "libthag_runtime.a"; then
                cp libthag_runtime.a thag_runtime.lib
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          fi
          if [[ -z "$RUNTIME_ASSET" ]]; then
            build_runtime_fallback || true
          fi
          if [[ -n "$RUNTIME_ASSET" ]]; then
            if ! runtime_contract_ok; then
              echo "[WARN] runtime asset $RUNTIME_ASSET failed bootstrap-critical contract, rebuilding fallback..." | tee -a "$STAGE_TRACE_FILE"
              build_runtime_fallback || true
            fi
          fi
          if [[ -z "$RUNTIME_ASSET" ]]; then
            if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
              echo "[SKIP] optional lane missing runtime asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
              echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
              : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
              : > "core-ir-release-${{ matrix.asset_tag }}.txt"
              : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
              : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
              : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
              exit 0
            fi
            echo "CRITICAL: missing runtime asset for ${{ matrix.asset_tag }}."
            exit 1
          fi
          if [[ "$RUNTIME_ASSET" != "${{ matrix.runtime_seed_name }}" ]]; then
            cp "bootstrap/$RUNTIME_ASSET" "bootstrap/${{ matrix.runtime_seed_name }}"
          fi
          MANIFEST_ASSET=""
          for CANDIDATE in "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" "seed-promotion-manifest-${{ runner.os }}.txt"; do
            if download_asset "$CANDIDATE"; then
              MANIFEST_ASSET="$CANDIDATE"
              break
            fi
          done
          if [[ -n "$MANIFEST_ASSET" && -f "bootstrap/$MANIFEST_ASSET" ]]; then
            echo "[SEED] manifest=$MANIFEST_ASSET" | tee -a "$STAGE_TRACE_FILE"
          else
            echo "[SEED] manifest=missing (warn only for ${{ matrix.asset_tag }})" | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"

      - name: Discord update - Download stage1 bootstrap asset
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Download stage1 bootstrap asset

      - name: Runtime ABI bootstrap-critical gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"

      - name: Build Stage2 -> Stage2 (mandatory)
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            resolve_local() {
              local preferred="$1"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            echo "CRITICAL: compiler $cc succeeded but produced no artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE"
            return 1
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build "${{ matrix.stage1_bin }}" src/thagore.tg "${{ matrix.stage2_bin }}"
          STAGE2_BIN="$(resolve_bin "${{ matrix.stage2_bin }}" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "${{ matrix.stage2_rebuild_bin }}"
          STAGE2_REBUILD_BIN="$(resolve_bin "${{ matrix.stage2_rebuild_bin }}" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
            echo "[INFO] using in-place rebuilt compiler: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          HELLO_TARGET="${{ matrix.hello_bin }}"
          FIB_TARGET="${{ matrix.fib_bin }}"

          HELLO_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${{ matrix.stage1_bin }}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/hello.tg "$HELLO_TARGET"; then
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
              if [[ -n "$HELLO_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$HELLO_BIN"

          FIB_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${{ matrix.stage1_bin }}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/fib.tg "$FIB_TARGET"; then
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
              if [[ -n "$FIB_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$FIB_BIN"
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "WARN: bootstrap hash mismatch on Windows (non-bit-identical PE output)." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Discord update - Build Stage2 -> Stage2 (mandatory)
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Build Stage2 -> Stage2 (mandatory)

      - name: Run hello + fib
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Guard no stage0 markers
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Enforce no C++ dependency gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/no_cpp_dependency_gate.py --report "no-cpp-dependency-release-${{ matrix.asset_tag }}.txt"

      - name: Enforce deprecated API gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/deprecated_api_gate.py --report "deprecated-api-gate-release-${{ matrix.asset_tag }}.txt"

      - name: Build spec snapshot audit artifacts
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/spec_snapshot_audit.py --os-tag "release-${{ matrix.asset_tag }}" --out-dir "."

      - name: Package release payload
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$STAGE2_REBUILD_BIN" "dist/bin/${{ matrix.output_bin }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            cp "dist/bin/${{ matrix.output_bin }}" dist/bin/thag
          else
            cp "dist/bin/${{ matrix.output_bin }}" dist/bin/thag.exe
          fi
          cp -R std "dist/lib/std"
          mkdir -p dist/installer
          cp scripts/install/*.sh dist/installer/ || true
          cp scripts/install/*.ps1 dist/installer/ || true
          [[ -f "bootstrap/${{ matrix.stage1_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap seed asset bootstrap/${{ matrix.stage1_seed_name }}"; exit 1)
          [[ -f "bootstrap/${{ matrix.runtime_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap runtime asset bootstrap/${{ matrix.runtime_seed_name }}"; exit 1)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 200000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            tar -tzf "${{ matrix.stage1_seed_name }}" | grep -Eq "thagore|thag"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 20000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi
          bytes_pkg="$(wc -c < "${{ matrix.package_name }}")"
          if [[ "$bytes_pkg" -lt 2000 ]]; then
            echo "CRITICAL: ${{ matrix.package_name }} too small ($bytes_pkg bytes)."
            exit 1
          fi

      - name: Build Windows EXE installer (NSIS)
        if: runner.os == 'Windows' && env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          choco install nsis --no-progress -y --execution-timeout=1800
          NSIS_BIN=""
          if command -v makensis >/dev/null 2>&1; then
            NSIS_BIN="makensis"
          elif [[ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            NSIS_BIN="/c/Program Files (x86)/NSIS/makensis.exe"
          elif [[ -x "/c/ProgramData/chocolatey/bin/makensis.exe" ]]; then
            NSIS_BIN="/c/ProgramData/chocolatey/bin/makensis.exe"
          fi
          [[ -n "$NSIS_BIN" ]] || (echo "CRITICAL: NSIS makensis not found after installation."; exit 1)
          NSIS_WIN="$(cygpath -w "$NSIS_BIN")"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& '$NSIS_WIN' /DVERSION=${{ github.ref_name }} installer/windows/thagore.nsi"
          cp installer/windows/thagore-windows-setup.exe "thagore-setup-windows-${{ matrix.arch }}.exe"

      - name: Discord update - Package release payload
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Package release payload

      - name: Upload package artifacts
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_tag }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ matrix.runtime_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}
            runtime-abi-summary-release-${{ matrix.asset_tag }}.txt
            runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt
            no-cpp-dependency-release-${{ matrix.asset_tag }}.txt
            deprecated-api-gate-release-${{ matrix.asset_tag }}.txt
            typed-ir-release-${{ matrix.asset_tag }}.txt
            core-ir-release-${{ matrix.asset_tag }}.txt
            spec-summary-release-${{ matrix.asset_tag }}.txt
            seed-tag-sync-release.txt
            thagore-setup-windows-${{ matrix.arch }}.exe

      - name: Upload typed-ir audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-ir-release-${{ matrix.asset_tag }}
          path: typed-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload core-ir audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-release-${{ matrix.asset_tag }}
          path: core-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload spec-summary audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-summary-release-${{ matrix.asset_tag }}
          path: spec-summary-release-${{ matrix.asset_tag }}.txt

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, build-release]
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/thagore-linux-*.tar.gz
            artifacts/**/thagore-macos-*.tar.gz
            artifacts/**/thagore-windows-*.tar.gz
            artifacts/**/thagore-setup-windows-*.exe
            artifacts/**/thagore-stage1-linux-*.tar.gz
            artifacts/**/thagore-stage1-macos-*.tar.gz
            artifacts/**/thagore-stage1-windows-*.exe
            artifacts/**/thagore-runtime-linux-*.a
            artifacts/**/thagore-runtime-macos-*.a
            artifacts/**/thagore-runtime-windows-*.lib
            artifacts/**/release-stage-trace-*.log

      - name: Discord update - Publish GitHub Release Assets
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish GitHub Release Assets

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build-release, publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
