name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stage1_asset: thagore-stage1-linux.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux.tar.gz
            stage1_seed_name: thagore-stage1-linux.tar.gz
          - os: macos-latest
            stage1_asset: thagore-stage1-macos.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-macos.tar.gz
            stage1_seed_name: thagore-stage1-macos.tar.gz
          - os: windows-latest
            stage1_asset: thagore-stage1.exe
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows.tar.gz
            stage1_seed_name: thagore-stage1.exe
    env:
      BOOTSTRAP_STAGE1_TAG: v0.3.21-stage1-seed
      STAGE_TRACE_FILE: release-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm --version=21.1.8 --no-progress -y
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "${{ matrix.stage1_asset }}" -D bootstrap
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_asset }}" "${{ matrix.stage1_bin }}"
          else
            tar -xzf "bootstrap/${{ matrix.stage1_asset }}" -C bootstrap
            CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in unix seed asset"; exit 1)
            cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true

      - name: Build runtime artifact from runtime module
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Build Stage2 -> Stage2 (mandatory)
        shell: bash
        run: |
          set -euxo pipefail
          echo "[CMD] ./${{ matrix.stage1_bin }} build src/thagore.tg -o ${{ matrix.stage2_bin }}" | tee -a "$STAGE_TRACE_FILE"
          "./${{ matrix.stage1_bin }}" build src/thagore.tg -o "${{ matrix.stage2_bin }}"
          test -f "${{ matrix.stage2_bin }}"
          chmod +x "${{ matrix.stage2_bin }}" || true

          echo "[CMD] ./${{ matrix.stage2_bin }} build src/thagore.tg -o ${{ matrix.stage2_rebuild_bin }}" | tee -a "$STAGE_TRACE_FILE"
          "./${{ matrix.stage2_bin }}" build src/thagore.tg -o "${{ matrix.stage2_rebuild_bin }}"
          test -f "${{ matrix.stage2_rebuild_bin }}"
          chmod +x "${{ matrix.stage2_rebuild_bin }}" || true

          echo "[CMD] ./${{ matrix.stage2_rebuild_bin }} build examples/hello.tg -o ${{ matrix.hello_bin }}" | tee -a "$STAGE_TRACE_FILE"
          "./${{ matrix.stage2_rebuild_bin }}" build examples/hello.tg -o "${{ matrix.hello_bin }}"
          test -f "${{ matrix.hello_bin }}"

          echo "[CMD] ./${{ matrix.stage2_rebuild_bin }} build examples/fib.tg -o ${{ matrix.fib_bin }}" | tee -a "$STAGE_TRACE_FILE"
          "./${{ matrix.stage2_rebuild_bin }}" build examples/fib.tg -o "${{ matrix.fib_bin }}"
          test -f "${{ matrix.fib_bin }}"

      - name: Run hello + fib
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./${{ matrix.hello_bin }}
            ./${{ matrix.fib_bin }}
          else
            chmod +x "${{ matrix.hello_bin }}" "${{ matrix.fib_bin }}" || true
            ./${{ matrix.hello_bin }}
            ./${{ matrix.fib_bin }}
          fi

      - name: Guard no stage0 markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Package release payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "${{ matrix.stage2_rebuild_bin }}" "dist/bin/${{ matrix.output_bin }}"
          cp -R std "dist/lib/std"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "${{ matrix.stage2_rebuild_bin }}" "${{ matrix.stage1_seed_name }}"
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            tar -czf "${{ matrix.stage1_seed_name }}" -C dist/bin "${{ matrix.output_bin }}"
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/thagore-linux.tar.gz
            artifacts/**/thagore-macos.tar.gz
            artifacts/**/thagore-windows.tar.gz
            artifacts/**/thagore-stage1-linux.tar.gz
            artifacts/**/thagore-stage1-macos.tar.gz
            artifacts/**/thagore-stage1.exe
            artifacts/**/release-stage-trace.log
