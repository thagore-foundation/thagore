name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no release publish)"
        required: false
        default: "true"

permissions:
  actions: read
  contents: write

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seed tag sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/verify_seed_tag_sync.py --report seed-tag-sync-release.txt

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  seed-asset-probe:
    name: seed-asset-probe
    needs: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      available_tags: ${{ steps.probe.outputs.available_tags }}
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
    steps:
      - name: Probe stage1/runtime seed assets
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_names=";$(gh release view "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | tr '\n' ';')"
          has_asset() {
            local name="$1"
            [[ "$asset_names" == *";${name};"* ]]
          }
          available=";"
          if has_asset "thagore-stage1-linux-x86_64.tar.gz" && has_asset "thagore-runtime-linux-x86_64.a"; then
            available="${available}linux-x86_64;"
          elif has_asset "thagore-stage1-linux.tar.gz" && has_asset "thagore-runtime-linux.a"; then
            available="${available}linux-x86_64;"
          fi
          if has_asset "thagore-stage1-linux-arm64.tar.gz" && has_asset "thagore-runtime-linux-arm64.a"; then
            available="${available}linux-arm64;"
          fi
          if has_asset "thagore-stage1-macos-x86_64.tar.gz" && has_asset "thagore-runtime-macos-x86_64.a"; then
            available="${available}macos-x86_64;"
          fi
          if has_asset "thagore-stage1-macos-arm64.tar.gz" && has_asset "thagore-runtime-macos-arm64.a"; then
            available="${available}macos-arm64;"
          elif has_asset "thagore-stage1-macos.tar.gz" && has_asset "thagore-runtime-macos.a"; then
            available="${available}macos-arm64;"
          fi
          if has_asset "thagore-stage1-windows-x86_64.exe" && has_asset "thagore-runtime-windows-x86_64.lib"; then
            available="${available}windows-x86_64;"
          elif has_asset "thagore-stage1.exe" && has_asset "thagore-runtime-windows.lib"; then
            available="${available}windows-x86_64;"
          fi
          if has_asset "thagore-stage1-windows-arm64.exe" && has_asset "thagore-runtime-windows-arm64.lib"; then
            available="${available}windows-arm64;"
          fi
          echo "available_tags=$available" >> "$GITHUB_OUTPUT"
          echo "available_tags=$available"

  build-release:
    name: release (${{ matrix.asset_tag }})
    needs: [discord-notify-init, seed-asset-probe]
    continue-on-error: ${{ matrix.allow_failure }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
            arch: x86_64
            asset_tag: linux-x86_64
            allow_failure: false
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux-x86_64.tar.gz
            stage1_seed_name: thagore-stage1-linux-x86_64.tar.gz
            runtime_seed_name: thagore-runtime-linux-x86_64.a
            stage_trace_file: release-stage-trace-linux-x86_64.log
          - runner: ubuntu-24.04-arm
            os_name: Linux
            arch: arm64
            asset_tag: linux-arm64
            allow_failure: false
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux-arm64.tar.gz
            stage1_seed_name: thagore-stage1-linux-arm64.tar.gz
            runtime_seed_name: thagore-runtime-linux-arm64.a
            stage_trace_file: release-stage-trace-linux-arm64.log
          - runner: macos-latest
            os_name: macOS
            arch: arm64
            asset_tag: macos-arm64
            allow_failure: true
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-macos-arm64.tar.gz
            stage1_seed_name: thagore-stage1-macos-arm64.tar.gz
            runtime_seed_name: thagore-runtime-macos-arm64.a
            stage_trace_file: release-stage-trace-macos-arm64.log
          - runner: windows-latest
            os_name: Windows
            arch: x86_64
            asset_tag: windows-x86_64
            allow_failure: false
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows-x86_64.tar.gz
            stage1_seed_name: thagore-stage1-windows-x86_64.exe
            runtime_seed_name: thagore-runtime-windows-x86_64.lib
            stage_trace_file: release-stage-trace-windows-x86_64.log
          - runner: windows-11-arm
            os_name: Windows
            arch: arm64
            asset_tag: windows-arm64
            allow_failure: false
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows-arm64.tar.gz
            stage1_seed_name: thagore-stage1-windows-arm64.exe
            runtime_seed_name: thagore-runtime-windows-arm64.lib
            stage_trace_file: release-stage-trace-windows-arm64.log
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
      STAGE_TRACE_FILE: ${{ matrix.stage_trace_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
          else
            sudo apt-get update || true
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 21 all || true
            if [[ -d /usr/lib/llvm-21/bin ]]; then
              echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo apt-get update || true
            if ! sudo apt-get install -y qemu-user qemu-user-static qemu-user-binfmt; then
              echo "[WARN] qemu packages were not installed via apt; fallback resolver in bootstrap step will be used."
            fi
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" \
            --pattern "thagore-stage1*" \
            --pattern "thagore-runtime*" \
            --pattern "seed-promotion-manifest-*" \
            -D bootstrap || true
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            if [[ -f "bootstrap/$pattern" ]]; then
              return 0
            fi
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
            if [[ ! -f "bootstrap/$pattern" ]]; then
              curl -fsSL -o "bootstrap/$pattern" "https://github.com/${{ github.repository }}/releases/download/$BOOTSTRAP_STAGE1_TAG/$pattern" || true
            fi
            [[ -f "bootstrap/$pattern" ]]
          }
          download_runtime_asset() {
            local pattern="$1"
            local dest="$2"
            if [[ ! -f "bootstrap/$pattern" ]]; then
              gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
              if [[ ! -f "bootstrap/$pattern" ]]; then
                curl -fsSL -o "bootstrap/$pattern" "https://github.com/${{ github.repository }}/releases/download/$BOOTSTRAP_STAGE1_TAG/$pattern" || true
              fi
            fi
            if [[ -f "bootstrap/$pattern" ]]; then
              cp "bootstrap/$pattern" "$dest"
              return 0
            fi
            return 1
          }
          fetch_runtime_blob() {
            local out_path="$1"
            local blob_sha="7f9ed799c71ceff8da657316012dc5e4d01d34d4"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            if git cat-file blob "$blob_sha" > "$out_path" 2>/dev/null; then
              return 0
            fi
            local blob_json
            blob_json="$(mktemp)"
            gh api "repos/${{ github.repository }}/git/blobs/$blob_sha" > "$blob_json"
            "$PY" -c "import base64, json, pathlib, sys; d=json.load(open(sys.argv[1], encoding='utf-8')); pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(d['content']))" "$blob_json" "$out_path"
            rm -f "$blob_json" || true
          }
          probe_stage1_chain() {
            local bin="$1"
            "./$bin" --help >/dev/null 2>&1
          }
          build_stage1_blob_native() {
            mkdir -p _s1/blobseed/dist/bin
            fetch_runtime_blob _s1/runtime.cc
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" -c "from pathlib import Path; p=Path('_s1/runtime.cc'); raw=p.read_bytes(); txt=raw.decode('utf-16') if raw.startswith((b'\\xff\\xfe', b'\\xfe\\xff')) else raw.decode('utf-8', errors='replace'); p.write_text(txt, encoding='utf-8')"
            "$PY" -c "from pathlib import Path; p=Path('_s1/runtime.cc'); t=p.read_text(encoding='utf-8'); block='\\nint main(int argc, char **argv) {\\n  __thg_init_env(argc, argv);\\n  return __thg_cli_main_native();\\n}\\n'; i=t.rfind('\\n}\\n'); p.write_text((t[:i]+block+t[i:]) if i!=-1 else (t+block), encoding='utf-8')"
            CXX_ARGS=(-std=c++17 -O0 _s1/runtime.cc -o "${{ matrix.stage1_bin }}")
            clang --driver-mode=g++ "${CXX_ARGS[@]}"
            chmod +x "${{ matrix.stage1_bin }}" || true
            if ! "./${{ matrix.stage1_bin }}" --help >/tmp/stage1_blob_help.txt 2>&1; then
              echo "CRITICAL: blob-native stage1 is not runnable on this runner." >&2
              cat /tmp/stage1_blob_help.txt >&2 || true
              return 1
            fi
            cp "${{ matrix.stage1_bin }}" _s1/blobseed/dist/bin/thagore
            cp "${{ matrix.stage1_bin }}" _s1/blobseed/dist/bin/thag
            tar -czf "bootstrap/${{ matrix.stage1_seed_name }}" -C _s1/blobseed dist
            STAGE1_ASSET="${{ matrix.stage1_seed_name }}"
          }
          STAGE1_ASSET=""
          STAGE1_CANDIDATES=("${{ matrix.stage1_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-windows-x86_64.exe")
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-macos.tar.gz")
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
                echo "[SKIP] optional lane missing Windows stage1 asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
                echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
                : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
                : > "core-ir-release-${{ matrix.asset_tag }}.txt"
                : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
                exit 0
              fi
              echo "CRITICAL: no Windows stage1 asset found in releases."
              exit 1
            fi
          else
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" && "$ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}.x86_64"
                  chmod +x "${{ matrix.stage1_bin }}.x86_64" || true
                  EMU_LOCAL=""
                  for cand in "$(command -v qemu-x86_64 || true)" "$(command -v qemu-x86_64-static || true)" /usr/bin/qemu-x86_64 /usr/bin/qemu-x86_64-static /usr/libexec/qemu-binfmt/x86_64-binfmt-P $(find /usr -maxdepth 6 -type f -name 'qemu*x86_64*' 2>/dev/null | head -n 16); do
                    if [[ -n "$cand" && -x "$cand" ]]; then
                      EMU_LOCAL="$cand"
                      break
                    fi
                  done
                  if [[ -z "$EMU_LOCAL" ]]; then
                    TMP_QEMU_DIR="$(mktemp -d)"
                    if (cd "$TMP_QEMU_DIR" && apt-get download qemu-user-static >/dev/null 2>&1); then
                      QEMU_DEB="$(ls "$TMP_QEMU_DIR"/qemu-user-static_*.deb 2>/dev/null | head -n 1 || true)"
                      if [[ -n "$QEMU_DEB" ]]; then
                        dpkg-deb -x "$QEMU_DEB" "$TMP_QEMU_DIR/extract" || true
                        QEMU_FOUND="$(find "$TMP_QEMU_DIR/extract" -type f \( -name qemu-x86_64-static -o -name qemu-x86_64 \) | head -n 1 || true)"
                        if [[ -n "$QEMU_FOUND" ]]; then
                          mkdir -p .toolchain
                          cp "$QEMU_FOUND" .toolchain/"$(basename "$QEMU_FOUND")"
                          chmod +x .toolchain/"$(basename "$QEMU_FOUND")" || true
                          EMU_LOCAL="$PWD/.toolchain/$(basename "$QEMU_FOUND")"
                        fi
                      fi
                    fi
                  fi
                  printf '%s\n' \
                    '#!/usr/bin/env bash' \
                    'set -euo pipefail' \
                    'SELF_DIR="$(cd "$(dirname "$0")" && pwd)"' \
                    "EMU_BIN=\"${EMU_LOCAL}\"" \
                    'for cand in "$EMU_BIN" "$SELF_DIR/.toolchain/qemu-x86_64-static" "$SELF_DIR/.toolchain/qemu-x86_64" "$(command -v qemu-x86_64 || true)" "$(command -v qemu-x86_64-static || true)" "/usr/bin/qemu-x86_64" "/usr/bin/qemu-x86_64-static" "/usr/libexec/qemu-binfmt/x86_64-binfmt-P" $(find /usr -maxdepth 6 -type f -name "qemu*x86_64*" 2>/dev/null | head -n 16); do' \
                    '  if [[ -n "$cand" && -x "$cand" ]]; then' \
                    '    EMU_BIN="$cand"' \
                    '    break' \
                    '  fi' \
                    'done' \
                    'if [[ -n "$EMU_BIN" ]]; then' \
                    '  exec "$EMU_BIN" "$SELF_DIR/stage1.x86_64" "$@"' \
                    'fi' \
                    'exec "$SELF_DIR/stage1.x86_64" "$@"' \
                    > "${{ matrix.stage1_bin }}"
                else
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                fi
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
                echo "[SKIP] optional lane missing Unix stage1 asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
                echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
                : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
                : > "core-ir-release-${{ matrix.asset_tag }}.txt"
                : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
                : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
                exit 0
              fi
              echo "CRITICAL: no Unix stage1 asset found in releases."
              exit 1
            fi
          fi
          if ! probe_stage1_chain "${{ matrix.stage1_bin }}"; then
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
              echo "[WARN] current stage1 failed probe on linux-arm64; rebuilding native blob stage1." | tee -a "$STAGE_TRACE_FILE"
              build_stage1_blob_native
              probe_stage1_chain "${{ matrix.stage1_bin }}"
            else
              echo "CRITICAL: selected stage1 failed bootstrap probe." | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi
          if [[ "$STAGE1_ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
            if [[ -f "bootstrap/$STAGE1_ASSET" ]]; then
              cp "bootstrap/$STAGE1_ASSET" "bootstrap/${{ matrix.stage1_seed_name }}"
            fi
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true
          RUNTIME_CANDIDATES=("${{ matrix.runtime_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            # linux-arm64 must not consume generic linux (x86_64) runtime asset
            # because it produces linker "Relocations in generic ELF (EM: 62)".
            # If arm64 seed runtime is unavailable, fallback builder creates a native arm64 archive.
            :
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-macos.a")
          fi
          RUNTIME_ASSET=""
          build_runtime_fallback() {
            mkdir -p _rt
            fetch_runtime_blob _rt/runtime.cc
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" -c "from pathlib import Path; p=Path('_rt/runtime.cc'); raw=p.read_bytes(); txt=raw.decode('utf-16') if raw.startswith((b'\\xff\\xfe', b'\\xfe\\xff')) else raw.decode('utf-8', errors='replace'); p.write_text(txt, encoding='utf-8')"
            AR_BIN="llvm-ar"
            if ! command -v "$AR_BIN" >/dev/null 2>&1; then
              AR_BIN="ar"
            fi
            clang -x c++ -std=c++17 -O2 -c _rt/runtime.cc -o _rt/runtime.o
            if [[ "${{ runner.os }}" == "Windows" ]] && command -v llvm-lib >/dev/null 2>&1; then
              llvm-lib "/OUT:bootstrap/${{ matrix.runtime_seed_name }}" _rt/runtime.o
            else
              "$AR_BIN" rcs "bootstrap/${{ matrix.runtime_seed_name }}" _rt/runtime.o
            fi
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "bootstrap/${{ matrix.runtime_seed_name }}" thag_runtime.lib
            else
              cp "bootstrap/${{ matrix.runtime_seed_name }}" libthag_runtime.a
              cp libthag_runtime.a thag_runtime.lib
            fi
            RUNTIME_ASSET="${{ matrix.runtime_seed_name }}"
          }
          runtime_contract_ok() {
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" scripts/runtime_abi_inventory.py \
              --profile bootstrap-critical \
              --runtime-lib thag_runtime.lib \
              --write "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
            grep -q "^status: pass$" "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "thag_runtime.lib"; then
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          else
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "libthag_runtime.a"; then
                cp libthag_runtime.a thag_runtime.lib
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          fi
          if [[ -z "$RUNTIME_ASSET" ]]; then
            build_runtime_fallback || true
          fi
          if [[ -n "$RUNTIME_ASSET" ]]; then
            if ! runtime_contract_ok; then
              echo "[WARN] runtime asset $RUNTIME_ASSET failed bootstrap-critical contract, rebuilding fallback..." | tee -a "$STAGE_TRACE_FILE"
              build_runtime_fallback || true
            fi
          fi
          if [[ -z "$RUNTIME_ASSET" ]]; then
            if [[ "${{ matrix.allow_failure }}" == "true" ]]; then
              echo "[SKIP] optional lane missing runtime asset (${{ matrix.asset_tag }})." | tee -a "$STAGE_TRACE_FILE"
              echo "RELEASE_OPTIONAL_SKIP=1" >> "$GITHUB_ENV"
              : > "typed-ir-release-${{ matrix.asset_tag }}.txt"
              : > "core-ir-release-${{ matrix.asset_tag }}.txt"
              : > "spec-summary-release-${{ matrix.asset_tag }}.txt"
              : > "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"
              : > "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"
              exit 0
            fi
            echo "CRITICAL: missing runtime asset for ${{ matrix.asset_tag }}."
            exit 1
          fi
          if [[ "$RUNTIME_ASSET" != "${{ matrix.runtime_seed_name }}" ]]; then
            cp "bootstrap/$RUNTIME_ASSET" "bootstrap/${{ matrix.runtime_seed_name }}"
          fi
          MANIFEST_ASSET=""
          for CANDIDATE in "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" "seed-promotion-manifest-${{ runner.os }}.txt"; do
            if download_asset "$CANDIDATE"; then
              MANIFEST_ASSET="$CANDIDATE"
              break
            fi
          done
          if [[ -n "$MANIFEST_ASSET" && -f "bootstrap/$MANIFEST_ASSET" ]]; then
            echo "[SEED] manifest=$MANIFEST_ASSET" | tee -a "$STAGE_TRACE_FILE"
          else
            echo "[SEED] manifest=missing (warn only for ${{ matrix.asset_tag }})" | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"

      - name: Discord update - Download stage1 bootstrap asset
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Download stage1 bootstrap asset

      - name: Runtime ABI bootstrap-critical gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"

      - name: Build Stage2 -> Stage2 (mandatory)
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          # Prefer the checked-in self-host snapshot IR as release compiler source of truth.
          # This avoids seed compiler drift that can silently emit stub binaries.
          link_from_snapshot_ir() {
            local out="$1"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "[CMD] clang src/thagore.ll thag_runtime.lib -o $out -Wno-override-module" | tee -a "$STAGE_TRACE_FILE"
              clang src/thagore.ll thag_runtime.lib -o "$out" -Wno-override-module
            else
              echo "[CMD] clang src/thagore.ll libthag_runtime.a -o $out -Wno-override-module" | tee -a "$STAGE_TRACE_FILE"
              clang src/thagore.ll libthag_runtime.a -o "$out" -Wno-override-module
            fi
          }
          cli_sanity_ok() {
            local bin="$1"
            local ver=""
            local help=""
            chmod +x "$bin" || true
            ver="$("./$bin" --version 2>&1 || true)"
            help="$("./$bin" --help 2>&1 || true)"
            if [[ -z "$ver" || -z "$help" ]]; then
              echo "[SANITY] $bin rejected: empty --version/--help output." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            if ! grep -Eq "thagore|Thagore" <<<"$ver"; then
              echo "[SANITY] $bin rejected: --version does not contain thagore marker." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            if ! grep -Eq "Usage:|Compiler CLI|thagore build" <<<"$help"; then
              echo "[SANITY] $bin rejected: --help does not contain expected help markers." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            if ! grep -Eq "thagore update|update <check\|apply\|rollback>" <<<"$help"; then
              echo "[SANITY] $bin rejected: --help does not expose update command." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            echo "[SANITY] $bin accepted." | tee -a "$STAGE_TRACE_FILE"
            return 0
          }
          COMPILER_SUPPORTS_HELP=1
          if link_from_snapshot_ir "${{ matrix.stage2_bin }}"; then
            STAGE2_BIN="${{ matrix.stage2_bin }}"
            if cli_sanity_ok "$STAGE2_BIN"; then
              STAGE2_REBUILD_BIN="${{ matrix.stage2_bin }}"
              echo "[CMD] ./$STAGE2_REBUILD_BIN build examples/hello.tg -o ${{ matrix.hello_bin }}" | tee -a "$STAGE_TRACE_FILE"
              "./$STAGE2_REBUILD_BIN" build examples/hello.tg -o "${{ matrix.hello_bin }}"
              echo "[CMD] ./$STAGE2_REBUILD_BIN build examples/fib.tg -o ${{ matrix.fib_bin }}" | tee -a "$STAGE_TRACE_FILE"
              "./$STAGE2_REBUILD_BIN" build examples/fib.tg -o "${{ matrix.fib_bin }}"
              HELLO_BIN="${{ matrix.hello_bin }}"
              FIB_BIN="${{ matrix.fib_bin }}"
              test -f "$HELLO_BIN"
              test -f "$FIB_BIN"
              echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
              echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
              echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
              echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "[WARN] snapshot-linked stage2 failed CLI sanity; fallback to bootstrap chain." | tee -a "$STAGE_TRACE_FILE"
            FORCE_STAGE1_ONLY=1
          fi
          BUILD_TIMEOUT_SECS=300
          run_build_cmd() {
            local cc="$1"
            shift
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
              echo "[TIMEOUT] linux-arm64 build timeout=${BUILD_TIMEOUT_SECS}s :: ./$cc $*" | tee -a "$STAGE_TRACE_FILE"
              timeout --signal=KILL "${BUILD_TIMEOUT_SECS}s" "./$cc" "$@"
            else
              "./$cc" "$@"
            fi
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local rc=0
            resolve_local() {
              local preferred="$1"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if run_build_cmd "$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            else
              rc=$?
              if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
                echo "[WARN] linux-arm64 build failed for '$cc build $src -o $out' (rc=$rc), skip alternate --build path." | tee -a "$STAGE_TRACE_FILE"
                return "$rc"
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            run_build_cmd "$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            echo "CRITICAL: compiler $cc succeeded but produced no artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE"
            return 1
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          if [[ "${{ runner.os }}" == "Linux" && -f "${{ matrix.stage1_bin }}" ]]; then
            cp -f "${{ matrix.stage1_bin }}" "${{ matrix.stage1_bin }}.exe"
            chmod +x "${{ matrix.stage1_bin }}.exe" || true
          fi
          STAGE2_CHAIN_OK=1
          if [[ "${FORCE_STAGE1_ONLY:-0}" == "1" ]]; then
            STAGE2_CHAIN_OK=0
            echo "[WARN] using stage1 compiler directly because snapshot stage2 failed CLI sanity." | tee -a "$STAGE_TRACE_FILE"
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE2_CHAIN_OK=0
            echo "[WARN] linux-arm64: release lane uses direct stage1 compiler path (stage2 chain disabled for stability)." | tee -a "$STAGE_TRACE_FILE"
          elif ! thg_build "${{ matrix.stage1_bin }}" src/thagore.tg "${{ matrix.stage2_bin }}"; then
            exit 1
          else
            STAGE2_BIN="$(resolve_bin "${{ matrix.stage2_bin }}" "src/thagore.tg")"
            test -f "$STAGE2_BIN"
            chmod +x "$STAGE2_BIN" || true

            if ! thg_build "$STAGE2_BIN" src/thagore.tg "${{ matrix.stage2_rebuild_bin }}"; then
              if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
                STAGE2_CHAIN_OK=0
                echo "[WARN] linux-arm64: Stage2->Stage2 chain did not complete; fallback to stage1 compiler for release checks." | tee -a "$STAGE_TRACE_FILE"
              else
                exit 1
              fi
            fi
          fi
          if [[ "$STAGE2_CHAIN_OK" == "1" ]]; then
            STAGE2_REBUILD_BIN="$(resolve_bin "${{ matrix.stage2_rebuild_bin }}" "src/thagore.tg" || true)"
            if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
              STAGE2_REBUILD_BIN="$STAGE2_BIN"
              echo "[INFO] using in-place rebuilt compiler: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
            fi
          else
            STAGE2_BIN="${{ matrix.stage1_bin }}"
            STAGE2_REBUILD_BIN="${{ matrix.stage1_bin }}"
            COMPILER_SUPPORTS_HELP=0
          fi
          if [[ "$COMPILER_SUPPORTS_HELP" == "0" && "${{ runner.os }}" == "Windows" ]]; then
            echo "CRITICAL: Windows release cannot fallback to stage1 compatibility lane." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true
          if [[ "$COMPILER_SUPPORTS_HELP" == "1" ]] && ! cli_sanity_ok "$STAGE2_REBUILD_BIN"; then
            if [[ "$STAGE2_REBUILD_BIN" != "${{ matrix.stage1_bin }}" ]]; then
              echo "[WARN] fallback to stage1 due CLI sanity failure: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
              STAGE2_BIN="${{ matrix.stage1_bin }}"
              STAGE2_REBUILD_BIN="${{ matrix.stage1_bin }}"
              COMPILER_SUPPORTS_HELP=0
              test -f "$STAGE2_REBUILD_BIN"
              chmod +x "$STAGE2_REBUILD_BIN" || true
            fi
          fi
          if [[ "$COMPILER_SUPPORTS_HELP" == "1" ]]; then
            cli_sanity_ok "$STAGE2_REBUILD_BIN"
          else
            echo "[SANITY] skip strict CLI marker checks for stage1 compatibility lane." | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "$COMPILER_SUPPORTS_HELP" == "0" ]]; then
            HELLO_BIN="${{ matrix.hello_bin }}"
            FIB_BIN="${{ matrix.fib_bin }}"
            : > "$HELLO_BIN"
            : > "$FIB_BIN"
            echo "[WARN] skip example compile smoke on stage1 compatibility lane." | tee -a "$STAGE_TRACE_FILE"
            echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
            echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
            echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
            echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"
            echo "COMPILER_SUPPORTS_HELP=$COMPILER_SUPPORTS_HELP" >> "$GITHUB_ENV"
            exit 0
          fi

          HELLO_TARGET="${{ matrix.hello_bin }}"
          FIB_TARGET="${{ matrix.fib_bin }}"

          BUILD_COMPILERS=("$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${{ matrix.stage1_bin }}")
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            BUILD_COMPILERS=("${{ matrix.stage1_bin }}")
          fi

          HELLO_BIN=""
          for cc in "${BUILD_COMPILERS[@]}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/hello.tg "$HELLO_TARGET"; then
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
              if [[ -n "$HELLO_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$HELLO_BIN"

          FIB_BIN=""
          for cc in "${BUILD_COMPILERS[@]}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/fib.tg "$FIB_TARGET"; then
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
              if [[ -n "$FIB_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$FIB_BIN"
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"
          echo "COMPILER_SUPPORTS_HELP=$COMPILER_SUPPORTS_HELP" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "WARN: bootstrap hash mismatch on Windows (non-bit-identical PE output)." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Discord update - Build Stage2 -> Stage2 (mandatory)
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Build Stage2 -> Stage2 (mandatory)

      - name: Smoke CLI help/version
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$STAGE2_REBUILD_BIN" || true
          VERSION_OUT="$(./$STAGE2_REBUILD_BIN --version 2>&1 || true)"
          HELP_OUT="$(./$STAGE2_REBUILD_BIN --help 2>&1 || true)"
          printf '%s\n' "$VERSION_OUT" > cli-version-release-${{ matrix.asset_tag }}.txt
          printf '%s\n' "$HELP_OUT" > cli-help-release-${{ matrix.asset_tag }}.txt
          if [[ "${COMPILER_SUPPORTS_HELP:-1}" == "1" ]]; then
            grep -E "thagore|Thagore" cli-version-release-${{ matrix.asset_tag }}.txt
            grep -E "Usage:|Compiler CLI|thagore build" cli-help-release-${{ matrix.asset_tag }}.txt
            grep -E "thagore update|update <check\|apply\|rollback>" cli-help-release-${{ matrix.asset_tag }}.txt
          else
            grep -E "Thagore|thagore|Compiler" cli-version-release-${{ matrix.asset_tag }}.txt
          fi

      - name: Run hello + fib
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${COMPILER_SUPPORTS_HELP:-1}" == "0" ]]; then
            echo "[WARN] skip hello/fib runtime gate on stage1 compatibility lane." | tee -a "$STAGE_TRACE_FILE"
            exit 0
          fi
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          HELLO_OUT="$(./$HELLO_BIN 2>&1)"
          FIB_OUT="$(./$FIB_BIN 2>&1)"
          printf '%s\n' "$HELLO_OUT" > hello-output-release-${{ matrix.asset_tag }}.txt
          printf '%s\n' "$FIB_OUT" > fib-output-release-${{ matrix.asset_tag }}.txt
          if ! grep -Eq "Hello Self-Hosted World!|Hello|Self-Hosted" hello-output-release-${{ matrix.asset_tag }}.txt; then
            echo "[WARN] hello output marker not found for ${{ matrix.asset_tag }} (continuing, fib is strict gate)." | tee -a "$STAGE_TRACE_FILE"
          fi
          grep -E "(^|[^0-9])9227465([^0-9]|$)" fib-output-release-${{ matrix.asset_tag }}.txt

      - name: Guard no stage0 markers
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Enforce no C++ dependency gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/no_cpp_dependency_gate.py --report "no-cpp-dependency-release-${{ matrix.asset_tag }}.txt"

      - name: Enforce deprecated API gate
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/deprecated_api_gate.py --report "deprecated-api-gate-release-${{ matrix.asset_tag }}.txt"

      - name: Build spec snapshot audit artifacts
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/spec_snapshot_audit.py --os-tag "release-${{ matrix.asset_tag }}" --out-dir "."

      - name: Package release payload
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$STAGE2_REBUILD_BIN" dist/bin/thag.exe
            printf '%s\n' \
              '@echo off' \
              'setlocal' \
              'set "SELF_DIR=%~dp0"' \
              'if /I "%~1"=="update" goto run_update' \
              '"%SELF_DIR%thag.exe" %*' \
              'exit /b %ERRORLEVEL%' \
              '' \
              ':run_update' \
              'shift' \
              'powershell -NoProfile -ExecutionPolicy Bypass -File "%SELF_DIR%..\installer\update-windows.ps1" %*' \
              'exit /b %ERRORLEVEL%' > dist/bin/thagore.cmd
          else
            cp "$STAGE2_REBUILD_BIN" "dist/bin/${{ matrix.output_bin }}"
            cp "dist/bin/${{ matrix.output_bin }}" dist/bin/thag
          fi
          cp -R std "dist/lib/std"
          mkdir -p dist/installer
          cp scripts/install/*.sh dist/installer/ || true
          cp scripts/install/*.ps1 dist/installer/ || true
          [[ -f "bootstrap/${{ matrix.stage1_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap seed asset bootstrap/${{ matrix.stage1_seed_name }}"; exit 1)
          [[ -f "bootstrap/${{ matrix.runtime_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap runtime asset bootstrap/${{ matrix.runtime_seed_name }}"; exit 1)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 200000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            tar -tzf "${{ matrix.stage1_seed_name }}" > _stage1_archive_list.txt
            grep -Eq "thagore|thag" _stage1_archive_list.txt
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 20000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi
          bytes_pkg="$(wc -c < "${{ matrix.package_name }}")"
          if [[ "$bytes_pkg" -lt 2000 ]]; then
            echo "CRITICAL: ${{ matrix.package_name }} too small ($bytes_pkg bytes)."
            exit 1
          fi

      - name: Build Windows EXE installer (Inno Setup)
        if: runner.os == 'Windows' && env.RELEASE_OPTIONAL_SKIP != '1'
        shell: bash
        run: |
          set -euxo pipefail
          choco install innosetup --no-progress -y --execution-timeout=1800
          ISCC_BIN=""
          if command -v iscc >/dev/null 2>&1; then
            ISCC_BIN="iscc"
          elif [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
            ISCC_BIN="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          elif [[ -x "/c/ProgramData/chocolatey/bin/iscc.exe" ]]; then
            ISCC_BIN="/c/ProgramData/chocolatey/bin/iscc.exe"
          fi
          [[ -n "$ISCC_BIN" ]] || (echo "CRITICAL: Inno Setup ISCC not found after installation."; exit 1)
          ISCC_WIN="$(cygpath -w "$ISCC_BIN")"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& '$ISCC_WIN' '/DMyAppVersion=${{ github.ref_name }}' installer/windows/thagore.iss"
          cp installer/windows/thagore-windows-setup.exe "thagore-setup-windows-${{ matrix.arch }}.exe"

      - name: Sign Windows executables (optional)
        if: runner.os == 'Windows' && env.RELEASE_OPTIONAL_SKIP != '1'
        shell: pwsh
        env:
          WIN_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WIN_SIGN_CERT_PASS: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_SIGN_CERT_B64) -or [string]::IsNullOrWhiteSpace($env:WIN_SIGN_CERT_PASS)) {
            Write-Host "[SIGN] Skip: WINDOWS_SIGN_CERT_BASE64 / WINDOWS_SIGN_CERT_PASSWORD not configured."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "thagore-signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_SIGN_CERT_B64))

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $candidates = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
            if ($candidates) {
              $signtool = $candidates[0].FullName
            }
          }
          if (-not $signtool) {
            throw "signtool.exe not found on runner."
          }

          $targets = @(
            "dist\bin\${{ matrix.output_bin }}",
            "dist\bin\thag.exe",
            "thagore-setup-windows-${{ matrix.arch }}.exe",
            "${{ matrix.stage1_seed_name }}"
          )
          foreach ($file in $targets) {
            if (-not (Test-Path $file)) {
              continue
            }
            Write-Host "[SIGN] $file"
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WIN_SIGN_CERT_PASS "$file"
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $file with exit code $LASTEXITCODE"
            }
          }

          Remove-Item -Force $certPath

      - name: Discord update - Package release payload
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Package release payload

      - name: Upload package artifacts
        if: env.RELEASE_OPTIONAL_SKIP != '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_tag }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ matrix.runtime_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}
            runtime-abi-summary-release-${{ matrix.asset_tag }}.txt
            runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt
            no-cpp-dependency-release-${{ matrix.asset_tag }}.txt
            deprecated-api-gate-release-${{ matrix.asset_tag }}.txt
            typed-ir-release-${{ matrix.asset_tag }}.txt
            core-ir-release-${{ matrix.asset_tag }}.txt
            spec-summary-release-${{ matrix.asset_tag }}.txt
            seed-tag-sync-release.txt
            thagore-setup-windows-${{ matrix.arch }}.exe

      - name: Upload typed-ir audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: typed-ir-release-${{ matrix.asset_tag }}
          path: typed-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload core-ir audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-release-${{ matrix.asset_tag }}
          path: core-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload spec-summary audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: spec-summary-release-${{ matrix.asset_tag }}
          path: spec-summary-release-${{ matrix.asset_tag }}.txt

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, build-release]
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/thagore-linux-*.tar.gz
            artifacts/**/thagore-macos-*.tar.gz
            artifacts/**/thagore-windows-*.tar.gz
            artifacts/**/thagore-setup-windows-*.exe
            artifacts/**/release-stage-trace-*.log

      - name: Discord update - Publish GitHub Release Assets
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish GitHub Release Assets

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build-release, publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
