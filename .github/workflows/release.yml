name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev

      - name: Build thagc
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build -j

      - name: Package core
        run: |
          mkdir -p dist
          python3 tooling/packaging/pack_core.py \
            --bin build/compiler/thagc \
            --out dist/thagc-core-linux.tar.gz
          python3 tooling/packaging/make_checksums.py \
            --out dist/SHA256SUMS-thagc-linux.txt \
            dist/thagc-core-linux.tar.gz

      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "thagc ${{ inputs.tag }}" \
            --notes "Initial C++/LLVM direct API release lane." \
            dist/thagc-core-linux.tar.gz \
            dist/SHA256SUMS-thagc-linux.txt \
            || gh release upload "${{ inputs.tag }}" \
            dist/thagc-core-linux.tar.gz \
            dist/SHA256SUMS-thagc-linux.txt --clobber
