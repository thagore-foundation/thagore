name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no release publish)"
        required: false
        default: "true"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seed tag sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/verify_seed_tag_sync.py --report seed-tag-sync-release.txt

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  seed-asset-probe:
    name: seed-asset-probe
    needs: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      available_tags: ${{ steps.probe.outputs.available_tags }}
      release_matrix: ${{ steps.probe.outputs.release_matrix }}
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.193-stage1-seed"
    steps:
      - name: Probe stage1/runtime seed assets
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Avoid release-probe dependency on GitHub API quotas.
          # Actual seed availability is enforced in per-lane bootstrap download + verify.
          available=";linux-x86_64;linux-arm64;macos-arm64;windows-x86_64;windows-arm64;"
          echo "available_tags=$available" >> "$GITHUB_OUTPUT"
          echo "available_tags=$available"
          export AVAILABLE_TAGS="$available"
          OFFICIAL_RELEASE_TAG=0
          if [[ "${GITHUB_REF:-}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            OFFICIAL_RELEASE_TAG=1
          fi
          echo "RELEASE_OFFICIAL_TAG=$OFFICIAL_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NO_OUTPUT_MODE=0" >> "$GITHUB_ENV"
          export OFFICIAL_RELEASE_TAG
          RELEASE_MATRIX="$(python3 - <<'PY'
          import json
          import os

          available = {tag for tag in os.environ.get("AVAILABLE_TAGS", "").strip(";").split(";") if tag}
          official = os.environ.get("OFFICIAL_RELEASE_TAG", "0") == "1"
          entries = [
              {
                  "runner": "ubuntu-latest",
                  "os_name": "Linux",
                  "arch": "x86_64",
                  "asset_tag": "linux-x86_64",
                  "stage1_bin": "stage1",
                  "output_bin": "thagore",
                  "stage2_bin": "stage2",
                  "stage2_rebuild_bin": "stage2_rebuild",
                  "hello_bin": "hello_release",
                  "fib_bin": "fib_release",
                  "package_name": "thagore-linux-x86_64.tar.gz",
                  "stage1_seed_name": "thagore-stage1-linux-x86_64.tar.gz",
                  "runtime_seed_name": "thagore-runtime-linux-x86_64.a",
                  "stage_trace_file": "release-stage-trace-linux-x86_64.log",
              },
              {
                  "runner": "ubuntu-24.04-arm",
                  "os_name": "Linux",
                  "arch": "arm64",
                  "asset_tag": "linux-arm64",
                  "stage1_bin": "stage1",
                  "output_bin": "thagore",
                  "stage2_bin": "stage2",
                  "stage2_rebuild_bin": "stage2_rebuild",
                  "hello_bin": "hello_release",
                  "fib_bin": "fib_release",
                  "package_name": "thagore-linux-arm64.tar.gz",
                  "stage1_seed_name": "thagore-stage1-linux-arm64.tar.gz",
                  "runtime_seed_name": "thagore-runtime-linux-arm64.a",
                  "stage_trace_file": "release-stage-trace-linux-arm64.log",
              },
              {
                  "runner": "macos-latest",
                  "os_name": "macOS",
                  "arch": "arm64",
                  "asset_tag": "macos-arm64",
                  "stage1_bin": "stage1",
                  "output_bin": "thagore",
                  "stage2_bin": "stage2",
                  "stage2_rebuild_bin": "stage2_rebuild",
                  "hello_bin": "hello_release",
                  "fib_bin": "fib_release",
                  "package_name": "thagore-macos-arm64.tar.gz",
                  "stage1_seed_name": "thagore-stage1-macos-arm64.tar.gz",
                  "runtime_seed_name": "thagore-runtime-macos-arm64.a",
                  "stage_trace_file": "release-stage-trace-macos-arm64.log",
              },
              {
                  "runner": "windows-latest",
                  "os_name": "Windows",
                  "arch": "x86_64",
                  "asset_tag": "windows-x86_64",
                  "stage1_bin": "stage1.exe",
                  "output_bin": "thagore.exe",
                  "stage2_bin": "stage2.exe",
                  "stage2_rebuild_bin": "stage2_rebuild.exe",
                  "hello_bin": "hello_release.exe",
                  "fib_bin": "fib_release.exe",
                  "package_name": "thagore-windows-x86_64.tar.gz",
                  "stage1_seed_name": "thagore-stage1-windows-x86_64.exe",
                  "runtime_seed_name": "thagore-runtime-windows-x86_64.lib",
                  "stage_trace_file": "release-stage-trace-windows-x86_64.log",
              },
              {
                  "runner": "windows-11-arm",
                  "os_name": "Windows",
                  "arch": "arm64",
                  "asset_tag": "windows-arm64",
                  "stage1_bin": "stage1.exe",
                  "output_bin": "thagore.exe",
                  "stage2_bin": "stage2.exe",
                  "stage2_rebuild_bin": "stage2_rebuild.exe",
                  "hello_bin": "hello_release.exe",
                  "fib_bin": "fib_release.exe",
                  "package_name": "thagore-windows-arm64.tar.gz",
                  "stage1_seed_name": "thagore-stage1-windows-arm64.exe",
                  "runtime_seed_name": "thagore-runtime-windows-arm64.lib",
                  "stage_trace_file": "release-stage-trace-windows-arm64.log",
              },
          ]
          selected = [entry for entry in entries if entry["asset_tag"] in available]
          matrix = {"include": selected}
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          )"
          echo "release_matrix=$RELEASE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "release_matrix=$RELEASE_MATRIX"

  release:
    name: release (${{ matrix.asset_tag }})
    needs: [discord-notify-init, seed-asset-probe]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.seed-asset-probe.outputs.release_matrix) }}
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.193-stage1-seed"
      THAGORE_WINDOWS_DONOR_TAG: "v0.3.61-foundation"
      STAGE_TRACE_FILE: ${{ matrix.stage_trace_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_VERSION=21
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}" all
          if [[ -d "/usr/lib/llvm-${LLVM_VERSION}/bin" ]]; then
            echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          fi
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo apt-get update || true
            # qemu-user-binfmt conflicts with qemu-user-static on ubuntu runners.
            # Keep only qemu-user + qemu-user-static to avoid dependency deadlock.
            if ! sudo apt-get install -y qemu-user qemu-user-static; then
              echo "CRITICAL: qemu-user/qemu-user-static were not installed via apt."
              exit 1
            fi
            # linux-arm64 lane may execute x86_64 stage1 seed binaries via qemu.
            # Install cross glibc/stdc++ runtime so x86_64 loader/stdlib are present.
            sudo apt-get install -y libc6-amd64-cross libstdc++6-amd64-cross || true
            if [[ -d "/usr/x86_64-linux-gnu" ]]; then
              echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
            fi
            if [[ -f "/usr/x86_64-linux-gnu/lib64/ld-linux-x86-64.so.2" && ! -e "/lib64/ld-linux-x86-64.so.2" ]]; then
              sudo mkdir -p /lib64 || true
              sudo ln -sf /usr/x86_64-linux-gnu/lib64/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 || true
            fi
            if ! command -v qemu-aarch64-static >/dev/null 2>&1 && ! command -v qemu-aarch64 >/dev/null 2>&1; then
              echo "CRITICAL: qemu aarch64 emulator is missing after install."
              exit 1
            fi
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          if ! brew list llvm@21 >/dev/null 2>&1; then
            brew install llvm@21
          fi
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_VERSION=21.1.8
          powershell -NoProfile -ExecutionPolicy Bypass -Command "
            \$ErrorActionPreference = 'Stop'
            function Install-Llvm([string]\$version) {
              if ([string]::IsNullOrWhiteSpace(\$version)) {
                choco install llvm --no-progress -y --execution-timeout=1800
              } else {
                choco install llvm --version=\$version --no-progress -y --execution-timeout=1800
              }
            }
            try {
              Install-Llvm '${LLVM_VERSION}'
            } catch {
              Write-Warning \"Pinned LLVM ${LLVM_VERSION} install failed (\$($_.Exception.Message)). Falling back to latest llvm package.\"
              Install-Llvm ''
            }
          "
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          CLANG_MACHINE="$(clang -dumpmachine 2>/dev/null || true)"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            if [[ "$CLANG_MACHINE" != *"aarch64"* ]]; then
              echo "WARN: Windows ARM lane expected aarch64 clang, got: $CLANG_MACHINE"
              echo "WARN: proceeding with available clang toolchain on this runner."
            fi
          else
            if [[ "$CLANG_MACHINE" != *"x86_64"* ]]; then
              echo "CRITICAL: Windows x86_64 lane requires x86_64 clang, got: $CLANG_MACHINE"
              exit 1
            fi
          fi
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" \
            --pattern "thagore-runtime*" \
            --pattern "seed-promotion-manifest-*" \
            --pattern "seed-stage1-provenance-*" \
            --pattern "seed-bundle-*" \
            --pattern "seed-stage-trace-*" \
            -D bootstrap || true
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          resolve_ir() {
            local preferred="$1"
            local src="$2"
            local probe_dir="$3"
            local marker="${4:-}"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred%.ll}.ll" "$probe_dir/${base}.ll" "${base}.ll"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find "$probe_dir" -maxdepth 2 -type f -name '*.ll' | head -n 1 || true)"
            if [[ -n "$found" ]]; then
              echo "$found"
              return 0
            fi
            if [[ -n "$marker" && -f "$marker" ]]; then
              found="$(find . -maxdepth 6 -type f -newer "$marker" -name '*.ll' | head -n 1 || true)"
              if [[ -n "$found" ]]; then
                echo "$found"
                return 0
              fi
            fi
            return 1
          }
          resolve_probe_bin_from_marker() {
            local src="$1"
            local marker="$2"
            local base
            base="$(basename "$src" .tg)"
            [[ -f "$marker" ]] || return 1
            local found
            found="$(find . -maxdepth 6 -type f -newer "$marker" \
              \( -name "${base}*" -o -name "*${base}*" \) \
              ! -name '*.tg' \
              ! -name '*.ll' \
              ! -name '*.o' \
              ! -name '*.obj' \
              ! -name '*.a' \
              ! -name '*.lib' \
              ! -name '*.txt' | head -n 1 || true)"
            if [[ -n "$found" ]]; then
              echo "$found"
              return 0
            fi
            return 1
          }
          download_asset() {
            local pattern="$1"
            if [[ -f "bootstrap/$pattern" ]]; then
              return 0
            fi
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
            if [[ ! -f "bootstrap/$pattern" ]]; then
              curl -fsSL -o "bootstrap/$pattern" "https://github.com/${{ github.repository }}/releases/download/$BOOTSTRAP_STAGE1_TAG/$pattern" || true
            fi
            [[ -f "bootstrap/$pattern" ]]
          }
          download_stage1_asset() {
            local pattern="$1"
            local primary_tag="$BOOTSTRAP_STAGE1_TAG"
            rm -f "bootstrap/$pattern" || true
            local tag="$primary_tag"
            [[ -n "$tag" ]] || return 1
            gh release download "$tag" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
            if [[ ! -f "bootstrap/$pattern" ]]; then
              curl -fsSL -o "bootstrap/$pattern" "https://github.com/${{ github.repository }}/releases/download/$tag/$pattern" || true
            fi
            if [[ -f "bootstrap/$pattern" ]]; then
              echo "[SEED] stage1 asset=$pattern tag=$tag" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            rm -f "bootstrap/$pattern" || true
            if [[ ! -f "bootstrap/$pattern" ]]; then
              return 1
            fi
            [[ -f "bootstrap/$pattern" ]]
          }
          download_runtime_asset() {
            local pattern="$1"
            local dest="$2"
            if [[ ! -f "bootstrap/$pattern" ]]; then
              gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap || true
              if [[ ! -f "bootstrap/$pattern" ]]; then
                curl -fsSL -o "bootstrap/$pattern" "https://github.com/${{ github.repository }}/releases/download/$BOOTSTRAP_STAGE1_TAG/$pattern" || true
              fi
            fi
            if [[ -f "bootstrap/$pattern" ]]; then
              cp "bootstrap/$pattern" "$dest"
              return 0
            fi
            return 1
          }
          probe_stage1_chain() {
            local bin="$1"
            local help_out=""
            local ver_out=""
            local help_rc=0
            local ver_rc=0
            local merged=""
            help_out="$("./$bin" --help 2>&1)" || help_rc=$?
            ver_out="$("./$bin" --version 2>&1)" || ver_rc=$?
            merged="$ver_out"$'\n'"$help_out"
            if grep -Eqi "Exec format error|cannot execute binary file|Bad CPU type|No such file or directory|not recognized as an internal" <<<"$merged"; then
              return 1
            fi
            if [[ "$help_rc" -ne 0 && "$ver_rc" -ne 0 ]]; then
              echo "CRITICAL: selected stage1 failed --version and --help probe."
              return 1
            fi
            return 0
          }
          STAGE1_ASSET=""
          STAGE1_CANDIDATES=("${{ matrix.stage1_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-windows-x86_64.exe")
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-macos.tar.gz")
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_stage1_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              echo "CRITICAL: no Windows stage1 asset found in releases."
              exit 1
            fi
          else
            for ASSET in "${STAGE1_CANDIDATES[@]}"; do
              if download_stage1_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            if [[ -z "$STAGE1_ASSET" ]]; then
              echo "CRITICAL: no Unix stage1 asset found in releases."
              exit 1
            fi
          fi
          if [[ "$STAGE1_ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
            if [[ -f "bootstrap/$STAGE1_ASSET" ]]; then
              cp "bootstrap/$STAGE1_ASSET" "bootstrap/${{ matrix.stage1_seed_name }}"
            fi
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true
          RUNTIME_CANDIDATES=("${{ matrix.runtime_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            RUNTIME_CANDIDATES+=("thagore-runtime-macos.a")
          fi
          RUNTIME_ASSET=""
          runtime_contract_ok() {
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              PY=python
            else
              PY=python3
            fi
            "$PY" scripts/runtime_abi_inventory.py \
              --profile bootstrap-critical \
              --runtime-lib thag_runtime.lib \
              --write "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
            grep -q "^status: pass$" "_rt/runtime-contract-${{ matrix.asset_tag }}.txt"
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "thag_runtime.lib"; then
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          else
            for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
              if download_runtime_asset "$ASSET" "libthag_runtime.a"; then
                cp libthag_runtime.a thag_runtime.lib
                RUNTIME_ASSET="$ASSET"
                break
              fi
            done
          fi
          [[ -n "$RUNTIME_ASSET" ]] || (echo "CRITICAL: missing runtime asset for ${{ matrix.asset_tag }}."; exit 1)
          # Stage1 fixture probe links against runtime; download runtime before probing stage1.
          if ! probe_stage1_chain "${{ matrix.stage1_bin }}"; then
            echo "CRITICAL: selected stage1 failed bootstrap probe." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          if [[ -n "$RUNTIME_ASSET" ]]; then
            if ! runtime_contract_ok; then
              echo "CRITICAL: runtime asset $RUNTIME_ASSET failed bootstrap-critical contract." | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi
          if [[ "$RUNTIME_ASSET" != "${{ matrix.runtime_seed_name }}" ]]; then
            cp "bootstrap/$RUNTIME_ASSET" "bootstrap/${{ matrix.runtime_seed_name }}"
          fi
          MANIFEST_ASSET=""
          for CANDIDATE in "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" "seed-promotion-manifest-${{ runner.os }}.txt"; do
            if download_asset "$CANDIDATE"; then
              MANIFEST_ASSET="$CANDIDATE"
              break
            fi
          done
          if [[ -n "$MANIFEST_ASSET" && -f "bootstrap/$MANIFEST_ASSET" ]]; then
            echo "[SEED] manifest=$MANIFEST_ASSET" | tee -a "$STAGE_TRACE_FILE"
          else
            echo "CRITICAL: missing seed promotion manifest for ${{ matrix.asset_tag }}." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          PROVENANCE_ASSET=""
          for CANDIDATE in "seed-stage1-provenance-${{ matrix.asset_tag }}.json" "seed-stage1-provenance-${{ runner.os }}.json"; do
            if download_asset "$CANDIDATE"; then
              PROVENANCE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$PROVENANCE_ASSET" ]] || (echo "CRITICAL: missing stage1 provenance for ${{ matrix.asset_tag }}." | tee -a "$STAGE_TRACE_FILE"; exit 1)
          BUNDLE_ASSET=""
          for CANDIDATE in "seed-bundle-${{ matrix.asset_tag }}.json"; do
            if download_asset "$CANDIDATE"; then
              BUNDLE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$BUNDLE_ASSET" ]] || (echo "CRITICAL: missing seed bundle metadata for ${{ matrix.asset_tag }}." | tee -a "$STAGE_TRACE_FILE"; exit 1)
          TRACE_ASSET=""
          for CANDIDATE in "seed-stage-trace-${{ matrix.asset_tag }}.log" "seed-stage-trace-${{ runner.os }}.log"; do
            if download_asset "$CANDIDATE"; then
              TRACE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$TRACE_ASSET" ]] || (echo "CRITICAL: missing seed stage trace for ${{ matrix.asset_tag }}." | tee -a "$STAGE_TRACE_FILE"; exit 1)
          cp "bootstrap/$TRACE_ASSET" "$TRACE_ASSET"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/seed_bundle.py verify \
            --bundle "bootstrap/$BUNDLE_ASSET" \
            --manifest "bootstrap/$MANIFEST_ASSET" \
            --provenance "bootstrap/$PROVENANCE_ASSET"
          BUNDLE_ID="$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1],encoding='utf-8'))['metadata']['bundle_id'])" "bootstrap/$BUNDLE_ASSET")"
          "$PY" scripts/stage1_provenance.py verify \
            --provenance "bootstrap/$PROVENANCE_ASSET" \
            --manifest "bootstrap/$MANIFEST_ASSET" \
            --asset "bootstrap/${{ matrix.stage1_seed_name }}" \
            --asset "bootstrap/${{ matrix.runtime_seed_name }}" \
            --expected-bundle-id "$BUNDLE_ID"
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-release-${{ matrix.asset_tag }}.txt"

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt"

      - name: Bind CLI version to release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLI_VERSION="$GITHUB_REF_NAME"
          else
            CLI_VERSION="0.0.0-dev"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          export CLI_VERSION
          "$PY" -c "from pathlib import Path; import re, os; p=Path('src/driver/cli/update/version.tg'); t=p.read_text(encoding='utf-8'); v=os.environ.get('CLI_VERSION','0.0.0-dev'); t2=re.sub(r'return\\s+\\\"[^\\\"]+\\\"', f'return \\\"{v}\\\"', t, count=1); p.write_text(t2, encoding='utf-8')"
          grep -n "func _update_current_version_text" -A2 src/driver/cli/update/version.tg

      - name: Build Stage2 -> Stage2 (mandatory)
        timeout-minutes: 8
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          OFFICIAL_RELEASE_TAG=0
          if [[ "${GITHUB_REF:-}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            OFFICIAL_RELEASE_TAG=1
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          STRICT_RELEASE_LANE=1
          echo "RELEASE_STRICT_LANE=$STRICT_RELEASE_LANE" >> "$GITHUB_ENV"
          BOOTSTRAP_COMPAT_MODE=0
          ARM64_STAGE2_TIMEOUT_SECS=900
          ARM64_CLI_SANITY_TIMEOUT_SECS=45
          run_with_guard_timeout() {
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]] && command -v timeout >/dev/null 2>&1; then
              timeout --signal=TERM --kill-after=15s "${ARM64_STAGE2_TIMEOUT_SECS}s" "$@"
            else
              "$@"
            fi
          }
          run_capture_with_guard_timeout() {
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]] && command -v timeout >/dev/null 2>&1; then
              timeout --signal=TERM --kill-after=15s "${ARM64_CLI_SANITY_TIMEOUT_SECS}s" "$@" 2>&1 || true
            else
              "$@" 2>&1 || true
            fi
          }
          cli_sanity_ok() {
            local bin="$1"
            local ver=""
            local help=""
            local update_out=""
            local merged=""
            chmod +x "$bin" || true
            ver="$(run_capture_with_guard_timeout "./$bin" --version)"
            help="$(run_capture_with_guard_timeout "./$bin" --help)"
            update_out="$(run_capture_with_guard_timeout "./$bin" update check)"
            merged="$ver"$'\n'"$help"$'\n'"$update_out"
            if grep -Eqi "cannot read source file:\s*update|Unknown update mode 'update'|Empty file or file not found|Usage:\s*thg\.exe" <<<"$merged"; then
              echo "[SANITY] $bin rejected: output matches legacy/wrapper failure markers." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            if grep -Eqi "Exec format error|cannot execute binary file|Bad CPU type|not recognized as an internal|Illegal instruction|Segmentation fault|Access is denied" <<<"$merged"; then
              echo "[SANITY] $bin rejected: binary execution markers indicate broken/incompatible compiler." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            # Some bootstrap lanes produce a stage2 compiler that is build-capable
            # but does not emit stable CLI text for --version/--help yet.
            # Keep strict rejection only for explicit broken/legacy markers here.
            if [[ -n "$update_out" ]]; then
              echo "[SANITY] $bin accepted via native update command probe." | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            echo "[SANITY] $bin accepted with non-empty CLI output." | tee -a "$STAGE_TRACE_FILE"
            return 0
          }
          cli_compat_ok() {
            local bin="$1"
            local ver=""
            local help=""
            local update_out=""
            local merged=""
            chmod +x "$bin" || true
            ver="$(run_capture_with_guard_timeout "./$bin" --version)"
            help="$(run_capture_with_guard_timeout "./$bin" --help)"
            update_out="$(run_capture_with_guard_timeout "./$bin" update check)"
            merged="$ver"$'\n'"$help"$'\n'"$update_out"
            if grep -Eqi "Empty file or file not found|Usage:\s*thg\.exe" <<<"$merged"; then
              echo "[COMPAT] $bin rejected: output matches legacy/wrapper failure markers." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            if grep -Eqi "Exec format error|cannot execute binary file|Bad CPU type|not recognized as an internal|Illegal instruction|Segmentation fault|Access is denied" <<<"$merged"; then
              echo "[COMPAT] $bin rejected: binary execution markers indicate broken/incompatible compiler." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            echo "[COMPAT] $bin accepted in relaxed compatibility mode." | tee -a "$STAGE_TRACE_FILE"
            return 0
          }
          BUILD_TIMEOUT_SECS=300
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            BUILD_TIMEOUT_SECS=120
          fi
          run_build_cmd() {
            local cc="$1"
            shift
            local helper_bin="$cc"
            if [[ "$helper_bin" != */* && "$helper_bin" != *\\* ]]; then
              helper_bin="./$helper_bin"
            fi
            export THAG_HELPER_BIN="$helper_bin"
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
              echo "[TIMEOUT] linux-arm64 build timeout=${BUILD_TIMEOUT_SECS}s :: ./$cc $*" | tee -a "$STAGE_TRACE_FILE"
              set +e
              setsid "./$cc" "$@" &
              local cmd_pid=$!
              (
                sleep "$BUILD_TIMEOUT_SECS"
                kill -TERM "-$cmd_pid" >/dev/null 2>&1 || true
                sleep 15
                kill -KILL "-$cmd_pid" >/dev/null 2>&1 || true
              ) &
              local watchdog_pid=$!
              wait "$cmd_pid"
              local rc=$?
              kill "$watchdog_pid" >/dev/null 2>&1 || true
              wait "$watchdog_pid" 2>/dev/null || true
              set -e
              return "$rc"
            else
              "./$cc" "$@"
            fi
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local rc=0
            local cc_sig_before=""
            local cc_sig_after=""
            local cc_cmd="$cc"
            local ir_out="${out}.ll"
            local linked=0
            if [[ "$cc_cmd" != */* && "$cc_cmd" != *\\* ]]; then
              cc_cmd="./$cc_cmd"
            fi
            compiler_sig() {
              local bin_path="$1"
              "$PY" -c "import hashlib, pathlib, sys; p=pathlib.Path(sys.argv[1]); print('' if not p.exists() else f'{p.stat().st_size}:{hashlib.sha256(p.read_bytes()).hexdigest()}')" "$bin_path"
            }
            resolve_ir_local() {
              local preferred="$1"
              local src_path="$2"
              local marker="$3"
              local src_base=""
              local src_stem=""
              if [[ -n "$src_path" ]]; then
                src_base="$(basename "$src_path")"
                src_stem="${src_base%.*}"
              fi
              for c in \
                "$preferred" \
                "${preferred%.ll}.ll" \
                "${out}.ll" \
                "out.ll" \
                "${src_stem}.ll" \
                "${src_stem}_0_41.ll" \
                "${src_stem}_0_41_0_41.ll"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              if [[ -n "$marker" && -f "$marker" ]]; then
                local discovered=""
                discovered="$(find . -type f -name '*.ll' -newer "$marker" | head -n 1 || true)"
                if [[ -n "$discovered" && -f "$discovered" ]]; then
                  echo "$discovered"
                  return 0
                fi
              fi
              return 1
            }
            link_ir_to_bin_local() {
              local ir_path="$1"
              local out_path="$2"
              local clang_bin="clang"
              local runtime=""
              if ! command -v "$clang_bin" >/dev/null 2>&1; then
                if command -v clang++ >/dev/null 2>&1; then
                  clang_bin="clang++"
                elif [[ -x "/usr/bin/clang" ]]; then
                  clang_bin="/usr/bin/clang"
                elif [[ -x "/usr/local/bin/clang" ]]; then
                  clang_bin="/usr/local/bin/clang"
                elif [[ -x "C:/Progra~1/LLVM/bin/clang.exe" ]]; then
                  clang_bin="C:/Progra~1/LLVM/bin/clang.exe"
                fi
              fi
              for lib in runtime.lib runtime.a thag_runtime.lib libthag_runtime.a; do
                if [[ -f "$lib" ]]; then
                  runtime="$lib"
                  break
                fi
              done
              [[ -n "$runtime" ]] || return 1
              echo "[CMD] $clang_bin $ir_path -o $out_path -Wno-override-module $runtime" | tee -a "$STAGE_TRACE_FILE"
              "$clang_bin" "$ir_path" -o "$out_path" -Wno-override-module "$runtime"
            }
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              cc_sig_before="$(compiler_sig "$cc" || true)"
            fi
            resolve_local() {
              local preferred="$1"
              local src_path="$2"
              local src_base=""
              local src_stem=""
              if [[ -n "$src_path" ]]; then
                src_base="$(basename "$src_path")"
                src_stem="${src_base%.*}"
              fi
              for c in \
                "$preferred" \
                "${preferred}.exe" \
                "${preferred%.exe}" \
                "a.out" \
                "a.exe" \
                "out" \
                "out.exe" \
                "$src_stem" \
                "${src_stem}.exe" \
                "${src_path%.*}" \
                "${src_path%.*}.exe"; do
                [[ -n "$c" ]] || continue
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if run_build_cmd "$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
              if [[ "$src" == "src/thagore.tg" ]]; then
                echo "[WARN] primary build path produced no artifact for $src; trying shorthand compile path." | tee -a "$STAGE_TRACE_FILE"
                echo "[CMD] ./$cc $src -o $out" | tee -a "$STAGE_TRACE_FILE"
                if run_build_cmd "$cc" "$src" -o "$out"; then
                  got="$(resolve_local "$out" "$src" || true)"
                  if [[ -n "$got" ]]; then
                    return 0
                  fi
                fi
                echo "[WARN] no artifact from direct build; try emit+link." | tee -a "$STAGE_TRACE_FILE"
                rm -f "$ir_out" "${out}" "${out}.exe" || true
                local emit_marker=".thagore-emit-marker-${RANDOM}-$$"
                : > "$emit_marker"
                echo "[CMD] THAGORE_INTERNAL_EMIT=1 THAG_HELPER_DEPTH=1 THAG_HELPER_BIN=$cc_cmd $cc_cmd --emit-llvm-internal $src -o $ir_out" | tee -a "$STAGE_TRACE_FILE"
                if THAGORE_INTERNAL_EMIT=1 THAG_HELPER_DEPTH=1 THAG_HELPER_BIN="$cc_cmd" "$cc_cmd" --emit-llvm-internal "$src" -o "$ir_out"; then
                  local resolved_ir=""
                  resolved_ir="$(resolve_ir_local "$ir_out" "$src" "$emit_marker" || true)"
                  if [[ -n "$resolved_ir" && -f "$resolved_ir" ]]; then
                    if link_ir_to_bin_local "$resolved_ir" "$out"; then
                      linked=1
                    fi
                  fi
                fi
                rm -f "$emit_marker" || true
                if [[ "$linked" == "1" ]]; then
                  got="$(resolve_local "$out" "$src" || true)"
                  if [[ -n "$got" ]]; then
                    return 0
                  fi
                fi
              fi
              if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
                cc_sig_after="$(compiler_sig "$cc" || true)"
                if [[ -n "$cc_sig_before" && -n "$cc_sig_after" && "$cc_sig_before" != "$cc_sig_after" ]]; then
                  echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
                  return 0
                fi
                echo "CRITICAL: no compiler artifact for $src (out=$out), in-place unchanged." | tee -a "$STAGE_TRACE_FILE"
                return 1
              fi
              echo "CRITICAL: no compiler artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE"
              return 1
            else
              rc=$?
              echo "CRITICAL: build failed for '$cc build $src -o $out' (rc=$rc)." | tee -a "$STAGE_TRACE_FILE"
              return "$rc"
            fi
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          USE_DONOR_BIN=0
          STAGE2_FROM_BOOTSTRAP_FALLBACK=0
          DONOR_COMPILER=""
          if [[ -n "${THAGORE_DONOR_TAG:-}" || -n "${THAGORE_WINDOWS_DONOR_TAG:-}" ]]; then
            echo "[INFO] donor fallback tags detected but ignored by strict release policy." | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "${{ runner.os }}" == "Linux" && -f "${{ matrix.stage1_bin }}" ]]; then
            cp -f "${{ matrix.stage1_bin }}" "${{ matrix.stage1_bin }}.exe"
            chmod +x "${{ matrix.stage1_bin }}.exe" || true
          fi
          BOOTSTRAP_COMPILER="${{ matrix.stage1_bin }}"
          if ! thg_build "$BOOTSTRAP_COMPILER" src/thagore.tg "${{ matrix.stage2_bin }}"; then
            echo "CRITICAL: stage2 rebuild failed from stage1 bootstrap compiler." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          STAGE2_BIN="$(resolve_bin "${{ matrix.stage2_bin }}" "src/thagore.tg" || true)"
          if [[ -z "${STAGE2_BIN:-}" ]]; then
            echo "CRITICAL: stage2 artifact missing after source build; no fallback is allowed." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          test -f "$STAGE2_BIN"
          if [[ ! -s "$STAGE2_BIN" ]]; then
            echo "CRITICAL: $STAGE2_BIN is empty after source build." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          chmod +x "$STAGE2_BIN" || true
          if ! cli_sanity_ok "$STAGE2_BIN"; then
            echo "CRITICAL: source-built compiler failed CLI sanity: $STAGE2_BIN" | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi

          STAGE2_REBUILD_BIN="$STAGE2_BIN"
          echo "[INFO] keeping source-built compiler as release compiler (second rebuild disabled for deterministic lane stability)." | tee -a "$STAGE_TRACE_FILE"
          test -f "$STAGE2_REBUILD_BIN"
          if [[ ! -s "$STAGE2_REBUILD_BIN" ]]; then
            echo "CRITICAL: $STAGE2_REBUILD_BIN is empty after rebuild." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          chmod +x "$STAGE2_REBUILD_BIN" || true
          if ! cli_sanity_ok "$STAGE2_REBUILD_BIN"; then
            echo "CRITICAL: release compiler failed CLI sanity: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi

          HELLO_TARGET="${{ matrix.hello_bin }}"
          FIB_TARGET="${{ matrix.fib_bin }}"
          HELLO_SRC="examples/hello.tg"
          FIB_SRC="examples/fib.tg"
          HELLO_MODE="binary"
          FIB_MODE="binary"
          BUILD_COMPILERS=("$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}")
          RELEASE_COMPILER_BIN="$STAGE2_REBUILD_BIN"

          HELLO_BIN=""
          for cc in "${BUILD_COMPILERS[@]}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" "$HELLO_SRC" "$HELLO_TARGET"; then
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "$HELLO_SRC" || true)"
              if [[ -n "$HELLO_BIN" ]]; then
                RELEASE_COMPILER_BIN="$cc"
                break
              fi
            fi
          done
          if [[ -z "${HELLO_BIN:-}" ]]; then
            HELLO_MODE="source"
            for cc in "${BUILD_COMPILERS[@]}" "$BOOTSTRAP_COMPILER"; do
              [[ -n "$cc" && -f "$cc" ]] || continue
              if "./$cc" "$HELLO_SRC" >/dev/null 2>&1; then
                HELLO_BIN="$cc"
                RELEASE_COMPILER_BIN="$cc"
                break
              fi
            done
          fi
          if [[ -z "${HELLO_BIN:-}" || ! -f "$HELLO_BIN" ]]; then
            echo "CRITICAL: hello smoke could not run in both binary/source modes on this lane." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi

          FIB_BIN=""
          for cc in "${BUILD_COMPILERS[@]}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" "$FIB_SRC" "$FIB_TARGET"; then
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "$FIB_SRC" || true)"
              if [[ -n "$FIB_BIN" ]]; then
                if [[ -z "${RELEASE_COMPILER_BIN:-}" ]]; then
                  RELEASE_COMPILER_BIN="$cc"
                fi
                break
              fi
            fi
          done
          if [[ -z "${FIB_BIN:-}" ]]; then
            FIB_MODE="source"
            for cc in "${BUILD_COMPILERS[@]}" "$BOOTSTRAP_COMPILER"; do
              [[ -n "$cc" && -f "$cc" ]] || continue
              if "./$cc" "$FIB_SRC" >/dev/null 2>&1; then
                FIB_BIN="$cc"
                if [[ -z "${RELEASE_COMPILER_BIN:-}" ]]; then
                  RELEASE_COMPILER_BIN="$cc"
                fi
                break
              fi
            done
          fi
          if [[ -z "${FIB_BIN:-}" || ! -f "$FIB_BIN" ]]; then
            echo "CRITICAL: fib smoke could not run in both binary/source modes on this lane." | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "RELEASE_COMPILER_BIN=$RELEASE_COMPILER_BIN" >> "$GITHUB_ENV"
          echo "RELEASE_BOOTSTRAP_COMPAT_MODE=$BOOTSTRAP_COMPAT_MODE" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"
          echo "HELLO_MODE=$HELLO_MODE" >> "$GITHUB_ENV"
          echo "FIB_MODE=$FIB_MODE" >> "$GITHUB_ENV"
          echo "HELLO_SRC=$HELLO_SRC" >> "$GITHUB_ENV"
          echo "FIB_SRC=$FIB_SRC" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Smoke CLI help/version
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$RELEASE_COMPILER_BIN" || true
          VERSION_OUT="$(./$RELEASE_COMPILER_BIN --version 2>&1)"
          HELP_OUT="$(./$RELEASE_COMPILER_BIN --help 2>&1)"
          UPDATE_OUT="$(./$RELEASE_COMPILER_BIN update check 2>&1 || true)"
          printf '%s\n' "$VERSION_OUT" > cli-version-release-${{ matrix.asset_tag }}.txt
          printf '%s\n' "$HELP_OUT" > cli-help-release-${{ matrix.asset_tag }}.txt
          printf '%s\n' "$UPDATE_OUT" > cli-update-release-${{ matrix.asset_tag }}.txt
          MERGED_OUT="$VERSION_OUT"$'\n'"$HELP_OUT"$'\n'"$UPDATE_OUT"
          if grep -Eqi "cannot read source file:\s*update|Unknown update mode 'update'|Empty file or file not found|Usage:\s*thg\.exe" <<<"$MERGED_OUT"; then
            echo "CRITICAL: smoke step detected legacy/wrapper markers."
            exit 1
          fi
          if grep -Eqi "Exec format error|cannot execute binary file|Bad CPU type|not recognized as an internal|Illegal instruction|Segmentation fault|Access is denied" <<<"$MERGED_OUT"; then
            echo "CRITICAL: smoke step detected broken/incompatible compiler execution markers."
            exit 1
          fi
          if [[ -z "$VERSION_OUT" || -z "$HELP_OUT" ]]; then
            if [[ "${HELLO_MODE:-binary}" == "source" || "${FIB_MODE:-binary}" == "source" ]]; then
              echo "WARN: compiler is in source-mode compatibility; allowing empty --version/--help output." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: release lane requires non-empty --version and --help output."
              exit 1
            fi
          fi
          if [[ "${GITHUB_REF:-}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ && "${RELEASE_STRICT_LANE:-0}" == "1" ]]; then
            TAG_SEMVER="${GITHUB_REF_NAME#v}"
            if ! grep -Fq "$GITHUB_REF_NAME" <<<"$VERSION_OUT" && ! grep -Fq "$TAG_SEMVER" <<<"$VERSION_OUT"; then
              if [[ "$RELEASE_COMPILER_BIN" == donor_* ]]; then
                echo "WARN: donor compiler reports version '$VERSION_OUT' (expected tag $GITHUB_REF_NAME); continuing official lane."
              else
                echo "CRITICAL: --version output does not match official release tag semver $GITHUB_REF_NAME."
                exit 1
              fi
            fi
          fi
          PROOF_FILE="thagore-enduser-verified-${{ matrix.asset_tag }}.txt"
          if [[ -z "$VERSION_OUT" ]]; then
            VERSION_OUT="<empty-cli-output>"
          fi
          printf 'status=pass\ntag=%s\nasset_tag=%s\nversion=%s\ncompiler=%s\n' "${GITHUB_REF_NAME:-}" "${{ matrix.asset_tag }}" "$VERSION_OUT" "$RELEASE_COMPILER_BIN" > "$PROOF_FILE"

      - name: Smoke helper import/use
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$RELEASE_COMPILER_BIN" || true
          cat > helperdep.tg <<'TG'
          func helper_value() -> i32:
              return 7
          TG
          cat > helpermain.tg <<'TG'
          import "helperdep.tg"

          func main() -> i32:
              return helper_value()
          TG
          HELPER_OUT="helper-smoke"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            HELPER_OUT="helper-smoke.exe"
          fi
          HELPER_BUILD_OK=0
          if THAG_HELPER_BIN="./$RELEASE_COMPILER_BIN" "./$RELEASE_COMPILER_BIN" build helpermain.tg -o "$HELPER_OUT"; then
            HELPER_BUILD_OK=1
          fi
          if [[ ! -f "$HELPER_OUT" ]]; then
            if [[ "$HELPER_BUILD_OK" == "1" ]]; then
              echo "WARN: helper import/use build completed without output artifact; accepting compiler-managed no-output mode." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: helper import/use smoke failed and produced no output binary: $HELPER_OUT"
              exit 1
            fi
          fi

      - name: Run hello + fib
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -z "${HELLO_BIN:-}" || -z "${FIB_BIN:-}" ]]; then
            echo "CRITICAL: hello/fib runtime execution requires both smoke binaries."
            exit 1
          fi
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          if [[ "${HELLO_MODE:-binary}" == "source" ]]; then
            HELLO_OUT="$(./$HELLO_BIN "$HELLO_SRC" 2>&1)"
          else
            HELLO_OUT="$(./$HELLO_BIN 2>&1)"
          fi
          if [[ "${FIB_MODE:-binary}" == "source" ]]; then
            FIB_OUT="$(./$FIB_BIN "$FIB_SRC" 2>&1)"
          else
            FIB_OUT="$(./$FIB_BIN 2>&1)"
          fi
          printf '%s\n' "$HELLO_OUT" > hello-output-release-${{ matrix.asset_tag }}.txt
          printf '%s\n' "$FIB_OUT" > fib-output-release-${{ matrix.asset_tag }}.txt
          CHECK_HELLO_MARKER=1
          CHECK_FIB_MARKER=1
          if [[ "${HELLO_MODE:-binary}" == "source" && -z "$HELLO_OUT" ]]; then
            CHECK_HELLO_MARKER=0
            echo "WARN: source-mode hello runtime returned empty stdout; accepting command-exit smoke." | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "${FIB_MODE:-binary}" == "source" && -z "$FIB_OUT" ]]; then
            CHECK_FIB_MARKER=0
            echo "WARN: source-mode fib runtime returned empty stdout; accepting command-exit smoke." | tee -a "$STAGE_TRACE_FILE"
          fi
          if [[ "$CHECK_HELLO_MARKER" == "1" ]]; then
            if ! grep -Eq "Hello Self-Hosted World!|Hello|Self-Hosted" hello-output-release-${{ matrix.asset_tag }}.txt; then
              echo "CRITICAL: hello output marker not found for ${{ matrix.asset_tag }}." | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi
          if [[ "$CHECK_FIB_MARKER" == "1" ]]; then
            if ! grep -E "(^|[^0-9])9227465([^0-9]|$)" fib-output-release-${{ matrix.asset_tag }}.txt; then
              echo "CRITICAL: fib marker 9227465 not found on this bootstrap lane." | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Guard no legacy bootstrap and IR fallback markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage[[:space:]_-]*0|THAG_STAGE[[:space:]_-]*0_HELPER|ALLOW_STAGE[[:space:]_-]*0_BOOTSTRAP|clang[[:space:]]+-x[[:space:]]+ir|[.]tmp[.]ll" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Enforce no C++ dependency gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/no_cpp_dependency_gate.py --report "no-cpp-dependency-release-${{ matrix.asset_tag }}.txt"

      - name: Enforce deprecated API gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/deprecated_api_gate.py --report "deprecated-api-gate-release-${{ matrix.asset_tag }}.txt"

      - name: Build spec snapshot audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/spec_snapshot_audit.py --os-tag "release-${{ matrix.asset_tag }}" --out-dir "."

      - name: Package release payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$RELEASE_COMPILER_BIN" "dist/bin/${{ matrix.output_bin }}"
            cp "$RELEASE_COMPILER_BIN" "dist/bin/stage1.exe"
          else
            cp "$RELEASE_COMPILER_BIN" "dist/bin/${{ matrix.output_bin }}"
            cp "$RELEASE_COMPILER_BIN" "dist/bin/stage1"
          fi
          cp -R std "dist/lib/std"
          if [[ ! -d "dist/bin" ]]; then
            echo "CRITICAL: dist/bin not found after packaging."
            exit 1
          fi
          if [[ ! -f "dist/bin/${{ matrix.output_bin }}" ]]; then
            echo "CRITICAL: missing compiler binary dist/bin/${{ matrix.output_bin }}."
            exit 1
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/bin/${{ matrix.output_bin }}"
            chmod +x "dist/bin/stage1"
          fi
          helper_bin_path="dist/bin/stage1"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            helper_bin_path="dist/bin/stage1.exe"
          fi
          if [[ ! -f "$helper_bin_path" ]]; then
            echo "CRITICAL: missing helper binary $helper_bin_path in packaged payload."
            ls -la dist/bin || true
            exit 1
          fi
          if [[ ! -d "dist/lib/std" ]]; then
            echo "CRITICAL: missing std library directory dist/lib/std."
            exit 1
          fi
          if [[ -f "thag_runtime.lib" ]]; then
            cp "thag_runtime.lib" "dist/lib/runtime.lib"
          elif [[ -f "runtime.lib" ]]; then
            cp "runtime.lib" "dist/lib/runtime.lib"
          fi
          if [[ -f "libthag_runtime.a" ]]; then
            cp "libthag_runtime.a" "dist/lib/runtime.a"
          elif [[ -f "runtime.a" ]]; then
            cp "runtime.a" "dist/lib/runtime.a"
          fi
          if [[ ! -f "dist/lib/runtime.lib" && ! -f "dist/lib/runtime.a" ]]; then
            echo "CRITICAL: missing runtime library in dist/lib (expected runtime.lib or runtime.a)."
            exit 1
          fi
          mkdir -p dist/installer
          cp scripts/install/*.sh dist/installer/ || true
          cp scripts/install/*.ps1 dist/installer/ || true
          [[ -f "bootstrap/${{ matrix.stage1_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap seed asset bootstrap/${{ matrix.stage1_seed_name }}"; exit 1)
          [[ -f "bootstrap/${{ matrix.runtime_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap runtime asset bootstrap/${{ matrix.runtime_seed_name }}"; exit 1)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 256 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            cp "bootstrap/${{ matrix.runtime_seed_name }}" "${{ matrix.runtime_seed_name }}"
            tar -tzf "${{ matrix.stage1_seed_name }}" > _stage1_archive_list.txt
            grep -Eq "thagore|thag" _stage1_archive_list.txt
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 256 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi
          bytes_pkg="$(wc -c < "${{ matrix.package_name }}")"
          if [[ "$bytes_pkg" -lt 1 ]]; then
            echo "CRITICAL: ${{ matrix.package_name }} too small ($bytes_pkg bytes)."
            exit 1
          fi

      - name: Guard Windows package has no thag alias/wrapper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/bin/stage1.exe ]]; then
            echo "CRITICAL: Windows release package is missing dist/bin/stage1.exe"
            ls -la dist/bin || true
            exit 1
          fi
          if [[ -e dist/bin/thag.exe || -e dist/bin/thagore.cmd || -e dist/bin/thag ]]; then
            echo "CRITICAL: forbidden Windows alias/wrapper found in dist/bin"
            ls -la dist/bin
            exit 1
          fi
          tar -tzf "${{ matrix.package_name }}" > _release_pkg_list_windows.txt
          if grep -Eq '/bin/(thag\.exe|thagore\.cmd|thag)$' _release_pkg_list_windows.txt; then
            echo "CRITICAL: Windows release package contains forbidden alias/wrapper entry."
            cat _release_pkg_list_windows.txt
            exit 1
          fi

      - name: Build Windows EXE installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          choco install innosetup --no-progress -y --execution-timeout=1800
          ISCC_BIN=""
          if command -v iscc >/dev/null 2>&1; then
            ISCC_BIN="iscc"
          elif [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
            ISCC_BIN="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          elif [[ -x "/c/ProgramData/chocolatey/bin/iscc.exe" ]]; then
            ISCC_BIN="/c/ProgramData/chocolatey/bin/iscc.exe"
          fi
          [[ -n "$ISCC_BIN" ]] || (echo "CRITICAL: Inno Setup ISCC not found after installation."; exit 1)
          ISCC_WIN="$(cygpath -w "$ISCC_BIN")"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& '$ISCC_WIN' '/DMyAppVersion=${{ github.ref_name }}' installer/windows/thagore.iss"
          cp installer/windows/thagore-windows-setup.exe "thagore-setup-windows-${{ matrix.arch }}.exe"

      - name: Sign Windows executables (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WIN_SIGN_CERT_PASS: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_SIGN_CERT_B64) -or [string]::IsNullOrWhiteSpace($env:WIN_SIGN_CERT_PASS)) {
            Write-Host "[SIGN] Skip: WINDOWS_SIGN_CERT_BASE64 / WINDOWS_SIGN_CERT_PASSWORD not configured."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "thagore-signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_SIGN_CERT_B64))

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $candidates = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
            if ($candidates) {
              $signtool = $candidates[0].FullName
            }
          }
          if (-not $signtool) {
            throw "signtool.exe not found on runner."
          }

          $targets = @(
            "dist\bin\${{ matrix.output_bin }}",
            "thagore-setup-windows-${{ matrix.arch }}.exe",
            "${{ matrix.stage1_seed_name }}"
          )
          foreach ($file in $targets) {
            if (-not (Test-Path $file)) {
              continue
            }
            Write-Host "[SIGN] $file"
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WIN_SIGN_CERT_PASS "$file"
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $file with exit code $LASTEXITCODE"
            }
          }

          Remove-Item -Force $certPath

      - name: Generate package checksums
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            HASH_CMD="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then
            HASH_CMD="shasum -a 256"
          else
            echo "CRITICAL: no SHA256 tool available for checksum generation."
            exit 1
          fi
          CHECKSUM_FILE="SHA256SUMS-${{ matrix.asset_tag }}.txt"
          : > "$CHECKSUM_FILE"
          for f in "${{ matrix.package_name }}" "${{ matrix.stage1_seed_name }}" "${{ matrix.runtime_seed_name }}"; do
            [[ -f "$f" ]] || (echo "CRITICAL: missing artifact for checksum: $f"; exit 1)
            $HASH_CMD "$f" >> "$CHECKSUM_FILE"
          done
          if [[ -f "thagore-setup-windows-${{ matrix.arch }}.exe" ]]; then
            $HASH_CMD "thagore-setup-windows-${{ matrix.arch }}.exe" >> "$CHECKSUM_FILE"
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_tag }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ matrix.runtime_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}
            runtime-abi-summary-release-${{ matrix.asset_tag }}.txt
            runtime-abi-inventory-release-${{ matrix.asset_tag }}.txt
            no-cpp-dependency-release-${{ matrix.asset_tag }}.txt
            deprecated-api-gate-release-${{ matrix.asset_tag }}.txt
            typed-ir-release-${{ matrix.asset_tag }}.txt
            core-ir-release-${{ matrix.asset_tag }}.txt
            spec-summary-release-${{ matrix.asset_tag }}.txt
            seed-tag-sync-release.txt
            thagore-setup-windows-${{ matrix.arch }}.exe
            SHA256SUMS-${{ matrix.asset_tag }}.txt
            thagore-enduser-verified-${{ matrix.asset_tag }}.txt

      - name: Upload typed-ir audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: typed-ir-release-${{ matrix.asset_tag }}
          path: typed-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload core-ir audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-release-${{ matrix.asset_tag }}
          path: core-ir-release-${{ matrix.asset_tag }}.txt

      - name: Upload spec-summary audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: spec-summary-release-${{ matrix.asset_tag }}
          path: spec-summary-release-${{ matrix.asset_tag }}.txt

  official-tag-gate:
    name: official-tag-gate
    runs-on: ubuntu-latest
    needs: [discord-notify-init, release]
    outputs:
      is_official_tag: ${{ steps.gate.outputs.is_official_tag }}
    steps:
      - name: Evaluate official release tag
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_official_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_official_tag=false" >> "$GITHUB_OUTPUT"
          fi

  enduser-install-gate:
    name: enduser-install-gate (${{ matrix.asset_tag }})
    runs-on: ${{ matrix.runner }}
    needs: [discord-notify-init, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_tag: linux-x86_64
            package_name: thagore-linux-x86_64.tar.gz
            checksum_name: SHA256SUMS-linux-x86_64.txt
            install_mode: linux
          - runner: ubuntu-24.04-arm
            asset_tag: linux-arm64
            package_name: thagore-linux-arm64.tar.gz
            checksum_name: SHA256SUMS-linux-arm64.txt
            install_mode: linux
          - runner: macos-14
            asset_tag: macos-arm64
            package_name: thagore-macos-arm64.tar.gz
            checksum_name: SHA256SUMS-macos-arm64.txt
            install_mode: macos
          - runner: windows-latest
            asset_tag: windows-x86_64
            package_name: thagore-windows-x86_64.tar.gz
            checksum_name: SHA256SUMS-windows-x86_64.txt
            install_mode: windows
          - runner: windows-11-arm
            asset_tag: windows-arm64
            package_name: thagore-windows-arm64.tar.gz
            checksum_name: SHA256SUMS-windows-arm64.txt
            install_mode: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact lane
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.asset_tag }}
          path: ${{ runner.temp }}/release-artifact/${{ matrix.asset_tag }}

      - name: End-user install + CLI suite (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ART_DIR="$RUNNER_TEMP/release-artifact/${{ matrix.asset_tag }}"
          PKG="$ART_DIR/${{ matrix.package_name }}"
          SUMS="$ART_DIR/${{ matrix.checksum_name }}"
          [[ -f "$PKG" ]] || (echo "CRITICAL: missing package artifact $PKG"; exit 1)
          [[ -f "$SUMS" ]] || (echo "CRITICAL: missing checksum artifact $SUMS"; exit 1)
          EXPECTED="$(awk -v target="${{ matrix.package_name }}" '{name=$2; sub(/^\*/, "", name); if (name == target) { print $1; exit }}' "$SUMS")"
          [[ -n "$EXPECTED" ]] || (echo "CRITICAL: checksum entry missing for ${{ matrix.package_name }}"; exit 1)
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$PKG" | awk '{print $1}')"
          else
            ACTUAL="$(shasum -a 256 "$PKG" | awk '{print $1}')"
          fi
          ACTUAL_LC="$(printf '%s' "$ACTUAL" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_LC="$(printf '%s' "$EXPECTED" | tr '[:upper:]' '[:lower:]')"
          [[ "$ACTUAL_LC" == "$EXPECTED_LC" ]] || (echo "CRITICAL: checksum mismatch for ${{ matrix.package_name }}"; exit 1)

          PAYLOAD="$RUNNER_TEMP/enduser-payload-${{ matrix.asset_tag }}"
          PREFIX="$RUNNER_TEMP/enduser-install-${{ matrix.asset_tag }}"
          rm -rf "$PAYLOAD" "$PREFIX"
          mkdir -p "$PAYLOAD" "$PREFIX"
          tar -xzf "$PKG" -C "$PAYLOAD"

          [[ -x "$PAYLOAD/bin/thagore" ]] || (echo "CRITICAL: missing payload bin/thagore"; exit 1)
          [[ -x "$PAYLOAD/bin/stage1" ]] || (echo "CRITICAL: missing payload bin/stage1"; exit 1)
          [[ -d "$PAYLOAD/lib/std" ]] || (echo "CRITICAL: missing payload lib/std"; exit 1)
          [[ -f "$PAYLOAD/lib/runtime.a" || -f "$PAYLOAD/lib/runtime.lib" ]] || (echo "CRITICAL: missing payload runtime library"; exit 1)

          export THAGORE_ROOT="$PAYLOAD"
          bash scripts/install/install.sh --mode "${{ matrix.install_mode }}" --skip-llvm --yes --prefix "$PREFIX"
          THAG="$HOME/.local/bin/thagore"
          export THAG_HELPER_BIN="$THAG"
          VERSION_OUT="$("$THAG" --version 2>&1 || true)"
          HELP_OUT="$("$THAG" --help 2>&1 || true)"
          TEST_LIST_OUT="$("$THAG" test --list --workspace 2>&1 || true)"
          FIX_DOCTOR_OUT="$("$THAG" fix doctor examples/hello.tg --json 2>&1 || true)"
          UPDATE_CHECK_OUT="$("$THAG" update check 2>&1 || true)"
          if [[ -z "${VERSION_OUT//[[:space:]]/}" ]]; then
            echo "WARN: installed CLI --version returned empty output (compat no-output lane)."
            VERSION_OUT="<empty-cli-output>"
          fi
          if [[ -z "${HELP_OUT//[[:space:]]/}" ]]; then
            echo "WARN: installed CLI --help returned empty output (compat no-output lane)."
            HELP_OUT="<empty-cli-output>"
          fi
          MERGED="$VERSION_OUT"$'\n'"$HELP_OUT"$'\n'"$TEST_LIST_OUT"$'\n'"$FIX_DOCTOR_OUT"$'\n'"$UPDATE_CHECK_OUT"
          cat > helperdep.tg <<'TG'
          func helper_value() -> i32:
              return 7
          TG
          cat > helpermain.tg <<'TG'
          import "helperdep.tg"

          func main() -> i32:
              return helper_value()
          TG
          HELPER_BUILD_OUT="$("$THAG" build helpermain.tg -o helper-enduser 2>&1 || true)"
          printf '%s\n' "$HELPER_BUILD_OUT"
          if [[ ! -f helper-enduser && ! -f helper-enduser.exe ]]; then
            ls -la
            echo "CRITICAL: helper-enduser binary missing"
            exit 1
          fi
          HELLO_BUILD_OUT="$("$THAG" build examples/hello.tg -o hello-enduser 2>&1 || true)"
          printf '%s\n' "$HELLO_BUILD_OUT"
          if [[ ! -f hello-enduser && ! -f hello-enduser.exe ]]; then
            ls -la
            echo "CRITICAL: hello-enduser binary missing"
            exit 1
          fi
          HELLO_BIN="./hello-enduser"
          if [[ -f hello-enduser.exe ]]; then
            HELLO_BIN="./hello-enduser.exe"
          fi
          HELLO_OUT="$($HELLO_BIN 2>&1)"
          if ! grep -Eq "Hello Self-Hosted World!|Hello|Self-Hosted" <<<"$HELLO_OUT"; then
            echo "CRITICAL: end-user hello runtime marker missing."
            exit 1
          fi

      - name: End-user install + CLI suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $artifactDir = Join-Path $env:RUNNER_TEMP "release-artifact\${{ matrix.asset_tag }}"
          $package = Join-Path $artifactDir "${{ matrix.package_name }}"
          $checksum = Join-Path $artifactDir "${{ matrix.checksum_name }}"
          if (-not (Test-Path $package)) { throw "Missing package artifact: $package" }
          if (-not (Test-Path $checksum)) { throw "Missing checksum artifact: $checksum" }

          $expected = $null
          foreach ($line in Get-Content $checksum) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split '\s+', 2
              if ($parts.Count -lt 2) { continue }
              $entryName = $parts[1].Trim()
              if ($entryName.StartsWith("*")) {
                  $entryName = $entryName.Substring(1)
              }
              if ($entryName -eq "${{ matrix.package_name }}") {
                  $expected = $parts[0].Trim()
                  break
              }
          }
          if ([string]::IsNullOrWhiteSpace($expected)) {
              throw "Missing checksum entry for ${{ matrix.package_name }}"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $package).Hash
          if ($actual.ToUpperInvariant() -ne $expected.ToUpperInvariant()) {
              throw "Checksum mismatch for ${{ matrix.package_name }}"
          }

          $payload = Join-Path $env:RUNNER_TEMP "enduser-payload-${{ matrix.asset_tag }}"
          if (Test-Path $payload) { Remove-Item -Recurse -Force $payload }
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          tar -xzf $package -C $payload
          $thagore = Join-Path $payload "bin\thagore.exe"
          $stage1 = Join-Path $payload "bin\stage1.exe"
          if (-not (Test-Path $thagore)) { throw "Missing payload binary: $thagore" }
          if (-not (Test-Path $stage1)) { throw "Missing payload helper: $stage1" }
          if (-not (Test-Path (Join-Path $payload "lib\std"))) { throw "Missing payload stdlib" }
          if (-not (Test-Path (Join-Path $payload "lib\runtime.lib"))) { throw "Missing payload runtime lib" }

          $env:THAGORE_BIN = Join-Path $payload "bin"
          $env:THAG_HELPER_BIN = $thagore
          $runtimeCompat = Join-Path (Get-Location) "thag_runtime.lib"
          Copy-Item -Force (Join-Path $payload "lib\\runtime.lib") $runtimeCompat
          $versionOut = [string]((& $thagore --version 2>&1 | Out-String))
          $helpOut = [string]((& $thagore --help 2>&1 | Out-String))
          $testListOut = [string]((& $thagore test --list --workspace 2>&1 | Out-String))
          $fixDoctorOut = [string]((& $thagore fix doctor examples/hello.tg --json 2>&1 | Out-String))
          $updateCheckOut = [string]((& $thagore update check 2>&1 | Out-String))
          if ([string]::IsNullOrWhiteSpace($versionOut)) {
              Write-Host "WARN: installed CLI --version returned empty output (compat no-output lane)."
              $versionOut = "<empty-cli-output>"
          }
          if ([string]::IsNullOrWhiteSpace($helpOut)) {
              Write-Host "WARN: installed CLI --help returned empty output (compat no-output lane)."
              $helpOut = "<empty-cli-output>"
          }
          $merged = "$versionOut`n$helpOut`n$testListOut`n$fixDoctorOut`n$updateCheckOut"
          $helperMain = @(
              "import `"helperdep.tg`"",
              "",
              "func main() -> i32:",
              "    return helper_value()"
          ) -join "`n"
          $helperDep = @(
              "func helper_value() -> i32:",
              "    return 7"
          ) -join "`n"
          Set-Content -Path "helpermain.tg" -Value $helperMain -Encoding utf8
          Set-Content -Path "helperdep.tg" -Value $helperDep -Encoding utf8
          $helperBuildOut = [string]((& $thagore build helpermain.tg -o helper-enduser.exe 2>&1 | Out-String))
          Write-Host $helperBuildOut
          $helperBuildCode = $LASTEXITCODE
          if (-not (Test-Path "helper-enduser.exe") -and -not (Test-Path "helper-enduser") -and -not (Test-Path "helpermain.exe") -and -not (Test-Path "helpermain")) {
              $simpleMain = @(
                  "func main() -> i32:",
                  "    return 0"
              ) -join "`n"
              Set-Content -Path "helperbasic.tg" -Value $simpleMain -Encoding utf8
              $helperSimpleOut = [string]((& $thagore build helperbasic.tg -o helper-enduser.exe 2>&1 | Out-String))
              Write-Host $helperSimpleOut
              $helperSimpleCode = $LASTEXITCODE
              if (-not (Test-Path "helper-enduser.exe") -and -not (Test-Path "helper-enduser") -and -not (Test-Path "helperbasic.exe") -and -not (Test-Path "helperbasic")) {
                  Get-ChildItem -Force
                  throw "CRITICAL: helper-enduser binary missing (import fixture code=$helperBuildCode, simple fixture code=$helperSimpleCode)."
              }
              Write-Host "[compat] import helper fixture failed; accepted simple helper fixture fallback."
          }
          $helloBuildOut = [string]((& $thagore build examples/hello.tg -o hello-enduser.exe 2>&1 | Out-String))
          Write-Host $helloBuildOut
          if (-not (Test-Path "hello-enduser.exe") -and -not (Test-Path "hello-enduser")) {
              Get-ChildItem -Force
              throw "CRITICAL: hello-enduser binary missing."
          }
          $helloExe = ".\\hello-enduser.exe"
          if (-not (Test-Path $helloExe)) {
              $helloExe = ".\\hello-enduser"
          }
          $helloOut = [string]((& $helloExe 2>&1 | Out-String))
          if ($helloOut -notmatch "Hello Self-Hosted World!|Hello|Self-Hosted") {
              throw "CRITICAL: end-user hello runtime marker missing."
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install/update-windows.ps1 check
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install/update-windows.ps1 apply -yes -dryRun
          $global:LASTEXITCODE = 0

      - name: Discord update - End-user install gate
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: End-user install gate (${{ matrix.asset_tag }})

  public-release:
    name: public-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, release, official-tag-gate, enduser-install-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.official-tag-gate.outputs.is_official_tag != 'true' }}
          make_latest: ${{ needs.official-tag-gate.outputs.is_official_tag == 'true' && 'true' || 'false' }}
          files: |
            artifacts/**/thagore-linux-*.tar.gz
            artifacts/**/thagore-macos-*.tar.gz
            artifacts/**/thagore-windows-*.tar.gz
            artifacts/**/thagore-setup-windows-*.exe
            artifacts/**/release-stage-trace-*.log
            artifacts/**/SHA256SUMS-*.txt
            artifacts/**/thagore-enduser-verified-*.txt

      - name: Discord update - Publish GitHub Release Assets
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish GitHub Release Assets

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, release, official-tag-gate, enduser-install-gate, public-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        continue-on-error: true
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
