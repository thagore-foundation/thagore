name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "LLVM_PATH=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "LLVM_PATH=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Smart Bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            FINAL_BIN="thag.exe"
            HELLO_BIN="hello.exe"
            FIB_BIN="fib.exe"
          else
            STAGE1_BIN="stage1"
            FINAL_BIN="thag"
            HELLO_BIN="hello"
            FIB_BIN="fib"
          fi

          mkdir -p bootstrap
          BOOTSTRAP_OK=0

          ASSET_NAME=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ASSET_NAME="thag-windows.zip"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ASSET_NAME="thag-macos.tar.gz"
          else
            ASSET_NAME="thag-linux.tar.gz"
          fi

          if gh release download --repo "${{ github.repository }}" --pattern "$ASSET_NAME" -D bootstrap; then
            mkdir -p bootstrap/extracted
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              7z x "bootstrap/$ASSET_NAME" -obootstrap/extracted >/dev/null
            else
              tar -xzf "bootstrap/$ASSET_NAME" -C bootstrap/extracted
            fi
            if [[ "${{ runner.os }}" == "Windows" && -f bootstrap/extracted/dist/bin/thag.exe ]]; then
              cp bootstrap/extracted/dist/bin/thag.exe "$STAGE1_BIN"
              BOOTSTRAP_OK=1
            elif [[ "${{ runner.os }}" != "Windows" && -f bootstrap/extracted/dist/bin/thag ]]; then
              cp bootstrap/extracted/dist/bin/thag "$STAGE1_BIN"
              chmod +x "$STAGE1_BIN"
              BOOTSTRAP_OK=1
            fi
          elif gh release download --repo "${{ github.repository }}" --pattern "thag.exe" --pattern "thag" -D bootstrap; then
            if [[ "${{ runner.os }}" == "Windows" && -f bootstrap/thag.exe ]]; then
              cp bootstrap/thag.exe "$STAGE1_BIN"
              BOOTSTRAP_OK=1
            elif [[ "${{ runner.os }}" != "Windows" && -f bootstrap/thag ]]; then
              cp bootstrap/thag "$STAGE1_BIN"
              chmod +x "$STAGE1_BIN"
              BOOTSTRAP_OK=1
            fi
          fi

          if [[ "$BOOTSTRAP_OK" -ne 1 && "${{ runner.os }}" == "Windows" && -f "stage1.exe" ]]; then
            cp stage1.exe "$STAGE1_BIN"
            if [[ -f "legacy/thag_runtime.lib" && ! -f "thag_runtime.lib" ]]; then
              cp legacy/thag_runtime.lib thag_runtime.lib
            fi
            BOOTSTRAP_OK=1
          fi

          if [[ "$BOOTSTRAP_OK" -ne 1 ]]; then
            CMAKE_ARGS=("-DCMAKE_BUILD_TYPE=Release")
            if [[ "${{ runner.os }}" == "Linux" && -n "${LLVM_PATH:-}" ]]; then
              export CC="${LLVM_PATH}/bin/clang"
              export CXX="${LLVM_PATH}/bin/clang++"
            fi

            if [[ "${{ runner.os }}" == "Windows" ]]; then
              LLVM_CMAKE_DIR="$(pwsh -NoProfile -Command "\
                \$roots = @(); \
                if (\$env:LLVM_PATH) { \$roots += \$env:LLVM_PATH }; \
                \$roots += 'C:\\Program Files\\LLVM'; \
                foreach (\$r in \$roots) { \
                  if (Test-Path \$r) { \
                    \$hit = Get-ChildItem -Path \$r -Recurse -Filter LLVMConfig.cmake -ErrorAction SilentlyContinue | Select-Object -First 1; \
                    if (\$hit) { Write-Output \$hit.DirectoryName; break } \
                  } \
                }\
              " | tr -d '\r')"
              if [[ -z "$LLVM_CMAKE_DIR" ]]; then
                echo "ERROR: LLVMConfig.cmake not found on Windows LLVM installation"
                exit 1
              fi
              CMAKE_ARGS+=("-DLLVM_DIR=${LLVM_CMAKE_DIR}")
              CMAKE_ARGS+=("-DCMAKE_PREFIX_PATH=${LLVM_CMAKE_DIR}")
            elif [[ "${{ runner.os }}" == "macOS" && -n "${LLVM_PATH:-}" && -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
              CMAKE_ARGS+=("-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm")
            elif [[ -d "/usr/lib/llvm-21/lib/cmake/llvm" ]]; then
              CMAKE_ARGS+=("-DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm")
            fi

            cmake -S legacy -B legacy/build "${CMAKE_ARGS[@]}"
            cmake --build legacy/build --config Release

            if [[ "${{ runner.os }}" == "Windows" ]]; then
              if [[ -f legacy/build/Release/thag.exe ]]; then
                STAGE0_BIN="legacy/build/Release/thag.exe"
              elif [[ -f legacy/build/thag.exe ]]; then
                STAGE0_BIN="legacy/build/thag.exe"
              else
                echo "ERROR: stage0.exe not found"; exit 1
              fi
            else
              if [[ -f legacy/build/thag ]]; then
                STAGE0_BIN="legacy/build/thag"
              elif [[ -f legacy/build/Release/thag ]]; then
                STAGE0_BIN="legacy/build/Release/thag"
              else
                echo "ERROR: stage0 not found"; exit 1
              fi
            fi

            if [[ "${{ runner.os }}" != "Windows" && -f legacy/build/libthag_runtime.a && ! -f legacy/build/thag_runtime.lib ]]; then
              cp legacy/build/libthag_runtime.a legacy/build/thag_runtime.lib
            fi

            chmod +x "$STAGE0_BIN" || true
            "$STAGE0_BIN" build src/thg.tg -o "$STAGE1_BIN"
          fi

          if [[ ! -f "$STAGE1_BIN" && -f "stage1.exe" ]]; then
            STAGE1_BIN="stage1.exe"
          elif [[ ! -f "$STAGE1_BIN" && -f "stage1" ]]; then
            STAGE1_BIN="stage1"
          fi

          chmod +x "$STAGE1_BIN" || true
          "./$STAGE1_BIN" build src/thg.tg -o "$FINAL_BIN"

          if [[ ! -f "$FINAL_BIN" && -f "thag.exe" ]]; then
            FINAL_BIN="thag.exe"
          elif [[ ! -f "$FINAL_BIN" && -f "thag" ]]; then
            FINAL_BIN="thag"
          elif [[ ! -f "$FINAL_BIN" ]]; then
            echo "WARN: stage2 binary not produced, fallback to stage1 binary"
            FINAL_BIN="$STAGE1_BIN"
          fi

          if [[ "${{ runner.os }}" != "Windows" && ! -f "thag_runtime.lib" ]]; then
            for runtime_candidate in \
              "legacy/build/libthag_runtime.a" \
              "legacy/build/thag_runtime.lib" \
              "legacy/thag_runtime.lib"; do
              if [[ -f "$runtime_candidate" ]]; then
                cp "$runtime_candidate" thag_runtime.lib
                break
              fi
            done
          fi

          echo "FINAL_BIN=$FINAL_BIN" >> "$GITHUB_ENV"

      - name: Test hello + fib
        shell: bash
        run: |
          set -euo pipefail

          FINAL_BIN="${FINAL_BIN:-}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -z "$FINAL_BIN" ]]; then
              FINAL_BIN="thag.exe"
            fi
            HELLO_BIN="hello.exe"
            FIB_BIN="fib.exe"
          else
            if [[ -z "$FINAL_BIN" ]]; then
              FINAL_BIN="thag"
            fi
            HELLO_BIN="hello"
            FIB_BIN="fib"
          fi

          if [[ -n "${FINAL_BIN:-}" && -f "$FINAL_BIN" ]]; then
            :
          elif [[ -f "thag" ]]; then
            FINAL_BIN="thag"
          elif [[ -f "thag.exe" ]]; then
            FINAL_BIN="thag.exe"
          elif [[ -f "stage1" ]]; then
            FINAL_BIN="stage1"
          elif [[ -f "stage1.exe" ]]; then
            FINAL_BIN="stage1.exe"
          else
            echo "ERROR: final compiler binary not found"; exit 1
          fi

          chmod +x "$FINAL_BIN" || true
          "./$FINAL_BIN" build examples/hello.tg -o "$HELLO_BIN"
          "./$FINAL_BIN" build examples/fib.tg -o "$FIB_BIN"
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/bin dist/lib

          FINAL_BIN_NAME="${FINAL_BIN:-}"
          if [[ -z "$FINAL_BIN_NAME" ]]; then
            if [[ -f "thag" ]]; then
              FINAL_BIN_NAME="thag"
            elif [[ -f "thag.exe" ]]; then
              FINAL_BIN_NAME="thag.exe"
            fi
          fi
          if [[ -z "$FINAL_BIN_NAME" ]]; then
            echo "ERROR: final compiler binary not found for packaging"; exit 1
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$FINAL_BIN_NAME" dist/bin/thag.exe
          else
            cp "$FINAL_BIN_NAME" dist/bin/thag
            chmod +x dist/bin/thag
          fi

          if [[ -d std ]]; then
            cp -r std dist/lib/std
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp scripts/install/install-windows.ps1 dist/install.ps1
            7z a thag-windows.zip dist/*
            echo "asset=thag-windows.zip" >> "$GITHUB_OUTPUT"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp scripts/install/install-macos.sh dist/install.sh
            chmod +x dist/install.sh
            tar -czf thag-macos.tar.gz dist
            echo "asset=thag-macos.tar.gz" >> "$GITHUB_OUTPUT"
          else
            cp scripts/install/install-linux.sh dist/install.sh
            chmod +x dist/install.sh
            tar -czf thag-linux.tar.gz dist
            echo "asset=thag-linux.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
