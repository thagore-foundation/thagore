name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no release publish)"
        required: false
        default: "true"

permissions:
  actions: read
  contents: write

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  build-release:
    name: release (${{ matrix.os }})
    needs: discord-notify-init
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stage1_asset: thagore-linux.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux.tar.gz
            stage1_seed_name: thagore-stage1-linux.tar.gz
            stage_trace_file: release-stage-trace-linux.log
          - os: macos-latest
            stage1_asset: thagore-macos.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-macos.tar.gz
            stage1_seed_name: thagore-stage1-macos.tar.gz
            stage_trace_file: release-stage-trace-macos.log
          - os: windows-latest
            stage1_asset: thagore-stage1.exe
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows.tar.gz
            stage1_seed_name: thagore-stage1.exe
            stage_trace_file: release-stage-trace-windows.log
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
      STAGE_TRACE_FILE: ${{ matrix.stage_trace_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          download_runtime_asset() {
            local pattern="$1"
            local dest="$2"
            if gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap; then
              cp "bootstrap/$pattern" "$dest"
              return 0
            fi
            return 1
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out"; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            rm -f s1_probe_fib s1_probe_fib.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" src/thagore.tg s1_probe_s2_rebuild || return 1
            local probe_s2_rebuild
            probe_s2_rebuild="$(resolve_bin "s1_probe_s2_rebuild" "src/thagore.tg" || true)"
            if [[ -z "$probe_s2_rebuild" ]]; then
              probe_s2_rebuild="$probe_s2"
            fi
            [[ -n "$probe_s2_rebuild" && -f "$probe_s2_rebuild" ]] || return 1
            chmod +x "$probe_s2_rebuild" || true
            thg_build "$probe_s2_rebuild" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            thg_build "$probe_s2_rebuild" examples/fib.tg s1_probe_fib || return 1
            local probe_fib
            probe_fib="$(resolve_bin "s1_probe_fib" "examples/fib.tg" || true)"
            [[ -n "$probe_fib" && -f "$probe_fib" ]] || return 1
            return 0
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_ASSET=""
            for ASSET in thagore-stage1.exe; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Windows stage1 asset found in releases."; exit 1)
          else
            STAGE1_ASSET=""
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              for ASSET in thagore-stage1-linux.tar.gz; do
                if download_asset "$ASSET"; then
                  rm -rf bootstrap/extract_stage1 || true
                  mkdir -p bootstrap/extract_stage1
                  tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                  CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                  [[ -n "$CANDIDATE" ]] || continue
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                  chmod +x "${{ matrix.stage1_bin }}" || true
                  STAGE1_ASSET="$ASSET"
                  break
                fi
              done
            else
              for ASSET in thagore-stage1-macos.tar.gz; do
                if download_asset "$ASSET"; then
                  rm -rf bootstrap/extract_stage1 || true
                  mkdir -p bootstrap/extract_stage1
                  tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                  CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                  [[ -n "$CANDIDATE" ]] || continue
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                  chmod +x "${{ matrix.stage1_bin }}" || true
                  STAGE1_ASSET="$ASSET"
                  break
                fi
              done
            fi
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Unix stage1 asset found in releases."; exit 1)
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            download_runtime_asset "thagore-runtime-windows.lib" "thag_runtime.lib" || true
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            if download_runtime_asset "thagore-runtime-linux.a" "libthag_runtime.a"; then
              cp libthag_runtime.a thag_runtime.lib
            fi
          else
            if download_runtime_asset "thagore-runtime-macos.a" "libthag_runtime.a"; then
              cp libthag_runtime.a thag_runtime.lib
            fi
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-release-${{ matrix.os }}.txt"

      - name: Discord update - Download stage1 bootstrap asset
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Download stage1 bootstrap asset

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-release-${{ matrix.os }}.txt"

      - name: Build Stage2 -> Stage2 (mandatory)
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            resolve_local() {
              local preferred="$1"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            echo "CRITICAL: compiler $cc succeeded but produced no artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE"
            return 1
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build "${{ matrix.stage1_bin }}" src/thagore.tg "${{ matrix.stage2_bin }}"
          STAGE2_BIN="$(resolve_bin "${{ matrix.stage2_bin }}" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "${{ matrix.stage2_rebuild_bin }}"
          STAGE2_REBUILD_BIN="$(resolve_bin "${{ matrix.stage2_rebuild_bin }}" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
            echo "[INFO] using in-place rebuilt compiler: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          HELLO_TARGET="${{ matrix.hello_bin }}"
          FIB_TARGET="${{ matrix.fib_bin }}"

          HELLO_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${{ matrix.stage1_bin }}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/hello.tg "$HELLO_TARGET"; then
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
              if [[ -n "$HELLO_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$HELLO_BIN"

          FIB_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${{ matrix.stage1_bin }}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/fib.tg "$FIB_TARGET"; then
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
              if [[ -n "$FIB_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$FIB_BIN"
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "WARN: bootstrap hash mismatch on Windows (non-bit-identical PE output)." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Discord update - Build Stage2 -> Stage2 (mandatory)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Build Stage2 -> Stage2 (mandatory)

      - name: Run hello + fib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Guard no stage0 markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Package release payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$STAGE2_REBUILD_BIN" "dist/bin/${{ matrix.output_bin }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            cp "dist/bin/${{ matrix.output_bin }}" dist/bin/thag
          fi
          cp -R std "dist/lib/std"
          [[ -f "bootstrap/${{ matrix.stage1_seed_name }}" ]] || (echo "CRITICAL: missing bootstrap seed asset bootstrap/${{ matrix.stage1_seed_name }}"; exit 1)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 200000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            cp "bootstrap/${{ matrix.stage1_seed_name }}" "${{ matrix.stage1_seed_name }}"
            tar -tzf "${{ matrix.stage1_seed_name }}" | grep -Eq "thagore|thag"
            bytes_stage1="$(wc -c < "${{ matrix.stage1_seed_name }}")"
            if [[ "$bytes_stage1" -lt 20000 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} too small ($bytes_stage1 bytes)."
              exit 1
            fi
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi
          bytes_pkg="$(wc -c < "${{ matrix.package_name }}")"
          if [[ "$bytes_pkg" -lt 2000 ]]; then
            echo "CRITICAL: ${{ matrix.package_name }} too small ($bytes_pkg bytes)."
            exit 1
          fi

      - name: Discord update - Package release payload
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Package release payload

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}
            runtime-abi-summary-release-${{ matrix.os }}.txt
            runtime-abi-inventory-release-${{ matrix.os }}.txt

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, build-release]
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/thagore-linux.tar.gz
            artifacts/**/thagore-macos.tar.gz
            artifacts/**/thagore-windows.tar.gz
            artifacts/**/thagore-stage1-linux.tar.gz
            artifacts/**/thagore-stage1-macos.tar.gz
            artifacts/**/thagore-stage1.exe
            artifacts/**/release-stage-trace-*.log

      - name: Discord update - Publish GitHub Release Assets
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish GitHub Release Assets

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build-release, publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
