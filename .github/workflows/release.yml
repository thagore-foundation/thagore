name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.2"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-core:
    name: build-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-14
            platform: macos
            arch: x86_64
            optional: true
          - runner: macos-14
            platform: macos
            arch: aarch64
          - runner: windows-latest
            platform: windows
            arch: x86_64
            optional: true
          - runner: windows-11-arm
            platform: windows
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev
          echo "LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@21 ninja cmake
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          $llvmAsset = "clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          if ("${{ matrix.arch }}" -eq "aarch64") {
            $llvmAsset = "clang+llvm-21.1.8-aarch64-pc-windows-msvc.tar.xz"
          }
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/$llvmAsset"
          $archivePath = Join-Path $env:RUNNER_TEMP "llvm.tar.xz"
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm21"
          if (Test-Path $extractRoot) {
            Remove-Item -Recurse -Force $extractRoot
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          Invoke-WebRequest -Uri $llvmUrl -OutFile $archivePath
          tar -xf $archivePath -C $extractRoot
          $llvmRootDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
          if (-not $llvmRootDir) {
            throw "failed to extract LLVM archive: $llvmAsset"
          }
          $llvmRoot = $llvmRootDir.FullName
          "PATH=$llvmRoot\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $clang = Join-Path $llvmRoot "bin\clang.exe"
          $clangxx = Join-Path $llvmRoot "bin\clang++.exe"
          if (Test-Path $clang) {
            "CC=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (Test-Path $clangxx) {
            "CXX=$clangxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "LLVM_DIR=$llvmRoot\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Visual Studio DIA path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsRoot = "C:\Program Files\Microsoft Visual Studio\2022"
          $communityDir = Join-Path $vsRoot "Community"
          if (-not (Test-Path $communityDir)) {
            $candidate = @("Enterprise", "Professional", "BuildTools") `
              | ForEach-Object { Join-Path $vsRoot $_ } `
              | Where-Object { Test-Path $_ } `
              | Select-Object -First 1
            if ($candidate) {
              New-Item -ItemType Junction -Path $communityDir -Target $candidate -Force | Out-Null
            }
          }

          $legacyDiaLibDir = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK\lib\amd64"
          $legacyDiaLib = Join-Path $legacyDiaLibDir "diaguids.lib"
          if (-not (Test-Path $legacyDiaLib)) {
            $diaCandidates = @(
              "C:\Program Files\Microsoft Visual Studio\2022\Community\DIA SDK\lib\amd64\diaguids.lib",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK\lib\amd64\diaguids.lib",
              "C:\Program Files\Microsoft Visual Studio\2022\Professional\DIA SDK\lib\amd64\diaguids.lib",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\DIA SDK\lib\amd64\diaguids.lib"
            )
            $diaSource = $diaCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($diaSource) {
              New-Item -ItemType Directory -Path $legacyDiaLibDir -Force | Out-Null
              Copy-Item -Path $diaSource -Destination $legacyDiaLib -Force
            }
          }

      - name: Configure + build (non-Windows)
        if: runner.os != 'Windows'
        run: |
          JOBS="$(python3 - <<'PY'
          import os
          print(max(2, os.cpu_count() or 2))
          PY
          )"
          EXTRA_CMAKE_ARGS=()
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "x86_64" ]]; then
            EXTRA_CMAKE_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DLLVM_DIR="${LLVM_DIR}" \
            "${EXTRA_CMAKE_ARGS[@]}"
          cmake --build build -j"${JOBS}"

      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArgs = @("-S", ".", "-B", "build", "-G", "Ninja", "-DLLVM_DIR=$env:LLVM_DIR")
          if ($env:CC) { $cmakeArgs += "-DCMAKE_C_COMPILER=$env:CC" }
          if ($env:CXX) { $cmakeArgs += "-DCMAKE_CXX_COMPILER=$env:CXX" }
          if ("${{ matrix.arch }}" -eq "aarch64") {
            $cmakeArgs += "-DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc"
            $cmakeArgs += "-DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc"
          }
          cmake @cmakeArgs
          cmake --build build -j 4

      - name: Code sign thagc (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CODESIGN_CERT_BASE64 != '' && env.WINDOWS_CODESIGN_CERT_PASSWORD != ''
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "thagore-codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          signtool sign `
            /f $pfxPath `
            /p $env:WINDOWS_CODESIGN_CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            "build/compiler/thagc.exe"
          Remove-Item -Force $pfxPath

      - name: Package core archive
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="build/compiler/thagc"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN_PATH="build/compiler/thagc.exe"
          fi
          OUT="dist/thagc-core-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          python3 tooling/packaging/pack_core.py \
            --bin "${BIN_PATH}" \
            --mode "${{ matrix.platform }}" \
            --bundle-deps \
            --out "${OUT}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/thagc-core-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build-core
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist

      - name: Prepare installer + checksums
        shell: bash
        run: |
          cp tooling/release/thagup-init.sh dist/thagup-init.sh
          cp tooling/release/thagup.sh dist/thagup.sh
          cp tooling/release/thagup.ps1 dist/thagup.ps1
          chmod +x dist/thagup-init.sh
          chmod +x dist/thagup.sh
          python3 tooling/packaging/make_checksums.py \
            --out dist/SHA256SUMS-thagc.txt \
            dist/thagup-init.sh \
            dist/thagup.sh \
            dist/thagup.ps1 \
            dist/thagc-core-*.tar.gz
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          ASSETS=(dist/thagup-init.sh dist/thagup.sh dist/thagup.ps1 dist/SHA256SUMS-thagc.txt dist/thagc-core-*.tar.gz)
          gh release create "${RELEASE_TAG}" \
            --title "Thagore ${RELEASE_TAG}" \
            --notes "Multi-platform core release with Linux/macOS/Windows artifacts for x86_64 + aarch64." \
            --latest \
            "${ASSETS[@]}" \
            || {
              gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
              gh release edit "${RELEASE_TAG}" --title "Thagore ${RELEASE_TAG}" --latest
            }

  sync-landing:
    name: sync-landing
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read
    env:
      LANDING_SYNC_TOKEN: ${{ secrets.LANDING_SYNC_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Ensure sync token is configured
        shell: bash
        run: |
          if [[ -z "${LANDING_SYNC_TOKEN}" ]]; then
            echo "LANDING_SYNC_TOKEN is not configured; skipping landing sync."
            exit 0
          fi

      - name: Download release installer assets
        if: env.LANDING_SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" -R thagore-foundation/thagore \
            -D release-assets \
            -p thagup-init.sh \
            -p thagup.sh \
            -p thagup.ps1 \
            -p SHA256SUMS-thagc.txt
          ls -lh release-assets

      - name: Checkout landing repository
        if: env.LANDING_SYNC_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: thagore-foundation/landing
          token: ${{ secrets.LANDING_SYNC_TOKEN }}
          path: landing

      - name: Sync installer scripts to landing
        if: env.LANDING_SYNC_TOKEN != ''
        shell: bash
        run: |
          cp release-assets/thagup-init.sh landing/thagup-init.sh
          cp release-assets/thagup.sh landing/thagup.sh
          cp release-assets/thagup.ps1 landing/thagup.ps1
          cp release-assets/SHA256SUMS-thagc.txt landing/SHA256SUMS-thagc.txt

      - name: Commit + push landing sync
        if: env.LANDING_SYNC_TOKEN != ''
        shell: bash
        run: |
          cd landing
          if git diff --quiet; then
            echo "No landing changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thagup-init.sh thagup.sh thagup.ps1 SHA256SUMS-thagc.txt
          git commit -m "chore(release): sync installer scripts for ${RELEASE_TAG}"
          git push
