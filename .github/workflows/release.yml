name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stage1_asset: thagore-linux.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-linux.tar.gz
            stage1_seed_name: thagore-stage1-linux.tar.gz
          - os: macos-latest
            stage1_asset: thagore-macos.tar.gz
            stage1_bin: stage1
            output_bin: thagore
            stage2_bin: stage2
            stage2_rebuild_bin: stage2_rebuild
            hello_bin: hello_release
            fib_bin: fib_release
            package_name: thagore-macos.tar.gz
            stage1_seed_name: thagore-stage1-macos.tar.gz
          - os: windows-latest
            stage1_asset: thagore-stage1.exe
            stage1_bin: stage1.exe
            output_bin: thagore.exe
            stage2_bin: stage2.exe
            stage2_rebuild_bin: stage2_rebuild.exe
            hello_bin: hello_release.exe
            fib_bin: fib_release.exe
            package_name: thagore-windows.tar.gz
            stage1_seed_name: thagore-stage1.exe
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.20-foundation"
      BOOTSTRAP_STAGE1_TAG_FALLBACKS: "v0.3.19-foundation,v0.3.14-foundation,v0.3.13-foundation,v0.3.12-foundation,v0.3.8-foundation,v0.3.7-foundation,v0.3.6-foundation,v0.3.5-foundation,v0.3.4-foundation,v0.3.3-foundation,v0.3.2-foundation,v0.3.0-installer,v0.2.6-foundation,v0.2.5-foundation"
      STAGE_TRACE_FILE: release-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm --version=21.1.8 --no-progress -y
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download stage1 bootstrap asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          if [[ ! -f thag_runtime.lib && ! -f libthag_runtime.a ]]; then
            mkdir -p runtime/build
            clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
              cp runtime/build/thag_runtime.lib thag_runtime.lib
            else
              ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
              cp runtime/build/libthag_runtime.a libthag_runtime.a
              cp runtime/build/libthag_runtime.a thag_runtime.lib
            fi
          fi
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            if [[ -n "$BOOTSTRAP_STAGE1_TAG" ]]; then
              if gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap; then
                return 0
              fi
            fi
            IFS=',' read -r -a fallback_tags <<< "${BOOTSTRAP_STAGE1_TAG_FALLBACKS:-}"
            for tag in "${fallback_tags[@]}"; do
              tag="$(echo "$tag" | xargs)"
              if [[ -z "$tag" || "$tag" == "$BOOTSTRAP_STAGE1_TAG" ]]; then
                continue
              fi
              if gh release download "$tag" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap; then
                return 0
              fi
            done
            gh release download --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out" >/dev/null 2>&1; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" >/dev/null 2>&1 || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            return 0
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_ASSET=""
            for ASSET in thagore-stage1.exe thagore.exe thag.exe; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "${{ matrix.stage1_bin }}"
                chmod +x "${{ matrix.stage1_bin }}" || true
                if probe_stage1_chain "${{ matrix.stage1_bin }}"; then
                  STAGE1_ASSET="$ASSET"
                  break
                fi
                echo "Rejecting bootstrap asset $ASSET: probe failed"
                rm -f "${{ matrix.stage1_bin }}"
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Windows stage1 asset found in releases."; exit 1)
          else
            STAGE1_ASSET=""
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              for ASSET in thagore-linux.tar.gz thagore-stage1-linux.tar.gz thag-linux.tar.gz; do
                if download_asset "$ASSET"; then
                  rm -rf bootstrap/extract_stage1 || true
                  mkdir -p bootstrap/extract_stage1
                  tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                  CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                  [[ -n "$CANDIDATE" ]] || continue
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                  chmod +x "${{ matrix.stage1_bin }}" || true
                  if probe_stage1_chain "${{ matrix.stage1_bin }}"; then
                    STAGE1_ASSET="$ASSET"
                    break
                  fi
                  echo "Rejecting bootstrap asset $ASSET: probe failed"
                  rm -f "${{ matrix.stage1_bin }}"
                fi
              done
            else
              for ASSET in thagore-macos.tar.gz thagore-stage1-macos.tar.gz thag-macos.tar.gz; do
                if download_asset "$ASSET"; then
                  rm -rf bootstrap/extract_stage1 || true
                  mkdir -p bootstrap/extract_stage1
                  tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                  CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                  [[ -n "$CANDIDATE" ]] || continue
                  cp "$CANDIDATE" "${{ matrix.stage1_bin }}"
                  chmod +x "${{ matrix.stage1_bin }}" || true
                  if probe_stage1_chain "${{ matrix.stage1_bin }}"; then
                    STAGE1_ASSET="$ASSET"
                    break
                  fi
                  echo "Rejecting bootstrap asset $ASSET: probe failed"
                  rm -f "${{ matrix.stage1_bin }}"
                fi
              done
            fi
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Unix stage1 asset found in releases."; exit 1)
          fi
          chmod +x "${{ matrix.stage1_bin }}" || true

      - name: Build runtime artifact from runtime module
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Build Stage2 -> Stage2 (mandatory)
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local base
            base="$(basename "$src" .tg)"
            resolve_local() {
              local preferred="$1"
              local src_base="$2"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$src_base" "$src_base.exe" "examples/$src_base" "examples/$src_base.exe" "src/$src_base" "src/$src_base.exe" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" "$base" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" "$base" || true)"
            [[ -n "$got" ]]
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build "${{ matrix.stage1_bin }}" src/thagore.tg "${{ matrix.stage2_bin }}"
          STAGE2_BIN="$(resolve_bin "${{ matrix.stage2_bin }}" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "${{ matrix.stage2_rebuild_bin }}"
          STAGE2_REBUILD_BIN="$(resolve_bin "${{ matrix.stage2_rebuild_bin }}" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg "${{ matrix.hello_bin }}"
          HELLO_BIN="$(resolve_bin "${{ matrix.hello_bin }}" "examples/hello.tg")"
          test -f "$HELLO_BIN"

          thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg "${{ matrix.fib_bin }}"
          FIB_BIN="$(resolve_bin "${{ matrix.fib_bin }}" "examples/fib.tg")"
          test -f "$FIB_BIN"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Run hello + fib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Guard no stage0 markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden fallback markers detected"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Package release payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/lib
          cp "$STAGE2_REBUILD_BIN" "dist/bin/${{ matrix.output_bin }}"
          cp -R std "dist/lib/std"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "${{ matrix.stage2_rebuild_bin }}" "${{ matrix.stage1_seed_name }}"
            tar -czf "${{ matrix.package_name }}" -C dist .
          else
            tar -czf "${{ matrix.stage1_seed_name }}" -C dist/bin "${{ matrix.output_bin }}"
            tar -czf "${{ matrix.package_name }}" -C dist .
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.stage1_seed_name }}
            ${{ env.STAGE_TRACE_FILE }}

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/thagore-linux.tar.gz
            artifacts/**/thagore-macos.tar.gz
            artifacts/**/thagore-windows.tar.gz
            artifacts/**/thagore-stage1-linux.tar.gz
            artifacts/**/thagore-stage1-macos.tar.gz
            artifacts/**/thagore-stage1.exe
            artifacts/**/release-stage-trace.log
