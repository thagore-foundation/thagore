name: Bootstrap Probe

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/bootstrap-probe.yml"
      - "bootstrap/selfhost/frontend/**"
      - "tests/bootstrap_probe/**"
      - "tests/bootstrap_seed/**"
      - "tests/selfhost_frontend/**"
      - "stdlib/**"
      - "crates/**"
      - "tools/thagore-cli/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  selfhost_frontend_stage:
    name: Selfhost frontend stage (temporarily skipped)
    runs-on: ubuntu-latest
    steps:
      - name: Skip selfhost frontend stage while stabilizing
        run: echo "selfhost frontend stage temporarily disabled on linux; tracking in issue"

  probe:
    name: Bootstrap probe (temporarily skipped)
    runs-on: windows-latest
    steps:
      - name: Skip bootstrap probe while stabilizing
        run: echo "bootstrap probe temporarily disabled; tracking in issue"
