name: Core Seed Rebuild

# Rebuilds stage1 as a standalone thagc binary from libthag_runtime.a.
# Produces binaries that run on GLIBC >= 2.17 (Ubuntu 14.04+, Debian 8+).
# Ships as thagc — no wrapper, no helper subprocess, like rustc.
#
# Trigger manually or when bootstrap/ sources change.

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Tag to publish rebuilt seed under (e.g. v0.3.194-stage1-seed)"
        required: true
        default: "v0.3.194-stage1-seed"
  push:
    paths:
      - "bootstrap/thagc_main.cpp"
      - "bootstrap/thagc_main.c"
      - "bootstrap/glibc_compat.c"
      - ".github/workflows/core-seed-rebuild.yml"

concurrency:
  group: core-seed-rebuild-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  LLVM_FULL_VERSION: "21.1.8"

jobs:
  build-seed:
    name: build-seed-${{ matrix.os_slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64: manylinux2014 container (GLIBC 2.17) via ubuntu-latest
          # -static-libstdc++ -static-libgcc → binary needs only libc.so (GLIBC 2.17+)
          - runner: ubuntu-latest
            os_slug: linux
            triple: x86_64-unknown-linux-gnu
            artifact: thagore-stage1-linux.tar.gz
            runtime_asset: thagore-runtime-linux.a
          # macOS arm64
          - runner: macos-latest
            os_slug: macos
            triple: aarch64-apple-darwin
            artifact: thagore-stage1-macos.tar.gz
            runtime_asset: thagore-runtime-macos.a
          # Windows x86_64
          - runner: windows-latest
            os_slug: windows
            triple: x86_64-pc-windows-msvc
            artifact: thagore-stage1-windows-x86_64.exe
            runtime_asset: thagore-runtime-windows-x86_64.lib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Linux: install LLVM 21 + static libstdc++ ─────────────────────────
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME:-noble}}")
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y clang-21 lld-21 llvm-21
          # Get static libstdc++ — any available version works for -static-libstdc++
          sudo apt-get install -y libstdc++-12-dev 2>/dev/null || \
            sudo apt-get install -y libstdc++-11-dev 2>/dev/null || \
            sudo apt-get install -y libstdc++-10-dev 2>/dev/null || true
          echo "CXX=clang++-21" >> $GITHUB_ENV
          echo "CC=clang-21"    >> $GITHUB_ENV
          echo "=== static libstdc++ ==="
          find /usr/lib/gcc -name "libstdc++.a" 2>/dev/null | head -3

      # ── macOS: use system clang++ (libc++) to match libthag_runtime.a ABI ──
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # libthag_runtime.a for macOS was built with Apple clang (libc++ ABI).
          # Use system clang++ to match the ABI — not brew LLVM which may differ.
          echo "CXX=$(xcrun -f clang++)" >> $GITHUB_ENV
          echo "CC=$(xcrun -f clang)"    >> $GITHUB_ENV
          xcrun clang++ --version

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=21.1.8 -y --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          clang --version

      # ── Download current seed runtime (libthag_runtime.a) ─────────────────
      - name: Download seed runtime library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Try the existing seed tag to get runtime library for this lane
          mkdir -p bootstrap/seed
          RUNTIME_ASSET="${{ matrix.runtime_asset }}"
          # Download from the current stable seed
          gh release download v0.3.193-stage1-seed \
            --repo thagore-foundation/thagore \
            --pattern "$RUNTIME_ASSET" \
            -D bootstrap/seed || true
          if [[ -f "bootstrap/seed/$RUNTIME_ASSET" ]]; then
            cp "bootstrap/seed/$RUNTIME_ASSET" .
            echo "Downloaded runtime: $RUNTIME_ASSET ($(du -sh "$RUNTIME_ASSET" | cut -f1))"
          else
            echo "[FAIL] Missing runtime asset: $RUNTIME_ASSET"
            exit 1
          fi
          ls -lh "$RUNTIME_ASSET"

      # ── Build standalone thagc binary ─────────────────────────────────────
      - name: Build standalone thagc (Linux)
        if: runner.os == 'Linux'
        run: |
          # Compile glibc compat shim to an object file.
          # By linking the .o BEFORE libthag_runtime.a, the linker resolves
          # __isoc23_strtol from our definition (backed by strtol) instead of
          # looking it up in libc (which requires GLIBC 2.38).
          $CC -c bootstrap/glibc_compat.c -o /tmp/glibc_compat.o -O2

          # Locate static libstdc++ (needed for -static-libstdc++)
          STDCXX_A=$(find /usr/lib/gcc -name "libstdc++.a" 2>/dev/null | head -1)
          echo "Using static libstdc++: $STDCXX_A"
          STDCXX_DIR=$(dirname "$STDCXX_A")

          # Link: compat.o + thagc_main.cpp + libthag_runtime.a
          # Object file order: compat.o MUST come BEFORE libthag_runtime.a
          # -static-libstdc++ -static-libgcc: embed C++ runtime, no .so deps
          $CXX bootstrap/thagc_main.cpp \
            /tmp/glibc_compat.o \
            -o thagc_stage1 \
            ./thagore-runtime-linux.a \
            -static-libstdc++ -static-libgcc \
            -L"$STDCXX_DIR" \
            -lpthread -ldl -lm \
            -O2 -DNDEBUG
          chmod +x thagc_stage1

          # Verify: GLIBC requirements — should show max GLIBC_2.17 or lower
          echo "=== GLIBC/GLIBCXX requirements ==="
          objdump -p thagc_stage1 | grep "GLIBC_\|GLIBCXX_" || true
          echo "=== Dynamic deps ==="
          ldd thagc_stage1 || true
          echo "=== Binary size ==="
          ls -lh thagc_stage1
          echo "=== Version check ==="
          ./thagc_stage1 --version 2>&1 || true

      - name: Build standalone thagc (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS: use system SDK headers + explicit libc++ link
          SDK=$(xcrun --show-sdk-path)
          $CXX bootstrap/thagc_main.cpp \
            -isysroot "$SDK" \
            -o thagc_stage1 \
            -Wl,-force_load,./thagore-runtime-macos.a \
            -lc++ -lc++abi \
            -lpthread \
            -O2 -DNDEBUG
          chmod +x thagc_stage1
          echo "=== Binary size ==="
          ls -lh thagc_stage1
          echo "=== Version check ==="
          ./thagc_stage1 --version 2>&1 || true

      - name: Build standalone thagc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang bootstrap\thagc_main.c `
            .\thagore-runtime-windows-x86_64.lib `
            -O2 -DNDEBUG `
            -o thagc_stage1.exe
          if (-not (Test-Path thagc_stage1.exe)) { throw "thagc_stage1.exe not produced" }
          Get-Item thagc_stage1.exe | Format-Table -AutoSize
          .\thagc_stage1.exe --version 2>&1 | Out-String | Write-Host

      # ── Smoke test: build hello.tg with the new binary ────────────────────
      - name: Smoke test new thagc
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== smoke: hello.tg ==="
          cp "./${{ matrix.runtime_asset }}" ./thag_runtime.lib
          ./thagc_stage1 build examples/hello.tg -o ./smoke_hello 2>&1
          HBIN=./smoke_hello; [[ -f ./smoke_hello.exe ]] && HBIN=./smoke_hello.exe
          [[ -f "$HBIN" ]] || { echo "SMOKE FAIL: no output binary produced for hello.tg"; exit 1; }
          HOUT="$("$HBIN" 2>&1)"
          echo "Output: $HOUT"
          [[ "$HOUT" == *"Hello"* ]] || { echo "SMOKE FAIL: unexpected hello output"; exit 1; }
          echo "=== fib.tg (compile only) ==="
          ./thagc_stage1 build examples/fib.tg -o ./smoke_fib 2>&1

      - name: Smoke test new thagc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item .\thagore-runtime-windows-x86_64.lib .\thag_runtime.lib -Force
          .\thagc_stage1.exe build examples\hello.tg -o smoke_hello.exe
          if (-not (Test-Path smoke_hello.exe)) { throw "SMOKE FAIL: hello output binary missing" }
          $hout = (& .\smoke_hello.exe 2>&1 | Out-String).Trim()
          Write-Host "Output: $hout"
          if ($hout -notmatch "Hello") { throw "SMOKE FAIL: unexpected hello output" }
          .\thagc_stage1.exe build examples\fib.tg -o smoke_fib.exe
          if (-not (Test-Path smoke_fib.exe)) { throw "SMOKE FAIL: fib output binary missing" }

      # ── Package as seed artifacts ─────────────────────────────────────────
      - name: Package seed artifacts
        shell: bash
        run: |
          SLUG="${{ matrix.os_slug }}"
          mkdir -p dist/seed

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp thagc_stage1.exe "dist/seed/${{ matrix.artifact }}"
            cp thagore-runtime-windows-x86_64.lib "dist/seed/thagore-runtime-windows-x86_64.lib"
          else
            # Pack: stage1 tarball (same format as existing seed tarballs)
            mkdir -p seed_pack/bin
            cp thagc_stage1 seed_pack/bin/stage1
            cp thagc_stage1 seed_pack/bin/thagore
            cp thagc_stage1 seed_pack/bin/thag
            cp thagc_stage1 seed_pack/bin/thagc
            tar -czf "dist/seed/${{ matrix.artifact }}" -C seed_pack .
            cp "${{ matrix.runtime_asset }}" "dist/seed/thagore-runtime-${SLUG}.a"
          fi

          echo "=== Packaged ==="
          ls -lh dist/seed/

      - name: Upload seed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.os_slug }}
          path: |
            dist/seed/

  # ── Publish new seed release ───────────────────────────────────────────────
  publish-seed:
    name: publish-seed
    needs: build-seed
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all seed artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-seed-artifacts

      - name: Publish seed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_tag }}"
          echo "Publishing seed release: $TAG"

          # Collect all files
          ASSETS=()
          while IFS= read -r -d '' f; do
            ASSETS+=("$f")
          done < <(find all-seed-artifacts -type f \
            \( -name "*.tar.gz" -o -name "*.a" -o -name "*.lib" -o -name "*.exe" \) \
            -print0 | sort -z)

          echo "Assets to upload:"
          for a in "${ASSETS[@]}"; do echo "  $a"; done

          # Create release
          ASSET_FLAGS=()
          for a in "${ASSETS[@]}"; do
            ASSET_FLAGS+=("$a")
          done

          gh release create "$TAG" \
            --title "Stage1 Seed $TAG (standalone, GLIBC 2.17+)" \
            --notes "Rebuilt stage1 seed — standalone binary, no wrapper/helper needed. Requires GLIBC >= 2.17 (Ubuntu 14.04+). Built with static libstdc++ / static libgcc." \
            --prerelease \
            "${ASSET_FLAGS[@]}" || \
          gh release upload "$TAG" "${ASSET_FLAGS[@]}" --clobber
