name: Desktop App Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-desktop-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev libsqlite3-dev

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@21 ninja cmake libffi libxml2 zlib curl
          echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y llvm --version=21.1.3
          if ($LASTEXITCODE -ne 0) {
            choco install -y llvm
          }
          choco install -y ninja
          $roots = @(
            "C:\Program Files\LLVM",
            "C:\ProgramData\chocolatey\lib\llvm\tools\llvm"
          )
          $llvmRoot = $null
          foreach ($candidate in $roots) {
            if (Test-Path "$candidate\include\llvm\IR\BasicBlock.h") {
              $llvmRoot = $candidate
              break
            }
          }
          if (-not $llvmRoot) {
            throw "LLVM headers not found after installation"
          }
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$($llvmRoot -replace '\\','/')/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Linux/macOS
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          else
            LLVM_PREFIX="$(brew --prefix llvm@21)"
            cmake -S . -B build -G Ninja \
              -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          fi

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DLLVM_INCLUDE_DIRS="$env:LLVM_ROOT/include" `
            -DLLVM_LIBRARY_DIRS="$env:LLVM_ROOT/lib"

      - name: Build compiler
        if: runner.os != 'Windows'
        run: cmake --build build -j

      - name: Build compiler (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: cmake --build build --config Release -j

      - name: Build desktop drawing app example
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          build/compiler/thagc build examples/v1_6_drawing_app.tg -o dist/drawing-app-${{ runner.os }}

      - name: Build desktop drawing app example (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          build/compiler/thagc.exe build examples/v1_6_drawing_app.tg -o dist/drawing-app-windows.exe
