name: Release End-User Verify

on:
  release:
    types: [published]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default: latest release)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: release-enduser-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "120"

  syntax-gate:
    name: syntax-gate
    runs-on: ubuntu-latest
    needs: [discord-notify-init]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows with actionlint
        uses: devops-actions/actionlint@v0.1.10
        with:
          shellcheck_opts: -S error

      - name: Parse release workflows as YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('.github/workflows/release.yml').read_text(encoding='utf-8')); yaml.safe_load(pathlib.Path('.github/workflows/release-enduser-verify.yml').read_text(encoding='utf-8')); print('YAML_PARSE_OK')"

      - name: Verify release workflow contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  release:$' .github/workflows/release.yml
          grep -q '^  official-tag-gate:$' .github/workflows/release.yml
          grep -q '^  public-release:$' .github/workflows/release.yml
          grep -q 'SHA256SUMS-\*\.txt' .github/workflows/release.yml

      - name: Validate installer shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install/install.sh

      - name: Discord update - Syntax and workflow gate
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: End-user verify syntax gate

  linux-enduser-smoke:
    name: linux-enduser-smoke
    runs-on: ubuntu-latest
    needs: [discord-notify-init, syntax-gate]
    env:
      SKIP_LINUX_SMOKE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(python3 -c "import json, urllib.request; print(json.load(urllib.request.urlopen('https://api.github.com/repos/${{ github.repository }}/releases/latest'))['tag_name'])")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Discord update - Resolve Linux release tag
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Linux smoke resolved release tag

      - name: Download and verify Linux release payload
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET="thagore-linux-x86_64.tar.gz"
          SUMS="SHA256SUMS-linux-x86_64.txt"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          PAYLOAD_DIR="$RUNNER_TEMP/release-payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          if ! curl -fsSL "$BASE/$ASSET" -o "$ASSET"; then
            echo "No Linux payload for tag $TAG, skip linux-enduser-smoke."
            echo "SKIP_LINUX_SMOKE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! curl -fsSL "$BASE/$SUMS" -o "$SUMS"; then
            echo "No Linux checksum file for tag $TAG, skip linux-enduser-smoke."
            echo "SKIP_LINUX_SMOKE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          EXPECTED="$(awk -v target="$ASSET" '$2 == target {print $1; exit}' "$SUMS")"
          [[ -n "$EXPECTED" ]] || (echo "Missing checksum for $ASSET in $SUMS"; exit 1)
          ACTUAL="$(sha256sum "$ASSET" | awk '{print $1}')"
          [[ "${ACTUAL,,}" == "${EXPECTED,,}" ]] || (echo "Checksum mismatch for $ASSET"; exit 1)
          tar -xzf "$ASSET" -C "$PAYLOAD_DIR"
          [[ -x "$PAYLOAD_DIR/bin/thagore" ]] || (echo "Missing executable bin/thagore"; exit 1)
          [[ -d "$PAYLOAD_DIR/lib/std" ]] || (echo "Missing stdlib lib/std"; exit 1)
          [[ -f "$PAYLOAD_DIR/lib/runtime.a" || -f "$PAYLOAD_DIR/lib/runtime.lib" ]] || (echo "Missing runtime lib"; exit 1)

      - name: Discord update - Verify Linux payload checksum and layout
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Linux payload checksum and layout verified

      - name: Smoke test install.sh and CLI
        if: env.SKIP_LINUX_SMOKE != '1'
        shell: bash
        run: |
          set -euo pipefail
          export THAGORE_ROOT="$RUNNER_TEMP/release-payload"
          bash scripts/install/install.sh --mode linux --skip-llvm --yes --prefix "$RUNNER_TEMP/thagore-user"
          "$HOME/.local/bin/thagore" --version
          "$HOME/.local/bin/thagore" --help

      - name: Run Linux CLI command suite (syntax + commands)
        if: env.SKIP_LINUX_SMOKE != '1'
        shell: bash
        run: |
          set -euo pipefail
          THAG="$HOME/.local/bin/thagore"
          VERSION_OUT="$("$THAG" --version 2>&1 || true)"
          HELP_OUT="$("$THAG" --help 2>&1 || true)"
          BUILD_USAGE_OUT="$("$THAG" build 2>&1 || true)"
          TEST_LIST_OUT="$("$THAG" test --list --workspace 2>&1 || true)"
          FIX_DOCTOR_OUT="$("$THAG" fix doctor examples/hello.tg --json 2>&1 || true)"
          UPDATE_CHECK_OUT="$("$THAG" update check 2>&1 || true)"

          printf '%s\n' "$VERSION_OUT" > linux-cli-version.txt
          printf '%s\n' "$HELP_OUT" > linux-cli-help.txt
          printf '%s\n' "$BUILD_USAGE_OUT" > linux-cli-build.txt
          printf '%s\n' "$TEST_LIST_OUT" > linux-cli-test-list.txt
          printf '%s\n' "$FIX_DOCTOR_OUT" > linux-cli-fix-doctor.txt
          printf '%s\n' "$UPDATE_CHECK_OUT" > linux-cli-update-check.txt

          for file in linux-cli-version.txt linux-cli-help.txt linux-cli-build.txt linux-cli-test-list.txt linux-cli-fix-doctor.txt linux-cli-update-check.txt; do
            if [[ ! -s "$file" ]]; then
              echo "Missing CLI output in $file"
              exit 1
            fi
          done

          MERGED_OUT="$VERSION_OUT"$'\n'"$HELP_OUT"$'\n'"$BUILD_USAGE_OUT"$'\n'"$TEST_LIST_OUT"$'\n'"$FIX_DOCTOR_OUT"$'\n'"$UPDATE_CHECK_OUT"
          if grep -Eqi "cannot read source file:\s*update|Unknown update mode 'update'|Empty file or file not found|Usage:\s*thg\.exe" <<<"$MERGED_OUT"; then
            echo "CRITICAL: CLI suite detected legacy/wrapper markers."
            exit 1
          fi

      - name: Discord update - Linux CLI command suite
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Linux CLI command suite complete

      - name: Discord update - Linux install and CLI smoke
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Linux install and CLI smoke complete

  windows-enduser-smoke:
    name: windows-enduser-smoke
    runs-on: windows-latest
    needs: [discord-notify-init, syntax-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag }}"
          if ("${{ github.event_name }}" -eq "release") {
              $tag = "${{ github.event.release.tag_name }}"
          } elseif (-not [string]::IsNullOrWhiteSpace($inputTag)) {
              $tag = $inputTag
          } else {
              $latest = Invoke-RestMethod -Headers @{ "User-Agent" = "thagore-release-verify" } -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Method Get
              $tag = "$($latest.tag_name)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Discord update - Resolve Windows release tag
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Windows smoke resolved release tag

      - name: Download and verify Windows release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.tag.outputs.tag }}"
          $asset = "thagore-windows-x86_64.tar.gz"
          $sums = "SHA256SUMS-windows-x86_64.txt"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $asset
          Invoke-WebRequest -Uri "$base/$sums" -OutFile $sums

          $expected = $null
          foreach ($line in Get-Content $sums) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split '\s+', 2
              if ($parts.Count -lt 2) { continue }
              $entryName = $parts[1].Trim()
              if ($entryName.StartsWith("*")) {
                  $entryName = $entryName.Substring(1)
              }
              if ($entryName -eq $asset) {
                  $expected = $parts[0].Trim()
                  break
              }
          }
          if ([string]::IsNullOrWhiteSpace($expected)) {
              throw "Missing checksum for $asset in $sums"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash
          if ($actual.ToUpperInvariant() -ne $expected.ToUpperInvariant()) {
              throw "Checksum mismatch for $asset"
          }

          $extract = Join-Path $env:RUNNER_TEMP "thagore-release"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $asset -C $extract
          if (-not (Test-Path (Join-Path $extract "bin\\thagore.exe"))) { throw "Missing bin\\thagore.exe" }
          if (-not (Test-Path (Join-Path $extract "bin\\stage1.exe"))) { throw "Missing bin\\stage1.exe" }
          if (-not (Test-Path (Join-Path $extract "lib\\std"))) { throw "Missing lib\\std" }
          if (-not (Test-Path (Join-Path $extract "lib\\runtime.lib"))) { throw "Missing lib\\runtime.lib" }

      - name: Discord update - Verify Windows payload checksum and layout
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Windows payload checksum and layout verified

      - name: Smoke test updater and CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $extract = Join-Path $env:RUNNER_TEMP "thagore-release"
          $env:THAGORE_BIN = Join-Path $extract "bin"
          $env:THAG_HELPER_BIN = Join-Path $env:THAGORE_BIN "stage1.exe"
          & (Join-Path $env:THAGORE_BIN "thagore.exe") --version
          & (Join-Path $env:THAGORE_BIN "thagore.exe") --help
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install/update-windows.ps1 check
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install/update-windows.ps1 apply -yes -dryRun

      - name: Run Windows CLI command suite (syntax + commands)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extract = Join-Path $env:RUNNER_TEMP "thagore-release"
          $env:THAGORE_BIN = Join-Path $extract "bin"
          $thagore = Join-Path $env:THAGORE_BIN "thagore.exe"
          $env:THAG_HELPER_BIN = Join-Path $env:THAGORE_BIN "stage1.exe"
          if (-not (Test-Path $thagore)) {
              throw "Missing CLI binary at $thagore"
          }
          if (-not (Test-Path $env:THAG_HELPER_BIN)) {
              throw "Missing helper binary at $env:THAG_HELPER_BIN"
          }

          function Invoke-CliText {
              param([string[]]$Args)
              return [string]((& $thagore @Args 2>&1 | Out-String))
          }

          $versionOut = Invoke-CliText @("--version")
          $helpOut = Invoke-CliText @("--help")
          $buildUsageOut = Invoke-CliText @("build")
          $testListOut = Invoke-CliText @("test", "--list", "--workspace")
          $fixDoctorOut = Invoke-CliText @("fix", "doctor", "examples/hello.tg", "--json")
          $updateCheckOut = Invoke-CliText @("update", "check")
          $helperMain = @(
              "import `"helperdep.tg`"",
              "",
              "func main() -> i32:",
              "    return helper_value()"
          ) -join "`n"
          $helperDep = @(
              "func helper_value() -> i32:",
              "    return 7"
          ) -join "`n"
          Set-Content -Path "helpermain.tg" -Value $helperMain -Encoding utf8
          Set-Content -Path "helperdep.tg" -Value $helperDep -Encoding utf8
          $helperBuildLog = [string]((& $thagore build helpermain.tg -o helpertest.exe 2>&1 | Out-String))
          $helperBuildCode = $LASTEXITCODE
          $helperBuildStatus = "pass"
          if (($helperBuildCode -ne 0) -or (-not (Test-Path "helpertest.exe"))) {
              $helperBuildStatus = "fail"
              throw "Import/use fixture build failed with exit code $helperBuildCode"
          }
          Set-Content -Path "windows-cli-helper-build.txt" -Value $helperBuildLog -Encoding utf8
          Set-Content -Path "windows-cli-helper-status.txt" -Value $helperBuildStatus -Encoding utf8

          Set-Content -Path "windows-cli-version.txt" -Value $versionOut -Encoding utf8
          Set-Content -Path "windows-cli-help.txt" -Value $helpOut -Encoding utf8
          Set-Content -Path "windows-cli-build.txt" -Value $buildUsageOut -Encoding utf8
          Set-Content -Path "windows-cli-test-list.txt" -Value $testListOut -Encoding utf8
          Set-Content -Path "windows-cli-fix-doctor.txt" -Value $fixDoctorOut -Encoding utf8
          Set-Content -Path "windows-cli-update-check.txt" -Value $updateCheckOut -Encoding utf8

          $outputs = @(
              @{ name = "version"; value = $versionOut },
              @{ name = "help"; value = $helpOut },
              @{ name = "build"; value = $buildUsageOut },
              @{ name = "test-list"; value = $testListOut },
              @{ name = "fix-doctor"; value = $fixDoctorOut },
              @{ name = "update-check"; value = $updateCheckOut }
          )
          foreach ($entry in $outputs) {
              if ([string]::IsNullOrWhiteSpace($entry.value)) {
                  throw "Missing CLI output for $($entry.name)"
              }
          }

          $merged = ($outputs | ForEach-Object { $_.value }) -join "`n"
          if ($merged -match "cannot read source file:\s*update|Unknown update mode 'update'|Empty file or file not found|Usage:\s*thg\.exe") {
              throw "CLI suite detected legacy/wrapper markers."
          }

      - name: Discord update - Windows CLI command suite
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Windows CLI command suite complete

      - name: Discord update - Windows updater and CLI smoke
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Windows updater and CLI smoke complete

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, syntax-gate, linux-enduser-smoke, windows-enduser-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
