name: Selfhost Frontend Replacement

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/selfhost-frontend-replacement.yml"
      - "bootstrap/selfhost/frontend/**"
      - "tests/selfhost_frontend/**"
      - "tooling/ci/build_selfhost_frontend_stage.py"
      - "tooling/ci/selfhost_frontend_replacement.py"
      - "tools/thagore-cli/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-frontend-replacement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replacement:
    name: Selfhost frontend replacement ${{ matrix.os_name }}
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux-x64
            thagc_bin: target/release/thagc
            exe_suffix: ""

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 llvm-14-dev llvm-14-tools libpolly-14-dev lld pkg-config
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> "$GITHUB_ENV"

      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\tooling\ci\setup_msvc_env.ps1 -Arch amd64

      - name: Install Windows LLVM 14 prebuilt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target-prebuilt"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target.zip"
          if (Test-Path $extractRoot) {
            Remove-Item -Recurse -Force $extractRoot
          }
          Invoke-WebRequest `
            -Uri "https://github.com/thagore-foundation/thagore/releases/download/llvm-prebuilt-14.0.6/llvm-14.0.6-$target.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $llvmRoot = Join-Path $extractRoot "llvm-14.0.6-$target"
          $llvmBin = Join-Path $llvmRoot 'bin'
          $configCandidate = Join-Path $llvmBin 'llvm-config.exe'
          if (-not (Test-Path $configCandidate)) {
            $shimSource = Join-Path $env:RUNNER_TEMP 'llvm-config-bootstrap.cs'
            @(
              'using System;',
              'using System.IO;',
              'using System.Linq;',
              'internal static class Program {',
              '  private static int Main(string[] args) {',
              '    string root = Environment.GetEnvironmentVariable("THAGORE_LLVM_ROOT") ?? "";',
              '    string lib = Path.Combine(root, "lib");',
              '    string include = Path.Combine(root, "include");',
              '    if (args.Contains("--version")) { Console.WriteLine("14.0.6"); return 0; }',
              '    if (args.Contains("--prefix")) { Console.WriteLine(root); return 0; }',
              '    if (args.Contains("--libdir")) { Console.WriteLine(lib); return 0; }',
              '    if (args.Contains("--includedir")) { Console.WriteLine(include); return 0; }',
              '    if (args.Contains("--build-mode")) { Console.WriteLine("Release"); return 0; }',
              '    if (args.Contains("--cflags")) { Console.WriteLine("-I" + include); return 0; }',
              '    if (args.Contains("--ldflags") || args.Contains("--system-libs")) { Console.WriteLine(""); return 0; }',
              '    if (args.Contains("--libnames") || args.Contains("--libs")) {',
              '      var libs = Directory.EnumerateFiles(lib, "*.lib").Select(Path.GetFileName).Where(name => !string.IsNullOrWhiteSpace(name)).OrderBy(name => name, StringComparer.OrdinalIgnoreCase);',
              '      Console.WriteLine(string.Join(" ", libs));',
              '      return 0;',
              '    }',
              '    Console.WriteLine("");',
              '    return 0;',
              '  }',
              '}'
            ) | Set-Content -Path $shimSource -Encoding UTF8
            & csc /nologo "/out:$configCandidate" $shimSource
          }
          "LLVM_SYS_140_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THAGORE_LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_CONFIG_PATH=$configCandidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build host thagc on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release -p thagore-cli --bin thagc

      - name: Build host thagc on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release -p thagore-cli --bin thagc

      - name: Build selfhost replacement target on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/build_selfhost_frontend_stage.py \
            --repo-root "$PWD" \
            --thagc-bin "$PWD/${{ matrix.thagc_bin }}" \
            --out-dir "$PWD/selfhost-replacement-bin"

      - name: Build selfhost replacement target second pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/build_selfhost_frontend_stage.py \
            --repo-root "$PWD" \
            --thagc-bin "$PWD/${{ matrix.thagc_bin }}" \
            --out-dir "$PWD/selfhost-replacement-bin-second"

      - name: Build selfhost replacement target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/build_selfhost_frontend_stage.py `
            --repo-root $PWD `
            --thagc-bin $PWD/${{ matrix.thagc_bin }} `
            --out-dir $PWD/selfhost-replacement-bin

      - name: Build selfhost replacement target second pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/build_selfhost_frontend_stage.py `
            --repo-root $PWD `
            --thagc-bin $PWD/${{ matrix.thagc_bin }} `
            --out-dir $PWD/selfhost-replacement-bin-second

      - name: Validate replacement target on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/selfhost_frontend_replacement.py \
            --repo-root "$PWD" \
            --host-thagc "$PWD/${{ matrix.thagc_bin }}" \
            --selfhost-check "$PWD/selfhost-replacement-bin/check${{ matrix.exe_suffix }}" \
            --summary-out "$PWD/selfhost-replacement-bin/replacement-summary.txt"

      - name: Validate replacement target second pass on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tooling/ci/selfhost_frontend_replacement.py \
            --repo-root "$PWD" \
            --host-thagc "$PWD/${{ matrix.thagc_bin }}" \
            --selfhost-check "$PWD/selfhost-replacement-bin-second/check${{ matrix.exe_suffix }}" \
            --summary-out "$PWD/selfhost-replacement-bin-second/replacement-summary.txt"
          diff -u selfhost-replacement-bin/replacement-summary.txt selfhost-replacement-bin-second/replacement-summary.txt

      - name: Validate replacement target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/selfhost_frontend_replacement.py `
            --repo-root $PWD `
            --host-thagc $PWD/${{ matrix.thagc_bin }} `
            --selfhost-check $PWD/selfhost-replacement-bin/check${{ matrix.exe_suffix }} `
            --summary-out $PWD/selfhost-replacement-bin/replacement-summary.txt

      - name: Validate replacement target second pass on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tooling/ci/selfhost_frontend_replacement.py `
            --repo-root $PWD `
            --host-thagc $PWD/${{ matrix.thagc_bin }} `
            --selfhost-check $PWD/selfhost-replacement-bin-second/check${{ matrix.exe_suffix }} `
            --summary-out $PWD/selfhost-replacement-bin-second/replacement-summary.txt
          if ((Get-Content selfhost-replacement-bin/replacement-summary.txt -Raw) -ne (Get-Content selfhost-replacement-bin-second/replacement-summary.txt -Raw)) {
            throw 'selfhost replacement summaries differ between rebuilds'
          }

      - name: Summarize replacement target on Linux
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          {
            echo "## Selfhost replacement target (${{ matrix.os_name }})"
            echo
            echo '```text'
            cat selfhost-replacement-bin/replacement-summary.txt
            echo '```'
            echo
            echo '### Session route'
            echo '```text'
            cat selfhost-replacement-bin/replacement-session-route.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize replacement target on Windows
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          @"
          ## Selfhost replacement target (${{ matrix.os_name }})

          ```text
          $(Get-Content selfhost-replacement-bin/replacement-summary.txt -Raw)
          ```

          ### Second pass
          ```text
          $(Get-Content selfhost-replacement-bin-second/replacement-summary.txt -Raw)
          ```
          ### Session route
          ```text
          $(Get-Content selfhost-replacement-bin/replacement-session-route.txt -Raw)
          ```
          ### Second pass session route
          ```text
          $(Get-Content selfhost-replacement-bin-second/replacement-session-route.txt -Raw)
          ```
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload replacement summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhost-frontend-replacement-${{ matrix.os_name }}
          path: |
            selfhost-replacement-bin/replacement-summary.txt
            selfhost-replacement-bin/replacement-session-route.txt
            selfhost-replacement-bin-second/replacement-summary.txt
            selfhost-replacement-bin-second/replacement-session-route.txt
