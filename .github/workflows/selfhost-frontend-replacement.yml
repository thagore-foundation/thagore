name: Selfhost Frontend Replacement

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/selfhost-frontend-replacement.yml"
      - "bootstrap/selfhost/frontend/**"
      - "tests/selfhost_frontend/**"
      - "tooling/ci/build_selfhost_frontend_stage.py"
      - "tooling/ci/selfhost_frontend_replacement.py"
      - "tools/thagore-cli/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-frontend-replacement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replacement:
    name: Selfhost frontend replacement (temporarily skipped)
    runs-on: ubuntu-latest
    steps:
      - name: Skip linux selfhost frontend replacement while stabilizing
        run: echo "selfhost frontend replacement temporarily disabled on linux; tracking in issue"
