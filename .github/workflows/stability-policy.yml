name: Stability Policy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      window:
        description: "Consecutive success window"
        required: false
        default: "3"

permissions:
  actions: read
  contents: read

jobs:
  enforce-stability:
    name: enforce-stability
    runs-on: ubuntu-latest
    env:
      STABILITY_WINDOW: ${{ github.event.inputs.window || '3' }}
    steps:
      - name: Evaluate workflow streaks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const windowSize = Number(process.env.STABILITY_WINDOW || "3");
            if (!Number.isInteger(windowSize) || windowSize <= 0) {
              core.setFailed(`Invalid STABILITY_WINDOW=${process.env.STABILITY_WINDOW}`);
              return;
            }

            const isTag = (context.ref || "").startsWith("refs/tags/v");
            // Keep push/main non-blocking so recovery commits are not deadlocked by stale streak history.
            const enforceStrict = isTag;
            const targets = [
              {
                name: "CI",
                branch: "main",
                events: ["push"],
                artifactRegexes: [
                  "^ci-selfhost-ubuntu-latest$",
                  "^ci-selfhost-macos-latest$",
                  "^ci-selfhost-windows-latest$",
                  "^native-cli-canary-ubuntu$",
                  "^typed-ir-ci-ubuntu-latest$",
                  "^typed-ir-ci-macos-latest$",
                  "^typed-ir-ci-windows-latest$",
                  "^core-ir-ci-ubuntu-latest$",
                  "^core-ir-ci-macos-latest$",
                  "^core-ir-ci-windows-latest$",
                  "^spec-summary-ci-ubuntu-latest$",
                  "^spec-summary-ci-macos-latest$",
                  "^spec-summary-ci-windows-latest$",
                ],
              },
              {
                name: "Selfhost Matrix",
                branch: "main",
                events: ["push"],
                artifactRegexes: [
                  "^selfhost-trace-Linux$",
                  "^selfhost-trace-macOS$",
                  "^selfhost-trace-Windows$",
                  "^typed-ir-selfhost-ubuntu-latest$",
                  "^typed-ir-selfhost-macos-latest$",
                  "^typed-ir-selfhost-windows-latest$",
                  "^core-ir-selfhost-ubuntu-latest$",
                  "^core-ir-selfhost-macos-latest$",
                  "^core-ir-selfhost-windows-latest$",
                  "^spec-summary-selfhost-ubuntu-latest$",
                  "^spec-summary-selfhost-macos-latest$",
                  "^spec-summary-selfhost-windows-latest$",
                ],
              },
              {
                name: "Release",
                branch: "main",
                events: ["push"],
                artifactRegexes: [
                  "^release-linux-x86_64$",
                  "^release-linux-arm64$",
                  "^release-macos-arm64$",
                  "^release-windows-x86_64$",
                  "^release-windows-arm64$",
                  "^typed-ir-release-linux-x86_64$",
                  "^typed-ir-release-linux-arm64$",
                  "^typed-ir-release-macos-arm64$",
                  "^typed-ir-release-windows-x86_64$",
                  "^typed-ir-release-windows-arm64$",
                  "^core-ir-release-linux-x86_64$",
                  "^core-ir-release-linux-arm64$",
                  "^core-ir-release-macos-arm64$",
                  "^core-ir-release-windows-x86_64$",
                  "^core-ir-release-windows-arm64$",
                  "^spec-summary-release-linux-x86_64$",
                  "^spec-summary-release-linux-arm64$",
                  "^spec-summary-release-macos-arm64$",
                  "^spec-summary-release-windows-x86_64$",
                  "^spec-summary-release-windows-arm64$",
                ],
              },
            ];
            if (isTag) {
              targets.push({
                name: "Release",
                branch: null,
                events: ["push"],
                artifactRegexes: [
                  "^release-linux-x86_64$",
                  "^release-linux-arm64$",
                  "^release-macos-arm64$",
                  "^release-windows-x86_64$",
                  "^release-windows-arm64$",
                ],
              });
            }

            const report = [];
            let failed = false;
            try {
              const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
                owner,
                repo,
                per_page: 100,
              });
              const wfByName = new Map(workflows.map((w) => [w.name, w]));

              for (const target of targets) {
                const wf = wfByName.get(target.name);
                if (!wf) {
                  report.push(`FAIL|${target.name}|workflow_not_found`);
                  failed = true;
                  continue;
                }
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100,
                });
                const filtered = runs.filter((r) => {
                  if (r.status !== "completed") return false;
                  if (!target.events.includes(r.event)) return false;
                  if (target.branch && r.head_branch !== target.branch) return false;
                  return true;
                });

                let streak = 0;
                let breakRun = null;
                const inspected = [];
                for (const r of filtered) {
                  if (inspected.length >= windowSize) break;
                  inspected.push(`${r.id}:${r.conclusion}:${r.head_branch}:${r.event}`);
                  if (r.conclusion === "success") {
                    streak += 1;
                  } else {
                    breakRun = r;
                    break;
                  }
                }

                if (streak < windowSize) {
                  failed = true;
                  if (breakRun) {
                    report.push(`FAIL|${target.name}|streak=${streak}/${windowSize}|break_run=${breakRun.id}|break_conclusion=${breakRun.conclusion}`);
                  } else {
                    report.push(`FAIL|${target.name}|streak=${streak}/${windowSize}|insufficient_history`);
                  }
                } else {
                  report.push(`PASS|${target.name}|streak=${streak}/${windowSize}`);
                }
                for (const row of inspected) {
                  report.push(`RUN|${target.name}|${row}`);
                }

                const successRuns = filtered.filter((r) => r.conclusion === "success").slice(0, windowSize);
                if (successRuns.length < windowSize) {
                  failed = true;
                  report.push(`FAIL|${target.name}|artifact_audit=insufficient_success_runs|have=${successRuns.length}|need=${windowSize}`);
                  continue;
                }

                for (const r of successRuns) {
                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                    owner,
                    repo,
                    run_id: r.id,
                    per_page: 100,
                  });
                  const names = artifacts.map((a) => a.name || "");
                  report.push(`ARTIFACTS|${target.name}|run=${r.id}|count=${names.length}`);
                  const missingRegexes = (target.artifactRegexes || []).filter((pat) => {
                    const re = new RegExp(pat);
                    return !names.some((n) => re.test(n));
                  });
                  if (missingRegexes.length > 0) {
                    failed = true;
                    report.push(
                      `FAIL|${target.name}|artifact_audit=missing_artifact|run=${r.id}|missing=${missingRegexes.join(",")}`
                    );
                  } else {
                    report.push(`PASS|${target.name}|artifact_audit=ok|run=${r.id}`);
                  }
                }
              }

              const body = [
                `ref=${context.ref}`,
                `window=${windowSize}`,
                ...report,
              ].join("\n") + "\n";
              require("fs").writeFileSync("stability-policy-report.txt", body, "utf8");
              core.summary.addCodeBlock(body, "text").write();
              if (failed) {
                if (enforceStrict) {
                  core.setFailed("Stability policy failed. See stability-policy-report.txt");
                } else {
                  core.warning("Stability policy not yet satisfied on push/main. Report uploaded for tracking.");
                }
              }
            } catch (err) {
              const message = ((err && err.message) ? err.message : String(err)).replace(/\s+/g, " ").trim();
              const body = [
                `ref=${context.ref}`,
                `window=${windowSize}`,
                `WARN|api_error|${message}`,
              ].join("\n") + "\n";
              require("fs").writeFileSync("stability-policy-report.txt", body, "utf8");
              core.summary.addCodeBlock(body, "text").write();
              if (enforceStrict) {
                core.setFailed(`Stability policy API check failed: ${message}`);
              } else {
                core.warning(`Stability policy API check skipped due API error: ${message}`);
              }
            }

      - name: Upload stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-policy-report
          path: stability-policy-report.txt
