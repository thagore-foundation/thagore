name: Selfhost Readiness

on:
  workflow_dispatch:

jobs:
  readiness-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scope notice
        run: |
          echo "Selfhost milestone is tracked in ROADMAP and not proven by this workflow yet."
          echo "This lane validates compiler build and soak readiness."

      - name: Install LLVM 21 + build deps
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev

      - name: Build compiler
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build -j

      - name: Run soak suite
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python3 -m unittest tests.soak.test_compiler_stress
