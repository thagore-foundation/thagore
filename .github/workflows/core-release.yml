name: Core Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: true
        description: "Skip publishing and only build release plan artifacts."

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BOOTSTRAP_STAGE1_TAG: "v0.3.168-stage1-seed"

jobs:
  release-plan:
    name: release-plan-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate release bundle plan
        run: >
          python scripts/release_bundle_plan.py
          --host-os "${{ runner.os }}"
          --dry-run "${{ github.event.inputs.dry_run || 'true' }}"
          --report release-plan-${{ runner.os }}.txt

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: core-release-plan-${{ matrix.os }}
          path: release-plan-${{ runner.os }}.txt

