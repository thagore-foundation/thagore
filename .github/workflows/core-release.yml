name: Core Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: true
        description: "Skip publishing GitHub Release — only build and upload artifacts."
      tag_override:
        type: string
        required: false
        default: ""
        description: "Override release tag (default: git tag from push event)."

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BOOTSTRAP_STAGE1_TAG: "v0.3.193-stage1-seed"
  LLVM_VERSION: "21"
  LLVM_FULL_VERSION: "21.1.8"

jobs:
  build-release:
    name: build-release-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            os_slug: linux
          - os: macos-latest
            triple: aarch64-apple-darwin
            os_slug: macos
          - os: macos-13
            triple: x86_64-apple-darwin
            os_slug: macos-x64
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            os_slug: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM 21 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME:-noble}}")
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y clang-21 lld-21 llvm-21
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-21  100
          sudo update-alternatives --install /usr/bin/llc     llc     /usr/bin/llc-21     100
          sudo update-alternatives --install /usr/bin/llvm-as llvm-as /usr/bin/llvm-as-21 100

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=21.1.8 -y --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Bootstrap Linux/macOS (stage1 download + build stage2b)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bootstrap.sh

      - name: Bootstrap Windows (download stage1 seed + build stage2b)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Windows seed ships bare .exe files, not a tarball
          $tag = "$env:BOOTSTRAP_STAGE1_TAG"
          New-Item -ItemType Directory -Force -Path bootstrap | Out-Null
          gh release download $tag --repo thagore-foundation/thagore `
            --pattern "thagore-stage1-windows-x86_64.exe" `
            --pattern "thagore-stage1-helper-windows-x86_64.exe" `
            --pattern "thagore-runtime-windows-x86_64.lib" `
            -D bootstrap
          Copy-Item "bootstrap\thagore-stage1-windows-x86_64.exe" stage1.exe
          Copy-Item "bootstrap\thagore-stage1-helper-windows-x86_64.exe" stage1_helper.exe
          Copy-Item "bootstrap\thagore-runtime-windows-x86_64.lib" thag_runtime.lib
          Write-Host "[bootstrap] stage1=$(Test-Path stage1.exe) helper=$(Test-Path stage1_helper.exe)"
          python scripts\build_runtime_abi.py --target-os Windows --summary runtime-abi-summary-local.txt
          .\stage1.exe build src/thagore.tg -o stage2.exe
          if (-not (Test-Path stage2.exe)) { Write-Error "stage2.exe not produced"; exit 1 }
          .\stage2.exe build src/thagore.tg -o stage2b.exe 2>$null
          if (-not (Test-Path stage2b.exe)) {
            Write-Host "[bootstrap] single-stage mode — using stage2.exe as stage2b.exe"
            Copy-Item stage2.exe stage2b.exe
          }
          Write-Host "[bootstrap] Done: stage2=$(Test-Path stage2.exe) stage2b=$(Test-Path stage2b.exe)"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag_override }}" ]]; then
            VERSION="${{ github.event.inputs.tag_override }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Download LLVM prebuilt for target pack
        # LLVM GitHub releases only provide Linux + macOS prebuilts.
        # Windows: no upstream prebuilt tarball available; skip embedding LLVM.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python scripts/fetch_llvm_prebuilt.py \
            --triple "${{ matrix.triple }}" \
            --llvm-version "${LLVM_FULL_VERSION}" \
            --out-dir "targets/packs/${{ matrix.triple }}/llvm"

      - name: Package release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OS_SLUG="${{ matrix.os_slug }}"
          TRIPLE="${{ matrix.triple }}"
          mkdir -p dist/release

          # Prefer stage2b > stage2 > stage1 as the released compiler binary.
          # stage1 (= stage1_helper backend) is always functional; stage2/stage2b
          # are CLI wrappers that also work but require stage1_helper alongside them.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            THAGC_DEST="thagc.exe"
            if [[ -f "stage2b.exe" ]]; then THAGC_BIN="stage2b.exe"
            elif [[ -f "stage2.exe" ]]; then THAGC_BIN="stage2.exe"
            else THAGC_BIN="stage1.exe"; fi
          else
            THAGC_DEST="thagc"
            if [[ -f "stage2b" ]]; then THAGC_BIN="stage2b"
            elif [[ -f "stage2" ]]; then THAGC_BIN="stage2"
            else THAGC_BIN="stage1"; fi
          fi
          echo "Using compiler binary: $THAGC_BIN"

          # Core bundle: thagc binary + stage1_helper + thagup-init.sh + target registry
          CORE_STAGE="dist/release/core-staging"
          mkdir -p "$CORE_STAGE/bin" "$CORE_STAGE/targets/registry"
          cp "$THAGC_BIN" "$CORE_STAGE/bin/$THAGC_DEST"
          # Also bundle stage1 (= stage1_helper backend) so CLI wrapper can find it
          if [[ -f "stage1" && "$THAGC_BIN" != "stage1" ]]; then
            cp stage1 "$CORE_STAGE/bin/stage1_helper"
          elif [[ -f "stage1.exe" && "$THAGC_BIN" != "stage1.exe" ]]; then
            cp stage1.exe "$CORE_STAGE/bin/stage1_helper.exe"
          fi
          cp scripts/install/thagup-init.sh "$CORE_STAGE/"
          # Bundle platform-appropriate thagup self-updater
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp scripts/install/thagup.ps1 "$CORE_STAGE/thagup.ps1"
            # .cmd shim so `thagup` works from cmd.exe without specifying extension
            printf '@powershell -NoProfile -ExecutionPolicy Bypass -File "%%~dp0thagup.ps1" %%*\r\n' \
              > "$CORE_STAGE/thagup.cmd"
          else
            cp scripts/install/thagup "$CORE_STAGE/thagup"
          fi
          cp -r targets/registry/. "$CORE_STAGE/targets/registry/" 2>/dev/null || true

          CORE_TARBALL="dist/release/thagc-core-${OS_SLUG}.tar.gz"
          tar -czf "$CORE_TARBALL" -C "$CORE_STAGE" .
          echo "Packaged core: $CORE_TARBALL"

          # Target pack slug is derived from the triple's OS (not the runner OS).
          # This ensures thagup can download e.g. aarch64-unknown-linux-gnu target
          # from any host by knowing the triple → slug mapping.
          if [[ "$TRIPLE" == *"apple"* || "$TRIPLE" == *"darwin"* ]]; then
            TARGET_OS_SLUG="macos"
          elif [[ "$TRIPLE" == *"windows"* ]]; then
            TARGET_OS_SLUG="windows"
          else
            TARGET_OS_SLUG="linux"
          fi

          TARGET_STAGE="dist/release/target-staging-${TRIPLE}"
          mkdir -p "$TARGET_STAGE"
          cp -r "targets/packs/${TRIPLE}/." "$TARGET_STAGE/"

          TARGET_TARBALL="dist/release/thagc-target-${TRIPLE}-${TARGET_OS_SLUG}.tar.gz"
          tar -czf "$TARGET_TARBALL" -C "$TARGET_STAGE" .
          echo "Packaged target: $TARGET_TARBALL"

          # Checksums: one file per OS_SLUG (core bundle) and TARGET_OS_SLUG (target pack)
          cd dist/release
          SHA_CMD="sha256sum"
          command -v sha256sum >/dev/null 2>&1 || SHA_CMD="shasum -a 256"

          # Core checksum (by runner OS slug)
          $SHA_CMD "thagc-core-${OS_SLUG}.tar.gz" \
            > "SHA256SUMS-thagc-${OS_SLUG}.txt"
          # Append target pack checksum to its own OS slug file
          $SHA_CMD "thagc-target-${TRIPLE}-${TARGET_OS_SLUG}.tar.gz" \
            >> "SHA256SUMS-thagc-${TARGET_OS_SLUG}.txt"

          cat "SHA256SUMS-thagc-${OS_SLUG}.txt"
          [[ "${TARGET_OS_SLUG}" != "${OS_SLUG}" ]] && cat "SHA256SUMS-thagc-${TARGET_OS_SLUG}.txt" || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.triple }}
          path: |
            dist/release/thagc-core-${{ matrix.os_slug }}.tar.gz
            dist/release/thagc-target-${{ matrix.triple }}-*.tar.gz
            dist/release/SHA256SUMS-thagc-*.txt

  publish-release:
    name: publish-release
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: List artifacts
        run: find dist/release -type f | sort

      - name: Determine release version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.tag_override }}" ]]; then
            VERSION="${{ github.event.inputs.tag_override }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Collect all available release assets
          # Glob all assets produced by the build matrix
          ASSETS=()
          while IFS= read -r -d '' f; do
            ASSETS+=("$f")
          done < <(find dist/release -maxdepth 1 -type f \( \
            -name "thagc-core-*.tar.gz" -o \
            -name "thagc-target-*.tar.gz" -o \
            -name "SHA256SUMS-thagc-*.txt" \
          \) -print0 | sort -z)
          echo "Found ${#ASSETS[@]} assets to upload:"
          printf '  %s\n' "${ASSETS[@]}"
          echo "Uploading ${#ASSETS[@]} assets..."
          gh release create "$VERSION" \
            --title "Thagore $VERSION" \
            --generate-notes \
            "${ASSETS[@]}" \
            || echo "Release may already exist — trying to upload assets only" && \
          gh release upload "$VERSION" "${ASSETS[@]}" --clobber || true
