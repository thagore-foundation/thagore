name: Bootstrap Selfhost Bench

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-selfhost.yml"
      - "tests/bootstrap_probe/**"
      - "tooling/bootstrap/**"
      - "stdlib/**"
      - "crates/**"
      - "tools/thagore-cli/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-selfhost:
    name: Linux selfhost probe + bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 llvm-14-dev llvm-14-tools libpolly-14-dev lld pkg-config
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> "$GITHUB_ENV"

      - name: Build host thagc (release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-selfhost
          /usr/bin/time -f "%e %M" -o bootstrap-selfhost/host-build.metrics \
            cargo build --release -p thagore-cli

      - name: Hash host thagc
        shell: bash
        run: |
          set -euo pipefail
          sha256sum target/release/thagc > bootstrap-selfhost/thagc.sha256

      - name: Rehearse probe with host thagc
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(pwd)/target/release"
          python3 tooling/bootstrap/rehearse_probe.py \
            --thagc "$PREFIX/thagc" \
            --probe tests/bootstrap_probe/main.tg \
            --expected tests/bootstrap_probe/expected.txt \
            --result tests/bootstrap_probe/probe-result.txt \
            --out-dir bootstrap-selfhost/probe

      - name: Benchmark thagc run (placeholder)
        shell: bash
        run: |
          set -euo pipefail
          THAGORE_BOOTSTRAP_PROBE=ok /usr/bin/time -f "%e %M" \
            -o bootstrap-selfhost/probe-run.metrics \
            target/release/thagc run tests/bootstrap_probe/main.tg

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-selfhost-linux
          path: bootstrap-selfhost/*

  windows-selfhost:
    name: Windows selfhost probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Set up MSVC toolchain
        shell: pwsh
        run: |
          .\tooling\ci\setup_msvc_env.ps1 -Arch amd64

      - name: Install Windows LLVM 14 prebuilt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target-prebuilt"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target.zip"
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          Invoke-WebRequest `
            -Uri "https://github.com/thagore-foundation/thagore/releases/download/llvm-prebuilt-14.0.6/llvm-14.0.6-$target.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $llvmRoot = Join-Path $extractRoot "llvm-14.0.6-$target"
          echo "LLVM_SYS_140_PREFIX=$llvmRoot" >> $env:GITHUB_ENV
          echo "LLVM_CONFIG_PATH=$llvmRoot\bin\llvm-config.exe" >> $env:GITHUB_ENV
          echo "THAGORE_LLVM_ROOT=$llvmRoot" >> $env:GITHUB_ENV

      - name: Build host thagc (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir bootstrap-selfhost | Out-Null
          $elapsed = Measure-Command { cargo build --release -p thagore-cli }
          "elapsed_ms=$($elapsed.TotalMilliseconds)" | Out-File -FilePath bootstrap-selfhost\host-build.metrics -Encoding ascii

      - name: Hash host thagc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          $hash = Get-FileHash -Algorithm SHA256 -Path $thagc
          "$($hash.Hash)  thagc.exe" | Out-File -FilePath bootstrap-selfhost\thagc.sha256 -Encoding ascii

      - name: Rehearse probe with host thagc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          python tooling/bootstrap/rehearse_probe.py `
            --thagc $thagc `
            --probe "tests/bootstrap_probe/main.tg" `
            --expected "tests/bootstrap_probe/expected.txt" `
            --result "tests/bootstrap_probe/probe-result.txt" `
            --out-dir "bootstrap-selfhost\probe"

      - name: Record simple timing (placeholder)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          $env:THAGORE_BOOTSTRAP_PROBE = 'ok'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $thagc run tests/bootstrap_probe/main.tg
          if ($LASTEXITCODE -ne 0) { throw "thagc run returned $LASTEXITCODE" }
          $sw.Stop()
          "elapsed_ms=$($sw.ElapsedMilliseconds)" | Out-File -FilePath bootstrap-selfhost\probe\run.metrics -Encoding ascii

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-selfhost-windows
          path: bootstrap-selfhost/*
