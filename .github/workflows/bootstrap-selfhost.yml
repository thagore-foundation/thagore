name: Bootstrap Selfhost Bench

on:
  push:
    branches:
      - main
      - indev-rewrite
    paths:
      - ".github/workflows/bootstrap-selfhost.yml"
      - "bootstrap/selfhost/**"
      - "tests/bootstrap_probe/**"
      - "tests/bootstrap_seed/**"
      - "tests/selfhost_frontend/**"
      - "tooling/bootstrap/**"
      - "tooling/ci/**"
      - "stdlib/**"
      - "crates/**"
      - "tools/thagore-cli/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LINUX_SELFHOST_PROBE_RUN_LIMIT_SECS: 15
  LINUX_SELFHOST_PROBE_RUN_LIMIT_PEAK_KB: 524288
  WINDOWS_SELFHOST_PROBE_RUN_LIMIT_MS: 20000
  WINDOWS_SELFHOST_PROBE_RUN_LIMIT_PEAK_MB: 768

jobs:
  linux-selfhost:
    name: Linux selfhost probe + bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 llvm-14-dev llvm-14-tools libpolly-14-dev lld pkg-config
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> "$GITHUB_ENV"

      - name: Build host thagc (release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-selfhost
          /usr/bin/time -f "%e %M" -o bootstrap-selfhost/host-build.metrics \
            cargo build --release -p thagore-cli

      - name: Hash host thagc
        shell: bash
        run: |
          set -euo pipefail
          sha256sum target/release/thagc > bootstrap-selfhost/thagc.sha256

      - name: Rebuild to verify determinism
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/thagc bootstrap-selfhost/thagc.first
          cargo build --release -p thagore-cli
          cp target/release/thagc bootstrap-selfhost/thagc.second
          sha256sum bootstrap-selfhost/thagc.first | awk '{print $1}' > bootstrap-selfhost/thagc.first.sha256
          sha256sum bootstrap-selfhost/thagc.second | awk '{print $1}' > bootstrap-selfhost/thagc.second.sha256
          diff bootstrap-selfhost/thagc.first.sha256 bootstrap-selfhost/thagc.second.sha256

      - name: Rehearse probe with host thagc
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(pwd)/target/release"
          python3 tooling/bootstrap/rehearse_probe.py \
            --thagc "$PREFIX/thagc" \
            --probe tests/bootstrap_probe/main.tg \
            --expected tests/bootstrap_probe/expected.txt \
            --result tests/bootstrap_probe/probe-result.txt \
            --out-dir bootstrap-selfhost/probe

      - name: Benchmark thagc run
        shell: bash
        run: |
          set -euo pipefail
          THAGORE_BOOTSTRAP_PROBE=ok /usr/bin/time -f "%e %M" \
            -o bootstrap-selfhost/probe-run.metrics \
            target/release/thagc run tests/bootstrap_probe/main.tg
          read -r elapsed peak_kb < bootstrap-selfhost/probe-run.metrics
          awk -v elapsed="$elapsed" -v limit="${LINUX_SELFHOST_PROBE_RUN_LIMIT_SECS}" 'BEGIN { exit !(elapsed <= limit) }'
          awk -v peak_kb="$peak_kb" -v limit="${LINUX_SELFHOST_PROBE_RUN_LIMIT_PEAK_KB}" 'BEGIN { exit !(peak_kb <= limit) }'

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-selfhost-linux
          path: bootstrap-selfhost/*

  windows-selfhost:
    name: Windows selfhost probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Set up MSVC toolchain
        shell: pwsh
        run: |
          .\tooling\ci\setup_msvc_env.ps1 -Arch amd64

      - name: Diagnose MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bootstrap-selfhost | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Could not resolve a Visual Studio installation with VC tools.'
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($null -eq $cl) {
            throw 'cl.exe is not available after setup_msvc_env.ps1'
          }
          if ($null -eq $link) {
            throw 'link.exe is not available after setup_msvc_env.ps1'
          }
          "vs_installation=$installationPath" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          "vc_tools=$env:VCToolsInstallDir" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          "windows_sdk=$env:WindowsSdkDir" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          "windows_sdk_version=$env:WindowsSDKVersion" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          "cl_path=$($cl.Source)" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          "link_path=$($link.Source)" | Out-File -FilePath bootstrap-selfhost\msvc-env.txt -Encoding ascii -Append
          Get-Content bootstrap-selfhost\msvc-env.txt

      - name: Install Windows LLVM 14 prebuilt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target-prebuilt"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-14.0.6-$target.zip"
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          Invoke-WebRequest `
            -Uri "https://github.com/thagore-foundation/thagore/releases/download/llvm-prebuilt-14.0.6/llvm-14.0.6-$target.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $llvmRoot = Join-Path $extractRoot "llvm-14.0.6-$target"
          echo "LLVM_SYS_140_PREFIX=$llvmRoot" >> $env:GITHUB_ENV
          echo "LLVM_CONFIG_PATH=$llvmRoot\bin\llvm-config.exe" >> $env:GITHUB_ENV
          echo "THAGORE_LLVM_ROOT=$llvmRoot" >> $env:GITHUB_ENV

      - name: Build host thagc (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bootstrap-selfhost | Out-Null
          $elapsed = Measure-Command { cargo build --release -p thagore-cli }
          "elapsed_ms=$($elapsed.TotalMilliseconds)" | Out-File -FilePath bootstrap-selfhost\host-build.metrics -Encoding ascii

      - name: Hash host thagc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          $hash = Get-FileHash -Algorithm SHA256 -Path $thagc
          "$($hash.Hash)  thagc.exe" | Out-File -FilePath bootstrap-selfhost\thagc.sha256 -Encoding ascii

      - name: Rebuild to verify determinism
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $first = Join-Path (Get-Location) "bootstrap-selfhost\thagc.first.exe"
          $second = Join-Path (Get-Location) "bootstrap-selfhost\thagc.second.exe"
          Copy-Item "target\release\thagc.exe" $first
          $elapsed2 = Measure-Command { cargo build --release -p thagore-cli }
          "elapsed_ms=$($elapsed2.TotalMilliseconds)" | Out-File -FilePath bootstrap-selfhost\host-build-second.metrics -Encoding ascii
          Copy-Item "target\release\thagc.exe" $second
          $h1 = (Get-FileHash -Algorithm SHA256 -Path $first).Hash
          $h2 = (Get-FileHash -Algorithm SHA256 -Path $second).Hash
          "$h1" | Out-File -FilePath bootstrap-selfhost\thagc.first.sha256 -Encoding ascii
          "$h2" | Out-File -FilePath bootstrap-selfhost\thagc.second.sha256 -Encoding ascii
          if ($h1 -ne $h2) { throw "thagc build not deterministic between runs" }

      - name: Rehearse probe with host thagc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          python tooling/bootstrap/rehearse_probe.py `
            --thagc $thagc `
            --probe "tests/bootstrap_probe/main.tg" `
            --expected "tests/bootstrap_probe/expected.txt" `
            --result "tests/bootstrap_probe/probe-result.txt" `
            --out-dir "bootstrap-selfhost\probe"

      - name: Benchmark thagc run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thagc = Join-Path (Get-Location) "target\release\thagc.exe"
          $env:THAGORE_BOOTSTRAP_PROBE = 'ok'
          $process = Start-Process -FilePath $thagc `
            -ArgumentList @('run', 'tests/bootstrap_probe/main.tg') `
            -NoNewWindow `
            -PassThru
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "thagc run returned $($process.ExitCode)" }
          $elapsed = [int64]$process.ExitTime.Subtract($process.StartTime).TotalMilliseconds
          $workingSetMb = [math]::Round(($process.PeakWorkingSet64 / 1MB), 2)
          @(
            "elapsed_ms=$elapsed"
            "peak_working_set_mb=$workingSetMb"
          ) | Out-File -FilePath bootstrap-selfhost\probe\run.metrics -Encoding ascii
          if ($elapsed -gt [int64]$env:WINDOWS_SELFHOST_PROBE_RUN_LIMIT_MS) {
            throw "bootstrap probe run exceeded time limit: ${elapsed}ms > $env:WINDOWS_SELFHOST_PROBE_RUN_LIMIT_MS ms"
          }
          if ($workingSetMb -gt [double]$env:WINDOWS_SELFHOST_PROBE_RUN_LIMIT_PEAK_MB) {
            throw "bootstrap probe run exceeded memory limit: ${workingSetMb}MB > $env:WINDOWS_SELFHOST_PROBE_RUN_LIMIT_PEAK_MB MB"
          }

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-selfhost-windows
          path: bootstrap-selfhost/*
