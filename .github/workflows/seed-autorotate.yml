name: Seed Autorotate

on:
  workflow_run:
    workflows: ["Stability Policy"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: seed-autorotate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-seed:
    name: dispatch-seed
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.plan.outputs.should_dispatch }}
      base_seed_tag: ${{ steps.plan.outputs.base_seed_tag }}
      next_seed_tag: ${{ steps.plan.outputs.next_seed_tag }}
    steps:
      - name: Plan seed rotation
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;

            const required = ["CI", "Selfhost Matrix", "Release", "Policy No Stage0"];
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner, repo, per_page: 100,
            });
            const wfByName = new Map(workflows.map((w) => [w.name, w]));
            for (const name of required) {
              const wf = wfByName.get(name);
              if (!wf) {
                core.setOutput("should_dispatch", "false");
                core.setFailed(`Missing workflow: ${name}`);
                return;
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: wf.id, per_page: 50,
              });
              const hit = runs.find((r) => r.head_sha === sha && r.event === "push" && r.status === "completed");
              if (!hit || hit.conclusion !== "success") {
                core.info(`Gate ${name} not green for sha=${sha}`);
                core.setOutput("should_dispatch", "false");
                return;
              }
            }

            const seedWf = wfByName.get("Seed Stage1 Assets");
            if (!seedWf) {
              core.setOutput("should_dispatch", "false");
              core.setFailed("Missing workflow: Seed Stage1 Assets");
              return;
            }
            const seedRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: seedWf.id, per_page: 100,
            });
            const existing = seedRuns.find((r) => r.head_sha === sha && r.event === "workflow_dispatch");
            if (existing && (existing.status === "queued" || existing.status === "in_progress" || existing.conclusion === "success")) {
              core.info(`Seed run already exists for sha=${sha} run=${existing.id} status=${existing.status} conclusion=${existing.conclusion}`);
              core.setOutput("should_dispatch", "false");
              return;
            }

            const ciFile = await github.rest.repos.getContent({
              owner, repo, path: ".github/workflows/ci.yml", ref: "main",
            });
            const content = Buffer.from(ciFile.data.content, "base64").toString("utf8");
            const m = content.match(/BOOTSTRAP_STAGE1_TAG:\s*"([^"]+)"/) || content.match(/BOOTSTRAP_STAGE1_TAG:\s*([vV][0-9A-Za-z._-]+)/);
            if (!m) {
              core.setOutput("should_dispatch", "false");
              core.setFailed("Cannot parse BOOTSTRAP_STAGE1_TAG from ci.yml");
              return;
            }
            const baseSeed = m[1];
            let nextSeed = "";
            const sem = baseSeed.match(/^v(\d+)\.(\d+)\.(\d+)-stage1-seed/);
            if (sem) {
              const major = Number(sem[1]);
              const minor = Number(sem[2]);
              let patch = Number(sem[3]) + 1;
              for (let i = 0; i < 100; i += 1) {
                const cand = `v${major}.${minor}.${patch + i}-stage1-seed`;
                try {
                  await github.rest.repos.getReleaseByTag({ owner, repo, tag: cand });
                } catch (err) {
                  if (err.status === 404) {
                    nextSeed = cand;
                    break;
                  }
                  throw err;
                }
              }
            }
            if (!nextSeed) {
              const d = new Date();
              const stamp = `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, "0")}${String(d.getUTCDate()).padStart(2, "0")}`;
              nextSeed = `v${stamp}-stage1-seed`;
            }

            core.info(`base=${baseSeed} next=${nextSeed}`);
            core.setOutput("base_seed_tag", baseSeed);
            core.setOutput("next_seed_tag", nextSeed);
            core.setOutput("should_dispatch", "true");

      - name: Dispatch Seed Stage1 Assets
        if: steps.plan.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "seed-stage1.yml",
              ref: "main",
              inputs: {
                seed_tag: "${{ steps.plan.outputs.next_seed_tag }}",
                base_seed_tag: "${{ steps.plan.outputs.base_seed_tag }}",
              },
            });

      - name: Write report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head_sha=${{ github.event.workflow_run.head_sha }}"
            echo "base_seed_tag=${{ steps.plan.outputs.base_seed_tag }}"
            echo "next_seed_tag=${{ steps.plan.outputs.next_seed_tag }}"
            echo "should_dispatch=${{ steps.plan.outputs.should_dispatch }}"
          } > seed-autorotate-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-autorotate-report
          path: seed-autorotate-report.txt
