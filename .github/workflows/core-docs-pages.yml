name: Core Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/core-docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: core-docs-pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect docs framework
        id: detect
        run: |
          # Starlight docs live in docs/starlight/
          if [[ -f docs/starlight/astro.config.mjs || -f docs/starlight/astro.config.ts ]]; then
            echo "framework=astro" >> "$GITHUB_OUTPUT"
            echo "docs_dir=docs/starlight" >> "$GITHUB_OUTPUT"
          elif [[ -f docs/astro.config.mjs || -f docs/astro.config.ts ]]; then
            echo "framework=astro" >> "$GITHUB_OUTPUT"
            echo "docs_dir=docs" >> "$GITHUB_OUTPUT"
          elif [[ -f docs/starlight/package.json ]]; then
            echo "framework=node" >> "$GITHUB_OUTPUT"
            echo "docs_dir=docs/starlight" >> "$GITHUB_OUTPUT"
          elif [[ -f docs/package.json ]]; then
            echo "framework=node" >> "$GITHUB_OUTPUT"
            echo "docs_dir=docs" >> "$GITHUB_OUTPUT"
          else
            echo "framework=static" >> "$GITHUB_OUTPUT"
            echo "docs_dir=docs" >> "$GITHUB_OUTPUT"
          fi

      - name: Install docs dependencies
        if: steps.detect.outputs.framework == 'astro' || steps.detect.outputs.framework == 'node'
        working-directory: ${{ steps.detect.outputs.docs_dir }}
        run: npm ci

      - name: Build docs (Astro/Starlight)
        if: steps.detect.outputs.framework == 'astro' || steps.detect.outputs.framework == 'node'
        working-directory: ${{ steps.detect.outputs.docs_dir }}
        run: npm run build

      - name: Validate static docs tree
        if: steps.detect.outputs.framework == 'static'
        run: |
          test -d docs
          test -f docs/index.html

      - name: Prepare Pages root
        run: |
          rm -rf _site
          if [[ "${{ steps.detect.outputs.framework }}" == "static" ]]; then
            cp -a docs _site
          else
            cp -a "${{ steps.detect.outputs.docs_dir }}/dist" _site
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
