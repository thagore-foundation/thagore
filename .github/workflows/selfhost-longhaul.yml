name: Selfhost Longhaul

on:
  workflow_call:
    inputs:
      longhaul_rounds:
        required: false
        type: string
        default: "10"
      bootstrap_stage1_tag:
        required: false
        type: string
        default: "v0.3.193-stage1-seed"
  workflow_dispatch:
    inputs:
      longhaul_rounds:
        description: "Number of Stage1->Stage2->Stage2 rounds"
        required: false
        default: "10"
      bootstrap_stage1_tag:
        description: "Bootstrap seed tag"
        required: false
        default: "v0.3.193-stage1-seed"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: selfhost-longhaul-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  longhaul:
    name: longhaul (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: ${{ inputs.bootstrap_stage1_tag || github.event.inputs.bootstrap_stage1_tag || 'v0.3.193-stage1-seed' }}
      STAGE_TRACE_FILE: selfhost-longhaul-trace.log
      SOAK_REPORT_FILE: selfhost-longhaul-report.txt
      LONGHAUL_ROUNDS: ${{ inputs.longhaul_rounds || github.event.inputs.longhaul_rounds || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Bootstrap Stage1 (asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          ghdl() {
            local pattern="$1"
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          ghdl_stage1() {
            local pattern="$1"
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ghdl_stage1 "thagore-stage1.exe"
            cp bootstrap/thagore-stage1.exe stage1.exe
            chmod +x stage1.exe || true
            echo "STAGE1_BIN=stage1.exe" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            ghdl_stage1 "thagore-stage1-linux.tar.gz"
            mkdir -p bootstrap/extract_stage1
            tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" && -f "$CANDIDATE" ]] || (echo "CRITICAL: missing linux stage1 binary"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
            echo "STAGE1_BIN=stage1" >> "$GITHUB_ENV"
          else
            ghdl_stage1 "thagore-stage1-macos.tar.gz"
            mkdir -p bootstrap/extract_stage1
            tar -xzf bootstrap/thagore-stage1-macos.tar.gz -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" && -f "$CANDIDATE" ]] || (echo "CRITICAL: missing macOS stage1 binary"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
            echo "STAGE1_BIN=stage1" >> "$GITHUB_ENV"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ghdl "thagore-runtime-windows.lib"
            cp bootstrap/thagore-runtime-windows.lib thag_runtime.lib
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            ghdl "thagore-runtime-linux.a"
            cp bootstrap/thagore-runtime-linux.a libthag_runtime.a
            cp libthag_runtime.a thag_runtime.lib
          else
            ghdl "thagore-runtime-macos.a"
            cp bootstrap/thagore-runtime-macos.a libthag_runtime.a
            cp libthag_runtime.a thag_runtime.lib
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-longhaul-${{ runner.os }}.txt"

      - name: Longhaul 10 rounds (Stage1 -> Stage2 -> Stage2)
        shell: bash
        run: |
          set -euxo pipefail
          : > "$SOAK_REPORT_FILE"
          echo "runner_os=${{ runner.os }}" >> "$SOAK_REPORT_FILE"
          echo "seed_tag=$BOOTSTRAP_STAGE1_TAG" >> "$SOAK_REPORT_FILE"
          echo "rounds=$LONGHAUL_ROUNDS" >> "$SOAK_REPORT_FILE"
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          build_require_artifact() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" --build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              LAST_BIN="$cc"
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            LAST_BIN=""
            return 1
          }
          build_with_candidates() {
            local src="$1"
            local out="$2"
            shift 2
            for cc in "$@"; do
              [[ -n "$cc" && -f "$cc" ]] || continue
              if build_require_artifact "$cc" "$src" "$out"; then
                return 0
              fi
              echo "[WARN] compiler $cc did not emit artifact for $src with out=$out" | tee -a "$STAGE_TRACE_FILE"
            done
            return 1
          }
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
            else
              shasum -a 256 "$f" | awk '{print $1}'
            fi
          }
          round=1
          while [[ "$round" -le "$LONGHAUL_ROUNDS" ]]; do
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              S2="lh_stage2_${round}.exe"
              S2R="lh_stage2r_${round}.exe"
              H="lh_hello_${round}.exe"
              F="lh_fib_${round}.exe"
            else
              S2="lh_stage2_${round}"
              S2R="lh_stage2r_${round}"
              H="lh_hello_${round}"
              F="lh_fib_${round}"
            fi
            rm -f "$S2" "$S2R" "$H" "$F" "${S2}.exe" "${S2R}.exe" "${H}.exe" "${F}.exe" || true
            LAST_BIN=""
            build_require_artifact "$STAGE1_BIN" src/thagore.tg "$S2"
            S2_REAL="$LAST_BIN"
            test -n "$S2_REAL"
            test -f "$S2_REAL"
            chmod +x "$S2_REAL" || true

            LAST_BIN=""
            build_require_artifact "$S2_REAL" src/thagore.tg "$S2R"
            S2R_REAL="$LAST_BIN"
            test -n "$S2R_REAL"
            test -f "$S2R_REAL"
            chmod +x "$S2R_REAL" || true

            LAST_BIN=""
            build_with_candidates examples/hello.tg "$H" "$S2R_REAL" "$S2_REAL" "$STAGE1_BIN"
            H_REAL="$LAST_BIN"
            test -n "$H_REAL"
            test -f "$H_REAL"
            chmod +x "$H_REAL" || true
            "./$H_REAL"

            LAST_BIN=""
            build_with_candidates examples/fib.tg "$F" "$S2R_REAL" "$S2_REAL" "$STAGE1_BIN"
            F_REAL="$LAST_BIN"
            test -n "$F_REAL"
            test -f "$F_REAL"
            chmod +x "$F_REAL" || true
            "./$F_REAL"

            H1="$(hash_file "$S2_REAL")"
            H2="$(hash_file "$S2R_REAL")"
            echo "[ROUND $round] s2=$S2_REAL sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
            echo "[ROUND $round] s2r=$S2R_REAL sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
            echo "ROUND|$round|stage2=$S2_REAL|sha256=$H1" >> "$SOAK_REPORT_FILE"
            echo "ROUND|$round|stage2_rebuild=$S2R_REAL|sha256=$H2" >> "$SOAK_REPORT_FILE"
            if [[ "$H1" != "$H2" && "${{ runner.os }}" != "Windows" ]]; then
              echo "ROUND|$round|status=hash_mismatch_unix" >> "$SOAK_REPORT_FILE"
              echo "CRITICAL: unix bootstrap hash mismatch at round $round" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
            echo "ROUND|$round|status=pass" >> "$SOAK_REPORT_FILE"
            round=$((round + 1))
          done

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-longhaul-${{ runner.os }}.txt"

      - name: Syntax matrix canary (longhaul)
        shell: bash
        run: |
          set -euxo pipefail
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "tests/$base" "tests/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          build_test() {
            local cc="$1"
            local test_src="$2"
            local test_bin="$3"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc build $test_src -o $test_bin" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$test_src" -o "$test_bin"; then
              local got
              got="$(resolve_bin "$test_bin" "$test_src" || true)"
              if [[ -n "$got" ]]; then
                BUILT_BIN="$got"
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $test_src -o $test_bin" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" --build "$test_src" -o "$test_bin"; then
              local got2
              got2="$(resolve_bin "$test_bin" "$test_src" || true)"
              if [[ -n "$got2" ]]; then
                BUILT_BIN="$got2"
                return 0
              fi
            fi
            echo "[WARN] $cc returned no syntax matrix artifact in longhaul for $test_src." | tee -a "$STAGE_TRACE_FILE"
            return 1
          }
          for TEST_SRC in tests/test_syntax_matrix.tg tests/test_syntax_matrix_edge.tg tests/test_syntax_matrix_negative.tg tests/test_syntax_contract_strict.tg tests/test_typecheck_contracts.tg tests/test_codegen_native_contracts.tg tests/test_codegen_condition_precedence.tg tests/test_language_pipeline.tg tests/test_native_pipeline.tg; do
            BASE="$(basename "$TEST_SRC" .tg)"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              TEST_BIN="${BASE}_longhaul.exe"
            else
              TEST_BIN="${BASE}_longhaul"
            fi
            rm -f "$TEST_BIN" "${TEST_BIN}.exe" || true
            BUILT_BIN=""
            if ! build_test "$STAGE1_BIN" "$TEST_SRC" "$TEST_BIN"; then
              echo "CRITICAL: failed to compile syntax matrix in longhaul for $TEST_SRC."
              exit 1
            fi
            test -n "$BUILT_BIN"
            test -f "$BUILT_BIN"
            chmod +x "$BUILT_BIN" || true
            "./$BUILT_BIN"
            echo "SYNTAX|$TEST_SRC|status=pass|binary=$BUILT_BIN" >> "$SOAK_REPORT_FILE"
          done

      - name: Validate soak report contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$SOAK_REPORT_FILE"
          test -f "$REPORT"
          grep -q '^runner_os=' "$REPORT"
          grep -q '^seed_tag=' "$REPORT"
          grep -q '^rounds=' "$REPORT"
          REQUIRED_TESTS=(
            "tests/test_syntax_matrix.tg"
            "tests/test_syntax_matrix_edge.tg"
            "tests/test_syntax_matrix_negative.tg"
            "tests/test_syntax_contract_strict.tg"
            "tests/test_typecheck_contracts.tg"
            "tests/test_codegen_native_contracts.tg"
            "tests/test_codegen_condition_precedence.tg"
            "tests/test_language_pipeline.tg"
            "tests/test_native_pipeline.tg"
          )
          for t in "${REQUIRED_TESTS[@]}"; do
            if ! grep -q "^SYNTAX|${t}|status=pass|" "$REPORT"; then
              echo "CRITICAL: missing SYNTAX pass entry for ${t}"
              cat "$REPORT"
              exit 1
            fi
          done
          PASS_ROUNDS="$(grep -Ec '^ROUND\|[0-9]+\|status=pass$' "$REPORT" || true)"
          if [[ "${PASS_ROUNDS}" -ne "${LONGHAUL_ROUNDS}" ]]; then
            echo "CRITICAL: pass rounds mismatch, got=${PASS_ROUNDS}, expect=${LONGHAUL_ROUNDS}"
            cat "$REPORT"
            exit 1
          fi

      - name: Guard no-stage0 markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden stage0 markers detected in longhaul trace."
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Upload longhaul traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-longhaul-${{ runner.os }}
          path: |
            ${{ env.STAGE_TRACE_FILE }}
            ${{ env.SOAK_REPORT_FILE }}
            runtime-abi-summary-longhaul-${{ runner.os }}.txt
            runtime-abi-inventory-longhaul-${{ runner.os }}.txt
