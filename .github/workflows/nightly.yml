name: Nightly Toolchain

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-hosted:
    name: Nightly hosted ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-gnu
            archive: zip
            use_cross: false
          - runner: windows-latest
            target: i686-pc-windows-msvc
            archive: zip
            use_cross: false
          - runner: windows-latest
            target: i686-pc-windows-gnu
            archive: zip
            use_cross: false
          - runner: ubuntu-latest
            target: i686-unknown-linux-gnu
            archive: tar.gz
            use_cross: true
          - runner: ubuntu-latest
            target: wasm32-wasip1
            archive: tar.gz
            use_cross: false
          - runner: ubuntu-latest
            target: wasm32-unknown-unknown
            archive: tar.gz
            use_cross: false
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 llvm-14-dev llvm-14-tools lld pkg-config zip
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cargo install cross --locked
          fi

      - name: Install Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'LLVM-14.0.6-win64'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-14.0.6-win64.exe'
          if (Test-Path $llvmRoot) {
            Remove-Item -Recurse -Force $llvmRoot
          }
          Invoke-WebRequest `
            -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/LLVM-14.0.6-win64.exe' `
            -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvmRoot" -Wait -PassThru
          if ($null -ne $process.ExitCode -and $process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          $llvmLib = Join-Path $llvmRoot 'lib'
          $llvmInclude = Join-Path $llvmRoot 'include'
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin directory not found at $llvmBin"
          }
          if (-not (Test-Path $llvmLib)) {
            throw "LLVM lib directory not found at $llvmLib"
          }
          if (-not (Test-Path $llvmInclude)) {
            throw "LLVM include directory not found at $llvmInclude"
          }
          $configCandidate = Join-Path $llvmBin 'llvm-config.exe'
          if (-not (Test-Path $configCandidate)) {
            $shimSource = Join-Path $env:RUNNER_TEMP 'llvm-config-nightly.cs'
            @(
              'using System;',
              'using System.IO;',
              'using System.Linq;',
              '',
              'internal static class Program',
              '{',
              '    private static int Main(string[] args)',
              '    {',
              '        string root = Environment.GetEnvironmentVariable("THAGORE_LLVM_ROOT") ?? "";',
              '        string lib = Path.Combine(root, "lib");',
              '        string include = Path.Combine(root, "include");',
              '',
              '        if (args.Contains("--version"))',
              '        {',
              '            Console.WriteLine("14.0.6");',
              '            return 0;',
              '        }',
              '        if (args.Contains("--prefix"))',
              '        {',
              '            Console.WriteLine(root);',
              '            return 0;',
              '        }',
              '        if (args.Contains("--libdir"))',
              '        {',
              '            Console.WriteLine(lib);',
              '            return 0;',
              '        }',
              '        if (args.Contains("--includedir"))',
              '        {',
              '            Console.WriteLine(include);',
              '            return 0;',
              '        }',
              '        if (args.Contains("--build-mode"))',
              '        {',
              '            Console.WriteLine("Release");',
              '            return 0;',
              '        }',
              '        if (args.Contains("--cflags"))',
              '        {',
              '            Console.WriteLine("-I" + include);',
              '            return 0;',
              '        }',
              '        if (args.Contains("--ldflags"))',
              '        {',
              '            Console.WriteLine("");',
              '            return 0;',
              '        }',
              '        if (args.Contains("--system-libs"))',
              '        {',
              '            Console.WriteLine("");',
              '            return 0;',
              '        }',
              '        if (args.Contains("--libnames") || args.Contains("--libs"))',
              '        {',
              '            var libs = Directory.EnumerateFiles(lib, "*.lib")',
              '                .Select(Path.GetFileName)',
              '                .Where(name => !string.IsNullOrWhiteSpace(name))',
              '                .OrderBy(name => name, StringComparer.OrdinalIgnoreCase);',
              '            Console.WriteLine(string.Join(" ", libs));',
              '            return 0;',
              '        }',
              '',
              '        Console.WriteLine("");',
              '        return 0;',
              '    }',
              '}'
            ) | Set-Content -Path $shimSource -Encoding UTF8
            & csc /nologo "/out:$configCandidate" $shimSource
          }
          choco install mingw -y
          "LLVM_SYS_140_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "THAGORE_LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_CONFIG_PATH=$configCandidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build nightly binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target "${{ matrix.target }}" -p thagore-cli -p thagore-fmt -p thagore-lsp
          else
            cargo build --release --target "${{ matrix.target }}" -p thagore-cli -p thagore-fmt -p thagore-lsp
          fi

      - name: Build nightly binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ('${{ matrix.target }}' -like 'i686-*') { 'x86' } else { 'x64' }
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\$arch\link.exe"
          if (-not (Test-Path $linker)) {
            throw "MSVC linker not found at $linker"
          }
          $targetEnv = ('CARGO_TARGET_' + '${{ matrix.target }}'.ToUpperInvariant().Replace('-', '_') + '_LINKER')
          Set-Item -Path "Env:$targetEnv" -Value $linker
          cargo build --release --target "${{ matrix.target }}" -p thagore-cli -p thagore-fmt -p thagore-lsp

      - name: Package nightly archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          mkdir -p dist
          python3 tooling/release/package_release.py \
            --version "${TAG}" \
            --tag "${TAG}" \
            --target "${{ matrix.target }}" \
            --archive-format "${{ matrix.archive }}" \
            --support-tier "nightly" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --stdlib-dir "stdlib" \
            --installer-dir "tooling/release" \
            --out-dir "dist"

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*

  build-self-hosted:
    name: Nightly self-hosted ${{ matrix.target }}
    runs-on: ${{ fromJson(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_labels: '["self-hosted","dragonflybsd","x64"]'
            target: x86_64-unknown-dragonfly
            archive: tar.gz
          - runner_labels: '["self-hosted","illumos","x64"]'
            target: x86_64-unknown-illumos
            archive: tar.gz
          - runner_labels: '["self-hosted","android","x64"]'
            target: x86_64-linux-android
            archive: tar.gz
          - runner_labels: '["self-hosted","android","arm64"]'
            target: aarch64-linux-android
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build nightly binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" -p thagore-cli -p thagore-fmt -p thagore-lsp

      - name: Package nightly archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          mkdir -p dist
          python3 tooling/release/package_release.py \
            --version "${TAG}" \
            --tag "${TAG}" \
            --target "${{ matrix.target }}" \
            --archive-format "${{ matrix.archive }}" \
            --support-tier "nightly" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --stdlib-dir "stdlib" \
            --installer-dir "tooling/release" \
            --out-dir "dist"

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*

  publish-nightly:
    name: Publish nightly assets
    needs: [build-hosted, build-self-hosted]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRAGO_VERSION: "1.0.7"
    steps:
      - uses: actions/checkout@v5

      - name: Resolve nightly tag
        run: |
          TAG="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Normalize dist layout
        run: |
          mkdir -p release-dist
          find dist -type f -maxdepth 2 -exec cp {} release-dist/ \;
          cp tooling/release/thagup.sh release-dist/
          cp tooling/release/thagup.ps1 release-dist/

      - name: Generate nightly manifest
        run: |
          python3 tooling/release/generate_release_manifest.py \
            --version "${RELEASE_TAG}" \
            --tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-dir release-dist \
            --targets-file tooling/packaging/targets.json \
            --tiers "nightly" \
            --require-complete \
            --drago-version "${DRAGO_VERSION}" \
            --drago-tag "v${DRAGO_VERSION}"

      - name: Publish nightly release
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --prerelease --title "${RELEASE_TAG}" --notes "Automated nightly build"
          gh release upload "${RELEASE_TAG}" release-dist/* --clobber
