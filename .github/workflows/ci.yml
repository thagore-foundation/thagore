name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seed tag sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/verify_seed_tag_sync.py --report seed-tag-sync-ci.txt

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "180"

  verify-selfhost:
    name: ci-selfhost (${{ matrix.os }})
    needs: discord-notify-init
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
      STAGE_TRACE_FILE: stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Bootstrap Stage1 (asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          download_runtime_asset() {
            local pattern="$1"
            local dest="$2"
            if gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap; then
              cp "bootstrap/$pattern" "$dest"
              return 0
            fi
            return 1
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out"; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            rm -f s1_probe_fib s1_probe_fib.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" src/thagore.tg s1_probe_s2_rebuild || return 1
            local probe_s2_rebuild
            probe_s2_rebuild="$(resolve_bin "s1_probe_s2_rebuild" "src/thagore.tg" || true)"
            if [[ -z "$probe_s2_rebuild" ]]; then
              probe_s2_rebuild="$probe_s2"
            fi
            [[ -n "$probe_s2_rebuild" && -f "$probe_s2_rebuild" ]] || return 1
            chmod +x "$probe_s2_rebuild" || true
            thg_build "$probe_s2_rebuild" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            thg_build "$probe_s2_rebuild" examples/fib.tg s1_probe_fib || return 1
            local probe_fib
            probe_fib="$(resolve_bin "s1_probe_fib" "examples/fib.tg" || true)"
            [[ -n "$probe_fib" && -f "$probe_fib" ]] || return 1
            return 0
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1.exe; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Windows stage1 asset found in releases."; exit 1)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-linux.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Linux stage1 asset found in releases."; exit 1)
          else
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-macos.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no macOS stage1 asset found in releases."; exit 1)
          fi
          chmod +x "$STAGE1_BIN" || true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            download_runtime_asset "thagore-runtime-windows.lib" "thag_runtime.lib"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            download_runtime_asset "thagore-runtime-linux.a" "libthag_runtime.a"
            cp libthag_runtime.a thag_runtime.lib
          else
            download_runtime_asset "thagore-runtime-macos.a" "libthag_runtime.a"
            cp libthag_runtime.a thag_runtime.lib
          fi
          MANIFEST_ASSET="seed-promotion-manifest-${{ runner.os }}.txt"
          download_asset "$MANIFEST_ASSET"
          [[ -f "bootstrap/$MANIFEST_ASSET" ]] || (echo "CRITICAL: missing seed promotion manifest $MANIFEST_ASSET"; exit 1)
          echo "[SEED] manifest=$MANIFEST_ASSET" | tee -a "$STAGE_TRACE_FILE"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-ci-${{ matrix.os }}.txt"
          echo "STAGE1_BIN=$STAGE1_BIN" >> "$GITHUB_ENV"

      - name: Discord update - Bootstrap Stage1 (asset only)
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Bootstrap Stage1 (asset only)

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-ci-${{ matrix.os }}.txt"

      - name: Intent registry budget gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/intent_budget_gate.py

      - name: Intent suite (doctor + strict-lock)
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          CLI_BIN="./$STAGE1_BIN"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            INTENT_CLI="$CLI_BIN"
            if "./$STAGE1_BIN" build src/thagore.tg -o stage_intent >/dev/null 2>&1; then
              if [[ -f stage_intent ]]; then
                chmod +x stage_intent || true
                INTENT_CLI="./stage_intent"
              fi
            fi
            set +e
            THAGORE_INTERNAL_EMIT=1 "$PY" scripts/intent_suite.py --cli "$INTENT_CLI" > intent-suite.log 2>&1
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              cat intent-suite.log
              if grep -q "did not produce valid JSON output" intent-suite.log; then
                echo "WARN: intent suite JSON output missing on Linux bootstrap seed; continue while native chain gate remains."
              else
                exit $rc
              fi
            fi
          else
            if ! THAGORE_INTERNAL_EMIT=1 "$PY" scripts/intent_suite.py --cli "$CLI_BIN"; then
              echo "WARN: intent suite failed on ${{ runner.os }}; continuing CI while keeping Linux strict gate."
            fi
          fi

      - name: Selfhost chain Stage1 -> Stage2 -> Stage2
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local base
            base="$(basename "$src" .tg)"
            resolve_local() {
              local preferred="$1"
              local src_base="$2"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$src_base" "$src_base.exe" "examples/$src_base" "examples/$src_base.exe" "src/$src_base" "src/$src_base.exe" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" "$base" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" "$base" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            echo "CRITICAL: compiler $cc succeeded but produced no artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE"
            return 1
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_ci.exe"
            FIB_BIN="fib_ci.exe"
          else
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_ci"
            FIB_BIN="fib_ci"
          fi

          thg_build "$STAGE1_BIN" src/thagore.tg "$STAGE2_BIN"
          STAGE2_BIN="$(resolve_bin "$STAGE2_BIN" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "$STAGE2_REBUILD_BIN"
          STAGE2_REBUILD_BIN="$(resolve_bin "$STAGE2_REBUILD_BIN" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
            echo "[INFO] using in-place rebuilt compiler: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          HELLO_TARGET="$HELLO_BIN"
          FIB_TARGET="$FIB_BIN"

          HELLO_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/hello.tg "$HELLO_TARGET"; then
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
              if [[ -n "$HELLO_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$HELLO_BIN"

          FIB_BIN=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
            [[ -n "$cc" && -f "$cc" ]] || continue
            if thg_build "$cc" examples/fib.tg "$FIB_TARGET"; then
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
              if [[ -n "$FIB_BIN" ]]; then
                break
              fi
            fi
          done
          test -f "$FIB_BIN"
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "WARN: bootstrap hash mismatch on Windows (non-bit-identical PE output)." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Discord update - Selfhost chain Stage1 -> Stage2 -> Stage2
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Selfhost chain Stage1 -> Stage2 -> Stage2

      - name: Run hello/fib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Autofix off regression gate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          COMPILER_PATH=".\\${STAGE1_BIN}"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/autofix_off_regression.ps1 \
            -Compiler "$COMPILER_PATH" \
            -Entry "examples/hello.tg" \
            -Runs 2 \
            -MaxOverheadPct 45 \
            -JsonOut "autofix-off-regression.json"

      - name: Autofix contract tests
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN1="autofix_cli_ci.exe"
            BIN2="autofix_report_golden_ci.exe"
            BIN3="autofix_compiler_suggestions_ci.exe"
          else
            BIN1="autofix_cli_ci"
            BIN2="autofix_report_golden_ci"
            BIN3="autofix_compiler_suggestions_ci"
          fi
          "./$STAGE1_BIN" build tests/test_autofix_cli.tg -o "$BIN1"
          "./$STAGE1_BIN" build tests/test_autofix_report_golden.tg -o "$BIN2"
          "./$STAGE1_BIN" build tests/test_autofix_compiler_suggestions.tg -o "$BIN3"
          test -f "$BIN1"
          test -f "$BIN2"
          test -f "$BIN3"
          chmod +x "$BIN1" "$BIN2" "$BIN3" || true
          "./$BIN1"
          "./$BIN2"
          "./$BIN3"

      - name: Run syntax matrix (15 features)
        shell: bash
        run: |
          set -euxo pipefail
          REPORT="syntax-matrix-report.txt"
          : > "$REPORT"
          echo "runner_os=${{ runner.os }}" >> "$REPORT"
          echo "seed_tag=$BOOTSTRAP_STAGE1_TAG" >> "$REPORT"
          build_test() {
            local cc="$1"
            local test_src="$2"
            local test_bin="$3"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc build $test_src -o $test_bin" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" build "$test_src" -o "$test_bin" || return 1
            local got
            got="$(resolve_bin "$test_bin" "$test_src" || true)"
            if [[ -z "$got" ]]; then
              echo "CRITICAL: $cc returned success but produced no syntax matrix artifact for $test_src." | tee -a "$STAGE_TRACE_FILE"
              return 1
            fi
            BUILT_BIN="$got"
            USED_CC="$cc"
            return 0
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "tests/$base" "tests/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          for TEST_SRC in tests/test_syntax_matrix.tg tests/test_syntax_matrix_edge.tg tests/test_syntax_matrix_negative.tg tests/test_syntax_contract_strict.tg tests/test_typecheck_contracts.tg tests/test_codegen_native_contracts.tg tests/test_codegen_condition_precedence.tg tests/test_language_pipeline.tg tests/test_native_pipeline.tg tests/test_spec_parser_typecheck_lowering.tg; do
            BASE="$(basename "$TEST_SRC" .tg)"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              TEST_BIN="${BASE}_ci.exe"
            else
              TEST_BIN="${BASE}_ci"
            fi
            rm -f "$TEST_BIN" "${TEST_BIN}.exe" || true
            ok=0
            BUILT_BIN=""
            USED_CC=""
            for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
              if build_test "$cc" "$TEST_SRC" "$TEST_BIN"; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "FAIL|$TEST_SRC|compile_failed" >> "$REPORT"
              echo "CRITICAL: failed to compile syntax matrix test $TEST_SRC."
              exit 1
            fi
            RUN_BIN="$BUILT_BIN"
            if [[ -z "$RUN_BIN" ]]; then
              echo "FAIL|$TEST_SRC|missing_binary" >> "$REPORT"
              echo "CRITICAL: syntax matrix binary not found after compile for $TEST_SRC."
              ls -la || true
              exit 1
            fi
            test -f "$RUN_BIN"
            chmod +x "$RUN_BIN" || true
            "./$RUN_BIN"
            echo "PASS|$TEST_SRC|compiler=$USED_CC|binary=$RUN_BIN" >> "$REPORT"
          done
          cat "$REPORT" | tee -a "$STAGE_TRACE_FILE"

      - name: Upload syntax matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntax-matrix-report-ci-${{ matrix.os }}
          path: syntax-matrix-report.txt

      - name: Validate syntax matrix report contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT="syntax-matrix-report.txt"
          test -f "$REPORT"
          grep -q '^runner_os=' "$REPORT"
          grep -q '^seed_tag=' "$REPORT"
          REQUIRED_TESTS=(
            "tests/test_syntax_matrix.tg"
            "tests/test_syntax_matrix_edge.tg"
            "tests/test_syntax_matrix_negative.tg"
            "tests/test_syntax_contract_strict.tg"
            "tests/test_typecheck_contracts.tg"
            "tests/test_codegen_native_contracts.tg"
            "tests/test_codegen_condition_precedence.tg"
            "tests/test_language_pipeline.tg"
            "tests/test_native_pipeline.tg"
            "tests/test_spec_parser_typecheck_lowering.tg"
          )
          for t in "${REQUIRED_TESTS[@]}"; do
            if ! grep -q "^PASS|${t}|" "$REPORT"; then
              echo "CRITICAL: missing PASS entry for ${t} in ${REPORT}"
              cat "$REPORT"
              exit 1
            fi
          done
          if grep -q '^FAIL|' "$REPORT"; then
            echo "CRITICAL: FAIL rows found in ${REPORT}"
            cat "$REPORT"
            exit 1
          fi

      - name: Upload autofix off regression report (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: autofix-off-regression-ci-windows
          path: autofix-off-regression.json

      - name: Canary match-negative typecheck (non-blocking, Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          REPORT="canary-match-negative-windows-ci.txt"
          : > "$REPORT"
          echo "seed_tag=$BOOTSTRAP_STAGE1_TAG" >> "$REPORT"
          echo "stage2=$STAGE2_BIN" >> "$REPORT"
          echo "stage2_rebuild=$STAGE2_REBUILD_BIN" >> "$REPORT"
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "tests/$base" "tests/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          build_test() {
            local cc="$1"
            local test_src="$2"
            local test_bin="$3"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc build $test_src -o $test_bin" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" build "$test_src" -o "$test_bin" || return 1
            local got
            got="$(resolve_bin "$test_bin" "$test_src" || true)"
            if [[ -z "$got" ]]; then
              return 1
            fi
            BUILT_BIN="$got"
            USED_CC="$cc"
            return 0
          }

          TEST_SRC="tests/test_typecheck_match_negative.tg"
          TEST_BIN="test_typecheck_match_negative_canary.exe"
          rm -f "$TEST_BIN" "${TEST_BIN}.exe" || true
          ok=0
          BUILT_BIN=""
          USED_CC=""
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
            if build_test "$cc" "$TEST_SRC" "$TEST_BIN"; then
              ok=1
              break
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "status=compile_failed" >> "$REPORT"
            echo "WARN: canary compile failed for $TEST_SRC on Windows stage1 seed."
          else
            echo "compiler=$USED_CC" >> "$REPORT"
            echo "binary=$BUILT_BIN" >> "$REPORT"
            chmod +x "$BUILT_BIN" || true
            if "./$BUILT_BIN"; then
              echo "status=pass" >> "$REPORT"
            else
              echo "status=runtime_failed" >> "$REPORT"
              echo "WARN: canary runtime failed for $TEST_SRC on Windows stage1 seed."
            fi
          fi

      - name: Upload canary match-negative report (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: canary-match-negative-ci-windows
          path: canary-match-negative-windows-ci.txt

      - name: Verify comptime lowering emit
        shell: bash
        run: |
          set -euxo pipefail
          TEST_SRC="tests/test_comptime_func.tg"
          TEST_LL="test_comptime_func_ci.ll"
          rm -f "$TEST_LL"
          emit_ll() {
            local cc="$1"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc $TEST_SRC --emit-llvm -o $TEST_LL" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" "$TEST_SRC" --emit-llvm -o "$TEST_LL" || return 1
            [[ -f "$TEST_LL" ]] || return 1
            return 0
          }

          ok=0
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
            if emit_ll "$cc"; then
              ok=1
              break
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "WARN: comptime LLVM output not found; continuing."
            ls -la || true
            exit 0
          fi
          if [[ ! -f "$TEST_LL" ]]; then
            echo "WARN: comptime LLVM file missing after emit; continuing."
            ls -la || true
            exit 0
          fi
          if ! grep -Eq "define .*@main\\(" "$TEST_LL"; then
            echo "WARN: comptime LLVM output missing @main; continuing."
            cat "$TEST_LL" || true
            exit 0
          fi

      - name: Guard no-stage0 path
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: detected forbidden stage0 fallback markers in stage trace."
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi
          echo "Stage trace is clean:"
          cat "$STAGE_TRACE_FILE"

      - name: Enforce no C++ dependency gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/no_cpp_dependency_gate.py --report "no-cpp-dependency-ci-${{ matrix.os }}.txt"

      - name: Enforce deprecated API gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/deprecated_api_gate.py --report "deprecated-api-gate-ci-${{ matrix.os }}.txt"

      - name: Build spec snapshot audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/spec_snapshot_audit.py --os-tag "ci-${{ matrix.os }}" --out-dir "."

      - name: Upload selfhost artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-selfhost-${{ matrix.os }}
          path: |
            stage-trace.log
            stage1*
            stage2*
            runtime-abi-summary-ci-${{ matrix.os }}.txt
            runtime-abi-inventory-ci-${{ matrix.os }}.txt
            no-cpp-dependency-ci-${{ matrix.os }}.txt
            deprecated-api-gate-ci-${{ matrix.os }}.txt
            typed-ir-ci-${{ matrix.os }}.txt
            core-ir-ci-${{ matrix.os }}.txt
            spec-summary-ci-${{ matrix.os }}.txt
            seed-tag-sync-ci.txt

      - name: Upload typed-ir audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-ir-ci-${{ matrix.os }}
          path: typed-ir-ci-${{ matrix.os }}.txt

      - name: Upload core-ir audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-ci-${{ matrix.os }}
          path: core-ir-ci-${{ matrix.os }}.txt

      - name: Upload spec-summary audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-summary-ci-${{ matrix.os }}
          path: spec-summary-ci-${{ matrix.os }}.txt

  native-cli-canary:
    name: native-cli-canary (ubuntu)
    runs-on: ubuntu-latest
    needs: [discord-notify-init, verify-selfhost]
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.25-stage1-seed"
      STAGE_TRACE_FILE: canary-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Bootstrap Stage1 (linux asset)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "thagore-stage1-linux.tar.gz" \
            -D bootstrap
          mkdir -p bootstrap/extract_stage1
          tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap/extract_stage1
          CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
          [[ -n "$CANDIDATE" && -f "$CANDIDATE" ]] || (echo "CRITICAL: missing stage1 binary in linux seed asset"; exit 1)
          cp "$CANDIDATE" stage1
          chmod +x stage1
          gh release download "$BOOTSTRAP_STAGE1_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "thagore-runtime-linux.a" \
            -D bootstrap
          cp bootstrap/thagore-runtime-linux.a libthag_runtime.a
          cp libthag_runtime.a thag_runtime.lib
          gh release download "$BOOTSTRAP_STAGE1_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "seed-promotion-manifest-Linux.txt" \
            -D bootstrap
          [[ -f "bootstrap/seed-promotion-manifest-Linux.txt" ]] || (echo "CRITICAL: missing seed promotion manifest seed-promotion-manifest-Linux.txt"; exit 1)
          echo "[SEED] manifest=seed-promotion-manifest-Linux.txt" | tee -a "$STAGE_TRACE_FILE"
          python3 scripts/build_runtime_abi.py --target-os "Linux" --summary "runtime-abi-summary-canary-linux.txt"

      - name: Discord update - Bootstrap Stage1 (linux asset)
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Bootstrap Stage1 (linux asset)

      - name: Runtime ABI bootstrap-critical gate (canary)
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write runtime-abi-inventory-canary-linux.txt

      - name: Canary build native CLI module
        shell: bash
        run: |
          set -euxo pipefail
          rm -f thagore_cli_canary thagore_cli_canary.ll cli_canary.ll || true
          echo "[CMD] ./stage1 build src/driver/cli/main.tg -o thagore_cli_canary" | tee -a "$STAGE_TRACE_FILE"
          ./stage1 build src/driver/cli/main.tg -o thagore_cli_canary || true
          if [[ -f thagore_cli_canary ]]; then
            chmod +x thagore_cli_canary || true
            ./thagore_cli_canary --version || true
          fi
          if [[ ! -f thagore_cli_canary.ll ]]; then
            echo "[CMD] ./stage1 src/driver/cli/main.tg --emit-llvm" | tee -a "$STAGE_TRACE_FILE"
            ./stage1 src/driver/cli/main.tg --emit-llvm || true
          fi
          if [[ -f thagore.ll ]]; then
            cp thagore.ll cli_canary.ll
          elif [[ -f thagore_cli_canary.ll ]]; then
            cp thagore_cli_canary.ll cli_canary.ll
          else
            pick_ll="$(find . -maxdepth 1 -type f -name "*.ll" | head -n 1 || true)"
            [[ -n "$pick_ll" ]] && cp "$pick_ll" cli_canary.ll
          fi
          [[ -f cli_canary.ll ]] || (echo "CRITICAL: native CLI canary did not emit LLVM"; exit 1)
          grep -Eq "define .*@main\\(" cli_canary.ll || (echo "CRITICAL: native CLI canary LLVM missing @main"; cat cli_canary.ll; exit 1)

      - name: Discord update - Canary build native CLI module
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Canary build native CLI module

      - name: Guard no-stage0 path (canary)
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: native CLI canary trace contains forbidden stage0 markers."
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-canary-ubuntu
          path: |
            canary-stage-trace.log
            cli_canary.ll
            thagore_cli_canary
            runtime-abi-summary-canary-linux.txt
            runtime-abi-inventory-canary-linux.txt

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    needs: [discord-notify-init, discord-notify-live, verify-selfhost, native-cli-canary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        continue-on-error: true
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
