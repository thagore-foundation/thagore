name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity-and-deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parity and deterministic tests
        run: |
          python -m compileall tooling tests
          python -m unittest discover -s tests -p "test_*.py"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 21 + build tools
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build clang-format \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev \
            golang-go rustc cargo

      - name: Format check (C++)
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            files=$(git diff --name-only HEAD^ HEAD -- '*.cpp' '*.hpp')
          else
            files=$(git ls-files '*.cpp' '*.hpp')
          fi
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j

      - name: Enforce startup and binary size budgets
        run: |
          python tooling/policy/check_startup_budget.py \
            --bin build/compiler/thagc \
            --budgets contracts/perf/startup_budget.json \
            --key linux-x86_64
          python tooling/policy/check_binary_size_budget.py \
            --bin build/compiler/thagc \
            --budgets contracts/perf/binary_size_budget.json \
            --key linux-x86_64

      - name: Benchmark automation and latency budget gate
        run: |
          python3 -m pip install --user flask
          mkdir -p dist
          python tooling/bench/run_benchmarks.py \
            --thagc build/compiler/thagc \
            --out-json dist/perf-metrics.json \
            --out-markdown dist/perf-report.md \
            --startup-iterations 20 \
            --build-iterations 8 \
            --run-iterations 12 \
            --require-runtimes go,rust,python
          python tooling/policy/check_public_backend_gate.py \
            --metrics dist/perf-metrics.json \
            --contract contracts/perf/backend_compete_v1_8.json
          python tooling/policy/check_latency_budget.py \
            --metrics dist/perf-metrics.json \
            --budgets contracts/perf/latency_budget.json \
            --key linux-x86_64
          python tooling/bench/run_model_serving_benchmark.py \
            --thagc build/compiler/thagc \
            --out-json dist/perf-model-serving-v1.7.json \
            --out-markdown dist/perf-model-serving-v1.7.md \
            --iterations 12 \
            --workload-loops 4000
          python tooling/policy/check_model_serving_gate.py \
            --metrics dist/perf-model-serving-v1.7.json \
            --contract contracts/perf/model_serving_gate_v1_7.json

      - name: Upload performance metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics-${{ github.sha }}
          path: |
            dist/perf-metrics.json
            dist/perf-report.md
            dist/perf-model-serving-v1.7.json
            dist/perf-model-serving-v1.7.md
          if-no-files-found: error

      - name: Run full Python suites with built compiler
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM + build tools
        run: |
          brew update
          brew install llvm@21 ninja cmake libffi libxml2 zlib curl
          echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"

      - name: Build
        run: cmake --build build -j

      - name: Run full Python suites with built compiler
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM + Ninja
        shell: powershell
        run: |
          choco install -y llvm --version=21.1.3
          if ($LASTEXITCODE -ne 0) {
            choco install -y llvm
          }
          choco install -y ninja
          $roots = @(
            "C:\Program Files\LLVM",
            "C:\ProgramData\chocolatey\lib\llvm\tools\llvm"
          )
          $llvmRoot = $null
          foreach ($candidate in $roots) {
            if (Test-Path "$candidate\include\llvm\IR\BasicBlock.h") {
              $llvmRoot = $candidate
              break
            }
          }
          if (-not $llvmRoot) {
            throw "LLVM headers not found after installation"
          }
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$($llvmRoot -replace '\\','/')/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DLLVM_INCLUDE_DIRS="$env:LLVM_ROOT/include" `
            -DLLVM_LIBRARY_DIRS="$env:LLVM_ROOT/lib"

      - name: Build
        shell: powershell
        run: cmake --build build --config Release -j

      - name: Run full Python suites with built compiler
        shell: powershell
        env:
          THAGC_BIN: build/compiler/thagc.exe
        run: |
          python -m unittest discover -s tests -p "test_*.py"
