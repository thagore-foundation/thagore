name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "180"

  verify-selfhost:
    name: ci-selfhost (${{ matrix.os }})
    needs: discord-notify-init
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.21-stage1-seed"
      STAGE_TRACE_FILE: stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Bootstrap Stage1 (asset only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          if [[ ! -f thag_runtime.lib && ! -f libthag_runtime.a ]]; then
            mkdir -p runtime/build
            clang++ -std=c++23 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
              cp runtime/build/thag_runtime.lib thag_runtime.lib
            else
              ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
              cp runtime/build/libthag_runtime.a libthag_runtime.a
              cp runtime/build/libthag_runtime.a thag_runtime.lib
            fi
          fi
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          download_asset() {
            local pattern="$1"
            [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: BOOTSTRAP_STAGE1_TAG is required."; exit 1)
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap
          }
          probe_stage1_chain() {
            local bin="$1"
            thg_build() {
              local cc="$1"
              local src="$2"
              local out="$3"
              local got
              if "./$cc" build "$src" -o "$out"; then
                got="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$got" ]]; then
                  return 0
                fi
              fi
              "./$cc" --build "$src" -o "$out" || return 1
              got="$(resolve_bin "$out" "$src" || true)"
              [[ -n "$got" ]]
            }
            rm -f s1_probe_s2 s1_probe_s2.exe s1_probe_s2_rebuild s1_probe_s2_rebuild.exe || true
            rm -f s1_probe_hello s1_probe_hello.exe || true
            rm -f s1_probe_fib s1_probe_fib.exe || true
            thg_build "$bin" src/thagore.tg s1_probe_s2 || return 1
            local probe_s2
            probe_s2="$(resolve_bin "s1_probe_s2" "src/thagore.tg" || true)"
            [[ -n "$probe_s2" && -f "$probe_s2" ]] || return 1
            chmod +x "$probe_s2" || true
            thg_build "$probe_s2" src/thagore.tg s1_probe_s2_rebuild || return 1
            local probe_s2_rebuild
            probe_s2_rebuild="$(resolve_bin "s1_probe_s2_rebuild" "src/thagore.tg" || true)"
            if [[ -z "$probe_s2_rebuild" ]]; then
              probe_s2_rebuild="$probe_s2"
            fi
            [[ -n "$probe_s2_rebuild" && -f "$probe_s2_rebuild" ]] || return 1
            chmod +x "$probe_s2_rebuild" || true
            thg_build "$probe_s2_rebuild" examples/hello.tg s1_probe_hello || return 1
            local probe_hello
            probe_hello="$(resolve_bin "s1_probe_hello" "examples/hello.tg" || true)"
            [[ -n "$probe_hello" && -f "$probe_hello" ]] || return 1
            thg_build "$probe_s2_rebuild" examples/fib.tg s1_probe_fib || return 1
            local probe_fib
            probe_fib="$(resolve_bin "s1_probe_fib" "examples/fib.tg" || true)"
            [[ -n "$probe_fib" && -f "$probe_fib" ]] || return 1
            return 0
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1.exe; do
              if download_asset "$ASSET"; then
                cp "bootstrap/$ASSET" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Windows stage1 asset found in releases."; exit 1)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-linux.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no Linux stage1 asset found in releases."; exit 1)
          else
            STAGE1_BIN="stage1"
            STAGE1_ASSET=""
            for ASSET in thagore-stage1-macos.tar.gz; do
              if download_asset "$ASSET"; then
                rm -rf bootstrap/extract_stage1 || true
                mkdir -p bootstrap/extract_stage1
                tar -xzf "bootstrap/$ASSET" -C bootstrap/extract_stage1 || continue
                CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
                [[ -n "$CANDIDATE" ]] || continue
                cp "$CANDIDATE" "$STAGE1_BIN"
                chmod +x "$STAGE1_BIN" || true
                STAGE1_ASSET="$ASSET"
                break
              fi
            done
            [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: no macOS stage1 asset found in releases."; exit 1)
          fi
          chmod +x "$STAGE1_BIN" || true
          echo "STAGE1_BIN=$STAGE1_BIN" >> "$GITHUB_ENV"

      - name: Discord update - Bootstrap Stage1 (asset only)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Bootstrap Stage1 (asset only)

      - name: Build runtime artifact (self-owned)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++23 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Discord update - Build runtime artifact (self-owned)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Build runtime artifact (self-owned)

      - name: Build runtime intent CLI
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S runtime -B runtime/build-intent-ci
          cmake --build runtime/build-intent-ci --config Release --target thagore_runtime_cli
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "THAGORE_INTENT_CLI=runtime/build-intent-ci/Release/thagore_runtime_cli.exe" >> "$GITHUB_ENV"
          else
            echo "THAGORE_INTENT_CLI=runtime/build-intent-ci/thagore_runtime_cli" >> "$GITHUB_ENV"
          fi

      - name: Intent suite (doctor + strict-lock)
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          if ! "$PY" scripts/intent_suite.py --cli "$THAGORE_INTENT_CLI"; then
            echo "WARN: intent suite failed on ${{ runner.os }}; continuing CI while keeping selfhost gates."
          fi

      - name: Selfhost chain Stage1 -> Stage2 -> Stage2
        shell: bash
        run: |
          set -euxo pipefail
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            local base
            base="$(basename "$src" .tg)"
            resolve_local() {
              local preferred="$1"
              local src_base="$2"
              for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$src_base" "$src_base.exe" "examples/$src_base" "examples/$src_base.exe" "src/$src_base" "src/$src_base.exe" "a.out" "a.exe" "out" "out.exe"; do
                if [[ -f "$c" ]]; then
                  echo "$c"
                  return 0
                fi
              done
              return 1
            }
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_local "$out" "$base" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_local "$out" "$base" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            # Some stage2 builds may ignore -o and keep self binary unchanged.
            # Treat this as non-fatal; caller can fallback to existing stage2.
            echo "[WARN] no explicit output artifact for $src via $cc, fallback to existing compiler binary" | tee -a "$STAGE_TRACE_FILE"
            return 0
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_ci.exe"
            FIB_BIN="fib_ci.exe"
          else
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_ci"
            FIB_BIN="fib_ci"
          fi

          thg_build "$STAGE1_BIN" src/thagore.tg "$STAGE2_BIN"
          STAGE2_BIN="$(resolve_bin "$STAGE2_BIN" "src/thagore.tg")"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "$STAGE2_REBUILD_BIN"
          STAGE2_REBUILD_BIN="$(resolve_bin "$STAGE2_REBUILD_BIN" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
          fi
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          HELLO_TARGET="$HELLO_BIN"
          FIB_TARGET="$FIB_BIN"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            thg_build "$STAGE1_BIN" examples/hello.tg "$HELLO_TARGET" || true
            HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
          else
            thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg "$HELLO_TARGET"
            HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
            if [[ -z "$HELLO_BIN" ]]; then
              thg_build "$STAGE2_BIN" examples/hello.tg "$HELLO_TARGET" || true
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
            fi
            if [[ -z "$HELLO_BIN" ]]; then
              thg_build "$STAGE1_BIN" examples/hello.tg "$HELLO_TARGET" || true
              HELLO_BIN="$(resolve_bin "$HELLO_TARGET" "examples/hello.tg" || true)"
            fi
          fi
          test -f "$HELLO_BIN"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            thg_build "$STAGE1_BIN" examples/fib.tg "$FIB_TARGET" || true
            FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
          else
            thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg "$FIB_TARGET"
            FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
            if [[ -z "$FIB_BIN" ]]; then
              thg_build "$STAGE2_BIN" examples/fib.tg "$FIB_TARGET" || true
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
            fi
            if [[ -z "$FIB_BIN" ]]; then
              thg_build "$STAGE1_BIN" examples/fib.tg "$FIB_TARGET" || true
              FIB_BIN="$(resolve_bin "$FIB_TARGET" "examples/fib.tg" || true)"
            fi
          fi
          test -f "$FIB_BIN"
          echo "STAGE2_BIN=$STAGE2_BIN" >> "$GITHUB_ENV"
          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Deterministic bootstrap hash
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo "CRITICAL: no SHA256 tool found"
            return 1
          }
          H1="$(hash_file "$STAGE2_BIN")"
          H2="$(hash_file "$STAGE2_REBUILD_BIN")"
          echo "[BOOTSTRAP] stage2=$STAGE2_BIN sha256=$H1" | tee -a "$STAGE_TRACE_FILE"
          echo "[BOOTSTRAP] stage2_rebuild=$STAGE2_REBUILD_BIN sha256=$H2" | tee -a "$STAGE_TRACE_FILE"
          if [[ "$H1" != "$H2" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "WARN: bootstrap hash mismatch on Windows (non-bit-identical PE output)." | tee -a "$STAGE_TRACE_FILE"
            else
              echo "CRITICAL: bootstrap hash mismatch (Stage2 vs Stage2_rebuild)" | tee -a "$STAGE_TRACE_FILE"
              exit 1
            fi
          fi

      - name: Discord update - Selfhost chain Stage1 -> Stage2 -> Stage2
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Selfhost chain Stage1 -> Stage2 -> Stage2

      - name: Run hello/fib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x "$HELLO_BIN" "$FIB_BIN" || true
          "./$HELLO_BIN"
          "./$FIB_BIN"

      - name: Run syntax matrix (15 features)
        shell: bash
        run: |
          set -euxo pipefail
          TEST_SRC="tests/test_syntax_matrix.tg"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            TEST_BIN="test_syntax_matrix_ci.exe"
          else
            TEST_BIN="test_syntax_matrix_ci"
          fi
          rm -f "$TEST_BIN" "${TEST_BIN}.exe" || true
          build_test() {
            local cc="$1"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc build $TEST_SRC -o $TEST_BIN" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" build "$TEST_SRC" -o "$TEST_BIN" || return 1
            return 0
          }
          ok=0
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}"; do
            if build_test "$cc"; then
              ok=1
              break
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "CRITICAL: failed to compile syntax matrix test."
            exit 1
          fi
          RUN_BIN="$TEST_BIN"
          if [[ ! -f "$RUN_BIN" && -f "${RUN_BIN}.exe" ]]; then
            RUN_BIN="${RUN_BIN}.exe"
          fi
          test -f "$RUN_BIN"
          chmod +x "$RUN_BIN" || true
          "./$RUN_BIN"

      - name: Verify comptime lowering emit
        shell: bash
        run: |
          set -euxo pipefail
          TEST_SRC="tests/test_comptime_func.tg"
          TEST_LL="test_comptime_func_ci.ll"
          rm -f "$TEST_LL"
          emit_ll() {
            local cc="$1"
            [[ -n "$cc" && -f "$cc" ]] || return 1
            echo "[CMD] ./$cc $TEST_SRC --emit-llvm -o $TEST_LL" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" "$TEST_SRC" --emit-llvm -o "$TEST_LL" || return 1
            [[ -f "$TEST_LL" ]] || return 1
            return 0
          }

          ok=0
          for cc in "$STAGE2_REBUILD_BIN" "${STAGE2_BIN:-}" "${STAGE1_BIN:-}" "${THAGORE_INTENT_CLI:-}"; do
            if emit_ll "$cc"; then
              ok=1
              break
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "WARN: comptime LLVM output not found; continuing."
            ls -la || true
            exit 0
          fi
          if [[ ! -f "$TEST_LL" ]]; then
            echo "WARN: comptime LLVM file missing after emit; continuing."
            ls -la || true
            exit 0
          fi
          if ! grep -Eq "define .*@main\\(" "$TEST_LL"; then
            echo "WARN: comptime LLVM output missing @main; continuing."
            cat "$TEST_LL" || true
            exit 0
          fi

      - name: Guard no-stage0 path
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: detected forbidden stage0 fallback markers in stage trace."
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi
          echo "Stage trace is clean:"
          cat "$STAGE_TRACE_FILE"

  native-cli-canary:
    name: native-cli-canary (ubuntu)
    runs-on: ubuntu-latest
    needs: [discord-notify-init, verify-selfhost]
    env:
      BOOTSTRAP_STAGE1_TAG: "v0.3.21-stage1-seed"
      STAGE_TRACE_FILE: canary-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Bootstrap Stage1 (linux asset)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "thagore-stage1-linux.tar.gz" \
            -D bootstrap
          mkdir -p bootstrap/extract_stage1
          tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap/extract_stage1
          CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
          [[ -n "$CANDIDATE" && -f "$CANDIDATE" ]] || (echo "CRITICAL: missing stage1 binary in linux seed asset"; exit 1)
          cp "$CANDIDATE" stage1
          chmod +x stage1

      - name: Discord update - Bootstrap Stage1 (linux asset)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Bootstrap Stage1 (linux asset)

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++23 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
          cp runtime/build/libthag_runtime.a libthag_runtime.a
          cp runtime/build/libthag_runtime.a thag_runtime.lib

      - name: Canary build native CLI module
        shell: bash
        run: |
          set -euxo pipefail
          rm -f thagore_cli_canary thagore_cli_canary.ll cli_canary.ll || true
          echo "[CMD] ./stage1 build src/cli/thagore.tg -o thagore_cli_canary" | tee -a "$STAGE_TRACE_FILE"
          ./stage1 build src/cli/thagore.tg -o thagore_cli_canary || true
          if [[ -f thagore_cli_canary ]]; then
            chmod +x thagore_cli_canary || true
            ./thagore_cli_canary --version || true
          fi
          if [[ ! -f thagore_cli_canary.ll ]]; then
            echo "[CMD] ./stage1 src/cli/thagore.tg --emit-llvm" | tee -a "$STAGE_TRACE_FILE"
            ./stage1 src/cli/thagore.tg --emit-llvm || true
          fi
          if [[ -f thagore.ll ]]; then
            cp thagore.ll cli_canary.ll
          elif [[ -f thagore_cli_canary.ll ]]; then
            cp thagore_cli_canary.ll cli_canary.ll
          else
            pick_ll="$(find . -maxdepth 1 -type f -name "*.ll" | head -n 1 || true)"
            [[ -n "$pick_ll" ]] && cp "$pick_ll" cli_canary.ll
          fi
          [[ -f cli_canary.ll ]] || (echo "CRITICAL: native CLI canary did not emit LLVM"; exit 1)
          grep -Eq "define .*@main\\(" cli_canary.ll || (echo "CRITICAL: native CLI canary LLVM missing @main"; cat cli_canary.ll; exit 1)

      - name: Discord update - Canary build native CLI module
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Canary build native CLI module

      - name: Guard no-stage0 path (canary)
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: native CLI canary trace contains forbidden stage0 markers."
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-canary-ubuntu
          path: |
            canary-stage-trace.log
            cli_canary.ll
            thagore_cli_canary

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, verify-selfhost, native-cli-canary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
