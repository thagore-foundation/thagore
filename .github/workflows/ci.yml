name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity-and-deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parity and deterministic tests
        run: |
          python -m compileall tooling tests
          python -m unittest discover -s tests -p "test_*.py"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 21 + build tools
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build clang-format \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev

      - name: Format check (C++)
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j

      - name: Run full Python suites with built compiler
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM + build tools
        run: |
          brew update
          brew install llvm@21 ninja cmake libffi libxml2 zlib curl
          echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"

      - name: Build
        run: cmake --build build -j

      - name: Run full Python suites with built compiler
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM + Ninja
        shell: powershell
        run: |
          choco install -y llvm --version=21.1.3
          choco install -y ninja
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

      - name: Build
        shell: powershell
        run: cmake --build build --config Release -j

      - name: Run full Python suites with built compiler
        shell: powershell
        env:
          THAGC_BIN: build/compiler/thagc.exe
        run: |
          python -m unittest discover -s tests -p "test_*.py"
