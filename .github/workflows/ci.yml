name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      STAGE_TRACE_FILE: stage-commands.log
      ALLOW_STAGE0_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      - name: Bootstrap Stage1 from release asset
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$STAGE_TRACE_FILE"
          mkdir -p bootstrap

          STAGE1_BIN="stage1"
          FINAL_BIN="thagore"
          HELLO_BIN="hello"
          FIB_BIN="fib"
          PROBE_BIN="stage1_probe"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            FINAL_BIN="thagore.exe"
            HELLO_BIN="hello.exe"
            FIB_BIN="fib.exe"
            PROBE_BIN="stage1_probe.exe"

            if gh release download --repo "${{ github.repository }}" --pattern "thagore-stage1.exe" -D bootstrap; then
              if [[ -f "bootstrap/thagore-stage1.exe" ]]; then
                cp "bootstrap/thagore-stage1.exe" "$STAGE1_BIN"
              fi
            fi

            if gh release download --repo "${{ github.repository }}" --pattern "thagore-windows-setup.exe" -D bootstrap; then
              mkdir -p bootstrap/install
              "bootstrap/thagore-windows-setup.exe" /S "/D=$PWD/bootstrap/install" || true
              if [[ -f "bootstrap/install/bin/thagore.exe" ]]; then
                cp "bootstrap/install/bin/thagore.exe" "$STAGE1_BIN"
              elif [[ -f "bootstrap/install/bin/thag.exe" ]]; then
                cp "bootstrap/install/bin/thag.exe" "$STAGE1_BIN"
              fi
            fi
            if [[ ! -f "$STAGE1_BIN" ]]; then
              if gh release download --repo "${{ github.repository }}" --pattern "thag-windows-setup.exe" -D bootstrap; then
                mkdir -p bootstrap/install
                "bootstrap/thag-windows-setup.exe" /S "/D=$PWD/bootstrap/install" || true
                if [[ -f "bootstrap/install/bin/thagore.exe" ]]; then
                  cp "bootstrap/install/bin/thagore.exe" "$STAGE1_BIN"
                elif [[ -f "bootstrap/install/bin/thag.exe" ]]; then
                  cp "bootstrap/install/bin/thag.exe" "$STAGE1_BIN"
                fi
              fi
            fi

            if [[ ! -f "$STAGE1_BIN" ]]; then
              if gh release download --repo "${{ github.repository }}" --pattern "thagore.exe" -D bootstrap; then
                if [[ -f "bootstrap/thagore.exe" ]]; then
                  cp "bootstrap/thagore.exe" "$STAGE1_BIN"
                elif [[ -f "bootstrap/thag.exe" ]]; then
                  cp "bootstrap/thag.exe" "$STAGE1_BIN"
                fi
              fi
            fi
          else
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              BOOTSTRAP_STAGE1_ASSET="thagore-stage1-linux.tar.gz"
              BOOTSTRAP_ASSET="thagore-linux.tar.gz"
              BOOTSTRAP_ASSET_LEGACY="thag-linux.tar.gz"
            else
              BOOTSTRAP_STAGE1_ASSET="thagore-stage1-macos.tar.gz"
              BOOTSTRAP_ASSET="thagore-macos.tar.gz"
              BOOTSTRAP_ASSET_LEGACY="thag-macos.tar.gz"
            fi
            MIN_BOOTSTRAP_SIZE=20000
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              MIN_BOOTSTRAP_SIZE=15000
            fi
            BOOTSTRAP_TAG="$(
              gh api "repos/${{ github.repository }}/releases?per_page=30" --jq ".[] | select(.draft == false and .prerelease == false) | select(any(.assets[]?; ((.name == \"$BOOTSTRAP_ASSET\" or .name == \"$BOOTSTRAP_ASSET_LEGACY\") and (.size >= $MIN_BOOTSTRAP_SIZE)))) | .tag_name" | head -n 1 || true
            )"
            DL_TAG_ARGS=()
            if [[ -n "$BOOTSTRAP_TAG" ]]; then
              echo "Using bootstrap release tag: $BOOTSTRAP_TAG" | tee -a "$STAGE_TRACE_FILE"
              DL_TAG_ARGS=("$BOOTSTRAP_TAG")
            else
              echo "WARN: could not find a healthy historical Unix bootstrap release; trying latest." | tee -a "$STAGE_TRACE_FILE"
            fi

            if gh release download "${DL_TAG_ARGS[@]}" --repo "${{ github.repository }}" --pattern "$BOOTSTRAP_STAGE1_ASSET" -D bootstrap; then
              mkdir -p bootstrap/extracted_stage1
              tar -xzf "bootstrap/$BOOTSTRAP_STAGE1_ASSET" -C bootstrap/extracted_stage1
              if [[ -f "bootstrap/extracted_stage1/bin/thagore" ]]; then
                cp "bootstrap/extracted_stage1/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_stage1/dist/bin/thagore" ]]; then
                cp "bootstrap/extracted_stage1/dist/bin/thagore" "$STAGE1_BIN"
              elif [[ -f "bootstrap/extracted_stage1/dist/bin/thag" ]]; then
                cp "bootstrap/extracted_stage1/dist/bin/thag" "$STAGE1_BIN"
              fi
            fi

            if [[ ! -f "$STAGE1_BIN" ]]; then
              if gh release download "${DL_TAG_ARGS[@]}" --repo "${{ github.repository }}" --pattern "$BOOTSTRAP_ASSET" -D bootstrap; then
                mkdir -p bootstrap/extracted
                tar -xzf "bootstrap/$BOOTSTRAP_ASSET" -C bootstrap/extracted
                if [[ -f "bootstrap/extracted/bin/thagore" ]]; then
                  cp "bootstrap/extracted/bin/thagore" "$STAGE1_BIN"
                elif [[ -f "bootstrap/extracted/dist/bin/thagore" ]]; then
                  cp "bootstrap/extracted/dist/bin/thagore" "$STAGE1_BIN"
                elif [[ -f "bootstrap/extracted/dist/bin/thag" ]]; then
                  cp "bootstrap/extracted/dist/bin/thag" "$STAGE1_BIN"
                fi
              fi
            fi
            if [[ ! -f "$STAGE1_BIN" ]]; then
              if gh release download "${DL_TAG_ARGS[@]}" --repo "${{ github.repository }}" --pattern "$BOOTSTRAP_ASSET_LEGACY" -D bootstrap; then
                mkdir -p bootstrap/extracted_legacy
                tar -xzf "bootstrap/$BOOTSTRAP_ASSET_LEGACY" -C bootstrap/extracted_legacy
                if [[ -f "bootstrap/extracted_legacy/bin/thagore" ]]; then
                  cp "bootstrap/extracted_legacy/bin/thagore" "$STAGE1_BIN"
                elif [[ -f "bootstrap/extracted_legacy/bin/thag" ]]; then
                  cp "bootstrap/extracted_legacy/bin/thag" "$STAGE1_BIN"
                elif [[ -f "bootstrap/extracted_legacy/dist/bin/thagore" ]]; then
                  cp "bootstrap/extracted_legacy/dist/bin/thagore" "$STAGE1_BIN"
                elif [[ -f "bootstrap/extracted_legacy/dist/bin/thag" ]]; then
                  cp "bootstrap/extracted_legacy/dist/bin/thag" "$STAGE1_BIN"
                fi
              fi
            fi

            if [[ ! -f "$STAGE1_BIN" ]]; then
              if gh release download --repo "${{ github.repository }}" --pattern "thagore" -D bootstrap; then
                if [[ -f "bootstrap/thagore" ]]; then
                  cp "bootstrap/thagore" "$STAGE1_BIN"
                elif [[ -f "bootstrap/thag" ]]; then
                  cp "bootstrap/thag" "$STAGE1_BIN"
                fi
              fi
            fi
          fi

          if [[ ! -f "$STAGE1_BIN" ]]; then
            if [[ "${{ runner.os }}" == "Windows" && ("$ALLOW_STAGE0_BOOTSTRAP" == "true" || "$ALLOW_STAGE0_BOOTSTRAP" == "1" || "$ALLOW_STAGE0_BOOTSTRAP" == "TRUE" || "$ALLOW_STAGE0_BOOTSTRAP" == "yes" || "$ALLOW_STAGE0_BOOTSTRAP" == "YES") ]]; then
              LLVM_ARG=""
              if [[ -n "${LLVM_PATH:-}" ]]; then
                LLVM_DOS="$(cygpath -d "$LLVM_PATH" 2>/dev/null || true)"
                if [[ -n "$LLVM_DOS" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_DOS}/lib/cmake/llvm"
                elif [[ -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
                fi
              fi
              echo "[CMD] cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}" | tee -a "$STAGE_TRACE_FILE"
              cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}
              echo "[CMD] cmake --build legacy/build --config Release" | tee -a "$STAGE_TRACE_FILE"
              cmake --build legacy/build --config Release
              if [[ -f "legacy/build/thag.exe" ]]; then
                cp "legacy/build/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/thag" ]]; then
                cp "legacy/build/thag" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag.exe" ]]; then
                cp "legacy/build/Release/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag" ]]; then
                cp "legacy/build/Release/thag" "$STAGE1_BIN"
              else
                echo "CRITICAL: stage0 fallback enabled but legacy build output not found."
                exit 1
              fi
            else
              echo "CRITICAL: Stage1 bootstrap asset is required but not found in GitHub Releases."
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                echo "Set ALLOW_STAGE0_BOOTSTRAP=true (or 1) to allow stage0 fallback on Windows."
              else
                echo "Unix runners require a valid Stage1 release asset; stage0 fallback is disabled."
              fi
              exit 1
            fi
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -f "legacy/thag_runtime.lib" ]]; then
              cp legacy/thag_runtime.lib thag_runtime.lib
            fi
          else
            RUNTIME_CXX="clang++"
            if ! command -v "$RUNTIME_CXX" >/dev/null 2>&1; then
              RUNTIME_CXX="c++"
            fi
            "$RUNTIME_CXX" -std=c++17 -Ilegacy/include -c legacy/src/runtime/runtime.cpp -o thag_runtime.o
            ar rcs libthag_runtime.a thag_runtime.o
            cp libthag_runtime.a thag_runtime.lib
          fi
          if [[ ! -f "thag_runtime.lib" && ! -f "libthag_runtime.a" ]]; then
            echo "CRITICAL: runtime library missing (thag_runtime.lib/libthag_runtime.a)."
            exit 1
          fi

          chmod +x "$STAGE1_BIN" || true
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find . -maxdepth 3 -type f -not -path "./bootstrap/*" \( -name "$base" -o -name "$base.exe" \) | head -n 1)"
            if [[ -n "$found" ]]; then
              echo "${found#./}"
              return 0
            fi
            return 1
          }
          thg_build() {
            local bin="$1"
            local src="$2"
            local out="$3"
            "./$bin" build "$src" -o "$out" && return 0
            "./$bin" --build "$src" -o "$out" && return 0
            "./$bin" "$src" -o "$out" && return 0
            "./$bin" build "$src" && return 0
            "./$bin" --build "$src" && return 0
            "./$bin" "$src" && return 0
            return 1
          }
          PROBE_COMPILER_BIN="stage1_compiler_probe"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PROBE_COMPILER_BIN="stage1_compiler_probe.exe"
          fi
          echo "[CMD] ./$STAGE1_BIN build examples/hello.tg -o $PROBE_BIN" | tee -a "$STAGE_TRACE_FILE"
          STAGE1_OK=1
          thg_build "$STAGE1_BIN" "examples/hello.tg" "$PROBE_BIN" || STAGE1_OK=0
          PROBE_RUN="$(resolve_bin "$PROBE_BIN" "examples/hello.tg" || true)"
          if [[ -n "$PROBE_RUN" && -f "$PROBE_RUN" ]]; then
            PROBE_BIN="$PROBE_RUN"
            chmod +x "$PROBE_BIN" || true
          else
            STAGE1_OK=0
          fi
          if [[ "$STAGE1_OK" == "1" ]]; then
            echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $PROBE_COMPILER_BIN" | tee -a "$STAGE_TRACE_FILE"
            thg_build "$STAGE1_BIN" "src/thagore.tg" "$PROBE_COMPILER_BIN" || STAGE1_OK=0
            PROBE_COMPILER_RUN="$(resolve_bin "$PROBE_COMPILER_BIN" "src/thagore.tg" || true)"
            if [[ -n "$PROBE_COMPILER_RUN" && -f "$PROBE_COMPILER_RUN" ]]; then
              PROBE_COMPILER_BIN="$PROBE_COMPILER_RUN"
              chmod +x "$PROBE_COMPILER_BIN" || true
            else
              STAGE1_OK=0
            fi
          fi
          if [[ "$STAGE1_OK" != "1" ]]; then
            echo "WARN: downloaded stage1 asset failed self-host probe."
            rm -f "$STAGE1_BIN"
            if [[ "${{ runner.os }}" == "Windows" && ("$ALLOW_STAGE0_BOOTSTRAP" == "true" || "$ALLOW_STAGE0_BOOTSTRAP" == "1" || "$ALLOW_STAGE0_BOOTSTRAP" == "TRUE" || "$ALLOW_STAGE0_BOOTSTRAP" == "yes" || "$ALLOW_STAGE0_BOOTSTRAP" == "YES") ]]; then
              LLVM_ARG=""
              if [[ -n "${LLVM_PATH:-}" ]]; then
                LLVM_DOS="$(cygpath -d "$LLVM_PATH" 2>/dev/null || true)"
                if [[ -n "$LLVM_DOS" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_DOS}/lib/cmake/llvm"
                elif [[ -d "${LLVM_PATH}/lib/cmake/llvm" ]]; then
                  LLVM_ARG="-DLLVM_DIR=${LLVM_PATH}/lib/cmake/llvm"
                fi
              fi
              echo "[CMD] cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}" | tee -a "$STAGE_TRACE_FILE"
              cmake -S legacy -B legacy/build -G Ninja -DCMAKE_BUILD_TYPE=Release ${LLVM_ARG}
              echo "[CMD] cmake --build legacy/build --config Release" | tee -a "$STAGE_TRACE_FILE"
              cmake --build legacy/build --config Release
              if [[ -f "legacy/build/thag.exe" ]]; then
                cp "legacy/build/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/thag" ]]; then
                cp "legacy/build/thag" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag.exe" ]]; then
                cp "legacy/build/Release/thag.exe" "$STAGE1_BIN"
              elif [[ -f "legacy/build/Release/thag" ]]; then
                cp "legacy/build/Release/thag" "$STAGE1_BIN"
              else
                echo "CRITICAL: stage0 fallback enabled but legacy build output not found."
                exit 1
              fi
            else
              echo "CRITICAL: stage1 asset invalid."
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                echo "Enable ALLOW_STAGE0_BOOTSTRAP only on Windows to allow fallback."
              else
                echo "Unix runners require a valid Stage1 release asset; stage0 fallback is disabled."
              fi
              exit 1
            fi
          fi
          "./$PROBE_BIN" || true

          echo "[CMD] ./$STAGE1_BIN build src/thagore.tg -o $FINAL_BIN" | tee -a "$STAGE_TRACE_FILE"
          thg_build "$STAGE1_BIN" "src/thagore.tg" "$FINAL_BIN" || (echo "CRITICAL: stage1->stage2 build command failed."; exit 1)
          FINAL_RUN="$(resolve_bin "$FINAL_BIN" "src/thagore.tg" || true)"
          if [[ -n "$FINAL_RUN" && -f "$FINAL_RUN" ]]; then
            FINAL_BIN="$FINAL_RUN"
            chmod +x "$FINAL_BIN" || true
          fi

          if [[ ! -f "$FINAL_BIN" ]]; then
            echo "ERROR: stage2 output not generated: $FINAL_BIN"
            exit 1
          fi

          echo "STAGE1_BIN=$STAGE1_BIN" >> "$GITHUB_ENV"
          echo "FINAL_BIN=$FINAL_BIN" >> "$GITHUB_ENV"
          echo "HELLO_BIN=$HELLO_BIN" >> "$GITHUB_ENV"
          echo "FIB_BIN=$FIB_BIN" >> "$GITHUB_ENV"

      - name: Build and run hello/fib
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          thg_build() {
            local bin="$1"
            local src="$2"
            local out="$3"
            "./$bin" build "$src" -o "$out" && return 0
            "./$bin" --build "$src" -o "$out" && return 0
            "./$bin" "$src" -o "$out" && return 0
            "./$bin" build "$src" && return 0
            "./$bin" --build "$src" && return 0
            "./$bin" "$src" && return 0
            return 1
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local found
            found="$(find . -maxdepth 3 -type f -not -path "./bootstrap/*" \( -name "$base" -o -name "$base.exe" \) | head -n 1)"
            if [[ -n "$found" ]]; then
              echo "${found#./}"
              return 0
            fi
            return 1
          }
          chmod +x "$FINAL_BIN" || true
          if [[ -f "$STAGE1_BIN" ]]; then
            export THAG_STAGE0_HELPER="./$STAGE1_BIN"
          fi
          thg_build "$FINAL_BIN" "examples/hello.tg" "$HELLO_BIN"
          thg_build "$FINAL_BIN" "examples/fib.tg" "$FIB_BIN"
          HELLO_RUN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          FIB_RUN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          chmod +x "$HELLO_RUN" "$FIB_RUN" || true
          "./$HELLO_RUN"
          "./$FIB_RUN"

      - name: CLI smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "./$FINAL_BIN" --version
          "./$FINAL_BIN" doctor || true

      - name: Stage trace summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Stage Trace (${{ matrix.os }})"
            echo "- bootstrap_source: release_asset_only"
            echo "- compiler_stage2: $FINAL_BIN"
            echo ""
            echo '```text'
            cat "$STAGE_TRACE_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
