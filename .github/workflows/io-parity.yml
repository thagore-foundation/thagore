name: IO Parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  io-ga:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev \
            cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev libsqlite3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@21 ninja cmake libffi libxml2 zlib curl sqlite

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y llvm --version=21.1.3
          if ($LASTEXITCODE -ne 0) {
            choco install -y llvm
          }
          choco install -y ninja
          $roots = @(
            "C:\Program Files\LLVM",
            "C:\ProgramData\chocolatey\lib\llvm\tools\llvm"
          )
          $llvmRoot = $null
          foreach ($candidate in $roots) {
            if (Test-Path "$candidate\include\llvm\IR\BasicBlock.h") {
              $llvmRoot = $candidate
              break
            }
          }
          if (-not $llvmRoot) {
            throw "LLVM headers not found after installation"
          }
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$($llvmRoot -replace '\\','/')/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure + build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build -j

      - name: Configure + build (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          cmake --build build -j

      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DLLVM_INCLUDE_DIRS="$env:LLVM_ROOT/include" `
            -DLLVM_LIBRARY_DIRS="$env:LLVM_ROOT/lib"
          cmake --build build --config Release -j

      - name: IO GA tests (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          THAGC_BIN: build/compiler/thagc
        run: |
          python -m unittest tests.integration.test_io_stack_ga

      - name: IO GA tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          THAGC_BIN: build/compiler/thagc.exe
        run: |
          python -m unittest tests.integration.test_io_stack_ga
