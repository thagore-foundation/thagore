name: Selfhost Soak Nightly

on:
  workflow_dispatch:
    inputs:
      longhaul_rounds:
        description: "Number of soak rounds per OS"
        required: false
        default: "3"
      bootstrap_stage1_tag:
        description: "Bootstrap seed tag"
        required: false
        default: "v0.3.167-stage1-seed"
  schedule:
    - cron: "0 2 * * *"

permissions:
  actions: read
  contents: read

jobs:
  soak:
    uses: ./.github/workflows/selfhost-longhaul.yml
    with:
      longhaul_rounds: ${{ github.event.inputs.longhaul_rounds || '3' }}
      bootstrap_stage1_tag: ${{ github.event.inputs.bootstrap_stage1_tag || 'v0.3.167-stage1-seed' }}
