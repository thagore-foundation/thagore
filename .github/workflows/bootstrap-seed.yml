name: Bootstrap Seed Verify

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "120"

  verify-stage1-seed:
    runs-on: ubuntu-latest
    needs: discord-notify-init
    env:
      BOOTSTRAP_STAGE1_TAG: v0.3.25-stage1-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Download stage1 seed asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-stage1-linux.tar.gz" -D bootstrap
          tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-runtime-linux.a" -D bootstrap
          cp bootstrap/thagore-runtime-linux.a libthag_runtime.a
          cp libthag_runtime.a thag_runtime.lib
          CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
          [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in seed asset"; exit 1)
          cp "$CANDIDATE" stage1
          chmod +x stage1
          python3 scripts/build_runtime_abi.py --target-os "Linux" --summary "runtime-abi-summary-bootstrap-seed-linux.txt"

      - name: Discord update - Download stage1 seed asset
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Download stage1 seed asset

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write runtime-abi-inventory-bootstrap-seed-linux.txt

      - name: Verify Stage1 -> Stage2 -> Stage2
        shell: bash
        run: |
          set -euxo pipefail
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            if "./$cc" --build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              LAST_BIN="$cc"
              return 0
            fi
            LAST_BIN=""
            return 1
          }
          LAST_BIN=""
          thg_build stage1 src/thagore.tg stage2
          STAGE2_BIN="$LAST_BIN"
          test -n "$STAGE2_BIN"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          LAST_BIN=""
          thg_build "$STAGE2_BIN" src/thagore.tg stage2_rebuild
          STAGE2_REBUILD_BIN="$LAST_BIN"
          test -n "$STAGE2_REBUILD_BIN"
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          LAST_BIN=""
          thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg hello_seed
          HELLO_BIN="$LAST_BIN"
          test -n "$HELLO_BIN"
          test -f "$HELLO_BIN"
          chmod +x "$HELLO_BIN" || true
          "./$HELLO_BIN"

          LAST_BIN=""
          thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg fib_seed
          FIB_BIN="$LAST_BIN"
          test -n "$FIB_BIN"
          test -f "$FIB_BIN"
          chmod +x "$FIB_BIN" || true
          "./$FIB_BIN"

      - name: Upload bootstrap seed runtime summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-runtime-summary
          path: |
            runtime-abi-summary-bootstrap-seed-linux.txt
            runtime-abi-inventory-bootstrap-seed-linux.txt

      - name: Discord update - Verify Stage1 -> Stage2 -> Stage2
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Verify Stage1 -> Stage2 -> Stage2

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, verify-stage1-seed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
