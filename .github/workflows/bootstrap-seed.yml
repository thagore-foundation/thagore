name: Bootstrap Seed Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage1-seed:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_STAGE1_TAG: v0.3.22-stage1-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Download stage1 seed asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p bootstrap
          gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-stage1-linux.tar.gz" -D bootstrap
          tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap
          CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
          [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in seed asset"; exit 1)
          cp "$CANDIDATE" stage1
          chmod +x stage1

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o thag_runtime.o
          ar rcs libthag_runtime.a thag_runtime.o
          cp libthag_runtime.a thag_runtime.lib

      - name: Verify Stage1 -> Stage2 -> Stage2
        shell: bash
        run: |
          set -euxo pipefail
          ./stage1 build src/thagore.tg -o stage2
          ./stage2 build src/thagore.tg -o stage2_rebuild
          ./stage2_rebuild build examples/hello.tg -o hello_seed
          ./hello_seed
          ./stage2_rebuild build examples/fib.tg -o fib_seed
          ./fib_seed
