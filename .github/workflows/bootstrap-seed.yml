name: Bootstrap Seed Verify

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "120"

  verify-stage1-seed:
    runs-on: ubuntu-latest
    needs: discord-notify-init
    env:
      BOOTSTRAP_STAGE1_TAG: v0.3.25-stage1-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Linux:"
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Download stage1 seed asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p bootstrap
          download_optional() {
            local pattern="$1"
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap >/dev/null 2>&1
          }
          STAGE1_ASSET=""
          for CANDIDATE in "thagore-stage1-linux-x86_64.tar.gz" "thagore-stage1-linux.tar.gz"; do
            if download_optional "$CANDIDATE"; then
              STAGE1_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: stage1 linux seed asset not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          RUNTIME_ASSET=""
          for CANDIDATE in "thagore-runtime-linux-x86_64.a" "thagore-runtime-linux.a"; do
            if download_optional "$CANDIDATE"; then
              RUNTIME_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$RUNTIME_ASSET" ]] || (echo "CRITICAL: runtime linux seed asset not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          if [[ "$STAGE1_ASSET" != "thagore-stage1-linux.tar.gz" ]]; then
            cp "bootstrap/$STAGE1_ASSET" bootstrap/thagore-stage1-linux.tar.gz
          fi
          if [[ "$RUNTIME_ASSET" != "thagore-runtime-linux.a" ]]; then
            cp "bootstrap/$RUNTIME_ASSET" bootstrap/thagore-runtime-linux.a
          fi
          tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap
          MANIFEST_ASSET=""
          for CANDIDATE in "seed-promotion-manifest-linux-x86_64.txt" "seed-promotion-manifest-Linux.txt"; do
            if download_optional "$CANDIDATE"; then
              MANIFEST_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$MANIFEST_ASSET" ]] || (echo "CRITICAL: seed promotion manifest not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          PROVENANCE_ASSET=""
          for CANDIDATE in "seed-stage1-provenance-linux-x86_64.json" "seed-stage1-provenance-Linux.json"; do
            if download_optional "$CANDIDATE"; then
              PROVENANCE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$PROVENANCE_ASSET" ]] || (echo "CRITICAL: stage1 provenance file not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          BUNDLE_ASSET=""
          for CANDIDATE in "seed-bundle-linux-x86_64.json"; do
            if download_optional "$CANDIDATE"; then
              BUNDLE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$BUNDLE_ASSET" ]] || (echo "CRITICAL: seed bundle metadata not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          TRACE_ASSET=""
          for CANDIDATE in "seed-stage-trace-linux-x86_64.log"; do
            if download_optional "$CANDIDATE"; then
              TRACE_ASSET="$CANDIDATE"
              break
            fi
          done
          [[ -n "$TRACE_ASSET" ]] || (echo "CRITICAL: seed stage trace not found in $BOOTSTRAP_STAGE1_TAG"; exit 1)
          cp bootstrap/thagore-runtime-linux.a libthag_runtime.a
          cp libthag_runtime.a thag_runtime.lib
          CANDIDATE="$(find bootstrap -maxdepth 4 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
          [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary not found in seed asset"; exit 1)
          cp "$CANDIDATE" stage1
          chmod +x stage1
          echo "SEED_MANIFEST_PATH=bootstrap/$MANIFEST_ASSET" >> "$GITHUB_ENV"
          echo "SEED_PROVENANCE_PATH=bootstrap/$PROVENANCE_ASSET" >> "$GITHUB_ENV"
          python3 scripts/build_runtime_abi.py --target-os "Linux" --summary "runtime-abi-summary-bootstrap-seed-linux.txt"

      - name: Enforce promotion gate policy (workflow config)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enforce_seed_promotion_gate.py \
            --workflow .github/workflows/seed-stage1.yml \
            --report seed-promotion-gate-bootstrap.txt

      - name: Verify atomic seed release bundle (all OS/arch)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p bootstrap/all
          for ASSET in \
            thagore-stage1-linux-x86_64.tar.gz \
            thagore-runtime-linux-x86_64.a \
            seed-promotion-manifest-linux-x86_64.txt \
            seed-stage1-provenance-linux-x86_64.json \
            seed-bundle-linux-x86_64.json \
            seed-stage-trace-linux-x86_64.log \
            thagore-stage1-linux-arm64.tar.gz \
            thagore-runtime-linux-arm64.a \
            seed-promotion-manifest-linux-arm64.txt \
            seed-stage1-provenance-linux-arm64.json \
            seed-bundle-linux-arm64.json \
            seed-stage-trace-linux-arm64.log \
            thagore-stage1-macos-arm64.tar.gz \
            thagore-runtime-macos-arm64.a \
            seed-promotion-manifest-macos-arm64.txt \
            seed-stage1-provenance-macos-arm64.json \
            seed-bundle-macos-arm64.json \
            seed-stage-trace-macos-arm64.log \
            thagore-stage1-windows-x86_64.exe \
            thagore-runtime-windows-x86_64.lib \
            seed-promotion-manifest-windows-x86_64.txt \
            seed-stage1-provenance-windows-x86_64.json \
            seed-bundle-windows-x86_64.json \
            seed-stage-trace-windows-x86_64.log \
            thagore-stage1-windows-arm64.exe \
            thagore-runtime-windows-arm64.lib \
            seed-promotion-manifest-windows-arm64.txt \
            seed-stage1-provenance-windows-arm64.json \
            seed-bundle-windows-arm64.json \
            seed-stage-trace-windows-arm64.log; do
            gh release download "$BOOTSTRAP_STAGE1_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$ASSET" \
              -D bootstrap/all >/dev/null 2>&1
          done
          python3 scripts/verify_seed_release_bundle.py \
            --root bootstrap/all \
            --expected-seed-tag "$BOOTSTRAP_STAGE1_TAG" \
            --report seed-release-bundle-verify-bootstrap.txt

      - name: Discord update - Download stage1 seed asset
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Download stage1 seed asset

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write runtime-abi-inventory-bootstrap-seed-linux.txt

      - name: Verify stage1 seed manifest and provenance
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${SEED_MANIFEST_PATH:-}"
          test -n "${SEED_PROVENANCE_PATH:-}"
          test -f "$SEED_MANIFEST_PATH"
          test -f "$SEED_PROVENANCE_PATH"
          python3 scripts/seed_bundle.py verify \
            --bundle bootstrap/seed-bundle-linux-x86_64.json \
            --manifest "$SEED_MANIFEST_PATH" \
            --provenance "$SEED_PROVENANCE_PATH"
          BUNDLE_ID="$(python3 -c "import json;print(json.load(open('bootstrap/seed-bundle-linux-x86_64.json',encoding='utf-8'))['metadata']['bundle_id'])")"
          python3 scripts/stage1_provenance.py verify \
            --provenance "$SEED_PROVENANCE_PATH" \
            --manifest "$SEED_MANIFEST_PATH" \
            --asset bootstrap/thagore-stage1-linux.tar.gz \
            --asset bootstrap/thagore-runtime-linux.a \
            --expected-bundle-id "$BUNDLE_ID"

      - name: Verify Stage1 -> Stage2 -> Stage2
        shell: bash
        run: |
          set -euxo pipefail
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            if "./$cc" --build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                LAST_BIN="$got"
                return 0
              fi
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              LAST_BIN="$cc"
              return 0
            fi
            LAST_BIN=""
            return 1
          }
          LAST_BIN=""
          thg_build stage1 src/thagore.tg stage2
          STAGE2_BIN="$LAST_BIN"
          test -n "$STAGE2_BIN"
          test -f "$STAGE2_BIN"
          chmod +x "$STAGE2_BIN" || true

          LAST_BIN=""
          thg_build "$STAGE2_BIN" src/thagore.tg stage2_rebuild
          STAGE2_REBUILD_BIN="$LAST_BIN"
          test -n "$STAGE2_REBUILD_BIN"
          test -f "$STAGE2_REBUILD_BIN"
          chmod +x "$STAGE2_REBUILD_BIN" || true

          LAST_BIN=""
          thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg hello_seed
          HELLO_BIN="$LAST_BIN"
          test -n "$HELLO_BIN"
          test -f "$HELLO_BIN"
          chmod +x "$HELLO_BIN" || true
          "./$HELLO_BIN"

          LAST_BIN=""
          thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg fib_seed
          FIB_BIN="$LAST_BIN"
          test -n "$FIB_BIN"
          test -f "$FIB_BIN"
          chmod +x "$FIB_BIN" || true
          "./$FIB_BIN"

      - name: Upload bootstrap seed runtime summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-runtime-summary
          path: |
            runtime-abi-summary-bootstrap-seed-linux.txt
            runtime-abi-inventory-bootstrap-seed-linux.txt
            bootstrap/seed-promotion-manifest-*.txt
            bootstrap/seed-stage1-provenance-*.json
            bootstrap/seed-stage-trace-*.log
            seed-promotion-gate-bootstrap.txt
            seed-release-bundle-verify-bootstrap.txt

      - name: Discord update - Verify Stage1 -> Stage2 -> Stage2
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Verify Stage1 -> Stage2 -> Stage2

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, verify-stage1-seed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
