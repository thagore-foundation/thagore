name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/starlight/**"
      - "scripts/install/thagup-init.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "120"

  build:
    runs-on: ubuntu-latest
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/starlight/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: docs/starlight
        run: npm ci

      - name: Build Starlight docs
        working-directory: docs/starlight
        run: npm run build

      - name: Publish thagup.sh + thagup.exe endpoints
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="docs/starlight/dist"
          mkdir -p "$DIST_DIR"

          cat > "$DIST_DIR/thagup.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/thagore-foundation/thagore/main/scripts/install/thagup-init.sh | bash -s -- "$@"
          SH
          chmod +x "$DIST_DIR/thagup.sh"

          PY_BIN=python3
          if ! command -v "$PY_BIN" >/dev/null 2>&1; then
            PY_BIN=python
          fi
          RELEASE_JSON="$("$PY_BIN" - <<'PY'
          import json
          import re
          import urllib.request

          api = "https://api.github.com/repos/thagore-foundation/thagore/releases?per_page=100"
          req = urllib.request.Request(api, headers={"User-Agent": "thagore-docs-pages"})
          releases = json.load(urllib.request.urlopen(req))
          tag_re = re.compile(r"^v\d+\.\d+\.\d+$")

          for rel in releases:
              if rel.get("draft") or rel.get("prerelease"):
                  continue
              tag = str(rel.get("tag_name", "")).strip()
              if not tag_re.match(tag):
                  continue
              assets = {str(a.get("name", "")): str(a.get("browser_download_url", "")) for a in rel.get("assets", [])}
              if "thagore-setup-windows-x86_64.exe" in assets:
                  print(json.dumps({"tag": tag, "url": assets["thagore-setup-windows-x86_64.exe"]}))
                  break
          PY
          )"
          THAGUP_EXE_URL="$("$PY_BIN" -c 'import json,sys; print(json.loads(sys.argv[1])["url"])' "$RELEASE_JSON")"
          THAGUP_EXE_TAG="$("$PY_BIN" -c 'import json,sys; print(json.loads(sys.argv[1])["tag"])' "$RELEASE_JSON")"
          if [[ -z "${THAGUP_EXE_URL:-}" || -z "${THAGUP_EXE_TAG:-}" ]]; then
            echo "CRITICAL: unable to resolve stable release asset thagore-setup-windows-x86_64.exe"
            exit 1
          fi
          echo "[docs-pages] thagup.exe source tag: $THAGUP_EXE_TAG"
          curl -fsSL "$THAGUP_EXE_URL" -o "$DIST_DIR/thagup.exe"

      - name: Discord update - Build Starlight docs
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Build Starlight docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/starlight/dist

  deploy:
    needs: [discord-notify-init, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Discord update - Deploy to GitHub Pages
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Deploy to GitHub Pages

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build, deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
