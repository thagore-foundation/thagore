name: Seed Autopromote

on:
  workflow_run:
    workflows: ["Seed Stage1 Assets"]
    types: [completed]

permissions:
  actions: read
  contents: write
  workflows: write

jobs:
  promote-tag:
    name: promote-tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download seed run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          gh run download "$RUN_ID" --repo "${{ github.repository }}" -D seedrun

      - name: Enforce promotion gate policy (workflow config)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enforce_seed_promotion_gate.py \
            --workflow .github/workflows/seed-stage1.yml \
            --report seed-promotion-gate-autopromote.txt

      - name: Verify atomic seed bundles from source run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_seed_run_bundle.py \
            --root seedrun \
            --expected-commit-sha "${{ github.event.workflow_run.head_sha }}" \
            --expected-run-id "${{ github.event.workflow_run.id }}" \
            --expected-run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --report seed-run-bundle-verify.txt

      - name: Extract promoted seed tag
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find seedrun -type f -name 'seed-promotion-manifest-*.txt' | head -n 1 || true)"
          [[ -n "$MANIFEST" && -f "$MANIFEST" ]] || (echo "CRITICAL: seed promotion manifest not found in run artifacts"; exit 1)
          TAG="$(grep -E '^seed_tag=' "$MANIFEST" | head -n 1 | cut -d'=' -f2- || true)"
          [[ -n "$TAG" ]] || (echo "CRITICAL: cannot extract seed_tag from $MANIFEST"; exit 1)
          echo "seed_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Update BOOTSTRAP_STAGE1_TAG
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_seed_tag.py --new-tag "${{ steps.extract.outputs.seed_tag }}" --report seed-tag-update-report.txt
          python3 scripts/verify_seed_tag_sync.py --report seed-tag-sync-autopromote.txt

      - name: Commit promoted tag
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No tag changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows scripts/update_seed_tag.py
          git commit -m "ci: promote bootstrap seed tag to ${{ steps.extract.outputs.seed_tag }}"
          git push origin main

      - name: Upload autopromote reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-autopromote-report
          path: |
            seed-tag-update-report.txt
            seed-tag-sync-autopromote.txt
            seed-promotion-gate-autopromote.txt
            seed-run-bundle-verify.txt
