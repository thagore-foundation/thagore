name: Cross Platform Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  package-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: linux
          - os: macos-latest
            mode: macos
          - os: windows-latest
            mode: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 lld-21 llvm-21-dev cmake ninja-build \
            libffi-dev libedit-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev libxml2-dev
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          echo "LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@21 ninja cmake
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y llvm --version=21.1.3
          if ($LASTEXITCODE -ne 0) {
            choco install -y llvm
          }
          choco install -y ninja
          "PATH=C:\Program Files\LLVM\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=C:/Program Files/LLVM/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure + build (non-Windows)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DLLVM_DIR="${LLVM_DIR}"
          cmake --build build -j

      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DLLVM_DIR="$env:LLVM_DIR"
          cmake --build build -j 4

      - name: Package core archive
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="build/compiler/thagc"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN_PATH="build/compiler/thagc.exe"
          fi
          python3 tooling/packaging/pack_core.py \
            --bin "${BIN_PATH}" \
            --mode "${{ matrix.mode }}" \
            --bundle-deps \
            --out "dist/thagc-core-${{ matrix.mode }}.tar.gz"

      - name: Smoke deploy + run (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p smoke/stage
          tar -xzf "dist/thagc-core-${{ matrix.mode }}.tar.gz" -C smoke/stage
          cat > smoke/main.tg <<'TG'
          print("smoke-ok")
          TG
          THAGORE_HOME="$PWD/smoke/.thagore-home" smoke/stage/bin/thagc build smoke/main.tg -o smoke/main.bin
          ./smoke/main.bin | tee smoke/out.txt
          grep -q "smoke-ok" smoke/out.txt

      - name: Smoke deploy + run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke\stage | Out-Null
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive = Path("dist/thagc-core-windows.tar.gz")
          dest = Path("smoke/stage")
          with tarfile.open(archive, "r:gz") as tf:
              tf.extractall(dest)
          PY
          @'
          print("smoke-ok")
          '@ | Out-File -Encoding utf8 smoke\main.tg
          $env:THAGORE_HOME = "$pwd\smoke\.thagore-home"
          & "smoke\stage\bin\thagc.exe" build smoke\main.tg -o smoke\main.exe
          $out = & "smoke\main.exe"
          if ($out -notmatch "smoke-ok") {
            throw "smoke output mismatch: $out"
          }
