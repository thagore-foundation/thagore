name: Seed Runtime Assets

on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: "Seed release tag to upload runtime assets"
        required: false
        default: "v0.3.25-stage1-seed"

permissions:
  contents: write
  actions: read

jobs:
  build-runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Materialize runtime source blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rt
          git cat-file blob 7f9ed799c71ceff8da657316012dc5e4d01d34d4 > _rt/runtime.cc
          test -s _rt/runtime.cc

      - name: Build runtime static library
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c++17 -O2 -c _rt/runtime.cc -o _rt/runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs thagore-runtime-windows.lib _rt/runtime.o
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            llvm-ar rcs thagore-runtime-linux.a _rt/runtime.o
          else
            llvm-ar rcs thagore-runtime-macos.a _rt/runtime.o
            if command -v ranlib >/dev/null 2>&1; then
              ranlib thagore-runtime-macos.a || true
            fi
          fi

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ runner.os }}
          path: |
            thagore-runtime-windows.lib
            thagore-runtime-linux.a
            thagore-runtime-macos.a

  publish-runtime:
    name: publish-runtime-assets
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: runtime-artifacts

      - name: Publish runtime assets to seed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_TAG: ${{ github.event.inputs.seed_tag || 'v0.3.25-stage1-seed' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$SEED_TAG" \
            runtime-artifacts/**/thagore-runtime-windows.lib \
            runtime-artifacts/**/thagore-runtime-linux.a \
            runtime-artifacts/**/thagore-runtime-macos.a \
            --repo "${{ github.repository }}" \
            --clobber
