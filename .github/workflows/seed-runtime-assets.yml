name: Seed Runtime Assets (Disabled)

on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: "Deprecated. Runtime seed is now published only via atomic seed bundle."
        required: false
        default: "v0.3.168-stage1-seed"

permissions:
  contents: read
  actions: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Block deprecated runtime-only publish
        shell: bash
        run: |
          set -euo pipefail
          echo "CRITICAL: runtime-only seed publish is disabled."
          echo "Use '.github/workflows/seed-stage1.yml' to publish atomic seed bundle (stage1+runtime+manifest+provenance+trace)."
          exit 1
