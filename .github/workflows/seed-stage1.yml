name: Seed Stage1 Assets

on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: "Release tag for stage1 seed assets"
        required: true
        default: "v0.3.22-stage1-seed"

permissions:
  contents: write

jobs:
  build-seed:
    name: seed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm --version=21.1.8 --no-progress -y
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++17 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Build Stage0 (one-time exception)
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S legacy -B legacy/build -DCMAKE_BUILD_TYPE=Release
          cmake --build legacy/build --config Release

      - name: Build and verify stage1 seed
        shell: bash
        run: |
          set -euxo pipefail
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            "./$cc" --build "$src" -o "$out" || return 1
            got="$(resolve_bin "$out" "$src" || true)"
            [[ -n "$got" ]]
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE0_BIN=""
            for c in "legacy/build/Release/thag.exe" "legacy/build/thag.exe" "legacy/build/Release/thagore.exe" "legacy/build/thagore.exe"; do
              if [[ -f "$c" ]]; then
                STAGE0_BIN="$c"
                break
              fi
            done
            [[ -n "$STAGE0_BIN" ]] || (echo "CRITICAL: stage0 binary not found on Windows"; exit 1)
            STAGE1_OUT="stage1_seed.exe"
            STAGE2_OUT="stage2_seed.exe"
            HELLO_OUT="hello_seed.exe"
            FIB_OUT="fib_seed.exe"
          else
            STAGE0_BIN=""
            for c in "legacy/build/thag" "legacy/build/Release/thag" "legacy/build/thagore" "legacy/build/Release/thagore"; do
              if [[ -f "$c" ]]; then
                STAGE0_BIN="$c"
                break
              fi
            done
            [[ -n "$STAGE0_BIN" ]] || (echo "CRITICAL: stage0 binary not found on Unix"; exit 1)
            chmod +x "$STAGE0_BIN" || true
            STAGE1_OUT="stage1_seed"
            STAGE2_OUT="stage2_seed"
            HELLO_OUT="hello_seed"
            FIB_OUT="fib_seed"
          fi

          thg_build "$STAGE0_BIN" src/thagore.tg "$STAGE1_OUT"
          STAGE1_OUT="$(resolve_bin "$STAGE1_OUT" "src/thagore.tg")"
          chmod +x "$STAGE1_OUT" || true

          thg_build "$STAGE1_OUT" src/thagore.tg "$STAGE2_OUT"
          STAGE2_OUT="$(resolve_bin "$STAGE2_OUT" "src/thagore.tg")"
          chmod +x "$STAGE2_OUT" || true

          thg_build "$STAGE2_OUT" examples/hello.tg "$HELLO_OUT"
          HELLO_OUT="$(resolve_bin "$HELLO_OUT" "examples/hello.tg")"
          chmod +x "$HELLO_OUT" || true
          "./$HELLO_OUT"

          thg_build "$STAGE2_OUT" examples/fib.tg "$FIB_OUT"
          FIB_OUT="$(resolve_bin "$FIB_OUT" "examples/fib.tg")"
          chmod +x "$FIB_OUT" || true
          "./$FIB_OUT"

          mkdir -p seed/dist/bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$STAGE1_OUT" "seed/dist/bin/thagore.exe"
            cp "$STAGE1_OUT" "thagore-stage1.exe"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp "$STAGE1_OUT" "seed/dist/bin/thagore"
            tar -czf "thagore-stage1-linux.tar.gz" -C seed dist
          else
            cp "$STAGE1_OUT" "seed/dist/bin/thagore"
            tar -czf "thagore-stage1-macos.tar.gz" -C seed dist
          fi

      - name: Upload seed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ runner.os }}
          path: |
            thagore-stage1.exe
            thagore-stage1-linux.tar.gz
            thagore-stage1-macos.tar.gz

  publish-seed:
    name: publish-seed-release
    runs-on: ubuntu-latest
    needs: [build-seed]
    steps:
      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          path: seed-artifacts

      - name: Publish seed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.seed_tag }}
          name: Stage1 Seed ${{ github.event.inputs.seed_tag }}
          files: |
            seed-artifacts/**/thagore-stage1.exe
            seed-artifacts/**/thagore-stage1-linux.tar.gz
            seed-artifacts/**/thagore-stage1-macos.tar.gz
          make_latest: false
          prerelease: true
          overwrite_files: true
