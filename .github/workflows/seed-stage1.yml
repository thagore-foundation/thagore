name: Seed Stage1 Assets

on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: "Release tag for new stage1 seed assets"
        required: true
        default: "v0.3.25-stage1-seed"
      base_seed_tag:
        description: "Existing stage1 seed tag used for bootstrap"
        required: true
        default: "v0.3.21-stage1-seed"

permissions:
  actions: read
  contents: write

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  build-seed:
    name: seed (${{ matrix.os }})
    needs: discord-notify-init
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BOOTSTRAP_STAGE1_TAG: ${{ github.event.inputs.base_seed_tag }}
      STAGE_TRACE_FILE: seed-stage-trace.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          sudo apt-get update || true
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all || true
          if [[ -d /usr/lib/llvm-21/bin ]]; then
            echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Fetch bootstrap stage1 asset (strict tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: base_seed_tag is required."; exit 1)
          mkdir -p bootstrap
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-stage1.exe" -D bootstrap
            cp bootstrap/thagore-stage1.exe stage1.exe
            chmod +x stage1.exe || true
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-stage1-linux.tar.gz" -D bootstrap
            mkdir -p bootstrap/extract_stage1
            tar -xzf bootstrap/thagore-stage1-linux.tar.gz -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary missing in Linux seed archive"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
          else
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "thagore-stage1-macos.tar.gz" -D bootstrap
            mkdir -p bootstrap/extract_stage1
            tar -xzf bootstrap/thagore-stage1-macos.tar.gz -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary missing in macOS seed archive"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
          fi

      - name: Discord update - Fetch bootstrap stage1 asset (strict tag)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Fetch bootstrap stage1 asset (strict tag)

      - name: Build runtime artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/build
          clang++ -std=c++23 -O2 -c runtime/src/runtime.cpp -o runtime/build/thag_runtime.o
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            llvm-ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o || ar rcs runtime/build/thag_runtime.lib runtime/build/thag_runtime.o
            cp runtime/build/thag_runtime.lib thag_runtime.lib
          else
            ar rcs runtime/build/libthag_runtime.a runtime/build/thag_runtime.o
            cp runtime/build/libthag_runtime.a libthag_runtime.a
            cp runtime/build/libthag_runtime.a thag_runtime.lib
          fi

      - name: Verify Stage1 -> Stage2 -> Stage2 -> samples
        shell: bash
        run: |
          set -euxo pipefail
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local allow_missing_output="${4:-0}"
            local got=""
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            if "./$cc" build "$src" -o "$out"; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE"
            "./$cc" --build "$src" -o "$out"
            got="$(resolve_bin "$out" "$src" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$allow_missing_output" == "1" ]]; then
              echo "[WARN] no explicit output artifact for $src via $cc, fallback to existing compiler binary" | tee -a "$STAGE_TRACE_FILE"
              return 0
            fi
            return 1
          }

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_seed.exe"
            FIB_BIN="fib_seed.exe"
          else
            STAGE1_BIN="stage1"
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_seed"
            FIB_BIN="fib_seed"
          fi

          thg_build "$STAGE1_BIN" src/thagore.tg "$STAGE2_BIN" 1
          STAGE2_BIN="$(resolve_bin "$STAGE2_BIN" "src/thagore.tg")"
          chmod +x "$STAGE2_BIN" || true

          thg_build "$STAGE2_BIN" src/thagore.tg "$STAGE2_REBUILD_BIN" 1
          STAGE2_REBUILD_BIN="$(resolve_bin "$STAGE2_REBUILD_BIN" "src/thagore.tg" || true)"
          if [[ -z "$STAGE2_REBUILD_BIN" ]]; then
            STAGE2_REBUILD_BIN="$STAGE2_BIN"
          fi
          chmod +x "$STAGE2_REBUILD_BIN" || true

          thg_build "$STAGE2_REBUILD_BIN" examples/hello.tg "$HELLO_BIN"
          HELLO_BIN="$(resolve_bin "$HELLO_BIN" "examples/hello.tg")"
          chmod +x "$HELLO_BIN" || true
          HELLO_OUT="$(./"$HELLO_BIN" || true)"
          echo "$HELLO_OUT"
          echo "$HELLO_OUT" | grep -F "Hello Self-Hosted World!"

          thg_build "$STAGE2_REBUILD_BIN" examples/fib.tg "$FIB_BIN"
          FIB_BIN="$(resolve_bin "$FIB_BIN" "examples/fib.tg")"
          chmod +x "$FIB_BIN" || true
          FIB_OUT="$(./"$FIB_BIN" || true)"
          echo "$FIB_OUT"
          echo "$FIB_OUT" | grep -F "9227465"

          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"

      - name: Discord update - Verify Stage1 -> Stage2 -> Stage2 -> samples
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Verify Stage1 -> Stage2 -> Stage2 -> samples

      - name: Guard no stage0 usage
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden stage0 markers detected in seed trace"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Package stage1 seed artifact from stage2_rebuild
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf seed
          mkdir -p seed/dist/bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$STAGE2_REBUILD_BIN" thagore-stage1.exe
            test -f thagore-stage1.exe
            bytes="$(wc -c < thagore-stage1.exe)"
            if [[ "$bytes" -lt 200000 ]]; then
              echo "CRITICAL: thagore-stage1.exe too small ($bytes bytes), abort publish."
              exit 1
            fi
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp "$STAGE2_REBUILD_BIN" seed/dist/bin/thagore
            tar -czf thagore-stage1-linux.tar.gz -C seed dist
            tar -tzf thagore-stage1-linux.tar.gz | grep -F "dist/bin/thagore"
            bytes="$(wc -c < thagore-stage1-linux.tar.gz)"
            if [[ "$bytes" -lt 20000 ]]; then
              echo "CRITICAL: thagore-stage1-linux.tar.gz too small ($bytes bytes), abort publish."
              exit 1
            fi
          else
            cp "$STAGE2_REBUILD_BIN" seed/dist/bin/thagore
            tar -czf thagore-stage1-macos.tar.gz -C seed dist
            tar -tzf thagore-stage1-macos.tar.gz | grep -F "dist/bin/thagore"
            bytes="$(wc -c < thagore-stage1-macos.tar.gz)"
            if [[ "$bytes" -lt 20000 ]]; then
              echo "CRITICAL: thagore-stage1-macos.tar.gz too small ($bytes bytes), abort publish."
              exit 1
            fi
          fi

      - name: Discord update - Package stage1 seed artifact from stage2_rebuild
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Package stage1 seed artifact from stage2_rebuild

      - name: Upload seed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ runner.os }}
          path: |
            thagore-stage1.exe
            thagore-stage1-linux.tar.gz
            thagore-stage1-macos.tar.gz
            ${{ env.STAGE_TRACE_FILE }}

  publish-seed:
    name: publish-seed-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, build-seed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          path: seed-artifacts

      - name: Publish seed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.seed_tag }}
          name: Stage1 Seed ${{ github.event.inputs.seed_tag }}
          files: |
            seed-artifacts/**/thagore-stage1.exe
            seed-artifacts/**/thagore-stage1-linux.tar.gz
            seed-artifacts/**/thagore-stage1-macos.tar.gz
          make_latest: false
          prerelease: true
          overwrite_files: true

      - name: Discord update - Publish seed release
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish seed release

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build-seed, publish-seed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
