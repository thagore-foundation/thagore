name: Seed Stage1 Assets
run-name: Seed Stage1 Assets (${{ github.event.inputs.seed_tag }})

on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: "Release tag for new stage1 seed assets"
        required: true
        default: "v0.3.25-stage1-seed"
      base_seed_tag:
        description: "Existing stage1 seed tag used for bootstrap"
        required: true
        default: "v0.3.25-stage1-seed"

permissions:
  actions: read
  contents: write

jobs:
  discord-notify-init:
    name: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.init.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Discord message
        id: init
        uses: ./.github/actions/discord-ci-status
        with:
          mode: init
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  discord-notify-live:
    name: discord-notify-live
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: discord-notify-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch Discord message realtime
        uses: ./.github/actions/discord-ci-status
        with:
          mode: watch
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          poll_seconds: "20"
          max_minutes: "240"

  seed-base-probe:
    name: seed-base-probe
    needs: discord-notify-init
    runs-on: ubuntu-latest
    outputs:
      available_tags: ${{ steps.probe.outputs.available_tags }}
    env:
      BOOTSTRAP_STAGE1_TAG: ${{ github.event.inputs.base_seed_tag }}
    steps:
      - name: Probe base seed assets
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_names=";$(gh release view "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | tr '\n' ';')"
          has_asset() {
            local name="$1"
            [[ "$asset_names" == *";${name};"* ]]
          }
          available=";"
          if has_asset "thagore-stage1-linux-x86_64.tar.gz"; then
            available="${available}linux-x86_64;"
          elif has_asset "thagore-stage1-linux.tar.gz"; then
            available="${available}linux-x86_64;"
          fi
          if has_asset "thagore-stage1-linux-arm64.tar.gz"; then
            available="${available}linux-arm64;"
          fi
          if has_asset "thagore-stage1-macos-arm64.tar.gz"; then
            available="${available}macos-arm64;"
          elif has_asset "thagore-stage1-macos.tar.gz"; then
            available="${available}macos-arm64;"
          fi
          if has_asset "thagore-stage1-windows-x86_64.exe"; then
            available="${available}windows-x86_64;"
          elif has_asset "thagore-stage1.exe"; then
            available="${available}windows-x86_64;"
          fi
          if has_asset "thagore-stage1-windows-arm64.exe"; then
            available="${available}windows-arm64;"
          fi
          echo "available_tags=$available" >> "$GITHUB_OUTPUT"
          echo "available_tags=$available"

  build-seed:
    name: seed (${{ matrix.asset_tag }})
    needs: [discord-notify-init, seed-base-probe]
    continue-on-error: ${{ matrix.allow_failure }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
            arch: x86_64
            asset_tag: linux-x86_64
            allow_failure: false
            stage1_seed_name: thagore-stage1-linux-x86_64.tar.gz
            runtime_seed_name: thagore-runtime-linux-x86_64.a
          - runner: ubuntu-24.04-arm
            os_name: Linux
            arch: arm64
            asset_tag: linux-arm64
            allow_failure: false
            stage1_seed_name: thagore-stage1-linux-arm64.tar.gz
            runtime_seed_name: thagore-runtime-linux-arm64.a
          - runner: macos-latest
            os_name: macOS
            arch: arm64
            asset_tag: macos-arm64
            allow_failure: false
            stage1_seed_name: thagore-stage1-macos-arm64.tar.gz
            runtime_seed_name: thagore-runtime-macos-arm64.a
          - runner: windows-latest
            os_name: Windows
            arch: x86_64
            asset_tag: windows-x86_64
            allow_failure: false
            stage1_seed_name: thagore-stage1-windows-x86_64.exe
            runtime_seed_name: thagore-runtime-windows-x86_64.lib
          - runner: windows-11-arm
            os_name: Windows
            arch: arm64
            asset_tag: windows-arm64
            allow_failure: false
            stage1_seed_name: thagore-stage1-windows-arm64.exe
            runtime_seed_name: thagore-runtime-windows-arm64.lib
    env:
      BOOTSTRAP_STAGE1_TAG: ${{ github.event.inputs.base_seed_tag }}
      STAGE_TRACE_FILE: seed-stage-trace-${{ matrix.asset_tag }}.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          apt_quick() {
            timeout --signal=TERM --kill-after=30 6m "$@"
          }
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            apt_quick sudo apt-get update || true
            apt_quick sudo apt-get install -y qemu-user qemu-user-static libc6-amd64-cross libstdc++6-amd64-cross libgcc-s1-amd64-cross || true
          fi
          if ! command -v clang >/dev/null 2>&1; then
            apt_quick sudo apt-get update || true
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            chmod +x /tmp/llvm.sh
            apt_quick sudo /tmp/llvm.sh 21 all || true
            if [[ -d /usr/lib/llvm-21/bin ]]; then
              echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
            fi
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            echo "Using preinstalled clang on Windows:"
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Fetch bootstrap stage1 asset (strict tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          : > "$STAGE_TRACE_FILE"
          [[ -n "$BOOTSTRAP_STAGE1_TAG" ]] || (echo "CRITICAL: base_seed_tag is required."; exit 1)
          mkdir -p bootstrap
          download_optional() {
            local pattern="$1"
            gh release download "$BOOTSTRAP_STAGE1_TAG" --repo "${{ github.repository }}" --pattern "$pattern" -D bootstrap >/dev/null 2>&1
          }
          STAGE1_CANDIDATES=("${{ matrix.stage1_seed_name }}")
          RUNTIME_CANDIDATES=("${{ matrix.runtime_seed_name }}")
          if [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1.exe")
            RUNTIME_CANDIDATES+=("thagore-runtime-windows.lib")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "x86_64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-linux.tar.gz")
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES=("thagore-stage1-linux-x86_64.tar.gz" "${{ matrix.stage1_seed_name }}" "thagore-stage1-linux.tar.gz")
            RUNTIME_CANDIDATES+=("thagore-runtime-linux.a")
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            STAGE1_CANDIDATES+=("thagore-stage1-macos.tar.gz")
            RUNTIME_CANDIDATES+=("thagore-runtime-macos.a")
          fi
          STAGE1_ASSET=""
          for ASSET in "${STAGE1_CANDIDATES[@]}"; do
            if download_optional "$ASSET"; then
              STAGE1_ASSET="$ASSET"
              break
            fi
          done
          [[ -n "$STAGE1_ASSET" ]] || (echo "CRITICAL: stage1 bootstrap asset missing for ${{ matrix.asset_tag }}"; exit 1)
          RUNTIME_ASSET=""
          for ASSET in "${RUNTIME_CANDIDATES[@]}"; do
            if download_optional "$ASSET"; then
              RUNTIME_ASSET="$ASSET"
              break
            fi
          done
          if [[ -z "$RUNTIME_ASSET" && "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            mkdir -p _rt
            git cat-file blob 7f9ed799c71ceff8da657316012dc5e4d01d34d4 > _rt/runtime.cc
            AR_BIN="llvm-ar"
            if ! command -v "$AR_BIN" >/dev/null 2>&1; then
              AR_BIN="ar"
            fi
            clang -std=c++17 -O2 -c _rt/runtime.cc -o _rt/runtime.o
            "$AR_BIN" rcs "bootstrap/${{ matrix.runtime_seed_name }}" _rt/runtime.o
            RUNTIME_ASSET="${{ matrix.runtime_seed_name }}"
          fi
          [[ -n "$RUNTIME_ASSET" ]] || (echo "CRITICAL: runtime bootstrap asset missing for ${{ matrix.asset_tag }}"; exit 1)
          if [[ "$STAGE1_ASSET" != "${{ matrix.stage1_seed_name }}" ]]; then
            cp "bootstrap/$STAGE1_ASSET" "bootstrap/${{ matrix.stage1_seed_name }}"
          fi
          if [[ "$RUNTIME_ASSET" != "${{ matrix.runtime_seed_name }}" ]]; then
            cp "bootstrap/$RUNTIME_ASSET" "bootstrap/${{ matrix.runtime_seed_name }}"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "bootstrap/${{ matrix.stage1_seed_name }}" stage1.exe
            chmod +x stage1.exe || true
            cp "bootstrap/${{ matrix.runtime_seed_name }}" thag_runtime.lib
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp "bootstrap/${{ matrix.runtime_seed_name }}" libthag_runtime.a
            cp libthag_runtime.a thag_runtime.lib
            mkdir -p bootstrap/extract_stage1
            tar -xzf "bootstrap/${{ matrix.stage1_seed_name }}" -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary missing in Linux seed archive"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
            STAGE1_FILE_INFO="$(file -b stage1 || true)"
            if [[ "${{ matrix.arch }}" == "arm64" && "$STAGE1_FILE_INFO" == *"x86-64"* ]]; then
              echo "STAGE1_EMULATE_X86_64=1" >> "$GITHUB_ENV"
              echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
            else
              echo "STAGE1_EMULATE_X86_64=0" >> "$GITHUB_ENV"
            fi
          else
            cp "bootstrap/${{ matrix.runtime_seed_name }}" libthag_runtime.a
            cp libthag_runtime.a thag_runtime.lib
            mkdir -p bootstrap/extract_stage1
            tar -xzf "bootstrap/${{ matrix.stage1_seed_name }}" -C bootstrap/extract_stage1
            CANDIDATE="$(find bootstrap/extract_stage1 -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n 1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: stage1 binary missing in macOS seed archive"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1 || true
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/build_runtime_abi.py --target-os "${{ runner.os }}" --summary "runtime-abi-summary-seed-${{ matrix.asset_tag }}.txt"

      - name: Discord update - Fetch bootstrap stage1 asset (strict tag)
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Fetch bootstrap stage1 asset (strict tag)

      - name: Runtime ABI bootstrap-critical gate
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" scripts/runtime_abi_inventory.py \
            --profile bootstrap-critical \
            --fail-on-missing \
            --write "runtime-abi-inventory-seed-${{ matrix.asset_tag }}.txt"

      - name: Provision swap for linux-arm64 verify lane
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euxo pipefail
          swap_total_bytes="$(swapon --bytes --show=SIZE --noheadings | awk '{sum+=$1} END {print sum+0}')"
          min_swap_bytes=$((8 * 1024 * 1024 * 1024))
          if (( swap_total_bytes < min_swap_bytes )); then
            need_bytes=$((min_swap_bytes - swap_total_bytes))
            # Round up to MiB for dd/fallocate sizing.
            need_mib=$(( (need_bytes + 1024 * 1024 - 1) / (1024 * 1024) ))
            [[ "$need_mib" -ge 2048 ]] || need_mib=2048
            SWAPFILE=/swapfile_thagore
            sudo swapoff "$SWAPFILE" >/dev/null 2>&1 || true
            sudo rm -f "$SWAPFILE"
            if ! sudo fallocate -l "${need_mib}M" "$SWAPFILE"; then
              sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count="$need_mib" status=progress
            fi
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          swapon --show
          free -h

      - name: Verify Stage1 -> Stage2 -> Stage2 -> samples
        shell: bash
        timeout-minutes: 12
        run: |
          set -euxo pipefail
          WATCHDOG_PID=""
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            (
              sleep 720
              echo "CRITICAL: verify watchdog exceeded 12 minutes on linux-arm64, terminating step." >&2
              pkill -TERM -P "$$" || true
              kill -TERM "$$" || true
            ) &
            WATCHDOG_PID="$!"
            trap 'if [[ -n "${WATCHDOG_PID:-}" ]]; then kill "$WATCHDOG_PID" >/dev/null 2>&1 || true; fi' EXIT
          fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            free -h || true
          fi
          run_with_watchdog() {
            if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "arm64" ]]; then
              if command -v timeout >/dev/null 2>&1; then
                timeout --signal=TERM --kill-after=60 8m "$@"
                return $?
              fi
            fi
            "$@"
          }
          run_compiler() {
            local cc="$1"
            shift
            if [[ "${STAGE1_EMULATE_X86_64:-0}" == "1" && "$cc" == "stage1" ]]; then
              local qemu_bin=""
              if command -v qemu-x86_64-static >/dev/null 2>&1; then
                qemu_bin="$(command -v qemu-x86_64-static)"
              elif command -v qemu-x86_64 >/dev/null 2>&1; then
                qemu_bin="$(command -v qemu-x86_64)"
              fi
              if [[ -z "$qemu_bin" ]]; then
                echo "CRITICAL: qemu x86_64 emulator is missing on linux-arm64 seed lane." >&2
                return 127
              fi
              run_with_watchdog env QEMU_LD_PREFIX="${QEMU_LD_PREFIX:-/usr/x86_64-linux-gnu}" "$qemu_bin" "./$cc" "$@"
              return $?
            fi
            run_with_watchdog "./$cc" "$@"
          }
          resolve_bin() {
            local preferred="$1"
            local src="$2"
            local base
            base="$(basename "$src" .tg)"
            for c in "$preferred" "${preferred}.exe" "${preferred%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local discovered=""
            local base_matches=""
            if [[ "$src" != "src/thagore.tg" ]]; then
              base_matches="$(
                {
                  find . -maxdepth 2 -type f -name "${base}*" 2>/dev/null
                  find ./src -maxdepth 2 -type f -name "${base}*" 2>/dev/null
                  find ./examples -maxdepth 2 -type f -name "${base}*" 2>/dev/null
                } \
                | sed 's|^\./||' \
                | grep -Ev '\.(tg|ll|o|obj|txt|log|json|md|yml|yaml)$' \
                | grep -E '(^|/)[^/.]+(\.exe)?$' \
                || true
              )"
            fi
            discovered="$(
              {
                find . -maxdepth 2 -type f -name "${preferred}*" 2>/dev/null
                find ./src -maxdepth 2 -type f -name "${preferred}*" 2>/dev/null
                find ./examples -maxdepth 2 -type f -name "${preferred}*" 2>/dev/null
                if [[ -n "$base_matches" ]]; then
                  printf '%s\n' "$base_matches"
                fi
              } \
              | sed 's|^\./||' \
              | grep -Ev '\.(tg|ll|o|obj|txt|log|json|md|yml|yaml)$' \
              | grep -E '(^|/)[^/.]+(\.exe)?$' \
              | head -n1 || true
            )"
            if [[ -n "$discovered" ]]; then
              echo "$discovered"
              return 0
            fi
            return 1
          }
          resolve_ir() {
            local preferred="$1"
            local src="$2"
            local base
            local stem
            base="$(basename "$src" .tg)"
            stem="${preferred%.ll}"
            stem="${stem%.exe}"
            for c in "$preferred" "${stem}.ll" "${stem%.exe}.ll" "$base.ll" "examples/$base.ll" "src/$base.ll"; do
              if [[ -f "$c" ]]; then
                echo "$c"
                return 0
              fi
            done
            local discovered=""
            discovered="$(
              {
                find . -maxdepth 2 -type f -name "${stem}*.ll" 2>/dev/null
                find ./src -maxdepth 2 -type f -name "${stem}*.ll" 2>/dev/null
                find ./examples -maxdepth 2 -type f -name "${stem}*.ll" 2>/dev/null
                find . -maxdepth 2 -type f -name "${base}*.ll" 2>/dev/null
                find ./src -maxdepth 2 -type f -name "${base}*.ll" 2>/dev/null
                find ./examples -maxdepth 2 -type f -name "${base}*.ll" 2>/dev/null
              } \
              | sed 's|^\./||' \
              | head -n1 || true
            )"
            if [[ -n "$discovered" ]]; then
              echo "$discovered"
              return 0
            fi
            return 1
          }
          link_ir_to_bin() {
            local ir="$1"
            local out="$2"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              run_with_watchdog clang "$ir" -o "$out" -Wno-override-module thag_runtime.lib && return 0
              run_with_watchdog clang "$ir" -o "$out" -Wno-override-module libthag_runtime.a && return 0
              return 1
            fi
            run_with_watchdog clang "$ir" -o "$out" -Wno-override-module libthag_runtime.a && return 0
            run_with_watchdog clang "$ir" -o "$out" -Wno-override-module thag_runtime.lib && return 0
            return 1
          }
          thg_build() {
            local cc="$1"
            local src="$2"
            local out="$3"
            local got=""
            echo "[CMD] ./$cc build $src -o $out" | tee -a "$STAGE_TRACE_FILE" >&2
            if run_compiler "$cc" build "$src" -o "$out" 1>&2; then
              got="$(resolve_bin "$out" "$src" || true)"
              if [[ -n "$got" ]]; then
                return 0
              fi
            fi
            echo "[CMD] ./$cc --build $src -o $out" | tee -a "$STAGE_TRACE_FILE" >&2
            run_compiler "$cc" --build "$src" -o "$out" 1>&2
            got="$(resolve_bin "$out" "$src" || true)"
            if [[ -n "$got" ]]; then
              return 0
            fi
            if [[ "$src" == "src/thagore.tg" && -f "$cc" ]]; then
              echo "[INFO] compiler rebuilt in-place artifact: $cc" | tee -a "$STAGE_TRACE_FILE" >&2
              return 0
            fi
            echo "CRITICAL: compiler $cc succeeded but produced no artifact for $src (out=$out)." | tee -a "$STAGE_TRACE_FILE" >&2
            return 1
          }
          purge_outputs() {
            local src="$1"
            local out="$2"
            local base
            base="$(basename "$src" .tg)"
            rm -f "$out" "${out}.exe" "${out%.exe}" "$base" "$base.exe" "examples/$base" "examples/$base.exe" "src/$base" "src/$base.exe" "a.out" "a.exe" "out" "out.exe" || true
          }
          hash_file() {
            local f="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            echo ""
            return 0
          }

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            STAGE1_BIN="stage1.exe"
            STAGE2_BIN="stage2.exe"
            STAGE2_REBUILD_BIN="stage2_rebuild.exe"
            HELLO_BIN="hello_seed.exe"
            FIB_BIN="fib_seed.exe"
          else
            STAGE1_BIN="stage1"
            STAGE2_BIN="stage2"
            STAGE2_REBUILD_BIN="stage2_rebuild"
            HELLO_BIN="hello_seed"
            FIB_BIN="fib_seed"
          fi
          export THAG_HELPER_BIN="$STAGE1_BIN"

          if [[ "${{ matrix.asset_tag }}" == "linux-arm64" ]]; then
            echo "[INFO] linux-arm64 minimal verify: cli + hello smoke from stage1 seed" | tee -a "$STAGE_TRACE_FILE"
            echo "[CMD] ./$STAGE1_BIN --version" | tee -a "$STAGE_TRACE_FILE" >&2
            run_compiler "$STAGE1_BIN" --version 1>&2
            printf 'func main():\n    print("seed linux arm64 smoke")\n' > _seed_min_hello.tg
            SEED_BIN="$STAGE1_BIN"
            STAGE2_REBUILD_BIN="$SEED_BIN"
            COMPILER_CANDIDATES=("$SEED_BIN")
          else
            thg_build "$STAGE1_BIN" src/thagore.tg "$STAGE2_BIN"
            STAGE2_BIN_RESOLVED="$(resolve_bin "$STAGE2_BIN" "src/thagore.tg" || true)"
            if [[ -n "$STAGE2_BIN_RESOLVED" ]]; then
              STAGE2_BIN="$STAGE2_BIN_RESOLVED"
            else
              STAGE2_BIN="$STAGE1_BIN"
              echo "[INFO] using in-place rebuilt compiler for stage2: $STAGE2_BIN" | tee -a "$STAGE_TRACE_FILE"
            fi
            chmod +x "$STAGE2_BIN" || true

            thg_build "$STAGE2_BIN" src/thagore.tg "$STAGE2_REBUILD_BIN"
            STAGE2_REBUILD_BIN_RESOLVED="$(resolve_bin "$STAGE2_REBUILD_BIN" "src/thagore.tg" || true)"
            if [[ -n "$STAGE2_REBUILD_BIN_RESOLVED" ]]; then
              STAGE2_REBUILD_BIN="$STAGE2_REBUILD_BIN_RESOLVED"
            else
              STAGE2_REBUILD_BIN="$STAGE2_BIN"
              echo "[INFO] using in-place rebuilt compiler: $STAGE2_REBUILD_BIN" | tee -a "$STAGE_TRACE_FILE"
            fi
            chmod +x "$STAGE2_REBUILD_BIN" || true

            SEED_BIN="$STAGE2_REBUILD_BIN"
            COMPILER_CANDIDATES=("$SEED_BIN" "$STAGE2_BIN" "$STAGE1_BIN")
          fi
          build_sample_with_candidates() {
            local src="$1"
            local out="$2"
            local found=""
            local ir_out="${out}.ll"
            local found_ir=""
            purge_outputs "$src" "$out"
            for cc in "${COMPILER_CANDIDATES[@]}"; do
              [[ -n "$cc" && -f "$cc" ]] || continue
              if thg_build "$cc" "$src" "$out"; then
                found="$(resolve_bin "$out" "$src" || true)"
                if [[ -n "$found" ]]; then
                  echo "$found"
                  return 0
                fi
              fi
              echo "[CMD] ./$cc --emit-llvm-internal $src -o $ir_out" | tee -a "$STAGE_TRACE_FILE" >&2
              if run_compiler "$cc" --emit-llvm-internal "$src" -o "$ir_out" 1>&2; then
                found_ir="$(resolve_ir "$ir_out" "$src" || true)"
                if [[ -n "$found_ir" ]] && grep -q "@main(" "$found_ir"; then
                  echo "[CMD] clang $found_ir -> $out" | tee -a "$STAGE_TRACE_FILE" >&2
                  if link_ir_to_bin "$found_ir" "$out"; then
                    found="$(resolve_bin "$out" "$src" || true)"
                    if [[ -n "$found" ]]; then
                      echo "$found"
                      return 0
                    fi
                  fi
                fi
              fi
            done
            return 1
          }

          HELLO_SRC="examples/hello.tg"
          if [[ "${{ matrix.asset_tag }}" == "linux-arm64" ]]; then
            echo "[WARN] linux-arm64 verify lane uses CLI/runtime/provenance gate only; compile smoke is skipped because current seed baseline may return no artifact on this lane."
          else
            HELLO_BIN_FOUND="$(build_sample_with_candidates "$HELLO_SRC" "$HELLO_BIN" || true)"
            [[ -n "$HELLO_BIN_FOUND" && -f "$HELLO_BIN_FOUND" ]] || (echo "CRITICAL: unable to emit required smoke sample with stage1/stage2 compiler chain"; exit 1)
            chmod +x "$HELLO_BIN_FOUND" || true
            HELLO_HASH="$(hash_file "$HELLO_BIN_FOUND")"
            CC_HASH="$(hash_file "$SEED_BIN")"
            if [[ -n "$HELLO_HASH" && -n "$CC_HASH" && "$HELLO_HASH" == "$CC_HASH" ]]; then
              echo "CRITICAL: hello output binary unexpectedly equals compiler binary hash."
              exit 1
            fi
            run_with_watchdog "./$HELLO_BIN_FOUND" >/dev/null 2>&1
            FIB_BIN_FOUND="$(build_sample_with_candidates "examples/fib.tg" "$FIB_BIN" || true)"
            if [[ -n "$FIB_BIN_FOUND" && -f "$FIB_BIN_FOUND" ]]; then
              chmod +x "$FIB_BIN_FOUND" || true
              FIB_HASH="$(hash_file "$FIB_BIN_FOUND")"
              CC_HASH="$(hash_file "$SEED_BIN")"
              if [[ -n "$FIB_HASH" && -n "$CC_HASH" && "$FIB_HASH" == "$CC_HASH" ]]; then
                echo "CRITICAL: fib output binary unexpectedly equals compiler binary hash."
                exit 1
              fi
              run_with_watchdog "./$FIB_BIN_FOUND" >/dev/null 2>&1
            else
              echo "[WARN] unable to emit fib sample with stage1/stage2 compiler chain; hello smoke already passed."
            fi
          fi

          echo "STAGE2_REBUILD_BIN=$STAGE2_REBUILD_BIN" >> "$GITHUB_ENV"
          echo "SEED_BIN=$SEED_BIN" >> "$GITHUB_ENV"

      - name: Discord update - Verify Stage1 -> Stage2 -> Stage2 -> samples
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Verify Stage1 -> Stage2 -> Stage2 -> samples

      - name: Guard no stage0 usage
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi "stage0|THAG_STAGE0_HELPER|ALLOW_STAGE0_BOOTSTRAP" "$STAGE_TRACE_FILE"; then
            echo "CRITICAL: forbidden stage0 markers detected in seed trace"
            cat "$STAGE_TRACE_FILE"
            exit 1
          fi

      - name: Package stage1 seed artifact from stage2_rebuild
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf seed
          mkdir -p seed/dist/bin
          SEED_CANDIDATE="${SEED_BIN:-$STAGE2_REBUILD_BIN}"
          [[ -n "$SEED_CANDIDATE" && -f "$SEED_CANDIDATE" ]] || (echo "CRITICAL: missing seed compiler binary"; exit 1)
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$SEED_CANDIDATE" "${{ matrix.stage1_seed_name }}"
            test -f "${{ matrix.stage1_seed_name }}"
            bytes="$(wc -c < "${{ matrix.stage1_seed_name }}" | tr -d '[:space:]')"
            if [[ "${bytes:-0}" -lt 512 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} unexpectedly tiny ($bytes bytes), abort publish."
              exit 1
            fi
            [[ -f thag_runtime.lib ]] || (echo "CRITICAL: missing thag_runtime.lib for seed runtime asset"; exit 1)
            cp thag_runtime.lib "${{ matrix.runtime_seed_name }}"
            if [[ "${{ matrix.asset_tag }}" == "windows-x86_64" ]]; then
              cp "${{ matrix.stage1_seed_name }}" thagore-stage1.exe
              cp "${{ matrix.runtime_seed_name }}" thagore-runtime-windows.lib
            fi
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp "$SEED_CANDIDATE" seed/dist/bin/thagore
            tar -czf "${{ matrix.stage1_seed_name }}" -C seed dist
            tar -tzf "${{ matrix.stage1_seed_name }}" | grep -F "dist/bin/thagore"
            bytes="$(wc -c < "${{ matrix.stage1_seed_name }}" | tr -d '[:space:]')"
            if [[ "${bytes:-0}" -lt 512 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} unexpectedly tiny ($bytes bytes), abort publish."
              exit 1
            fi
            [[ -f libthag_runtime.a ]] || (echo "CRITICAL: missing libthag_runtime.a for linux seed runtime asset"; exit 1)
            cp libthag_runtime.a "${{ matrix.runtime_seed_name }}"
            if [[ "${{ matrix.asset_tag }}" == "linux-x86_64" ]]; then
              cp "${{ matrix.stage1_seed_name }}" thagore-stage1-linux.tar.gz
              cp "${{ matrix.runtime_seed_name }}" thagore-runtime-linux.a
            fi
          else
            cp "$SEED_CANDIDATE" seed/dist/bin/thagore
            tar -czf "${{ matrix.stage1_seed_name }}" -C seed dist
            tar -tzf "${{ matrix.stage1_seed_name }}" | grep -F "dist/bin/thagore"
            bytes="$(wc -c < "${{ matrix.stage1_seed_name }}" | tr -d '[:space:]')"
            if [[ "${bytes:-0}" -lt 512 ]]; then
              echo "CRITICAL: ${{ matrix.stage1_seed_name }} unexpectedly tiny ($bytes bytes), abort publish."
              exit 1
            fi
            [[ -f libthag_runtime.a ]] || (echo "CRITICAL: missing libthag_runtime.a for macos seed runtime asset"; exit 1)
            cp libthag_runtime.a "${{ matrix.runtime_seed_name }}"
            if [[ "${{ matrix.asset_tag }}" == "macos-arm64" ]]; then
              cp "${{ matrix.stage1_seed_name }}" thagore-stage1-macos.tar.gz
              cp "${{ matrix.runtime_seed_name }}" thagore-runtime-macos.a
            fi
          fi

      - name: Discord update - Package stage1 seed artifact from stage2_rebuild
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Package stage1 seed artifact from stage2_rebuild

      - name: Build seed promotion manifest
        shell: bash
        run: |
          set -euo pipefail
          hash_file() {
            local f="$1"
            if [[ ! -f "$f" ]]; then
              return 1
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" | awk '{print $1}'
              return 0
            fi
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" | awk '{print $1}'
              return 0
            fi
            return 1
          }
          OUT="seed-promotion-manifest-${{ matrix.asset_tag }}.txt"
          : > "$OUT"
          echo "schema=thagore.seed.promote.v1" >> "$OUT"
          echo "seed_tag=${{ github.event.inputs.seed_tag }}" >> "$OUT"
          echo "base_seed_tag=${{ github.event.inputs.base_seed_tag }}" >> "$OUT"
          echo "runner_os=${{ runner.os }}" >> "$OUT"
          echo "asset_tag=${{ matrix.asset_tag }}" >> "$OUT"
          echo "arch=${{ matrix.arch }}" >> "$OUT"
          echo "run_id=${{ github.run_id }}" >> "$OUT"
          echo "run_attempt=${{ github.run_attempt }}" >> "$OUT"
          echo "commit_sha=${{ github.sha }}" >> "$OUT"
          for f in "${{ matrix.stage1_seed_name }}" "${{ matrix.runtime_seed_name }}" thagore-stage1.exe thagore-stage1-linux.tar.gz thagore-stage1-macos.tar.gz thagore-runtime-windows.lib thagore-runtime-linux.a thagore-runtime-macos.a; do
            if [[ -f "$f" ]]; then
              h="$(hash_file "$f" || true)"
              echo "artifact=$f" >> "$OUT"
              echo "sha256=$h" >> "$OUT"
            fi
          done
          if [[ "${{ matrix.asset_tag }}" == "windows-x86_64" || "${{ matrix.asset_tag }}" == "linux-x86_64" || "${{ matrix.asset_tag }}" == "macos-arm64" ]]; then
            cp "$OUT" "seed-promotion-manifest-${{ runner.os }}.txt"
          fi

      - name: Build stage1 provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          BUNDLE_CORE="seed-bundle-core-${{ matrix.asset_tag }}.json"
          TRACE_ASSET="seed-stage-trace-${{ matrix.asset_tag }}.log"
          if [[ "$STAGE_TRACE_FILE" != "$TRACE_ASSET" ]]; then
            cp "$STAGE_TRACE_FILE" "$TRACE_ASSET"
          fi
          "$PY" scripts/seed_bundle.py capture \
            --output "$BUNDLE_CORE" \
            --asset "${{ matrix.stage1_seed_name }}" \
            --asset "${{ matrix.runtime_seed_name }}" \
            --asset "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" \
            --asset "$TRACE_ASSET" \
            --seed-tag "${{ github.event.inputs.seed_tag }}" \
            --asset-tag "${{ matrix.asset_tag }}" \
            --runner-os "${{ runner.os }}" \
            --arch "${{ matrix.arch }}" \
            --commit-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}"
          BUNDLE_ID="$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1],encoding='utf-8'))['metadata']['bundle_id'])" "$BUNDLE_CORE")"
          [[ -n "$BUNDLE_ID" ]] || (echo "CRITICAL: failed to compute bundle_id"; exit 1)
          PROV="seed-stage1-provenance-${{ matrix.asset_tag }}.json"
          ASSET_ARGS=()
          for f in "${{ matrix.stage1_seed_name }}" "${{ matrix.runtime_seed_name }}" thagore-stage1.exe thagore-stage1-linux.tar.gz thagore-stage1-macos.tar.gz thagore-runtime-windows.lib thagore-runtime-linux.a thagore-runtime-macos.a "$TRACE_ASSET"; do
            if [[ -f "$f" ]]; then
              ASSET_ARGS+=(--asset "$f")
            fi
          done
          "$PY" scripts/stage1_provenance.py capture \
            --output "$PROV" \
            --manifest "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" \
            --stage-trace "$STAGE_TRACE_FILE" \
            --seed-tag "${{ github.event.inputs.seed_tag }}" \
            --base-seed-tag "${{ github.event.inputs.base_seed_tag }}" \
            --runner-os "${{ runner.os }}" \
            --asset-tag "${{ matrix.asset_tag }}" \
            --arch "${{ matrix.arch }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --bundle-id "$BUNDLE_ID" \
            --repository "${{ github.repository }}" \
            "${ASSET_ARGS[@]}"
          BUNDLE_OUT="seed-bundle-${{ matrix.asset_tag }}.json"
          BUNDLE_ASSET_ARGS=(
            --asset "${{ matrix.stage1_seed_name }}"
            --asset "${{ matrix.runtime_seed_name }}"
            --asset "seed-promotion-manifest-${{ matrix.asset_tag }}.txt"
            --asset "$PROV"
            --asset "$TRACE_ASSET"
          )
          "$PY" scripts/seed_bundle.py capture \
            --output "$BUNDLE_OUT" \
            --seed-tag "${{ github.event.inputs.seed_tag }}" \
            --asset-tag "${{ matrix.asset_tag }}" \
            --runner-os "${{ runner.os }}" \
            --arch "${{ matrix.arch }}" \
            --commit-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            "${BUNDLE_ASSET_ARGS[@]}"
          "$PY" scripts/seed_bundle.py verify \
            --bundle "$BUNDLE_OUT" \
            --manifest "seed-promotion-manifest-${{ matrix.asset_tag }}.txt" \
            --provenance "$PROV"
          if [[ "${{ matrix.asset_tag }}" == "windows-x86_64" || "${{ matrix.asset_tag }}" == "linux-x86_64" || "${{ matrix.asset_tag }}" == "macos-arm64" ]]; then
            cp "$PROV" "seed-stage1-provenance-${{ runner.os }}.json"
          fi

      - name: Upload seed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.asset_tag }}
          path: |
            ${{ matrix.stage1_seed_name }}
            ${{ matrix.runtime_seed_name }}
            thagore-stage1.exe
            thagore-stage1-linux.tar.gz
            thagore-stage1-macos.tar.gz
            thagore-runtime-windows.lib
            thagore-runtime-linux.a
            thagore-runtime-macos.a
            ${{ env.STAGE_TRACE_FILE }}
            runtime-abi-summary-seed-${{ matrix.asset_tag }}.txt
            runtime-abi-inventory-seed-${{ matrix.asset_tag }}.txt
            seed-promotion-manifest-${{ matrix.asset_tag }}.txt
            seed-promotion-manifest-${{ runner.os }}.txt
            seed-stage1-provenance-${{ matrix.asset_tag }}.json
            seed-stage1-provenance-${{ runner.os }}.json
            seed-stage-trace-${{ matrix.asset_tag }}.log
            seed-bundle-core-${{ matrix.asset_tag }}.json
            seed-bundle-${{ matrix.asset_tag }}.json

  verify-bundle-before-publish:
    name: verify-bundle (${{ matrix.asset_tag }})
    runs-on: ${{ matrix.runner }}
    needs: [discord-notify-init, build-seed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
            arch: x86_64
            asset_tag: linux-x86_64
            stage1_seed_name: thagore-stage1-linux-x86_64.tar.gz
            runtime_seed_name: thagore-runtime-linux-x86_64.a
          - runner: ubuntu-24.04-arm
            os_name: Linux
            arch: arm64
            asset_tag: linux-arm64
            stage1_seed_name: thagore-stage1-linux-arm64.tar.gz
            runtime_seed_name: thagore-runtime-linux-arm64.a
          - runner: macos-latest
            os_name: macOS
            arch: arm64
            asset_tag: macos-arm64
            stage1_seed_name: thagore-stage1-macos-arm64.tar.gz
            runtime_seed_name: thagore-runtime-macos-arm64.a
          - runner: windows-latest
            os_name: Windows
            arch: x86_64
            asset_tag: windows-x86_64
            stage1_seed_name: thagore-stage1-windows-x86_64.exe
            runtime_seed_name: thagore-runtime-windows-x86_64.lib
          - runner: windows-11-arm
            os_name: Windows
            arch: arm64
            asset_tag: windows-arm64
            stage1_seed_name: thagore-stage1-windows-arm64.exe
            runtime_seed_name: thagore-runtime-windows-arm64.lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update || true
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 21 all || true
            if [[ -d /usr/lib/llvm-21/bin ]]; then
              echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
            fi
          fi
          clang --version

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang --version
            exit 0
          fi
          if [[ -x "/c/Program Files/LLVM/bin/clang.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            clang --version
            exit 0
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "choco install llvm --version=21.1.8 --no-progress -y --execution-timeout=1800"
          echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          path: seed-artifacts
          pattern: seed-${{ matrix.asset_tag }}

      - name: Verify bundle metadata and smoke packaged seed
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=python
          else
            PY=python3
          fi
          ROOT_DIR="$(find seed-artifacts -maxdepth 2 -type f -name "seed-bundle-${{ matrix.asset_tag }}.json" -print | head -n1 | xargs dirname)"
          [[ -n "${ROOT_DIR:-}" && -d "$ROOT_DIR" ]] || (echo "CRITICAL: missing seed artifact directory for ${{ matrix.asset_tag }}"; exit 1)
          BUNDLE_FILE="$ROOT_DIR/seed-bundle-${{ matrix.asset_tag }}.json"
          MANIFEST_FILE="$ROOT_DIR/seed-promotion-manifest-${{ matrix.asset_tag }}.txt"
          PROV_FILE="$ROOT_DIR/seed-stage1-provenance-${{ matrix.asset_tag }}.json"
          "$PY" scripts/seed_bundle.py verify \
            --bundle "$BUNDLE_FILE" \
            --manifest "$MANIFEST_FILE" \
            --provenance "$PROV_FILE"
          BUNDLE_ID="$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1],encoding='utf-8'))['metadata']['bundle_id'])" "$BUNDLE_FILE")"
          "$PY" scripts/stage1_provenance.py verify \
            --provenance "$PROV_FILE" \
            --manifest "$MANIFEST_FILE" \
            --asset "$ROOT_DIR/${{ matrix.stage1_seed_name }}" \
            --asset "$ROOT_DIR/${{ matrix.runtime_seed_name }}" \
            --expected-commit-sha "${{ github.sha }}" \
            --expected-bundle-id "$BUNDLE_ID"
          rm -rf verify_seed && mkdir -p verify_seed
          cp "$ROOT_DIR/${{ matrix.stage1_seed_name }}" verify_seed/
          cp "$ROOT_DIR/${{ matrix.runtime_seed_name }}" verify_seed/
          cd verify_seed
          resolve_bin() {
            local stem="$1"
            if [[ -f "$stem" ]]; then
              echo "$stem"
              return 0
            fi
            if [[ -f "${stem}.exe" ]]; then
              echo "${stem}.exe"
              return 0
            fi
            return 1
          }
          resolve_program_bin() {
            local source_file="$1"
            local out_stem="$2"
            local source_base=""
            local source_dir_stem=""
            source_base="$(basename "$source_file")"
            source_base="${source_base%.tg}"
            source_dir_stem="${source_file%.tg}"
            if [[ -f "$out_stem" ]]; then
              echo "$out_stem"
              return 0
            fi
            if [[ -f "${out_stem}.exe" ]]; then
              echo "${out_stem}.exe"
              return 0
            fi
            if [[ -f "$source_base" ]]; then
              echo "$source_base"
              return 0
            fi
            if [[ -f "${source_base}.exe" ]]; then
              echo "${source_base}.exe"
              return 0
            fi
            if [[ -f "$source_dir_stem" ]]; then
              echo "$source_dir_stem"
              return 0
            fi
            if [[ -f "${source_dir_stem}.exe" ]]; then
              echo "${source_dir_stem}.exe"
              return 0
            fi
            return 1
          }
          build_program_with_cc() {
            local compiler_bin="$1"
            local source_file="$2"
            local out_stem="$3"
            local tmp_ll="${out_stem}.ll"
            local out_bin=""
            local linker="${CXX:-clang++}"
            rm -f "$out_stem" "${out_stem}.exe" "$tmp_ll"
            THAG_HELPER_BIN="$compiler_bin" "./$compiler_bin" build "$source_file" -o "$out_stem" || true
            out_bin="$(resolve_program_bin "$source_file" "$out_stem" || true)"
            if [[ -n "$out_bin" ]]; then
              echo "$out_bin"
              return 0
            fi
            THAG_HELPER_BIN="$compiler_bin" "./$compiler_bin" --build "$source_file" -o "$out_stem" || true
            out_bin="$(resolve_program_bin "$source_file" "$out_stem" || true)"
            if [[ -n "$out_bin" ]]; then
              echo "$out_bin"
              return 0
            fi
            THAG_HELPER_BIN="$compiler_bin" "./$compiler_bin" --emit-llvm-internal "$source_file" -o "$tmp_ll" || true
            if [[ ! -f "$tmp_ll" ]]; then
              return 1
            fi
            if ! command -v "$linker" >/dev/null 2>&1; then
              if command -v clang++ >/dev/null 2>&1; then
                linker="clang++"
              elif command -v clang >/dev/null 2>&1; then
                linker="clang"
              else
                return 1
              fi
            fi
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              "$linker" "$tmp_ll" thag_runtime.lib -O2 -std=c++17 -o "${out_stem}.exe" || return 1
            else
              "$linker" "$tmp_ll" libthag_runtime.a -O2 -std=c++17 -o "$out_stem" || return 1
            fi
            out_bin="$(resolve_program_bin "$source_file" "$out_stem" || true)"
            [[ -n "$out_bin" ]] || return 1
            echo "$out_bin"
            return 0
          }
          thg_build_compiler() {
            local cc="$1"
            local source_file="$2"
            local out_stem="$3"
            local out_bin=""
            local cc_sig_before=""
            local cc_sig_after=""
            if [[ "$source_file" == "../src/thagore.tg" && -f "$cc" ]]; then
              cc_sig_before="$(cksum "$cc" 2>/dev/null || true)"
            fi
            "./$cc" build "$source_file" -o "$out_stem" || true
            out_bin="$(resolve_bin "$out_stem" || true)"
            if [[ -n "$out_bin" ]]; then
              echo "$out_bin"
              return 0
            fi
            "./$cc" --build "$source_file" -o "$out_stem" || return 1
            out_bin="$(resolve_bin "$out_stem" || true)"
            if [[ -n "$out_bin" ]]; then
              echo "$out_bin"
              return 0
            fi
            if [[ "$source_file" == "../src/thagore.tg" && -f "$cc" ]]; then
              cc_sig_after="$(cksum "$cc" 2>/dev/null || true)"
              if [[ -n "$cc_sig_before" && -n "$cc_sig_after" && "$cc_sig_before" != "$cc_sig_after" ]]; then
                echo "[INFO] compiler rebuilt in-place artifact: $cc"
                echo ""
                return 0
              fi
              if [[ -n "$cc_sig_before" && -n "$cc_sig_after" && "$cc_sig_before" == "$cc_sig_after" ]]; then
                echo "[WARN] compiler rebuild for $source_file completed with no emitted output and unchanged in-place binary ($cc); accepting as compiler-managed no-output mode."
                echo ""
                return 0
              fi
            fi
            return 1
          }
          build_and_assert_output_with_cc() {
            local compiler_bin="$1"
            local source_file="$2"
            local out_stem="$3"
            local expected="$4"
            local out_bin
            out_bin="$(build_program_with_cc "$compiler_bin" "$source_file" "$out_stem" || true)"
            [[ -n "$out_bin" ]] || (echo "CRITICAL: $compiler_bin failed to build executable for $source_file"; exit 1)
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              chmod +x "$out_bin"
            fi
            local got
            got="$("./$out_bin" | tr -d '\r')"
            [[ "$got" == "$expected" ]] || (echo "CRITICAL: output mismatch for $source_file"; echo "EXPECTED<<"; echo "$expected"; echo "GOT<<"; echo "$got"; exit 1)
          }
          build_and_assert_output() {
            local source_file="$1"
            local out_stem="$2"
            local expected="$3"
            build_and_assert_output_with_cc "$STAGE1_BIN" "$source_file" "$out_stem" "$expected"
          }
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "${{ matrix.stage1_seed_name }}" stage1.exe
            cp "${{ matrix.runtime_seed_name }}" thag_runtime.lib
            STAGE1_BIN="stage1.exe"
          else
            cp "${{ matrix.runtime_seed_name }}" libthag_runtime.a
            cp libthag_runtime.a thag_runtime.lib
            mkdir -p extract
            tar -xzf "${{ matrix.stage1_seed_name }}" -C extract
            CANDIDATE="$(find extract -maxdepth 5 -type f \( -name thagore -o -name thag \) | head -n1 || true)"
            [[ -n "$CANDIDATE" ]] || (echo "CRITICAL: missing stage1 binary in packaged seed archive"; exit 1)
            cp "$CANDIDATE" stage1
            chmod +x stage1
            STAGE1_BIN="stage1"
          fi
          if [[ "${{ matrix.asset_tag }}" == "linux-arm64" ]]; then
            echo "[WARN] verify-bundle linux-arm64 runs minimal packaged-seed gate (bundle/provenance/runtime presence) and skips executing packaged compiler."
            exit 0
          fi
          "./$STAGE1_BIN" --version >/dev/null 2>&1 || (echo "CRITICAL: packaged stage1 --version failed"; exit 1)
          "./$STAGE1_BIN" --help >/dev/null 2>&1 || (echo "CRITICAL: packaged stage1 --help failed"; exit 1)
          STAGE2_STEM="stage2_from_bundle"
          thg_build_compiler "$STAGE1_BIN" ../src/thagore.tg "$STAGE2_STEM" >/dev/null || (echo "CRITICAL: packaged stage1 failed to selfhost stage2"; exit 1)
          STAGE2_BIN="$(resolve_bin "$STAGE2_STEM" || true)"
          if [[ -z "$STAGE2_BIN" ]]; then
            STAGE2_BIN="$STAGE1_BIN"
            echo "[INFO] stage2 selfhost returned no standalone artifact; using in-place compiler binary $STAGE2_BIN"
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE2_BIN"
          fi
          thg_build_compiler "$STAGE2_BIN" ../src/thagore.tg stage2b_from_bundle >/dev/null || (echo "CRITICAL: stage2 failed to rebuild stage2b"; exit 1)
          STAGE2B_BIN="$(resolve_bin stage2b_from_bundle || true)"
          if [[ -z "$STAGE2B_BIN" ]]; then
            STAGE2B_BIN="$STAGE2_BIN"
            echo "[INFO] stage2b selfhost returned no standalone artifact; using in-place compiler binary $STAGE2B_BIN"
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE2B_BIN"
          fi
          thg_build_compiler "$STAGE2B_BIN" ../src/thagore.tg stage2c_from_bundle >/dev/null || (echo "CRITICAL: stage2b failed to rebuild stage2c"; exit 1)
          STAGE2C_BIN="$(resolve_bin stage2c_from_bundle || true)"
          if [[ -z "$STAGE2C_BIN" ]]; then
            STAGE2C_BIN="$STAGE2B_BIN"
            echo "[INFO] stage2c selfhost returned no standalone artifact; using in-place compiler binary $STAGE2C_BIN"
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE2C_BIN"
          fi
          if [[ "$STAGE2_BIN" == "$STAGE1_BIN" && "$STAGE2B_BIN" == "$STAGE1_BIN" && "$STAGE2C_BIN" == "$STAGE1_BIN" ]]; then
            echo "[WARN] packaged compiler selfhost completed in no-output mode; skipping executable sample assertions in verify-bundle."
            exit 0
          fi

          build_and_assert_output_with_cc "$STAGE2_BIN" ../examples/hello.tg hello_from_stage2 "Hello Self-Hosted World!"
          build_and_assert_output_with_cc "$STAGE2_BIN" ../examples/logic.tg logic_from_stage2 "100"
          build_and_assert_output_with_cc "$STAGE2B_BIN" ../examples/hello.tg hello_from_stage2b "Hello Self-Hosted World!"
          build_and_assert_output_with_cc "$STAGE2B_BIN" ../examples/fib.tg fib_from_stage2b "9227465"
          build_and_assert_output_with_cc "$STAGE2C_BIN" ../examples/string_ops.tg string_ops_from_stage2c $'Hello Thagore\nString equality works!'
          build_and_assert_output_with_cc "$STAGE2C_BIN" ../examples/loop.tg loop_from_stage2c $'0\n1\n2\n3\n4\n100'

  publish-seed:
    name: publish-seed-release
    runs-on: ubuntu-latest
    needs: [discord-notify-init, build-seed, verify-bundle-before-publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          path: seed-artifacts

      - name: Publish seed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.seed_tag }}
          name: Stage1 Seed ${{ github.event.inputs.seed_tag }}
          files: |
            seed-artifacts/**/thagore-stage1-windows-*.exe
            seed-artifacts/**/thagore-stage1-linux-*.tar.gz
            seed-artifacts/**/thagore-stage1-macos-*.tar.gz
            seed-artifacts/**/thagore-runtime-windows-*.lib
            seed-artifacts/**/thagore-runtime-linux-*.a
            seed-artifacts/**/thagore-runtime-macos-*.a
            seed-artifacts/**/thagore-stage1.exe
            seed-artifacts/**/thagore-stage1-linux.tar.gz
            seed-artifacts/**/thagore-stage1-macos.tar.gz
            seed-artifacts/**/thagore-runtime-windows.lib
            seed-artifacts/**/thagore-runtime-linux.a
            seed-artifacts/**/thagore-runtime-macos.a
            seed-artifacts/**/seed-promotion-manifest-*.txt
            seed-artifacts/**/seed-stage1-provenance-*.json
            seed-artifacts/**/seed-stage-trace-*.log
            seed-artifacts/**/seed-bundle-*.json
          make_latest: false
          prerelease: true
          overwrite_files: true

      - name: Discord update - Publish seed release
        if: always()
        uses: ./.github/actions/discord-ci-status
        with:
          mode: update
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
          milestone: Publish seed release

  discord-notify-finalize:
    name: discord-notify-finalize
    runs-on: ubuntu-latest
    if: always()
    needs: [discord-notify-init, discord-notify-live, build-seed, verify-bundle-before-publish, publish-seed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize Discord message
        uses: ./.github/actions/discord-ci-status
        with:
          mode: finalize
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message_id: ${{ needs.discord-notify-init.outputs.message_id }}
