name: Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/playground.yml"
      - "playground/**"
      - "crates/**"
      - "tools/thagore-fmt/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: cd playground && make wasm

      - name: Deploy to thagore-foundation/playground
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
          external_repository: thagore-foundation/playground
          publish_branch: gh-pages
          publish_dir: ./playground
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "deploy: publish playground from thagore@${{ github.sha }}"
