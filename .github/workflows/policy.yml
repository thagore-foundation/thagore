name: Policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline branch
        run: python3 tooling/policy/check_baseline_branch.py --branch backup/main-archive-20260226-211152

      - name: Verify compatibility snapshots
        run: |
          test -f contracts/cli/commands_snapshot.json
          test -f contracts/grammar/tokens.yaml
          test -f contracts/semantics/type_rules_snapshot.yaml
          test -f contracts/manifest.json

      - name: Verify architecture boundaries
        run: python3 tooling/policy/check_no_circular_headers.py --root compiler/include/thagc

      - name: Verify no legacy runtime link path
        run: python3 tooling/policy/check_no_legacy_runtime_link.py --root compiler

      - name: Verify no open P0/P1 release issues
        run: |
          python3 tooling/policy/check_p0_p1_registry.py --registry contracts/concurrency/p0_p1_registry.json
          python3 tooling/policy/check_p0_p1_registry.py --registry contracts/stability/p0_p1_registry.json
