version: 1
defaults:
  single_thread_shared_owner: Rc
  cross_thread_shared_owner: Arc
checks:
  send_sync_auto_check: true
  reject_rc_cross_thread: true
diagnostics:
  must_suggest_arc_on_rc_send_sync_failure: true
  include_exact_field_path: true
cases:
  - id: rc_single_thread_ok
    expect: pass
    sample: |
      func main():
        let local: Rc = Rc(1)
        return 0
  - id: rc_cross_thread_rejected
    expect: fail
    diagnostic: E_SEND_SYNC_004
    sample: |
      func main():
        let local: Rc = Rc(1)
        spawn(local)
        return 0
  - id: arc_cross_thread_ok
    expect: pass
    sample: |
      func main():
        let shared: Arc = Arc(1)
        spawn(shared)
        return 0
  - id: closure_capture_rc_rejected
    expect: fail
    diagnostic: E_SEND_SYNC_004
    sample: |
      func main():
        let conn: Rc = Rc(1)
        let task = |x| conn
        spawn(task)
        return 0
  - id: nested_rc_field_rejected
    expect: fail
    diagnostic: E_SEND_SYNC_004
    sample: |
      struct Connection:
        id: i32
      struct Job:
        conn: Rc<Connection>
      func main():
        let conn: Rc<Connection> = Rc(1)
        let job: Job = Job(conn)
        spawn(job)
        return 0
