version: 1
runtime:
  async_runtime_required: true
clients:
  http:
    required: true
    minimum_surface: [http_get, http_post]
  websocket:
    required: true
    minimum_surface: [ws_connect, ws_send, ws_close]
  db:
    required: true
    minimum_surface: [db_connect, db_query, db_close]
policy:
  surface_area: minimal
