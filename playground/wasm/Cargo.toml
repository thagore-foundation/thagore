[package]
name = "thagore-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "thagore_wasm.rs"

[dependencies]
bumpalo = "3.17.0"
serde_json = "1.0.145"
wasm-bindgen = "0.2.104"
thagore-lexer = { path = "../../crates/lexer" }
thagore-ast = { path = "../../crates/ast" }
thagore-parser = { path = "../../crates/parser" }
thagore-typeck = { path = "../../crates/typeck" }
thagore-interpreter = { path = "../../crates/interpreter" }
thagore-fmt = { path = "../../tools/thagore-fmt" }
